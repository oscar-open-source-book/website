<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="SenseNova slides pipeline architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#1B3B6B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#E9DEC8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#F3D07A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="160" fill="#D9A441" opacity="0.14" filter="url(#soft)"/>
  <circle cx="120" cy="540" r="140" fill="#6EA8FE" opacity="0.13" filter="url(#soft)"/>
  <text x="60" y="58" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="32" font-weight="800">SenseNova Slides Pipeline</text>
  <text x="60" y="92" fill="#D9A441" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="18" font-weight="600">PPTX → Markdown source → Stage pipeline → HTML deck</text>

  <g font-family="Inter, 'Noto Sans SC', sans-serif" font-size="17" fill="#1B2A3A">
    <rect x="70" y="145" width="220" height="112" rx="18" fill="url(#card)" stroke="#B4A078" stroke-width="2"/>
    <text x="98" y="184" font-size="24" font-weight="800">PPTX</text>
    <text x="98" y="214">既有演示文稿</text>
    <text x="98" y="238">展示容器，协作弱</text>

    <rect x="380" y="145" width="230" height="112" rx="18" fill="url(#card)" stroke="#B4A078" stroke-width="2"/>
    <text x="410" y="184" font-size="24" font-weight="800">Markdown</text>
    <text x="410" y="214">文本化叙事源</text>
    <text x="410" y="238">Git / diff / grep</text>

    <rect x="700" y="120" width="280" height="162" rx="20" fill="#1B3B6B" stroke="#D9A441" stroke-width="3"/>
    <text x="734" y="162" fill="#F5F0E8" font-size="24" font-weight="800">Hermes Agent</text>
    <text x="734" y="194" fill="#F5F0E8">读取仓库 · 调用 stage</text>
    <text x="734" y="222" fill="#F5F0E8">检查 JSON · 诊断失败</text>
    <text x="734" y="250" fill="#F5F0E8">恢复策略写回队列</text>

    <rect x="1030" y="145" width="110" height="112" rx="18" fill="url(#card)" stroke="#B4A078" stroke-width="2"/>
    <text x="1054" y="184" font-size="22" font-weight="800">Kanban</text>
    <text x="1054" y="214">per-deck</text>
    <text x="1054" y="238">task queue</text>

    <rect x="120" y="360" width="210" height="118" rx="18" fill="url(#card)" stroke="#B4A078" stroke-width="2"/>
    <text x="148" y="398" font-size="22" font-weight="800">sn-ppt-standard</text>
    <text x="148" y="430">preflight → outline</text>
    <text x="148" y="456">asset-plan → html</text>

    <rect x="450" y="360" width="220" height="118" rx="18" fill="#101E33" stroke="#D9A441" stroke-width="2"/>
    <text x="482" y="398" fill="#F5F0E8" font-size="22" font-weight="800">SenseNova</text>
    <text x="482" y="430" fill="#D9A441">6.8 Flash Lite</text>
    <text x="482" y="456" fill="#F5F0E8">文本 / HTML</text>

    <rect x="780" y="360" width="220" height="118" rx="18" fill="#101E33" stroke="#D9A441" stroke-width="2"/>
    <text x="812" y="398" fill="#F5F0E8" font-size="22" font-weight="800">U1.5 Lite</text>
    <text x="812" y="430" fill="#D9A441">实时配图</text>
    <text x="812" y="456" fill="#F5F0E8">VLM QC 自检</text>

    <rect x="290" y="545" width="620" height="54" rx="18" fill="url(#accent)" opacity="0.95"/>
    <text x="330" y="580" font-size="22" font-weight="800">Hugo deploy → osbook.slides / static HTML</text>
  </g>

  <g stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M292 201 C330 201 342 201 376 201"/>
    <path d="M612 201 C640 201 654 201 694 201"/>
    <path d="M980 201 C1000 201 1010 201 1026 201"/>
    <path d="M840 282 C780 320 560 324 328 356"/>
    <path d="M332 419 C375 419 405 419 446 419"/>
    <path d="M670 419 C700 419 730 419 776 419"/>
    <path d="M240 478 C340 525 500 540 610 545"/>
    <path d="M890 478 C820 520 735 540 655 553"/>
    <path d="M990 258 C1040 310 1030 398 990 430" stroke-dasharray="8 9"/>
  </g>
  <text x="690" y="328" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="15">Agent 调度 stage</text>
  <text x="990" y="338" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="15">失败日志 → 诊断修复</text>
</svg>
