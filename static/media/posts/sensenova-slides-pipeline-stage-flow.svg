<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="SenseNova slides pipeline stages diagram">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#1B3B6B"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#E9DEC8"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#F3D07A"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="url(#bg2)"/>
  <circle cx="1060" cy="70" r="130" fill="#D9A441" opacity="0.14"/>
  <circle cx="90" cy="430" r="120" fill="#6EA8FE" opacity="0.12"/>
  <text x="60" y="58" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="30" font-weight="800">Stage Pipeline as Auditable Craft</text>
  <text x="60" y="90" fill="#D9A441" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="17" font-weight="600">每个阶段留下可检查的中间态，而不是黑盒生成最终页面</text>

  <g font-family="Inter, 'Noto Sans SC', sans-serif" fill="#1B2A3A">
    <rect x="60" y="145" width="150" height="92" rx="16" fill="url(#card2)" stroke="#B4A078" stroke-width="2"/>
    <text x="86" y="184" font-size="22" font-weight="800">preflight</text>
    <text x="86" y="212" font-size="15">digest</text>

    <rect x="240" y="145" width="120" height="92" rx="16" fill="url(#card2)" stroke="#B4A078" stroke-width="2"/>
    <text x="266" y="184" font-size="22" font-weight="800">style</text>
    <text x="266" y="212" font-size="15">规范</text>

    <rect x="390" y="145" width="140" height="92" rx="16" fill="url(#card2)" stroke="#B4A078" stroke-width="2"/>
    <text x="416" y="184" font-size="22" font-weight="800">outline</text>
    <text x="416" y="212" font-size="15">结构</text>

    <rect x="560" y="145" width="160" height="92" rx="16" fill="url(#card2)" stroke="#B4A078" stroke-width="2"/>
    <text x="584" y="184" font-size="22" font-weight="800">asset-plan</text>
    <text x="584" y="212" font-size="15">视觉计划</text>

    <rect x="750" y="145" width="150" height="92" rx="16" fill="#101E33" stroke="#D9A441" stroke-width="2"/>
    <text x="775" y="184" fill="#F5F0E8" font-size="22" font-weight="800">gen-image</text>
    <text x="775" y="212" fill="#D9A441" font-size="15">U1.5 配图</text>

    <rect x="930" y="145" width="170" height="92" rx="16" fill="url(#card2)" stroke="#B4A078" stroke-width="2"/>
    <text x="952" y="184" font-size="22" font-weight="800">page-html</text>
    <text x="952" y="212" font-size="15">发布页</text>
  </g>

  <g stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arrow2)">
    <path d="M210 191 C220 191 224 191 238 191"/>
    <path d="M360 191 C370 191 374 191 388 191"/>
    <path d="M530 191 C540 191 544 191 558 191"/>
    <path d="M720 191 C730 191 734 191 748 191"/>
    <path d="M900 191 C910 191 914 191 928 191"/>
  </g>

  <g font-family="Inter, 'Noto Sans SC', sans-serif">
    <rect x="110" y="320" width="980" height="100" rx="22" fill="#0E2440" stroke="#D9A441" stroke-width="2"/>
    <text x="150" y="360" fill="#F5F0E8" font-size="24" font-weight="800">Artifact 层</text>
    <text x="150" y="395" fill="#D9A441" font-size="20">Markdown 事实源 · JSON 中间态 · HTML 发布态 · PNG 配图</text>
    <text x="780" y="395" fill="#F5F0E8" font-size="20">可 diff · 可回滚 · 可复用</text>
  </g>

  <g stroke="#D9A441" stroke-width="2" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow2)">
    <path d="M135 237 C135 280 150 302 150 320"/>
    <path d="M640 237 C640 280 640 302 640 320"/>
    <path d="M1015 237 C1015 280 990 302 990 320"/>
  </g>
</svg>
