<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Kanban persistent workflow loop diagram">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#1B3B6B"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#E9DEC8"/>
    </linearGradient>
    <marker id="arrow4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="url(#bg4)"/>
  <circle cx="610" cy="235" r="185" fill="none" stroke="#D9A441" stroke-width="4" stroke-dasharray="10 10" opacity="0.8"/>
  <text x="60" y="58" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="30" font-weight="800">Kanban Persistent Loop</text>
  <text x="60" y="90" fill="#D9A441" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="17" font-weight="600">任务事实不留在聊天记录里，而留在卡片、日志和重试边界里</text>

  <g font-family="Inter, 'Noto Sans SC', sans-serif">
    <rect x="82" y="142" width="190" height="105" rx="18" fill="url(#card4)" stroke="#B4A078" stroke-width="2"/>
    <text x="112" y="181" font-size="24" font-weight="800">Task Card</text>
    <text x="112" y="214" font-size="17">状态 · 幂等键 · 重试</text>

    <rect x="450" y="82" width="210" height="105" rx="18" fill="#101E33" stroke="#D9A441" stroke-width="3"/>
    <text x="482" y="122" fill="#F5F0E8" font-size="24" font-weight="800">Gateway</text>
    <text x="482" y="155" fill="#F5F0E8" font-size="17">串行派发 · 60s 调度</text>

    <rect x="820" y="142" width="210" height="105" rx="18" fill="url(#card4)" stroke="#B4A078" stroke-width="2"/>
    <text x="852" y="181" font-size="24" font-weight="800">Worker</text>
    <text x="852" y="214" font-size="17">运行一个 deck</text>

    <rect x="450" y="300" width="210" height="105" rx="18" fill="url(#card4)" stroke="#B4A078" stroke-width="2"/>
    <text x="482" y="340" font-size="24" font-weight="800">Audit Trail</text>
    <text x="482" y="373" font-size="17">日志 · 错误 · 产物</text>
  </g>

  <g stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arrow4)">
    <path d="M272 192 C350 152 400 135 448 135"/>
    <path d="M660 135 C740 155 785 178 818 192"/>
    <path d="M925 248 C860 300 730 330 660 345"/>
    <path d="M440 345 C320 330 240 280 178 248"/>
    <path d="M555 300 C555 250 555 220 555 190"/>
  </g>
</svg>
