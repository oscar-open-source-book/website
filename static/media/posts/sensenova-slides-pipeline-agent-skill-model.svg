<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="SenseNova agent skill model role diagram">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#1B3B6B"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="1" stop-color="#E9DEC8"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#F3D07A"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg3)"/>
  <circle cx="1030" cy="90" r="150" fill="#D9A441" opacity="0.14"/>
  <circle cx="130" cy="450" r="130" fill="#6EA8FE" opacity="0.12"/>
  <text x="60" y="58" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="30" font-weight="800">Agent, Skill, Model</text>
  <text x="60" y="90" fill="#D9A441" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="17" font-weight="600">分工不是并列口号，而是不同层级的可恢复协作</text>

  <g font-family="Inter, 'Noto Sans SC', sans-serif">
    <rect x="100" y="145" width="220" height="135" rx="20" fill="#101E33" stroke="#D9A441" stroke-width="3"/>
    <text x="132" y="185" fill="#F5F0E8" font-size="26" font-weight="800">Hermes Agent</text>
    <text x="132" y="222" fill="#F5F0E8" font-size="18">理解目标</text>
    <text x="132" y="252" fill="#F5F0E8" font-size="18">读取状态 · 修复失败</text>

    <rect x="480" y="145" width="220" height="135" rx="20" fill="url(#card3)" stroke="#B4A078" stroke-width="2"/>
    <text x="512" y="185" font-size="26" font-weight="800">SenseNova Skill</text>
    <text x="512" y="222" font-size="18">拆分 stage</text>
    <text x="512" y="252" font-size="18">约束输入输出</text>

    <rect x="860" y="145" width="220" height="135" rx="20" fill="url(#card3)" stroke="#B4A078" stroke-width="2"/>
    <text x="892" y="185" font-size="26" font-weight="800">SenseNova Models</text>
    <text x="892" y="222" font-size="18">推理 / HTML</text>
    <text x="892" y="252" font-size="18">配图 / 质检</text>

    <rect x="100" y="350" width="980" height="92" rx="22" fill="url(#gold3)" opacity="0.96"/>
    <text x="140" y="392" font-size="25" font-weight="800">Fact Layer</text>
    <text x="140" y="424" font-size="20">Markdown · JSON artifact · HTML deck · PNG image</text>
  </g>

  <g stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arrow3)">
    <path d="M320 212 C380 212 420 212 478 212"/>
    <path d="M700 212 C760 212 800 212 858 212"/>
    <path d="M970 282 C840 330 520 330 260 350"/>
    <path d="M1060 280 C1088 320 1060 348 1040 350" stroke-dasharray="9 9"/>
  </g>
  <text x="732" y="318" fill="#F5F0E8" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="16">artifact 回流</text>
</svg>
