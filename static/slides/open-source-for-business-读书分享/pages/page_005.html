<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>核心洞察</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --accent:#00E5FF;
  --neutral:#B0BEC5;
  --dark:#0A1628;
  --card-bg:rgba(10,22,40,0.55);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{font-family:'Roboto',sans-serif;color:#E8F1FB;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;}
#bg img{width:100%;height:100%;object-fit:cover;display:block;}
#bg .bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,30,0.65) 0%,rgba(6,14,30,0.35) 45%,rgba(6,14,30,0.55) 100%);z-index:1;}
#ct{position:absolute;inset:0;z-index:2;padding:60px;}

.top{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:36px;}
.kicker{font-family:'Roboto',sans-serif;font-weight:300;font-size:15px;letter-spacing:12px;color:var(--accent);margin-bottom:22px;text-transform:uppercase;}
.title{font-family:'Inter',sans-serif;font-weight:800;font-size:120px;line-height:1;letter-spacing:6px;background:linear-gradient(180deg,#FFFFFF 0%,#B0E4FA 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(33,150,243,0.25);}
.rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:26px 0 20px;}
.subtitle{font-family:'Roboto',sans-serif;font-weight:400;font-size:22px;color:var(--neutral);letter-spacing:4px;}

.columns{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:56px;padding:0 40px;}
.col{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 30px;text-align:center;}
.col-divider{width:1px;align-self:stretch;background:linear-gradient(180deg,transparent 0%,var(--accent) 30%,var(--accent) 70%,transparent 100%);box-shadow:0 0 12px rgba(0,229,255,0.6);margin:18px 0;}
.col-num{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;letter-spacing:6px;color:var(--accent);margin-bottom:14px;}
.col-title{font-family:'Inter',sans-serif;font-weight:700;font-size:30px;color:#FFFFFF;margin-bottom:16px;letter-spacing:2px;}
.col-desc{font-family:'Roboto',sans-serif;font-weight:300;font-size:16px;line-height:1.7;color:var(--neutral);max-width:280px;}

.bottom-narrative{position:absolute;left:80px;right:80px;bottom:118px;text-align:center;font-family:'Roboto',sans-serif;font-weight:300;font-size:14px;line-height:1.8;color:var(--neutral);letter-spacing:1px;}
.bottom-narrative .highlight{color:var(--accent);font-weight:400;}

.data-strip{position:absolute;left:80px;right:80px;bottom:46px;display:flex;justify-content:space-between;align-items:center;}
.data-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 28px;border:1px solid rgba(0,229,255,0.5);background:var(--card-bg);box-shadow:0 0 18px rgba(0,229,255,0.15),inset 0 0 12px rgba(33,150,243,0.08);min-width:180px;}
.data-card::before,.data-card::after{content:'';position:absolute;}
.data-card{position:relative;}
.data-card .d-corner{position:absolute;width:8px;height:8px;border:1px solid var(--accent);}
.data-card .d-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.data-card .d-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;}
.data-card .d-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;}
.data-card .d-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.d-label{font-family:'Roboto',sans-serif;font-weight:300;font-size:12px;letter-spacing:4px;color:var(--neutral);}
.d-value{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;color:var(--accent);letter-spacing:2px;}
.d-spacer{flex:1;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img src="../images/page_005_section_bg.png" alt="章节过渡背景">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">
    <div class="top">
      <div class="kicker"><span>CHAPTER · INSIGHT</span></div>
      <h1 class="title"><span>核心洞察</span></h1>
      <div class="rule"></div>
      <div class="subtitle"><span>从商业模式到治理结构的深层剖析</span></div>
    </div>

    <div class="columns">
      <div class="col">
        <div class="col-num"><span>01</span></div>
        <div class="col-title"><span>商业模型</span></div>
        <div class="col-desc"><span>开源软件如何盈利，以及企业如何在其中找到自身位置</span></div>
      </div>
      <div class="col-divider"></div>
      <div class="col">
        <div class="col-num"><span>02</span></div>
        <div class="col-title"><span>治理与社区</span></div>
        <div class="col-desc"><span>项目治理模式如何决定社区的健康度与长期活力</span></div>
      </div>
      <div class="col-divider"></div>
      <div class="col">
        <div class="col-num"><span>03</span></div>
        <div class="col-title"><span>竞争与合作</span></div>
        <div class="col-desc"><span>同行之间在开源项目上的竞合关系与战略博弈</span></div>
      </div>
    </div>

    <div class="bottom-narrative">
      <span>进入核心洞察部分，我们将聚焦三个最容易被忽视但决定成败的关键维度：<span class="highlight">商业模式如何成立</span>、<span class="highlight">治理结构如何运转</span>，以及<span class="highlight">企业与社区之间的边界如何被定义</span>。</span>
    </div>

    <div class="data-strip">
      <div class="data-card">
        <span class="d-corner tl"></span><span class="d-corner tr"></span><span class="d-corner bl"></span><span class="d-corner br"></span>
        <span class="d-label">洞察维度</span>
        <span class="d-value">3</span>
      </div>
      <div class="data-card">
        <span class="d-corner tl"></span><span class="d-corner tr"></span><span class="d-corner bl"></span><span class="d-corner br"></span>
        <span class="d-label">覆盖企业</span>
        <span class="d-value">数十家</span>
      </div>
      <div class="data-card">
        <span class="d-corner tl"></span><span class="d-corner tr"></span><span class="d-corner bl"></span><span class="d-corner br"></span>
        <span class="d-label">分析深度</span>
        <span class="d-value">战略级</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
