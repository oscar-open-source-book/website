<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启示与行动</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap');

:root {
  --primary: #2196F3;
  --accent: #00E5FF;
  --neutral: #B0BEC5;
  --bg-dark: #0A0E1A;
  --bg-card: #0F1525;
  --bg-node: #11192F;
  --text-main: #E8EAF6;
  --text-sub: #90A4AE;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto', sans-serif;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: radial-gradient(ellipse at 50% 0%, #0D1B33 0%, #0A0E1A 60%, #060A14 100%);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

#bg::before {
  content: '';
  position: absolute;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 1200px;
  height: 600px;
  background: radial-gradient(ellipse at center, rgba(33,150,243,0.12) 0%, rgba(0,229,255,0.05) 40%, transparent 70%);
}

#bg::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 400px;
  background: radial-gradient(ellipse at 30% 100%, rgba(33,150,243,0.08) 0%, transparent 50%), radial-gradient(ellipse at 70% 100%, rgba(0,229,255,0.06) 0%, transparent 50%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 80px;
  display: flex;
  flex-direction: column;
}

.top-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  padding-top: 10px;
}

.chapter-tag {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 8px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.chapter-tag .tag-line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent));
}

.chapter-tag .tag-line.right {
  background: linear-gradient(90deg, var(--accent), transparent);
}

.main-title {
  font-family: 'Inter', sans-serif;
  font-size: 82px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #E8EAF6 0%, #2196F3 50%, #00E5FF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
  margin-bottom: 18px;
  position: relative;
}

.title-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 100px;
  background: radial-gradient(ellipse at center, rgba(33,150,243,0.25) 0%, transparent 70%);
  z-index: -1;
  filter: blur(20px);
}

.subtitle {
  font-family: 'Inter', sans-serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--neutral);
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.subtitle::before,
.subtitle::after {
  content: '◆';
  color: var(--primary);
  font-size: 10px;
  margin: 0 16px;
  vertical-align: middle;
}

.narrative {
  max-width: 900px;
  font-size: 15px;
  line-height: 1.9;
  color: var(--text-sub);
  text-align: center;
  padding: 22px 40px;
  border-top: 1px solid rgba(33,150,243,0.2);
  border-bottom: 1px solid rgba(33,150,243,0.2);
  position: relative;
  margin: 12px auto 18px auto;
  background: rgba(15, 21, 37, 0.4);
}

.narrative .highlight {
  color: var(--accent);
  font-weight: 500;
}

.narrative .highlight-blue {
  color: var(--primary);
  font-weight: 500;
}

.bottom-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex: 1;
  position: relative;
  padding-top: 8px;
}

.path-line {
  position: absolute;
  top: 60px;
  left: 15%;
  width: 70%;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(33,150,243,0.4) 20%, rgba(0,229,255,0.6) 50%, rgba(33,150,243,0.4) 80%, transparent 100%);
  z-index: 0;
}

.path-line::before {
  content: '';
  position: absolute;
  top: -3px;
  left: 0;
  width: 100%;
  height: 8px;
  background: linear-gradient(90deg, transparent 0%, rgba(33,150,243,0.15) 20%, rgba(0,229,255,0.25) 50%, rgba(33,150,243,0.15) 80%, transparent 100%);
  filter: blur(4px);
}

.node {
  flex: 1;
  max-width: 360px;
  background: linear-gradient(180deg, rgba(17, 25, 47, 0.9) 0%, rgba(10, 14, 26, 0.95) 100%);
  border: 1px solid rgba(33, 150, 243, 0.3);
  border-radius: 14px;
  padding: 24px 26px 26px 26px;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

.node::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 20%;
  width: 60%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.node-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.node-orb {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(0,229,255,0.9) 0%, rgba(33,150,243,0.7) 50%, rgba(33,150,243,0.3) 100%);
  box-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(33,150,243,0.3), inset 0 0 10px rgba(255,255,255,0.3);
  position: relative;
  flex-shrink: 0;
}

.node-orb::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.3);
}

.node-num {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--accent);
  margin-bottom: 3px;
}

.node-title {
  font-family: 'Inter', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 1px;
}

.node-divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  margin: 4px 0 12px 0;
  border-radius: 1px;
}

.node-desc {
  font-size: 14px;
  line-height: 1.7;
  color: var(--neutral);
}

.data-strip {
  position: absolute;
  bottom: 28px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: center;
  gap: 20px;
  z-index: 2;
}

.data-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 22px;
  background: rgba(15, 21, 37, 0.85);
  border: 1px solid rgba(33, 150, 243, 0.25);
  border-radius: 30px;
  font-size: 13px;
}

.data-chip .chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(0,229,255,0.8);
}

.data-chip .chip-label {
  color: var(--text-sub);
  font-weight: 300;
}

.data-chip .chip-value {
  color: var(--text-main);
  font-weight: 600;
  font-family: 'Inter', sans-serif;
}

.geo-corner-tl {
  position: absolute;
  top: 30px;
  left: 30px;
  width: 80px;
  height: 80px;
  border-top: 1px solid rgba(33,150,243,0.4);
  border-left: 1px solid rgba(33,150,243,0.4);
  z-index: 0;
}

.geo-corner-tr {
  position: absolute;
  top: 30px;
  right: 30px;
  width: 80px;
  height: 80px;
  border-top: 1px solid rgba(0,229,255,0.3);
  border-right: 1px solid rgba(0,229,255,0.3);
  z-index: 0;
}

.geo-corner-bl {
  position: absolute;
  bottom: 20px;
  left: 30px;
  width: 80px;
  height: 80px;
  border-bottom: 1px solid rgba(0,229,255,0.3);
  border-left: 1px solid rgba(33,150,243,0.4);
  z-index: 0;
}

.geo-corner-br {
  position: absolute;
  bottom: 20px;
  right: 30px;
  width: 80px;
  height: 80px;
  border-bottom: 1px solid rgba(33,150,243,0.4);
  border-right: 1px solid rgba(0,229,255,0.3);
  z-index: 0;
}

.grid-dots {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(circle, rgba(33,150,243,0.08) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.5;
  z-index: 0;
}

.side-label-left {
  position: absolute;
  top: 50%;
  left: 18px;
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: center;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 6px;
  color: rgba(176, 190, 197, 0.4);
  z-index: 0;
}

.side-label-right {
  position: absolute;
  top: 50%;
  right: 18px;
  transform: translateY(-50%) rotate(90deg);
  transform-origin: center;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 6px;
  color: rgba(176, 190, 197, 0.4);
  z-index: 0;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="grid-dots"></div>
  </div>
  <div id="ct">
    <div class="geo-corner-tl"></div>
    <div class="geo-corner-tr"></div>
    <div class="geo-corner-bl"></div>
    <div class="geo-corner-br"></div>
    <div class="side-label-left">CHAPTER · 07</div>
    <div class="side-label-right">ACTION · 行动</div>

    <div class="top-area">
      <div class="chapter-tag">
        <span class="tag-line"></span>
        <span>CHAPTER · 章节过渡</span>
        <span class="tag-line right"></span>
      </div>
      <div style="position: relative;">
        <div class="title-glow"></div>
        <div class="main-title">启示与行动</div>
      </div>
      <div class="subtitle">从阅读走向实践的关键跃迁</div>
    </div>

    <div class="narrative">
      阅读的最终目的是<span class="highlight-blue">行动</span>。从<span class="highlight">战略</span>到<span class="highlight">组织</span>再到<span class="highlight">个人</span>，开源实践需要层层落地。本书提供的不是一个简单答案，而是一套<span class="highlight-blue">思维框架</span>，帮助企业在复杂生态中做出更清晰、更可持续的决策。
    </div>

    <div class="bottom-area">
      <div class="path-line"></div>

      <div class="node">
        <div class="node-head">
          <div class="node-orb"></div>
          <div>
            <div class="node-num">LEVEL 01</div>
            <div class="node-title">战略层面</div>
          </div>
        </div>
        <div class="node-divider"></div>
        <div class="node-desc">把开源纳入企业长期技术战略与产品规划，而非单点的技术选型</div>
      </div>

      <div class="node">
        <div class="node-head">
          <div class="node-orb"></div>
          <div>
            <div class="node-num">LEVEL 02</div>
            <div class="node-title">组织层面</div>
          </div>
        </div>
        <div class="node-divider"></div>
        <div class="node-desc">建立开源委员会或专职团队，统筹贡献、合规与社区关系</div>
      </div>

      <div class="node">
        <div class="node-head">
          <div class="node-orb"></div>
          <div>
            <div class="node-num">LEVEL 03</div>
            <div class="node-title">个人层面</div>
          </div>
        </div>
        <div class="node-divider"></div>
        <div class="node-desc">鼓励工程师参与开源贡献，将其视为个人成长与团队价值的重要路径</div>
      </div>
    </div>

    <div class="data-strip">
      <div class="data-chip">
        <span class="chip-dot"></span>
        <span class="chip-label">落地层级</span>
        <span class="chip-value">3 层</span>
      </div>
      <div class="data-chip">
        <span class="chip-dot"></span>
        <span class="chip-label">行动窗口</span>
        <span class="chip-value">"当下"</span>
      </div>
      <div class="data-chip">
        <span class="chip-dot"></span>
        <span class="chip-label">核心原则</span>
        <span class="chip-value">"长期主义"</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
