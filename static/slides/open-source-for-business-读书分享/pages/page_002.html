<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>关于本书</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --cyan:#00E5FF;
  --gray:#B0BEC5;
  --dark:#0d1b2a;
  --text:#e8eef4;
  --card-bg:rgba(13,27,42,0.55);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;color:var(--text);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;}
#bg img{width:1600px;height:900px;object-fit:cover;display:block;}
#ct{position:absolute;inset:0;z-index:1;padding:54px 120px 44px 120px;display:flex;flex-direction:column;}
.title-wrap{text-align:center;margin-top:34px;}
.eyebrow{font-family:'Roboto',sans-serif;font-weight:500;font-size:13px;letter-spacing:6px;color:var(--cyan);margin-bottom:14px;}
.main-title{font-family:'Inter',sans-serif;font-weight:800;font-size:72px;letter-spacing:8px;color:#ffffff;text-shadow:0 0 40px rgba(33,150,243,0.6);}
.subtitle{font-family:'Roboto',sans-serif;font-weight:300;font-size:21px;color:var(--gray);letter-spacing:3px;margin-top:14px;}
.divider{margin:22px auto 24px auto;width:340px;height:3px;background:linear-gradient(90deg,transparent,var(--primary),var(--cyan),var(--primary),transparent);border-radius:2px;box-shadow:0 0 18px rgba(0,229,255,0.55);}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-bottom:18px;}
.card{background:var(--card-bg);border:1px solid rgba(33,150,243,0.25);border-radius:12px;padding:20px 22px;backdrop-filter:blur(4px);position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,var(--primary),var(--cyan));}
.card-label{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;letter-spacing:3px;color:var(--cyan);margin-bottom:10px;}
.card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;color:#ffffff;margin-bottom:10px;line-height:1.4;}
.card-desc{font-size:13.5px;line-height:1.7;color:var(--gray);font-weight:300;}
.data-row{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-bottom:22px;}
.data-tag{display:flex;align-items:center;justify-content:center;background:rgba(33,150,243,0.08);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:12px 10px;font-size:13px;color:var(--text);letter-spacing:1.5px;}
.data-tag .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:10px;box-shadow:0 0 10px var(--cyan);}
.footnote{max-width:1100px;margin:0 auto;text-align:center;font-size:13.5px;line-height:1.9;color:var(--gray);font-weight:300;border-top:1px solid rgba(33,150,243,0.18);padding-top:16px;}
.footnote em{font-style:normal;color:var(--cyan);}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img src="../images/page_002_section_bg.png" alt="章节分隔视觉背景">
  </div>
  <div id="ct">
    <div class="title-wrap">
      <div class="eyebrow"><span>CHAPTER · 序章</span></div>
      <h1 class="main-title"><span>关于本书</span></h1>
      <div class="subtitle"><span>一本书读懂企业为什么拥抱开源</span></div>
      <div class="divider"></div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label"><span>01</span></div>
        <div class="card-title"><span>核心议题</span></div>
        <div class="card-desc"><span>开源不再只是开发方式，而是企业产品、战略与文化的重要维度。</span></div>
      </div>
      <div class="card">
        <div class="card-label"><span>02</span></div>
        <div class="card-title"><span>目标读者</span></div>
        <div class="card-desc"><span>面向 CTO、产品负责人与决策层，帮助理解开源的商业价值。</span></div>
      </div>
      <div class="card">
        <div class="card-label"><span>03</span></div>
        <div class="card-title"><span>叙事视角</span></div>
        <div class="card-desc"><span>从历史演进到当下格局，再到未来趋势的完整商业视角。</span></div>
      </div>
    </div>

    <div class="data-row">
      <div class="data-tag"><span class="dot"></span><span>议题范畴：商业战略</span></div>
      <div class="data-tag"><span class="dot"></span><span>覆盖行业：科技 / 金融 / 制造</span></div>
      <div class="data-tag"><span class="dot"></span><span>核心价值：决策洞察</span></div>
    </div>

    <div class="footnote">
      <span>《Open Source for Business》并非技术手册，而是一部把开源放回商业语境中审视的著作，它用全球一线企业的实践告诉我们：<em>开源早已不是选做题，而是现代企业竞争格局下的必答题。</em></span>
    </div>
  </div>
</div>
</body>
</html>
