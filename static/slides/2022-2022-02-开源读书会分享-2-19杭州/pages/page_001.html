

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源读书会分享</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Roboto+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
:root{
  --primary:#2196F3;
  --accent:#00BCD4;
  --text-main:#ECEFF1;
  --text-dim:rgba(236,239,241,0.68);
  --line:rgba(33,150,243,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{
  font-family:'Inter','Noto Sans SC',sans-serif;
  color:var(--text-main);
}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
#bg .bg-photo{position:absolute;left:0;top:0;width:1600px;height:900px;object-fit:cover;display:block;}
#bg .bg-vignette{
  position:absolute;left:0;top:0;width:900px;height:900px;
  background:linear-gradient(90deg,rgba(7,17,35,0.82) 0%,rgba(7,17,35,0.55) 45%,rgba(7,17,35,0.0) 100%);
}
#ct{position:absolute;inset:0;z-index:1;padding:80px 90px 70px 90px;display:flex;flex-direction:column;justify-content:space-between;}
.head-row{
  display:flex;align-items:center;gap:14px;
  font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:0.22em;
  color:var(--primary);text-transform:uppercase;
}
.head-row .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 12px var(--primary);}
.head-row .bar{width:60px;height:1px;background:var(--line);}
.head-row .tag{color:var(--text-dim);letter-spacing:0.22em;}
.main-block{max-width:920px;}
.main-title{
  font-family:'Noto Sans SC','Inter',sans-serif;
  font-weight:900;font-size:128px;line-height:1.02;letter-spacing:0.02em;
  color:var(--text-main);
  text-shadow:0 0 40px rgba(33,150,243,0.25);
  margin-bottom:36px;
}
.main-title .accent{color:var(--primary);}
.main-title .divider{display:inline-block;width:14px;height:14px;background:var(--accent);vertical-align:middle;margin:0 4px 20px 4px;box-shadow:0 0 18px var(--accent);}
.sub-title{
  font-family:'Roboto Mono','Noto Sans SC',monospace;
  font-size:22px;font-weight:400;letter-spacing:0.06em;
  color:var(--text-main);
  padding-left:18px;border-left:3px solid var(--primary);
  margin-bottom:48px;line-height:1.6;
}
.tags{display:flex;flex-direction:column;gap:16px;max-width:900px;}
.tag-item{
  display:flex;align-items:flex-start;gap:18px;
  font-size:15px;line-height:1.6;
  padding:14px 18px;
  border:1px solid rgba(33,150,243,0.22);
  border-left:3px solid var(--accent);
  background:rgba(7,17,35,0.35);
  backdrop-filter:blur(2px);
}
.tag-item .label{
  font-family:'Roboto Mono',monospace;
  font-size:12px;font-weight:500;letter-spacing:0.18em;
  color:var(--accent);
  white-space:nowrap;
  padding-top:2px;
  min-width:120px;
}
.tag-item .sep{color:rgba(33,150,243,0.6);font-family:'Roboto Mono',monospace;}
.tag-item .desc{color:var(--text-main);opacity:0.92;}
.footer{
  display:flex;align-items:center;gap:24px;
  font-family:'Roboto Mono',monospace;
  font-size:11px;letter-spacing:0.12em;
  color:var(--text-dim);
  padding-top:18px;
  border-top:1px solid rgba(33,150,243,0.28);
  max-width:920px;
}
.footer .fdot{color:var(--primary);}
.footer .k{color:var(--primary);}
.footer .v{color:var(--text-main);opacity:0.85;}
.footer .rule{width:24px;height:1px;background:var(--line);display:inline-block;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="/slides/2022-2022-02-开源读书会分享-2-19杭州/images/page_001_hero.jpg" alt="深空蓝科技感抽象背景">
    <div class="bg-vignette"></div>
  </div>
  <div id="ct">

    <div class="head-row">
      <span class="dot"></span>
      <span>OPEN SOURCE / READING CLUB</span>
      <span class="bar"></span>
      <span class="tag">VOL.2022 · NO.001</span>
    </div>

    <div class="main-block">
      <h1 class="main-title">
        <span>开源读书会</span><span class="divider"></span><span class="accent">分享</span>
      </h1>
      <div class="sub-title">
        2022年2月19日 · 杭州 · 开源之书记录
      </div>
      <div class="tags">
        <div class="tag-item">
          <span class="label">// 主题聚焦</span>
          <span class="desc">围绕开源文化、阅读方法与社区参与展开深度分享</span>
        </div>
        <div class="tag-item">
          <span class="label">// 城市坐标</span>
          <span class="desc">杭州线下场次，汇聚本地开源爱好者与技术从业者</span>
        </div>
        <div class="tag-item">
          <span class="label">// 记录形式</span>
          <span class="desc">以开源之道为框架，整理为可复用的读书会资料集</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span><span class="k">活动日期</span> <span class="rule"></span> <span class="v">2022-02-19（线下举行）</span></span>
      <span class="fdot">◆</span>
      <span><span class="k">举办城市</span> <span class="rule"></span> <span class="v">杭州（华东核心站点）</span></span>
      <span class="fdot">◆</span>
      <span><span class="k">分享主题</span> <span class="rule"></span> <span class="v">开源读书会（开源之道系列）</span></span>
    </div>

  </div>
</div>
</body>
</html>
