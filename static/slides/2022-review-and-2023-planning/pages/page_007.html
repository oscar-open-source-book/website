<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>2023阅读规划</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto+Mono:wght@300;400;500&display=swap');

:root {
  --bg-dark: #0a0e14;
  --primary: #2196F3;
  --accent: #00BCD4;
  --neutral: #B0BEC5;
  --text-main: #ECEFF1;
  --text-muted: #78909C;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto Mono', monospace;
  background: var(--bg-dark);
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.bg-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.32;
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(10,14,20,0.92) 0%, rgba(10,14,20,0.85) 35%, rgba(10,14,20,0.7) 65%, rgba(10,14,20,0.88) 100%);
}

.bg-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 400px at 22% 65%, rgba(33,150,243,0.08), transparent 70%),
              radial-gradient(500px 350px at 78% 30%, rgba(0,188,212,0.06), transparent 70%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 56px 84px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top Section */
.top-section {
  display: flex;
  align-items: flex-start;
  gap: 48px;
}

.num-block {
  display: flex;
  align-items: center;
  gap: 32px;
  flex-shrink: 0;
  padding-top: 8px;
}

.num-bar {
  width: 6px;
  height: 190px;
  background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
  border-radius: 3px;
  box-shadow: 0 0 24px rgba(33,150,243,0.5);
}

.num-text {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 200px;
  line-height: 0.9;
  letter-spacing: -8px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.title-block {
  flex: 1;
  padding-top: 24px;
}

.section-tag {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 4px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.section-tag .tag-line {
  width: 40px;
  height: 1px;
  background: var(--accent);
  opacity: 0.6;
}

.main-title {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 64px;
  line-height: 1.1;
  letter-spacing: -1px;
  color: var(--text-main);
  margin-bottom: 18px;
}

.sub-title {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 22px;
  line-height: 1.5;
  color: var(--neutral);
  letter-spacing: 0.5px;
}

/* Divider */
.mid-divider {
  margin: 40px 0 30px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.mid-divider .line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(33,150,243,0.4), rgba(0,188,212,0.15), transparent);
}

.mid-divider .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

/* Points Section */
.points-section {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 28px;
}

.point-card {
  padding: 24px 26px 26px;
  border: 1px solid rgba(33,150,243,0.2);
  border-radius: 8px;
  background: rgba(33,150,243,0.04);
  position: relative;
  overflow: hidden;
  transition: none;
}

.point-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--primary), var(--accent));
}

.point-num {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--primary);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.point-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 24px;
  color: var(--text-main);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.point-desc {
  font-family: 'Roboto Mono', monospace;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.7;
  color: var(--neutral);
}

/* Bottom Closing */
.bottom-section {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 10px;
}

.bottom-bar {
  width: 4px;
  height: 56px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  border-radius: 2px;
  flex-shrink: 0;
}

.closing-text {
  font-family: 'Roboto Mono', monospace;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.7;
  color: var(--neutral);
  flex: 1;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="/slides/2022-review-and-2023-planning/images/page_007_roadmap_bg.jpg" alt="">
    <div class="bg-overlay"></div>
    <div class="bg-glow"></div>
  </div>
  <div id="ct">

    <div class="top-section">
      <div class="num-block">
        <div class="num-bar"></div>
        <div class="num-text">02</div>
      </div>
      <div class="title-block">
        <div class="section-tag">
          <span class="tag-line"></span>
          <span>SECTION 02 · ROADMAP</span>
        </div>
        <h1 class="main-title">2023 阅读规划</h1>
        <p class="sub-title">新一年的开源学习蓝图与成长路径</p>
      </div>
    </div>

    <div class="mid-divider">
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <div class="points-section">
      <div class="point-card">
        <div class="point-num">01 / DIRECTION</div>
        <div class="point-title">方向升级</div>
        <div class="point-desc">从单点技术深耕转向 AI 与云原生两大前沿领域的系统学习。</div>
      </div>
      <div class="point-card">
        <div class="point-num">02 / RHYTHM</div>
        <div class="point-title">节奏优化</div>
        <div class="point-desc">以季度为周期设定阅读目标，配合社区分享形成正向反馈。</div>
      </div>
      <div class="point-card">
        <div class="point-num">03 / DEPTH</div>
        <div class="point-title">深度加码</div>
        <div class="point-desc">增加源代码阅读与翻译项目，从阅读走向实践与传播。</div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="bottom-bar"></div>
      <p class="closing-text">站在2023的起点，适兕以更加清晰的方向感和更具挑战性的目标开启新一年的阅读征程——既要对标技术前沿，也要守住开源初心，让阅读成为开源布道的不竭动力。</p>
    </div>

  </div>
</div>
</body>
</html>
