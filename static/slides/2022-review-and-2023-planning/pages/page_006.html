

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>年度收获感悟</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --gray: #B0BEC5;
  --text-main: #E3F2FD;
  --text-sub: #90CAF9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Roboto Mono', monospace;
  color: var(--text-main);
  background: #050a12;
}
.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}
#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #050a12 0%, #0a1420 45%, #0d1a30 70%, #0a1420 100%);
}
#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 48px 60px 40px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
h1, h2, h3 { font-family: 'Inter', sans-serif; }

/* top section */
.top-section {
  display: flex;
  align-items: flex-start;
  gap: 32px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(33, 150, 243, 0.18);
}
.quote-silhouette {
  flex-shrink: 0;
  width: 100px;
  height: 104px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.big-quote {
  font-family: 'Inter', serif;
  font-size: 110px;
  font-weight: 700;
  line-height: 1;
  color: var(--primary);
  opacity: 0.9;
  text-shadow: 0 0 32px rgba(33, 150, 243, 0.45);
}
.silhouette {
  position: absolute;
  right: 2px;
  bottom: -4px;
}
.top-text {
  flex: 1;
  padding-top: 6px;
}
.main-title {
  font-family: 'Inter', sans-serif;
  font-size: 50px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 8px;
  margin-bottom: 12px;
}
.main-title .accent {
  color: var(--primary);
  text-shadow: 0 0 20px rgba(33, 150, 243, 0.35);
}
.subtitle {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  line-height: 1.85;
  color: var(--gray);
  max-width: 1240px;
  font-weight: 300;
  letter-spacing: 0.5px;
}
.subtitle .highlight {
  color: var(--accent);
  font-weight: 400;
}

/* middle */
.middle {
  display: flex;
  gap: 48px;
  flex: 1;
  margin-top: 26px;
  align-items: stretch;
}
.left-img {
  flex-shrink: 0;
  width: 640px;
  height: 380px;
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(33, 150, 243, 0.28);
  box-shadow: 0 12px 44px rgba(0, 0, 0, 0.5);
}
.left-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.left-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(33, 150, 243, 0.06) 0%, rgba(0, 0, 0, 0) 50%, rgba(0, 188, 212, 0.05) 100%);
  pointer-events: none;
}

.right-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px 10px 6px 0;
}
.insight {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 14px 20px;
  background: linear-gradient(90deg, rgba(33, 150, 243, 0.07) 0%, rgba(33, 150, 243, 0.02) 100%);
  border-left: 2px solid rgba(33, 150, 243, 0.4);
  border-radius: 0 6px 6px 0;
}
.insight .dot {
  flex-shrink: 0;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 12px rgba(33, 150, 243, 0.7);
  margin-top: 8px;
}
.insight-body {
  flex: 1;
}
.insight-title {
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 6px;
  letter-spacing: 1px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.insight-title .num {
  color: var(--primary);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 2px;
}
.insight-title .accent-bar {
  display: inline-block;
  width: 28px;
  height: 2px;
  background: var(--accent);
  margin-left: 6px;
  vertical-align: middle;
}
.insight-desc {
  font-family: 'Roboto Mono', monospace;
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--gray);
  font-weight: 300;
  letter-spacing: 0.3px;
}
.insight:nth-child(1) { margin-left: 0px; }
.insight:nth-child(2) { margin-left: 36px; }
.insight:nth-child(3) { margin-left: 72px; }
.insight:nth-child(4) { margin-left: 108px; }

/* bottom */
.bottom {
  text-align: center;
  padding-top: 16px;
  margin-top: 8px;
  border-top: 1px solid rgba(33, 150, 243, 0.18);
  position: relative;
}
.bottom-text {
  font-family: 'Roboto Mono', monospace;
  font-size: 11.5px;
  color: var(--gray);
  letter-spacing: 5px;
  font-weight: 300;
}
.bottom-text .acc {
  color: var(--accent);
}
.bottom-text .sep {
  color: var(--primary);
  margin: 0 10px;
  opacity: 0.6;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="top-section">
      <div class="quote-silhouette">
        <span class="big-quote">"</span>
        <svg class="silhouette" width="34" height="40" viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="17" cy="8" r="5.5" fill="#2196F3" opacity="0.75"/>
          <path d="M4 40 C4 28.5, 10 23, 17 23 C24 23, 30 28.5, 30 40 Z" fill="#2196F3" opacity="0.75"/>
        </svg>
      </div>
      <div class="top-text">
        <h1 class="main-title">年度<span class="accent">收获</span>感悟</h1>
        <p class="subtitle">阅读的真正价值不在于读了多少本书，而在于这些书如何改变了你的思维方式——<span class="highlight">开源精神与阅读精神相通</span>，保持开放，持续贡献，让知识在流动中增值。</p>
      </div>
    </div>

    <div class="middle">
      <div class="left-img">
        <img src="/slides/2022-review-and-2023-planning/images/page_006_quote_bg.jpg" alt="引号氛围背景图：深色底中央带有大尺寸低透明度天蓝色引号水印，深蓝到炭灰柔和渐变与稀疏微光粒子">
      </div>
      <div class="right-list">
        <div class="insight">
          <span class="dot"></span>
          <div class="insight-body">
            <div class="insight-title"><span class="num">01</span>开源即修行<span class="accent-bar"></span></div>
            <div class="insight-desc">开源不仅是技术协作模式，更是一种开放共享的价值观与生活态度。</div>
          </div>
        </div>
        <div class="insight">
          <span class="dot"></span>
          <div class="insight-body">
            <div class="insight-title"><span class="num">02</span>系统思维养成<span class="accent-bar"></span></div>
            <div class="insight-desc">数据密集型应用的阅读让全局架构视角从无到有地建立起来。</div>
          </div>
        </div>
        <div class="insight">
          <span class="dot"></span>
          <div class="insight-body">
            <div class="insight-title"><span class="num">03</span>写作即思考<span class="accent-bar"></span></div>
            <div class="insight-desc">坚持写读书笔记倒逼深度阅读，输出倒逼输入的质量提升。</div>
          </div>
        </div>
        <div class="insight">
          <span class="dot"></span>
          <div class="insight-body">
            <div class="insight-title"><span class="num">04</span>社区力量<span class="accent-bar"></span></div>
            <div class="insight-desc">开源之道社区的互动让知识从个人沉淀走向集体智慧。</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <p class="bottom-text">保持开放<span class="sep">·</span>持续贡献<span class="sep">·</span><span class="acc">让知识在流动中增值</span></p>
    </div>
  </div>
</div>
</body>
</html>
