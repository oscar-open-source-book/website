<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>共勉与展望</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --neutral: #B0BEC5;
  --bg-dark: #0a0e14;
  --bg-card: #111827;
  --bg-card-2: #0f1522;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto Mono', monospace;
  color: #e8eef5;
  background: #0a0e14;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at 75% 45%, rgba(33,150,243,0.08) 0%, rgba(10,14,20,0) 55%),
              linear-gradient(180deg, #0a0e14 0%, #080c12 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
}

/* Header */
.header {
  margin-bottom: 28px;
}

.header h1 {
  font-family: 'Inter', sans-serif;
  font-size: 56px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.header h1 .accent-bar {
  display: inline-block;
  width: 8px;
  height: 48px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  vertical-align: -6px;
  margin-right: 18px;
  border-radius: 4px;
}

.header .subtitle {
  font-family: 'Roboto Mono', monospace;
  font-size: 16px;
  font-weight: 300;
  color: var(--neutral);
  letter-spacing: 1px;
}

/* Main grid */
.main {
  display: grid;
  grid-template-columns: 1fr 720px;
  gap: 40px;
  height: 590px;
}

/* Left column */
.left {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.quote-block {
  position: relative;
  background: linear-gradient(135deg, rgba(17,24,39,0.9) 0%, rgba(15,21,34,0.9) 100%);
  border: 1px solid rgba(33,150,243,0.18);
  border-radius: 14px;
  padding: 24px 30px 24px 62px;
  overflow: hidden;
}

.quote-block::before {
  content: '\201C';
  position: absolute;
  top: -18px;
  left: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 110px;
  font-weight: 800;
  color: var(--primary);
  opacity: 0.35;
  line-height: 1;
}

.quote-block::after {
  content: '\201D';
  position: absolute;
  bottom: -42px;
  right: 18px;
  font-family: 'Inter', sans-serif;
  font-size: 80px;
  font-weight: 800;
  color: var(--accent);
  opacity: 0.22;
  line-height: 1;
}

.quote-block p {
  font-family: 'Roboto Mono', monospace;
  font-size: 13.5px;
  font-weight: 300;
  line-height: 1.85;
  color: #cfd8e3;
  letter-spacing: 0.3px;
}

.quote-block p .hl {
  color: var(--primary);
  font-weight: 500;
}

/* Three columns */
.three-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.card {
  background: rgba(17,24,39,0.6);
  border: 1px solid rgba(33,150,243,0.15);
  border-top: 2px solid var(--primary);
  border-radius: 10px;
  padding: 16px 16px 16px;
  transition: all 0.3s;
}

.card .card-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(33,150,243,0.12);
  border: 1px solid rgba(33,150,243,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
}

.card:nth-child(2) .card-icon { color: var(--accent); border-color: rgba(0,188,212,0.3); background: rgba(0,188,212,0.1); }
.card:nth-child(3) .card-icon { color: #42a5f5; border-color: rgba(66,165,245,0.3); background: rgba(66,165,245,0.1); }

.card .card-num {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--neutral);
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.card h3 {
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 8px;
}

.card p {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--neutral);
}

/* Right image */
.right {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-frame {
  position: relative;
  width: 700px;
  height: 390px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(33,150,243,0.2);
  background: rgba(8,12,18,0.8);
}

.image-frame img {
  width: 700px;
  height: 390px;
  object-fit: cover;
  display: block;
  opacity: 0.92;
}

.image-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  box-shadow: inset 0 0 60px rgba(33,150,243,0.15),
              inset 0 -40px 60px rgba(0,0,0,0.5);
  pointer-events: none;
}

.image-caption {
  position: absolute;
  bottom: -28px;
  right: 8px;
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  font-weight: 300;
  color: var(--neutral);
  letter-spacing: 1px;
  opacity: 0.7;
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  left: 60px;
  right: 60px;
  bottom: 30px;
  height: 56px;
  background: linear-gradient(90deg,
    rgba(33,150,243,0.18) 0%,
    rgba(33,150,243,0.32) 35%,
    rgba(0,188,212,0.32) 65%,
    rgba(0,188,212,0.15) 100%);
  border-radius: 10px;
  border: 1px solid rgba(33,150,243,0.25);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 2;
}

.bottom-bar .meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  font-weight: 400;
  color: #e0e8f0;
}

.bottom-bar .meta .label {
  color: var(--neutral);
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 1px;
}

.bottom-bar .meta .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}

.bottom-bar .tag {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 2px;
  padding: 6px 14px;
  border: 1px solid rgba(33,150,243,0.4);
  border-radius: 20px;
  background: rgba(33,150,243,0.08);
}

/* Decorative elements */
.deco-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, var(--primary), transparent);
  z-index: 2;
}

.deco-corner {
  position: absolute;
  top: 30px;
  right: 60px;
  width: 60px;
  height: 60px;
  border-top: 1px solid rgba(33,150,243,0.3);
  border-right: 1px solid rgba(33,150,243,0.3);
  z-index: 2;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <span class="deco-line"></span>
    <span class="deco-corner"></span>

    <div class="header">
      <h1><span class="accent-bar"></span><span>共勉与展望</span></h1>
      <p class="subtitle"><span>在开源之路上持续前行，以书为舟渡越技术之海</span></p>
    </div>

    <div class="main">
      <div class="left">
        <div class="quote-block">
          <p>
            <span>开源之道是一条没有终点的旅程，书籍是沿途的灯塔与路标。愿这份<span class="hl">2022年的复盘</span>与<span class="hl">2023年的规划</span>，能成为与你同行的伙伴——在开源的世界里，我们既是<span class="hl">阅读者</span>，也是<span class="hl">书写者</span>。</span>
          </p>
        </div>

        <div class="three-cards">
          <div class="card">
            <div class="card-icon"><span>I</span></div>
            <div class="card-num"><span>01</span></div>
            <h3><span>不忘初心</span></h3>
            <p><span>开源的起点是对技术自由的追求，也是对社区精神的坚守。</span></p>
          </div>
          <div class="card">
            <div class="card-icon"><span>II</span></div>
            <div class="card-num"><span>02</span></div>
            <h3><span>持续精进</span></h3>
            <p><span>以每年十余本书的节奏稳步前进，让成长可量化可追踪。</span></p>
          </div>
          <div class="card">
            <div class="card-icon"><span>III</span></div>
            <div class="card-num"><span>03</span></div>
            <h3><span>开放共享</span></h3>
            <p><span>将阅读所得持续分享给开源之道社区，与同仁同行。</span></p>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="image-frame">
          <img src="/slides/2022-review-and-2023-planning/images/page_010_closing_hero.jpg" alt="深暗背景下散发蓝色柔光的翻开的书">
          <div class="image-caption"><span>— 以书为舟，渡越技术之海 —</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="meta">
        <span class="label">公众号</span>
        <span class="dot"></span>
        <span>开源之道</span>
      </div>
      <div class="meta">
        <span class="label">记录人</span>
        <span class="dot"></span>
        <span>适兕</span>
      </div>
      <div class="tag"><span>FIN · 完</span></div>
    </div>
  </div>
</div>
</body>
</html>
