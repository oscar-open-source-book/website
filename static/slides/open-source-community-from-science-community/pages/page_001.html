

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开源之书记录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --primary: #6B8BA4;
  --accent: #A1887F;
  --neutral: #F5F0EB;
  --text-main: #3A3A3A;
  --text-light: #7A7A78;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

#bg .bg-photo {
  position: absolute;
  inset: 0;
  width: 1600px;
  height: 900px;
  object-fit: cover;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 64px 84px;
}

.top-bar {
  display: flex;
  align-items: center;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: 4px;
  font-weight: 300;
}

.top-bar .brand {
  color: var(--primary);
  font-weight: 500;
}

.top-bar .line {
  flex: 1;
  height: 1px;
  background: var(--primary);
  opacity: 0.35;
  margin: 0 28px;
}

.main-area {
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  max-width: 820px;
}

.title-block {
  margin-bottom: 6px;
}

.title-main {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  font-size: 82px;
  color: var(--primary);
  letter-spacing: 14px;
  line-height: 1.1;
}

.subtitle {
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  font-size: 21px;
  color: var(--text-main);
  letter-spacing: 6px;
  margin-top: 20px;
}

.title-divider {
  width: 220px;
  height: 1px;
  background: var(--primary);
  opacity: 0.55;
  margin: 38px 0 36px;
}

.points {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.point {
  display: flex;
  align-items: center;
  gap: 26px;
}

.point-index {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--accent);
  letter-spacing: 2px;
  min-width: 28px;
  font-weight: 500;
}

.point-label {
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 4px;
  min-width: 96px;
  white-space: nowrap;
}

.point-sep {
  width: 36px;
  height: 1px;
  background: var(--accent);
  opacity: 0.45;
  flex-shrink: 0;
}

.point-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  font-size: 15px;
  color: var(--text-main);
  letter-spacing: 1px;
  line-height: 1.6;
}

.bottom-bar {
  position: absolute;
  bottom: 64px;
  left: 84px;
  right: 84px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.bottom-left {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bottom-reading {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 5px;
  font-weight: 300;
}

.bottom-tagline {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--primary);
  letter-spacing: 3px;
  font-weight: 400;
}

.bottom-deco {
  position: relative;
  width: 130px;
  height: 90px;
}

.deco-square {
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid var(--accent);
  opacity: 0.65;
  right: 0;
  bottom: 0;
}

.deco-ring {
  position: absolute;
  width: 28px;
  height: 28px;
  border: 1px solid var(--primary);
  border-radius: 50%;
  opacity: 0.5;
  right: 32px;
  bottom: 30px;
}

.deco-dot {
  position: absolute;
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
  right: 72px;
  bottom: 16px;
  opacity: 0.7;
}

.deco-h-line {
  position: absolute;
  height: 1px;
  background: var(--primary);
  opacity: 0.4;
  right: 0;
  bottom: 48px;
  width: 60px;
}

.deco-v-line {
  position: absolute;
  width: 1px;
  height: 28px;
  background: var(--accent);
  opacity: 0.4;
  left: 0;
  bottom: 4px;
}

.deco-v-line-2 {
  position: absolute;
  width: 1px;
  height: 16px;
  background: var(--primary);
  opacity: 0.35;
  left: 0;
  bottom: 36px;
}

.page-tag {
  position: absolute;
  top: 64px;
  right: 84px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--primary);
  letter-spacing: 5px;
  font-weight: 500;
  text-align: right;
}

.page-tag .num {
  font-size: 28px;
  font-weight: 400;
  display: block;
  margin-top: 6px;
  color: var(--accent);
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="/slides/open-source-community-from-science-community/images/page_001_hero.jpg" alt="日式和纸纹理背景配极简线条氛围图">
  </div>
  <div id="ct">
    <div class="top-bar">
      <span class="brand">开&nbsp;源&nbsp;之&nbsp;道&nbsp;·&nbsp;适&nbsp;兕</span>
      <div class="line"></div>
      <span>OPEN&nbsp;SOURCE&nbsp;·&nbsp;BOOK&nbsp;RECORDS</span>
    </div>

    <div class="page-tag">
      <span>PROLOGUE</span>
      <span class="num">NO.&nbsp;01</span>
    </div>

    <div class="main-area">
      <div class="title-block">
        <div class="title-main">开源之书记录</div>
        <div class="subtitle">从科学社区到开源社区的成长与布道</div>
      </div>
      <div class="title-divider"></div>

      <div class="points">
        <div class="point">
          <span class="point-index">壹</span>
          <span class="point-label">主题定位</span>
          <div class="point-sep"></div>
          <span class="point-text">记录开源之道·适兕的阅读笔记与社区观察</span>
        </div>
        <div class="point">
          <span class="point-index">贰</span>
          <span class="point-label">核心脉络</span>
          <div class="point-sep"></div>
          <span class="point-text">探索科学社区如何演进为繁荣的开源社区生态</span>
        </div>
        <div class="point">
          <span class="point-index">叁</span>
          <span class="point-label">阅读视角</span>
          <div class="point-sep"></div>
          <span class="point-text">以书籍与文献为线索串联开源社区的发展图景</span>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <div class="bottom-tagline">阅&nbsp;读&nbsp;·&nbsp;思&nbsp;考&nbsp;·&nbsp;分&nbsp;享&nbsp;·&nbsp;协&nbsp;作</div>
        <div class="bottom-reading">A&nbsp;·&nbsp;JOURNEY&nbsp;OF&nbsp;OPEN&nbsp;SOURCE</div>
      </div>
      <div class="bottom-deco">
        <div class="deco-v-line"></div>
        <div class="deco-v-line-2"></div>
        <div class="deco-h-line"></div>
        <div class="deco-square"></div>
        <div class="deco-ring"></div>
        <div class="deco-dot"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
