<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>上篇 · 源起</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --haze-blue: #6B8BA4;
  --soft-brown: #A1887F;
  --warm-cream: #F5F0EB;
  --text-main: #3A4A5A;
  --text-sub: #8899AA;
  --line-soft: #B8C4D0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--warm-cream);
  font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--warm-cream);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

#bg .bg-photo {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 1440px;
  height: 810px;
  object-fit: cover;
  opacity: 0.28;
}

#bg .bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(245,240,235,0.6) 0%, rgba(245,240,235,0.3) 40%, rgba(245,240,235,0.5) 70%, rgba(245,240,235,0.85) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px 180px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--soft-brown);
  font-weight: 300;
  padding-bottom: 8px;
}

.top-bar .right {
  color: var(--haze-blue);
  letter-spacing: 3px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 10px;
}

.chapter-tag {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  letter-spacing: 10px;
  color: var(--soft-brown);
  font-weight: 400;
  margin-bottom: 30px;
  opacity: 0.85;
}

.chapter-tag::before,
.chapter-tag::after {
  content: '—';
  display: inline-block;
  margin: 0 16px;
  color: var(--line-soft);
  font-weight: 300;
}

.title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-weight: 700;
  font-size: 108px;
  letter-spacing: 12px;
  color: var(--haze-blue);
  text-align: center;
  line-height: 1.2;
  margin-bottom: 24px;
}

.subtitle {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-weight: 400;
  font-size: 24px;
  letter-spacing: 8px;
  color: var(--soft-brown);
  text-align: center;
  opacity: 0.85;
  margin-bottom: 32px;
}

.divider {
  width: 140px;
  height: 1px;
  background: var(--haze-blue);
  margin-bottom: 32px;
  position: relative;
}

.divider::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--haze-blue);
  transform: translateX(-50%);
}

.lede {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--text-sub);
  text-align: center;
  font-weight: 300;
  line-height: 1.8;
  max-width: 720px;
  margin-bottom: 48px;
}

.three-col {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  width: 100%;
  max-width: 1000px;
}

.col {
  padding: 24px 32px;
  text-align: center;
  position: relative;
}

.col + .col::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20px;
  bottom: 20px;
  width: 1px;
  background: var(--line-soft);
  opacity: 0.6;
}

.col-index {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  color: var(--haze-blue);
  letter-spacing: 4px;
  margin-bottom: 10px;
  font-weight: 400;
}

.col-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.col-desc {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--text-sub);
  font-weight: 300;
  letter-spacing: 1px;
}

.footer-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--line-soft);
  font-weight: 300;
  padding-top: 8px;
}

.footer-bar .center {
  font-family: 'Noto Serif SC', serif;
  color: var(--soft-brown);
  letter-spacing: 6px;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="/slides/open-source-community-from-science-community/images/page_002_deco.jpg" alt="">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">
    <div class="top-bar">
      <span>PART ONE</span>
      <span class="right">CHAPTER · 01</span>
    </div>

    <div class="main">
      <div class="chapter-tag"><span>CHAPTER</span></div>
      <div class="title"><span>上篇 · 源起</span></div>
      <div class="subtitle"><span>科学社区与开源精神的交汇</span></div>
      <div class="divider"></div>
      <div class="lede">
        <span>开源并非凭空诞生，它的精神根植于科学共同体的开放传统；<br>上篇从学术共享的基因出发，追溯开源社区如何在科学土壤里破土而出。</span>
      </div>

      <div class="three-col">
        <div class="col">
          <div class="col-index"><span>壹</span></div>
          <div class="col-title"><span>本篇章主题</span></div>
          <div class="col-desc"><span>聚焦开源社区早期<br>在学术与科学领域的萌芽</span></div>
        </div>
        <div class="col">
          <div class="col-index"><span>贰</span></div>
          <div class="col-title"><span>核心人物</span></div>
          <div class="col-desc"><span>关注早期推动者<br>如 Richard Stallman 与 Linus Torvalds</span></div>
        </div>
        <div class="col">
          <div class="col-index"><span>叁</span></div>
          <div class="col-title"><span>关键转折</span></div>
          <div class="col-desc"><span>从共享学术成果<br>到 GPL 许可证的法律化定义</span></div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <span><span>OPEN SOURCE · ORIGIN</span></span>
      <span class="center"><span>卷 上</span></span>
      <span><span>P. 002</span></span>
    </div>
  </div>
</div>
</body>
</html>
