<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之道·适兕</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#6B8BA4;
  --blue-soft:#8FA6B8;
  --brown:#A1887F;
  --brown-soft:#C9B7AC;
  --cream:#F5F0EB;
  --text-main:#3A3A3A;
  --text-sub:#6E6E6E;
  --line:#D8D2CC;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;color:var(--text-main);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;background:var(--cream);}
#ct{position:absolute;inset:0;z-index:1;padding:56px 72px 48px;box-sizing:border-box;display:flex;flex-direction:column;}

.header{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:28px;}
.title{font-family:'Noto Serif SC',serif;font-weight:500;font-size:46px;letter-spacing:18px;color:var(--text-main);}
.title .dot{color:var(--brown);font-size:36px;margin:0 6px;}
.subtitle{font-size:13px;line-height:2.0;color:var(--text-sub);letter-spacing:0.5px;max-width:980px;margin-top:20px;font-weight:300;}

.main{flex:1;display:flex;flex-direction:row;align-items:stretch;justify-content:space-between;gap:56px;padding-top:12px;}

.left-col{width:400px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.persona-img{width:400px;height:540px;object-fit:contain;display:block;}
.caption{margin-top:18px;font-size:12px;color:var(--brown);letter-spacing:2px;font-weight:400;}

.divider{width:1px;height:340px;background:var(--line);margin:0 auto;}

.right-col{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:8px;}

.intro-list{display:flex;flex-direction:column;gap:20px;margin-bottom:28px;}

.intro-item{display:flex;align-items:flex-start;gap:16px;}
.intro-marker{flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:9px;margin-left:4px;}
.intro-marker.brown{background:var(--brown);}
.intro-text{flex:1;}
.intro-label{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--blue);letter-spacing:4px;margin-bottom:6px;}
.intro-label.brown{color:var(--brown);}
.intro-body{font-size:12.5px;line-height:1.85;color:var(--text-main);font-weight:300;letter-spacing:0.5px;}

.footer-labels{display:flex;gap:14px;margin-top:6px;padding-top:22px;border-top:1px solid var(--line);}
.label-box{flex:1;padding:12px 18px;border:1px solid var(--line);background:rgba(255,255,255,0.4);display:flex;flex-direction:column;gap:4px;}
.label-key{font-size:11px;color:var(--text-sub);letter-spacing:2px;font-weight:400;}
.label-val{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--blue);letter-spacing:1.5px;font-weight:500;}
.label-box.brown .label-val{color:var(--brown);}

.pagenum{position:absolute;right:72px;bottom:24px;font-size:11px;color:var(--brown-soft);letter-spacing:3px;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="header">
      <div class="title"><span>开源之道<span class="dot">·</span>适兕</span></div>
      <div class="subtitle"><span>适兕取意于《道德经》中"善胜敌者不与"的从容姿态。作为开源布道者，我们的使命不是征服，而是陪伴——陪伴每一位读者在开源世界里找到属于自己的坐标。</span></div>
    </div>

    <div class="main">
      <div class="left-col">
        <img class="persona-img" src="/slides/open-source-community-from-science-community/images/page_009_persona_deco.jpg" alt="侧坐阅读者的极简线条剪影">
        <div class="divider"></div>
        <div class="caption"><span>以阅读为媒介，陪伴每一位开源世界的读者</span></div>
      </div>

      <div class="right-col">
        <div class="intro-list">
          <div class="intro-item">
            <span class="intro-marker"></span>
            <div class="intro-text">
              <div class="intro-label"><span>角色使命</span></div>
              <div class="intro-body"><span>作为开源社区的一员，以阅读为媒介传播开源知识与文化。</span></div>
            </div>
          </div>
          <div class="intro-item">
            <span class="intro-marker"></span>
            <div class="intro-text">
              <div class="intro-label"><span>内容方向</span></div>
              <div class="intro-body"><span>聚焦开源历史、社区治理、工程实践与个人成长四大方向。</span></div>
            </div>
          </div>
          <div class="intro-item">
            <span class="intro-marker brown"></span>
            <div class="intro-text">
              <div class="intro-label brown"><span>输出形式</span></div>
              <div class="intro-body"><span>读书笔记、书评、社区文章与线下分享会。</span></div>
            </div>
          </div>
          <div class="intro-item">
            <span class="intro-marker brown"></span>
            <div class="intro-text">
              <div class="intro-label brown"><span>社区愿景</span></div>
              <div class="intro-body"><span>希望构建一个有温度、有深度、可持续的中文开源读者社群。</span></div>
            </div>
          </div>
        </div>

        <div class="footer-labels">
          <div class="label-box">
            <span class="label-key"><span>核心方向</span></span>
            <span class="label-val"><span>4 条（历史 / 治理 / 实践 / 成长）</span></span>
          </div>
          <div class="label-box brown">
            <span class="label-key"><span>输出形式</span></span>
            <span class="label-val"><span>4 种（笔记 / 书评 / 文章 / 分享）</span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="pagenum"><span>09</span></div>
  </div>
</div>
</body>
</html>
