<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一章·黑客伦理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --cyan: #00E5FF;
  --bg-dark: #1E2A38;
  --text-main: #E8EEF5;
  --text-sub: #8BA0B4;
  --card-bg: rgba(30, 42, 56, 0.72);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 900px; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-main);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}
#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 1600px;
  height: 900px;
  overflow: hidden;
}
#bg .bg-photo {
  width: 1600px;
  height: 900px;
  object-fit: cover;
  display: block;
}
#bg .bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(15,22,32,0.55) 0%, rgba(15,22,32,0.15) 45%, rgba(15,22,32,0.35) 100%);
}
#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px 72px;
  box-sizing: border-box;
}

/* 顶部章节标题区 */
.chapter-header {
  display: flex;
  align-items: flex-start;
  gap: 40px;
  padding-top: 24px;
}
.chapter-num {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 210px;
  line-height: 0.85;
  color: var(--primary);
  letter-spacing: -8px;
  text-shadow: 0 0 60px rgba(33, 150, 243, 0.35);
  flex-shrink: 0;
}
.chapter-title-block {
  padding-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.chapter-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 400;
  color: var(--cyan);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.chapter-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 72px;
  line-height: 1.1;
  color: var(--text-main);
  letter-spacing: 4px;
}
.chapter-subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 22px;
  color: var(--text-sub);
  font-style: italic;
  letter-spacing: 2px;
}
.chapter-subtitle .slash {
  color: var(--cyan);
  font-style: normal;
  margin-right: 14px;
  font-weight: 400;
}

/* 分割线 */
.divider {
  width: 1120px;
  height: 2px;
  margin: 52px 0 44px 0;
  background: linear-gradient(90deg, var(--primary) 0%, var(--cyan) 60%, rgba(33,150,243,0) 100%);
  box-shadow: 0 0 20px rgba(33,150,243,0.4);
}

/* 下方双栏 */
.lower-section {
  display: flex;
  gap: 48px;
  align-items: stretch;
}

/* 左侧卡片 */
.cards-col {
  flex: 0 0 500px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.card {
  background: var(--card-bg);
  border: 1px solid rgba(33,150,243,0.3);
  border-left: 3px solid var(--primary);
  border-radius: 6px;
  padding: 20px 24px;
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  gap: 20px;
}
.card-icon {
  width: 36px;
  height: 36px;
  border: 1px solid var(--cyan);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--cyan);
  flex-shrink: 0;
}
.card-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.card-title {
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 2px;
}
.card-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-main);
  line-height: 1.65;
}

/* 卡片间竖线装饰 */
.card-divider-v {
  width: 1px;
  height: 18px;
  background: var(--cyan);
  margin: 0 0 0 18px;
  box-shadow: 0 0 8px rgba(0,229,255,0.6);
}

/* 右侧叙事 */
.narrative-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 8px;
}
.narrative-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-bottom: 18px;
}
.narrative-text {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 18px;
  line-height: 1.95;
  color: var(--text-main);
  letter-spacing: 0.5px;
}
.narrative-text .hl {
  color: var(--cyan);
  font-weight: 500;
}
.narrative-underline {
  width: 56px;
  height: 1px;
  background: var(--primary);
  margin-top: 24px;
}

/* 底部页脚 */
.footer-meta {
  position: absolute;
  bottom: 32px;
  left: 72px;
  right: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-sub);
  letter-spacing: 2px;
}
.footer-meta .dot {
  display: inline-block;
  width: 4px;
  height: 4px;
  background: var(--cyan);
  border-radius: 50%;
  margin: 0 8px;
  vertical-align: middle;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_section_bg.png" alt="章节背景">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">

    <div class="chapter-header">
      <div class="chapter-num">01</div>
      <div class="chapter-title-block">
        <div class="chapter-tag">CHAPTER · ONE</div>
        <div class="chapter-title">黑客伦理</div>
        <div class="chapter-subtitle"><span class="slash">/</span>追溯开源精神的起点</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="lower-section">
      <div class="cards-col">
        <div class="card">
          <div class="card-icon">01</div>
          <div class="card-body">
            <div class="card-title"><span>章节定位</span></div>
            <div class="card-text">理解黑客伦理是把握开源运动价值内核的前提与根基</div>
          </div>
        </div>

        <div class="card-divider-v"></div>

        <div class="card">
          <div class="card-icon">02</div>
          <div class="card-body">
            <div class="card-title"><span>核心议题</span></div>
            <div class="card-text">从个人自由的追求到协作共享的信念，黑客伦理如何形成</div>
          </div>
        </div>
      </div>

      <div class="narrative-col">
        <div class="narrative-label">PROLOGUE · 引 言</div>
        <div class="narrative-text">
          本章将带领读者回到开源运动的思想源头，追溯<span class="hl">黑客伦理</span>的诞生背景与核心命题。<br>
          我们将从<span class="hl">技术哲学</span>与<span class="hl">社会运动</span>两个维度，解构这一影响深远的文化基因。
        </div>
        <div class="narrative-underline"></div>
      </div>
    </div>

    <div class="footer-meta">
      <div><span>OPEN SOURCE · ETHICS OF HACKING</span></div>
      <div><span>CHAPTER 01</span><span class="dot"></span><span>PAGE 02</span></div>
    </div>

  </div>
</div>
</body>
</html>
