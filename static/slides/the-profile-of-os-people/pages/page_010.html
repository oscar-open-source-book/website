<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>总结与展望</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

:root {
  --primary: #00BCD4;
  --accent: #FF7043;
  --neutral: #B0BEC5;
  --dark-bg: #0A0E1A;
  --card-bg: rgba(10, 14, 26, 0.72);
  --text-main: #E8F4F8;
  --text-dim: #B0BEC5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto Mono', 'Noto Sans SC', monospace;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

#bg .bg-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#bg .bg-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(0, 188, 212, 0.08) 0%, rgba(10, 14, 26, 0.45) 50%, rgba(10, 14, 26, 0.85) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.header-section {
  text-align: center;
  margin-top: 8px;
}

.main-title {
  font-family: 'Inter', 'PingFang SC', sans-serif;
  font-weight: 900;
  font-size: 72px;
  letter-spacing: 12px;
  color: var(--text-main);
  text-shadow:
    0 0 20px rgba(0, 188, 212, 0.85),
    0 0 40px rgba(0, 188, 212, 0.5),
    0 0 80px rgba(0, 188, 212, 0.25);
  line-height: 1.1;
}

.sub-title {
  margin-top: 16px;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 8px;
  color: var(--neutral);
  font-family: 'Roboto Mono', 'Noto Sans SC', monospace;
}

.divider {
  width: 120px;
  height: 2px;
  margin: 20px auto;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
}

.points-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 1200px;
  width: 100%;
}

.point-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px 28px;
  background: var(--card-bg);
  border: 1px solid rgba(0, 188, 212, 0.2);
  border-radius: 8px;
  backdrop-filter: blur(8px);
}

.point-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0, 188, 212, 0.12);
  border: 1px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--primary);
  font-weight: 700;
  flex-shrink: 0;
  font-family: 'Roboto Mono', monospace;
}

.point-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.point-label {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 3px;
  font-family: 'Inter', 'PingFang SC', sans-serif;
}

.point-desc {
  font-size: 14px;
  color: var(--neutral);
  line-height: 1.5;
  font-family: 'Roboto Mono', 'Noto Sans SC', monospace;
}

.cards-section {
  display: flex;
  gap: 24px;
  width: 100%;
  max-width: 1200px;
}

.data-card {
  flex: 1;
  padding: 16px 24px;
  background: var(--card-bg);
  border: 1px solid rgba(0, 188, 212, 0.25);
  border-left: 3px solid var(--primary);
  border-radius: 6px;
  backdrop-filter: blur(8px);
}

.data-card .card-label {
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 4px;
  font-weight: 700;
  font-family: 'Roboto Mono', monospace;
  margin-bottom: 6px;
}

.data-card .card-title {
  font-size: 15px;
  color: var(--text-main);
  font-weight: 700;
  font-family: 'Inter', 'PingFang SC', sans-serif;
  line-height: 1.4;
}

.data-card .card-sub {
  margin-top: 4px;
  font-size: 12px;
  color: var(--neutral);
  font-family: 'Roboto Mono', monospace;
}

.cta-button {
  margin-bottom: 8px;
  padding: 14px 40px;
  background: rgba(255, 112, 67, 0.15);
  border: 1px solid var(--accent);
  border-radius: 30px;
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
  font-family: 'Inter', 'PingFang SC', sans-serif;
  text-shadow: 0 0 12px rgba(255, 112, 67, 0.4);
  box-shadow: 0 0 24px rgba(255, 112, 67, 0.15), inset 0 0 24px rgba(255, 112, 67, 0.08);
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="/slides/the-profile-of-os-people/images/page_010_closing_bg.jpg" alt="深色边缘向中心汇聚的青色光粒场景，带有电影感景深和团结收束的氛围">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">

    <div class="header-section">
      <div class="main-title"><span>总结与展望</span></div>
      <div class="sub-title"><span>开源人士塑造开源未来</span></div>
      <div class="divider"></div>
    </div>

    <div class="points-section">
      <div class="point-row">
        <div class="point-icon"><span>01</span></div>
        <div class="point-text">
          <div class="point-label"><span>多元共融</span></div>
          <div class="point-desc"><span>开源人士的画像远不止程序员，每一份贡献都在让社区更加丰富多元。</span></div>
        </div>
      </div>
      <div class="point-row">
        <div class="point-icon"><span>02</span></div>
        <div class="point-text">
          <div class="point-label"><span>持续进化</span></div>
          <div class="point-desc"><span>社区文化、工具链、协作模式都在快速迭代，贡献者也在不断进化。</span></div>
        </div>
      </div>
      <div class="point-row">
        <div class="point-icon"><span>03</span></div>
        <div class="point-text">
          <div class="point-label"><span>加入我们</span></div>
          <div class="point-desc"><span>无论你是新手还是老手，开源的大门永远向你敞开——从今天开始你的贡献。</span></div>
        </div>
      </div>
    </div>

    <div class="cards-section">
      <div class="data-card">
        <div class="card-label"><span>本期分享</span></div>
        <div class="card-title"><span>开源人士画像</span></div>
        <div class="card-sub"><span>The Profile of OS People</span></div>
      </div>
      <div class="data-card">
        <div class="card-label"><span>下期预告</span></div>
        <div class="card-title"><span>开源治理与社区运营</span></div>
        <div class="card-sub"><span>如何建设和运营开源社区</span></div>
      </div>
    </div>

    <div class="cta-button"><span>期待与你一起，用代码书写更大的开源故事</span></div>

  </div>
</div>
</body>
</html>
