

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第二章 · 布道与阅读</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600&display=swap');

:root {
  --navy: #0D2137;
  --cream: #F5F1E8;
  --wine: #C0392B;
  --navy-soft: #1a3a5c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--navy);
  background: var(--cream);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--cream);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 45px 50px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 560px 1fr;
  gap: 35px;
}

/* ===== 左侧文字区 ===== */
.left-col {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
}

.chapter-label {
  font-size: 13px;
  letter-spacing: 8px;
  color: var(--wine);
  font-weight: 600;
  margin-bottom: 16px;
}

.main-title {
  font-family: 'Playfair Display', 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 54px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1.12;
  letter-spacing: 2px;
}

.subtitle {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--navy-soft);
  margin-top: 14px;
  letter-spacing: 5px;
}

.title-rule {
  width: 56px;
  height: 3px;
  background: var(--wine);
  margin-top: 22px;
  margin-bottom: 26px;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 13px 18px;
  background: rgba(13, 33, 55, 0.035);
  border-left: 3px solid var(--wine);
}

.card-num {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--wine);
  min-width: 34px;
  line-height: 1.2;
}

.card-content {
  flex: 1;
}

.card-title {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
  letter-spacing: 1.5px;
}

.card-desc {
  font-size: 13px;
  color: var(--navy-soft);
  line-height: 1.55;
}

.bottom-block {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.highlights {
  display: flex;
  gap: 14px;
}

.highlight {
  flex: 1;
  padding: 16px 18px;
  background: var(--navy);
  color: var(--cream);
  display: flex;
  flex-direction: column;
  position: relative;
}

.highlight-num {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  font-weight: 900;
  color: var(--cream);
  line-height: 1;
  display: flex;
  align-items: baseline;
}

.highlight-num .unit {
  font-size: 14px;
  font-weight: 400;
  margin-left: 5px;
  color: var(--wine);
  font-family: 'Source Sans 3', sans-serif;
}

.highlight-label {
  font-size: 12px;
  color: var(--cream);
  opacity: 0.9;
  margin-top: 8px;
  letter-spacing: 2px;
}

.highlight-detail {
  font-size: 11px;
  color: var(--cream);
  opacity: 0.7;
  margin-top: 5px;
  line-height: 1.4;
}

.quote {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--navy);
  font-style: italic;
  line-height: 1.7;
  padding-left: 16px;
  border-left: 2px solid var(--wine);
  opacity: 0.82;
}

/* ===== 右侧视觉区 ===== */
.right-col {
  position: relative;
  height: 100%;
}

.img-frame {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.img-frame::before {
  content: '';
  position: absolute;
  top: 24px;
  left: 18px;
  right: 18px;
  bottom: 24px;
  border: 1px solid rgba(13, 33, 55, 0.18);
  z-index: 1;
}

.img-frame::after {
  content: '';
  position: absolute;
  top: 44px;
  left: 38px;
  right: 38px;
  bottom: 44px;
  border: 1px solid rgba(192, 57, 43, 0.32);
  z-index: 1;
}

.chapter-img {
  position: relative;
  z-index: 2;
  width: 900px;
  height: auto;
  max-height: 720px;
  object-fit: contain;
  box-shadow: 0 24px 60px rgba(13, 33, 55, 0.22);
}

.corner-tl {
  position: absolute;
  top: 14px;
  left: 28px;
  z-index: 3;
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--wine);
  font-style: italic;
}

.corner-br {
  position: absolute;
  bottom: 14px;
  right: 28px;
  z-index: 3;
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--navy);
  opacity: 0.7;
  font-style: italic;
}

.img-meta {
  position: absolute;
  bottom: 48px;
  left: 48px;
  right: 48px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--navy);
  opacity: 0.6;
}

.top-stripe {
  position: absolute;
  top: 0;
  left: 50px;
  right: 50px;
  height: 3px;
  background: var(--wine);
  z-index: 2;
}
</style>

<div class="wrapper">

    <div class="right-col">
