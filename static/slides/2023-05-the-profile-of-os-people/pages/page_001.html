

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之人的画像</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Roboto+Mono:wght@300;400;500;700&display=swap');
:root{
  --bg:#0F1923;
  --bg-deep:#0a1218;
  --primary:#2196F3;
  --accent:#00BCD4;
  --text:#E8EEF5;
  --text-dim:#8A99AE;
  --text-mute:#5A6A7E;
  --line:rgba(0,188,212,0.25);
  --card-bg:rgba(33,150,243,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;font-family:'Roboto Mono',monospace;color:var(--text);}
body{background:var(--bg);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#0F1923 0%, #0a1218 100%);}
#ct{position:absolute;inset:0;z-index:1;}

.bg-mark{
  position:absolute;left:30px;top:150px;
  font-family:'Inter',sans-serif;font-weight:900;
  font-size:300px;line-height:1;color:transparent;
  -webkit-text-stroke:1px rgba(33,150,243,0.08);
  letter-spacing:-12px;pointer-events:none;user-select:none;z-index:0;
}

.top-tag{
  position:absolute;left:60px;top:52px;
  display:flex;align-items:center;gap:14px;
  font-family:'Roboto Mono',monospace;font-size:11px;color:var(--accent);
  letter-spacing:4px;font-weight:500;z-index:2;
}
.top-tag .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;
  box-shadow:0 0 12px var(--accent),0 0 24px rgba(0,188,212,0.4);}
.top-tag .line{width:60px;height:1px;background:linear-gradient(90deg,var(--accent),transparent);}

.stage{position:absolute;top:0;left:0;width:1600px;height:900px;display:grid;grid-template-columns:700px 900px;}

.left{padding:60px 40px 60px 60px;position:relative;z-index:2;display:flex;flex-direction:column;}
.main-title{
  font-family:'Inter',sans-serif;font-weight:900;
  font-size:86px;line-height:1.06;letter-spacing:-2px;
  color:var(--text);margin-top:46px;
}
.main-title .hl{
  background:linear-gradient(90deg,#2196F3 0%,#00BCD4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:14px;
}
.divider{
  width:80px;height:3px;margin-top:28px;
  background:linear-gradient(90deg,var(--accent),var(--primary));
  box-shadow:0 0 12px rgba(0,188,212,0.6);
}
.subtitle{
  margin-top:22px;font-size:13px;line-height:1.9;
  color:var(--text-dim);font-weight:400;letter-spacing:0.5px;
}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:32px;}
.card{
  padding:14px 13px;background:var(--card-bg);
  border:1px solid var(--line);border-left:2px solid var(--accent);
  position:relative;
}
.card-label{
  font-family:'Roboto Mono',monospace;font-size:10px;
  color:var(--accent);letter-spacing:2px;font-weight:500;
  margin-bottom:8px;
}
.card-cn{
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
  color:var(--text);margin-bottom:7px;letter-spacing:2px;
}
.card-text{
  font-size:10.5px;line-height:1.7;color:var(--text-dim);font-weight:400;
}

.closing{margin-top:auto;padding-top:28px;position:relative;}
.closing-line{position:absolute;left:0;top:0;width:40px;height:1px;background:var(--accent);}
.closing-text{
  font-size:12px;line-height:1.95;color:var(--text-dim);
  padding-left:52px;
}
.closing-text .em{color:var(--accent);font-weight:500;}

.right{position:relative;padding:70px 60px 60px 30px;display:flex;flex-direction:column;justify-content:center;}
.hero-wrap{position:relative;width:880px;height:520px;}
.hero-img{
  width:880px;height:491px;object-fit:cover;display:block;
  border:1px solid rgba(0,188,212,0.4);
  box-shadow:0 0 60px rgba(0,188,212,0.25),0 0 120px rgba(33,150,243,0.15),0 30px 80px rgba(0,0,0,0.5);
}
.hero-corner{position:absolute;width:24px;height:24px;border:2px solid var(--accent);z-index:3;}
.hero-corner.tl{top:-10px;left:-10px;border-right:none;border-bottom:none;}
.hero-corner.tr{top:-10px;right:-10px;border-left:none;border-bottom:none;}
.hero-corner.bl{bottom:-10px;left:-10px;border-right:none;border-top:none;}
.hero-corner.br{bottom:-10px;right:-10px;border-left:none;border-top:none;}

.hero-cap{
  margin-top:26px;padding-left:18px;position:relative;
  font-size:14px;color:var(--accent);letter-spacing:2px;font-weight:500;
  font-family:'Roboto Mono',monospace;
}
.hero-cap::before{
  content:'';position:absolute;left:0;top:8px;width:8px;height:8px;
  background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent);
}
.hero-meta{margin-top:10px;padding-left:18px;font-size:11px;color:var(--text-mute);letter-spacing:1.5px;}

.footer-bar{
  position:absolute;left:60px;right:60px;bottom:30px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:10px;color:var(--text-mute);letter-spacing:3px;z-index:2;
}
.footer-bar .grid-line{flex:1;height:1px;margin:0 20px;background:linear-gradient(90deg,transparent,var(--line),transparent);}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="bg-mark">01</div>
    <div class="top-tag"><span class="dot"></span><span>开&nbsp;源&nbsp;群&nbsp;像&nbsp;·&nbsp;深&nbsp;度&nbsp;解&nbsp;构</span><span class="line"></span></div>

    <div class="stage">
      <div class="left">
        <h1 class="main-title">开源之人的<br><span class="hl">画&nbsp;像</span></h1>
        <div class="divider"></div>
        <div class="subtitle">The Profile of OS People<br>开源布道与阅读分享</div>

        <div class="cards">
          <div class="card">
            <div class="card-label">01</div>
            <div class="card-cn">主&nbsp;题</div>
            <div class="card-text">围绕开源贡献者群体画像的深度解读与讨论</div>
          </div>
          <div class="card">
            <div class="card-label">02</div>
            <div class="card-cn">出&nbsp;处</div>
            <div class="card-text">2023年5月开源阅读分享系列 · 开源之道 · 适兕</div>
          </div>
          <div class="card">
            <div class="card-label">03</div>
            <div class="card-cn">视&nbsp;角</div>
            <div class="card-text">从数据、动机、行为模式多维度解构开源人群</div>
          </div>
        </div>

        <div class="closing">
          <div class="closing-line"></div>
          <div class="closing-text">
            本期聚焦 <span class="em">「开源之人」</span> 这一核心主题，尝试回答到底是谁在写代码、提 issue、维护项目，通过画像分析既看见数据，也看见 <span class="em">一个个真实的贡献者</span>。
          </div>
        </div>
      </div>

      <div class="right">
        <div class="hero-wrap">
          <img class="hero-img" src="/slides/2023-05-the-profile-of-os-people/images/page_001_hero.jpg" alt="数字洪流中写代码的匿名身影">
          <span class="hero-corner tl"></span>
          <span class="hero-corner tr"></span>
          <span class="hero-corner bl"></span>
          <span class="hero-corner br"></span>
        </div>
        <div class="hero-cap"><span>数字洪流中写代码的匿名身影</span></div>
        <div class="hero-meta">二进制洪流 · 霓虹光束 · 匿名创作者</div>
      </div>
    </div>

    <div class="footer-bar">
      <span>2023 · 05</span>
      <span class="grid-line"></span>
      <span>开源之道 · 适兕</span>
    </div>
  </div>
</div>
</body>
</html>
