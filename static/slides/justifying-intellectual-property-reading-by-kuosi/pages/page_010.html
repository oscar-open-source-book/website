

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阅读收获与延展</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

:root {
  --ink: #000000;
  --gray: #888888;
  --gray-soft: #b8b8b8;
  --bg-mid: #F5F5F5;
  --bg-page: #FFFFFF;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg-page);
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg-page);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--bg-page);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 72px 140px;
  display: flex;
  flex-direction: column;
}

.top {
  display: flex;
  justify-content: center;
  padding-top: 4px;
}

.marker {
  font-size: 12px;
  color: var(--gray);
  letter-spacing: 0.42em;
  font-weight: 500;
  font-family: 'Noto Sans SC', sans-serif;
}

.hero {
  text-align: center;
  margin-top: 82px;
}

.hero h1 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-weight: 500;
  font-size: 84px;
  color: var(--ink);
  margin: 0;
  letter-spacing: 0.18em;
  line-height: 1.1;
}

.hero .subtitle {
  font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
  font-size: 19px;
  color: var(--gray);
  margin-top: 24px;
  font-weight: 300;
  letter-spacing: 0.14em;
}

.quote {
  text-align: center;
  margin-top: 54px;
  padding: 0 90px;
}

.quote p {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-size: 24px;
  line-height: 2;
  color: var(--ink);
  margin: 0;
  font-weight: 400;
  letter-spacing: 0.05em;
}

.endmark {
  display: flex;
  justify-content: center;
  margin-top: 30px;
}

.endmark .dot {
  width: 6px;
  height: 6px;
  background: var(--ink);
  border-radius: 50%;
}

.three {
  margin-top: 56px;
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  gap: 0 44px;
  align-items: start;
}

.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 12px;
}

.col .num {
  font-size: 11px;
  color: var(--gray-soft);
  letter-spacing: 0.4em;
  font-weight: 500;
  margin-bottom: 14px;
}

.col h3 {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  font-size: 20px;
  color: var(--ink);
  margin: 0 0 12px 0;
  font-weight: 500;
  letter-spacing: 0.14em;
}

.col p {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.9;
  margin: 0;
  font-weight: 300;
}

.divider-v {
  width: 1px;
  height: 96px;
  background: var(--bg-mid);
  align-self: center;
  margin-top: 8px;
}

.footer {
  margin-top: auto;
  text-align: center;
  padding-bottom: 4px;
}

.footer .thanks {
  font-size: 12px;
  color: var(--gray);
  letter-spacing: 0.32em;
  font-weight: 300;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="top">
      <span class="marker">END · 第 10 页</span>
    </div>

    <div class="hero">
      <h1>阅读收获与延展</h1>
      <div class="subtitle">正当性不是终点,而是持续的公共对话</div>
    </div>

    <div class="quote">
      <p>正当性不是一次性证明,而是共同维护的过程；<br>开源许可证把这场对话写成了可执行的文本。</p>
    </div>

    <div class="endmark"><span class="dot"></span></div>

    <div class="three">
      <div class="col">
        <span class="num">01</span>
        <h3>回到问题本身</h3>
        <p>知识产权的正当性不是自明的,它需要被反复论证、修订与让渡。</p>
      </div>
      <div class="divider-v"></div>
      <div class="col">
        <span class="num">02</span>
        <h3>开源的启示</h3>
        <p>共享与秩序可以共存,授权契约是二者之间可运行的桥梁。</p>
      </div>
      <div class="divider-v"></div>
      <div class="col">
        <span class="num">03</span>
        <h3>下一步</h3>
        <p>继续阅读开源许可证文本与相关公共政策议题,持续参与对话。</p>
      </div>
    </div>

    <div class="footer">
      <span class="thanks">感谢参与本次共读 · 欢迎在读书会群里继续讨论</span>
    </div>
  </div>
</div>
</body>
</html>
