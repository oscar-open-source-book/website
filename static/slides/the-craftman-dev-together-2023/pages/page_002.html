

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>本期导读</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --secondary:#00BCD4;
  --bg:#1E293B;
  --text-main:#E6EEF6;
  --text-mute:#94A3B8;
  --line:rgba(0,188,212,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{
  font-family:"Source Sans Pro","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  color:var(--text-main);
  background:var(--bg);
}
.wrapper{
  width:1600px;height:900px;position:relative;overflow:hidden;
  margin:0 auto;
  font-family:"Source Sans Pro","Helvetica Neue",Arial,sans-serif;
}
#bg{position:absolute;inset:0;z-index:0;}
#bg .bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
#bg .bg-overlay{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(15,23,42,0.92) 0%,rgba(15,23,42,0.78) 38%,rgba(15,23,42,0.55) 65%,rgba(15,23,42,0.7) 100%);
}
#ct{
  position:absolute;inset:0;z-index:1;
  padding:60px 80px;
  box-sizing:border-box;
}

.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:10px;
}
.brand{
  display:flex;align-items:center;gap:12px;
  font-family:"Inter",sans-serif;font-weight:700;letter-spacing:2px;
  color:var(--secondary);font-size:14px;
}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary);box-shadow:0 0 12px var(--secondary);}
.meta{
  font-family:"Source Sans Pro",sans-serif;
  font-weight:300;font-size:13px;color:var(--text-mute);
  letter-spacing:1.5px;
}

.main{
  display:grid;
  grid-template-columns:640px 1fr;
  gap:60px;
  margin-top:28px;
  height:680px;
}

/* 左侧序号区 */
.left{
  position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding-left:10px;
}
.left .label{
  font-family:"Source Sans Pro",sans-serif;
  font-weight:300;font-size:13px;letter-spacing:6px;
  color:var(--secondary);
  margin-bottom:6px;
}
.left .ch-title{
  font-family:"Inter",sans-serif;
  font-weight:900;
  font-size:140px;
  line-height:1;
  letter-spacing:-4px;
  background:linear-gradient(135deg,rgba(33,150,243,0.92) 0%,rgba(0,188,212,0.78) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  text-shadow:0 0 60px rgba(33,150,243,0.15);
  position:relative;
}
.left .ch-title .sub-num{
  position:absolute;
  font-size:300px;
  top:-30px;right:-30px;
  opacity:0.05;
  -webkit-text-fill-color:var(--primary);
  font-weight:900;
}
.left .divider{
  width:60px;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  margin:24px 0 22px;
  border-radius:2px;
  box-shadow:0 0 14px rgba(0,188,212,0.5);
}
.left .sec-title{
  font-family:"Inter",sans-serif;
  font-weight:700;font-size:44px;line-height:1.15;
  color:var(--text-main);
  letter-spacing:1px;
}
.left .sec-sub{
  font-family:"Inter",sans-serif;
  font-weight:500;font-size:20px;line-height:1.5;
  color:var(--secondary);
  margin-top:14px;
  letter-spacing:2px;
}
.left .deco{
  position:absolute;
  left:0;bottom:0;
  font-family:"Source Sans Pro",sans-serif;
  font-weight:300;font-size:11px;letter-spacing:4px;
  color:rgba(148,163,184,0.5);
}
.left .corner{
  position:absolute;left:0;top:0;
  width:48px;height:48px;
  border-left:2px solid var(--secondary);
  border-top:2px solid var(--secondary);
  opacity:0.6;
}

/* 右侧导览卡片 */
.right{
  display:flex;flex-direction:column;
  justify-content:center;
  gap:0;
  padding-right:10px;
}
.card{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:22px;
  align-items:center;
  padding:20px 22px 20px 8px;
  position:relative;
}
.card .idx{
  font-family:"Inter",sans-serif;
  font-weight:700;font-size:22px;
  color:var(--secondary);
  border:1px solid var(--line);
  width:54px;height:54px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;
  background:rgba(0,188,212,0.06);
}
.card .body h3{
  font-family:"Inter",sans-serif;
  font-weight:700;font-size:24px;
  color:var(--text-main);
  letter-spacing:1px;
  margin-bottom:8px;
}
.card .body p{
  font-family:"Source Sans Pro",sans-serif;
  font-weight:400;font-size:15px;line-height:1.65;
  color:var(--text-mute);
  letter-spacing:0.3px;
}
.card .body h3 .accent{color:var(--primary);}
.card + .card{
  border-top:1px solid rgba(148,163,184,0.15);
}

/* 底部小字 */
.footer{
  position:absolute;
  left:80px;right:80px;bottom:40px;
  display:flex;align-items:center;gap:16px;
}
.footer .line{
  flex:1;height:1px;
  background:linear-gradient(90deg,rgba(0,188,212,0.4),rgba(0,188,212,0));
}
.footer .txt{
  font-family:"Source Sans Pro",sans-serif;
  font-weight:300;font-size:13px;
  color:var(--text-mute);
  letter-spacing:1.5px;
  text-align:right;
}
.footer .tag{
  font-family:"Inter",sans-serif;font-weight:700;
  font-size:11px;letter-spacing:3px;
  color:var(--secondary);
  padding:5px 10px;
  border:1px solid rgba(0,188,212,0.4);
  border-radius:3px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_section_bg.png" alt="抽象代码流与几何网格科技感背景">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">

    <div class="top-bar">
      <div class="brand"><span class="dot"></span><span>OPEN SOURCE QUARTERLY</span></div>
      <div class="meta">SECTION&nbsp;&nbsp;/&nbsp;&nbsp;本期导读&nbsp;&nbsp;/&nbsp;&nbsp;ISSUE 01</div>
    </div>

    <div class="main">
      <div class="left">
        <div class="corner"></div>
        <div class="label">CHAPTER</div>
        <div class="ch-title">
          01
          <span class="sub-num">01</span>
        </div>
        <div class="divider"></div>
        <div class="sec-title">本期导读</div>
        <div class="sec-sub">从阅读中汲取开源的力量</div>
        <div class="deco">READING&nbsp;·&nbsp;INSIGHT&nbsp;·&nbsp;ACTION</div>
      </div>

      <div class="right">
        <div class="card">
          <div class="idx">01</div>
          <div class="body">
            <h3>三大<span class="accent">主线</span></h3>
            <p>工匠精神、协作实践、社区治理构成本期内容的三条叙事线</p>
          </div>
        </div>
        <div class="card">
          <div class="idx">02</div>
          <div class="body">
            <h3>布道<span class="accent">视角</span></h3>
            <p>以适兕为代表的开源布道者视角，串联理论思考与一线实战经验</p>
          </div>
        </div>
        <div class="card">
          <div class="idx">03</div>
          <div class="body">
            <h3>行动<span class="accent">号召</span></h3>
            <p>不仅传递知识，更倡导读者从阅读走向参与，从旁观走向共建</p>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="tag">PATH</span>
      <div class="line"></div>
      <div class="txt">从个人技艺的精进到团队协作的深化，再到社区层面的生态治理，三层递进呈现开源世界的完整图景。</div>
    </div>

  </div>
</div>
</body>
</html>
