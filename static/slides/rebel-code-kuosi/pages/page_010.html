<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>谢谢聆听 · 期待共读</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#1A1A2E;
  --klein:#002FA7;
  --cyan:#00BCD4;
  --text-white:#FFFFFF;
  --text-gray:#A9A9B8;
  --text-dim:#6E6E80;
  --line:#2A2A44;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0B0B15;color:var(--text-white);overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;}
#bg .glow{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1100px;height:1100px;border-radius:50%;
  background:radial-gradient(circle at center,rgba(0,47,167,0.35) 0%,rgba(0,47,167,0.12) 35%,rgba(0,188,212,0.06) 60%,rgba(26,26,46,0) 80%);
}
#bg .vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,0.45) 100%);
}
#ct{position:absolute;inset:0;z-index:1;padding:56px 80px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;}
.head{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:6px;}
.head .eyebrow{font-size:12px;letter-spacing:8px;color:var(--cyan);font-weight:400;text-transform:uppercase;}
.head h1{font-size:52px;font-weight:600;letter-spacing:6px;color:var(--text-white);line-height:1.2;}
.head .divider{width:64px;height:2px;background:linear-gradient(90deg,rgba(0,188,212,0),var(--cyan),rgba(0,188,212,0));margin:4px 0 0 0;}
.head .subtitle{font-size:18px;font-weight:300;color:var(--text-gray);letter-spacing:2px;}
.visual-wrap{position:relative;margin-top:14px;width:720px;height:400px;display:flex;align-items:center;justify-content:center;}
.visual-wrap img{width:720px;height:402px;object-fit:cover;border-radius:6px;display:block;}
.visual-wrap .caption{
  position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
  font-size:11px;letter-spacing:6px;color:var(--text-dim);white-space:nowrap;
}
.cards{display:flex;gap:24px;margin-top:70px;width:1440px;}
.card{
  flex:1;background:linear-gradient(180deg,rgba(0,47,167,0.10) 0%,rgba(26,26,46,0.4) 100%);
  border:1px solid var(--line);border-radius:10px;padding:22px 24px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;left:0;top:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--klein),var(--cyan));
}
.card .tag{font-size:10px;letter-spacing:4px;color:var(--cyan);font-weight:500;}
.card h3{font-size:19px;font-weight:600;color:var(--text-white);letter-spacing:1px;}
.card p{font-size:13px;line-height:1.7;color:var(--text-gray);font-weight:300;}
.datastrip{
  margin-top:auto;width:1440px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.datastrip .col{display:flex;flex-direction:column;gap:4px;}
.datastrip .label{font-size:10px;letter-spacing:4px;color:var(--text-dim);}
.datastrip .val{font-size:14px;color:var(--text-white);font-weight:400;letter-spacing:0.5px;}
.datastrip .sep{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:14px;}
.datastrip .sep .dot{width:3px;height:3px;border-radius:50%;background:var(--cyan);display:inline-block;}
.closing{
  margin-top:16px;text-align:center;font-size:13px;color:var(--text-gray);
  font-weight:300;letter-spacing:1.5px;line-height:1.6;
}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg">
  <div class="glow"></div>
  <div class="vignette"></div>
</div>
<div id="ct">
  <div class="head">
    <div class="eyebrow"><span>THANK YOU</span></div>
    <h1><span>谢谢聆听 · 期待共读</span></h1>
    <div class="divider"></div>
    <div class="subtitle"><span>开源不止于代码，阅读不止于书本</span></div>
  </div>

  <div class="visual-wrap">
    <img src="../images/page_010_closing_visual.png" alt="致谢氛围图：近黑底色上柔和的克莱因蓝径向光晕向外扩散">
    <div class="caption"><span>静谧收束 · 期待再遇</span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="tag"><span>01</span></div>
      <h3><span>核心回顾</span></h3>
      <p><span>从经典到新兴，从阅读到贡献，开源之道需要每一位参与者的持续投入与分享。</span></p>
    </div>
    <div class="card">
      <div class="tag"><span>02</span></div>
      <h3><span>下一步行动</span></h3>
      <p><span>关注适兕栏目，加入共读计划，在 2023 年开启属于你的开源阅读之旅。</span></p>
    </div>
    <div class="card">
      <div class="tag"><span>03</span></div>
      <h3><span>社区互动</span></h3>
      <p><span>欢迎在 GitHub、Gitee、微信公众号等平台与主讲人及社区成员交流讨论。</span></p>
    </div>
  </div>

  <div class="datastrip">
    <div class="col">
      <div class="label"><span>栏目平台</span></div>
      <div class="val"><span>GitHub / 公众号（开源之道社区）</span></div>
    </div>
    <div class="sep">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="col" style="align-items:flex-end;">
      <div class="label"><span>下次共读</span></div>
      <div class="val"><span>2023 年 1 月（持续更新中）</span></div>
    </div>
  </div>

  <div class="closing">
    <span>感谢每一位到场的听众，期待在未来的适兕栏目中与你再次相遇，共同探索开源的无限可能。</span>
  </div>
</div>
</div>
</body>
</html>
