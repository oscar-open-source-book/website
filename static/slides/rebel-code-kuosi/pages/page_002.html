

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开篇 · 为何阅读开源</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --klein: #002FA7;
  --klein-mid: #1E3FCC;
  --cyan: #00BCD4;
  --navy: #1A1A2E;
  --navy-deep: #12121F;
  --text-main: #F0F0F5;
  --text-muted: #A0A0B8;
  --text-dim: #6A6A80;
  --line-subtle: rgba(0, 47, 167, 0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--navy);
}
#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--navy);
}
#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
}
.bg-glow {
  position: absolute;
  top: -220px;
  right: -180px;
  width: 560px;
  height: 560px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 47, 167, 0.14) 0%, transparent 70%);
  pointer-events: none;
}
.bg-glow-2 {
  position: absolute;
  bottom: -160px;
  left: -120px;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 188, 212, 0.05) 0%, transparent 70%);
  pointer-events: none;
}
.page {
  display: flex;
  height: 100%;
  align-items: center;
  gap: 48px;
}
.left-col {
  width: 790px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  flex-shrink: 0;
}
.chapter-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 8px;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 12px;
}
.chapter-label .dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 6px rgba(0, 188, 212, 0.5);
}
.decor-img {
  width: 750px;
  height: 419px;
  object-fit: cover;
  border-radius: 4px;
}
.decor-caption {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 8px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 18px;
}
.decor-caption .sep {
  width: 48px;
  height: 1px;
  background: var(--line-subtle);
}
.right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.main-title {
  font-size: 44px;
  font-weight: 300;
  color: var(--text-main);
  letter-spacing: 2px;
  line-height: 1.25;
  margin-bottom: 20px;
}
.main-title .hl {
  color: var(--cyan);
  font-weight: 400;
}
.subtitle {
  font-size: 15px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.7;
  letter-spacing: 1px;
  margin-bottom: 46px;
  max-width: 540px;
  position: relative;
  padding-left: 22px;
}
.subtitle::before {
  content: '';
  position: absolute;
  left: 0;
  top: 4px;
  width: 2px;
  height: calc(100% - 8px);
  background: var(--klein);
  border-radius: 2px;
}
.blocks {
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.block {
  display: flex;
  align-items: flex-start;
  gap: 22px;
}
.vline {
  width: 2px;
  height: 64px;
  background: var(--klein);
  flex-shrink: 0;
  margin-top: 8px;
  position: relative;
}
.vline::after {
  content: '';
  position: absolute;
  right: -3px;
  top: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
}
.block-text {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.block-num {
  font-size: 11px;
  font-weight: 500;
  color: var(--cyan);
  letter-spacing: 4px;
  margin-bottom: 2px;
}
.block-title {
  font-size: 20px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.block-desc {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.7;
  letter-spacing: 0.5px;
  max-width: 540px;
}
.footer-note {
  position: absolute;
  bottom: 28px;
  left: 60px;
  right: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 3px;
  color: var(--text-dim);
}
.footer-note .left-mark {
  display: flex;
  align-items: center;
  gap: 12px;
}
.footer-note .left-mark .marker {
  width: 20px;
  height: 1px;
  background: var(--klein-mid);
}
.footer-note .right-mark {
  display: flex;
  align-items: center;
  gap: 10px;
}
.footer-note .right-mark .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px rgba(0, 188, 212, 0.4);
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
  </div>
  <div id="ct">
    <div class="page">
      <div class="left-col">
        <div class="chapter-label"><span class="dot"></span><span>CHAPTER · 01</span></div>
        <img class="decor-img" src="../images/page_002_decor.png" alt="克莱因蓝线条构成的数字01装饰图，青色小圆点点缀">
        <div class="decor-caption"><span class="sep"></span><span>章 · 01</span><span class="sep"></span></div>
      </div>
      <div class="right-col">
        <h1 class="main-title"><span>开篇 · 为何阅读<span class="hl">开源</span></span></h1>
        <p class="subtitle"><span>在技术迭代加速的时代，阅读是理解开源的锚点</span></p>
        <div class="blocks">
          <div class="block">
            <div class="vline"></div>
            <div class="block-text">
              <span class="block-num">01</span>
              <h3 class="block-title"><span>背景与缘起</span></h3>
              <p class="block-desc"><span>开源已成为全球软件开发的主流范式，阅读经典是理解其精神内核的捷径。</span></p>
            </div>
          </div>
          <div class="block">
            <div class="vline"></div>
            <div class="block-text">
              <span class="block-num">02</span>
              <h3 class="block-title"><span>适兕栏目定位</span></h3>
              <p class="block-desc"><span>以读书笔记为线索串联技术脉络、社区故事与个人成长体验。</span></p>
            </div>
          </div>
          <div class="block">
            <div class="vline"></div>
            <div class="block-text">
              <span class="block-num">03</span>
              <h3 class="block-title"><span>本场目标</span></h3>
              <p class="block-desc"><span>让听众带走书单、方法论与参与开源社区的实际行动路径。</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-note">
      <div class="left-mark">
        <span class="marker"></span>
        <span>栏目周期：月度</span>
      </div>
      <div class="right-mark">
        <span class="pulse"></span>
        <span>READING · OPEN SOURCE</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
