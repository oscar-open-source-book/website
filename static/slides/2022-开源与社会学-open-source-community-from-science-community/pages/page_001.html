

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源与社会学</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --cyan: #00BCD4;
  --neutral: #B0BEC5;
  --dark-base: #0a1628;
  --midnight: #0d1f3c;
  --card-bg: rgba(13, 31, 60, 0.65);
  --glow-primary: 0 0 20px rgba(33, 150, 243, 0.6);
  --glow-cyan: 0 0 16px rgba(0, 188, 212, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #E8EEF7;
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

#bg .bg-photo {
  position: absolute;
  width: 2752px;
  height: 1536px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  object-fit: cover;
}

#bg .bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(10, 22, 40, 0.78) 0%, rgba(13, 31, 60, 0.72) 40%, rgba(8, 18, 36, 0.85) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px;
}

.top-bar .brand {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--cyan);
  text-transform: uppercase;
}

.top-bar .meta-tag {
  font-size: 12px;
  color: var(--neutral);
  letter-spacing: 2px;
  border: 1px solid rgba(176, 190, 197, 0.3);
  padding: 5px 14px;
  border-radius: 20px;
}

/* Center hero */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin-top: -20px;
}

.hero .tag-row {
  display: flex;
  gap: 14px;
  margin-bottom: 24px;
}

.hero .tag {
  font-size: 12px;
  font-weight: 500;
  color: var(--cyan);
  letter-spacing: 2px;
  padding: 6px 16px;
  border: 1px solid rgba(0, 188, 212, 0.4);
  border-radius: 4px;
  background: rgba(0, 188, 212, 0.08);
}

.hero h1 {
  font-size: 118px;
  font-weight: 800;
  letter-spacing: 8px;
  line-height: 1.1;
  background: linear-gradient(135deg, #E8EEF7 0%, #2196F3 50%, #00BCD4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  margin-bottom: 10px;
}

.hero .title-glow {
  height: 4px;
  width: 320px;
  margin: 6px auto 22px;
  background: linear-gradient(90deg, transparent, var(--primary), var(--cyan), transparent);
  border-radius: 2px;
  box-shadow: 0 0 24px rgba(33, 150, 243, 0.7);
}

.hero .subtitle {
  font-size: 22px;
  font-weight: 300;
  color: var(--neutral);
  letter-spacing: 4px;
  line-height: 1.6;
  max-width: 1000px;
}

.hero .divider {
  margin: 30px auto 0;
  width: 80px;
  height: 1px;
  background: rgba(176, 190, 197, 0.3);
}

/* Cards row */
.cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
  margin-bottom: 28px;
}

.info-card {
  background: var(--card-bg);
  border: 1px solid rgba(33, 150, 243, 0.35);
  border-radius: 12px;
  padding: 22px 24px;
  backdrop-filter: blur(10px);
  box-shadow: var(--glow-primary);
  position: relative;
  overflow: hidden;
}

.info-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), var(--cyan));
  opacity: 0.8;
}

.info-card .card-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.info-card .card-title {
  font-size: 19px;
  font-weight: 700;
  color: #E8EEF7;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.info-card .card-text {
  font-size: 13px;
  font-weight: 400;
  color: var(--neutral);
  line-height: 1.7;
  letter-spacing: 0.3px;
}

/* Bottom badges */
.bottom-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
}

.badges {
  display: flex;
  gap: 16px;
}

.badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  background: rgba(13, 31, 60, 0.7);
  border: 1px solid rgba(33, 150, 243, 0.3);
  border-radius: 6px;
}

.badge .badge-icon {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: var(--glow-cyan);
}

.badge .badge-label {
  font-size: 10px;
  color: var(--neutral);
  letter-spacing: 2px;
  display: block;
}

.badge .badge-value {
  font-size: 14px;
  font-weight: 600;
  color: #E8EEF7;
  letter-spacing: 1px;
}

/* Bottom right decoration */
.deco-zone {
  position: absolute;
  bottom: 60px;
  right: 60px;
  width: 100px;
  height: 100px;
  z-index: 2;
  pointer-events: none;
}

.deco-zone svg {
  width: 100%;
  height: 100%;
  animation: spin 20s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Left side decorative line */
.side-line {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 200px;
  background: linear-gradient(180deg, transparent, var(--primary), var(--cyan), transparent);
  opacity: 0.6;
  z-index: 2;
}

/* Scan lines overlay for tech feel */
.scan-lines {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(33, 150, 243, 0.015) 3px,
    rgba(33, 150, 243, 0.015) 4px
  );
  pointer-events: none;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_001_hero_bg.png" alt="深色科技风抽象网络拓扑背景">
    <div class="bg-overlay"></div>
  </div>
  <div class="scan-lines"></div>

  <div class="side-line"></div>

  <div id="ct">
    <div class="top-bar">
      <div class="brand"><span>OPEN SOURCE × SOCIOLOGY</span></div>
      <div class="meta-tag"><span>COVER · 2022</span></div>
    </div>

    <div class="hero">
      <div class="tag-row">
        <div class="tag"><span>SOCIAL SCIENCE PERSPECTIVE</span></div>
        <div class="tag"><span>OPEN COLLABORATION</span></div>
      </div>
      <h1>开源与社会学</h1>
      <div class="title-glow"></div>
      <div class="subtitle">从科学共同体到开源社区——一场开放协作的社会学观察</div>
      <div class="divider"></div>
    </div>

    <div class="cards-row">
      <div class="info-card">
        <div class="card-num"><span>01 / POSITIONING</span></div>
        <div class="card-title"><span>主题定位</span></div>
        <div class="card-text"><span>以社会学视角重新审视开源社区的运作逻辑与协作机制</span></div>
      </div>
      <div class="info-card">
        <div class="card-num"><span>02 / TIMELINE</span></div>
        <div class="card-title"><span>时间坐标</span></div>
        <div class="card-text"><span>2022年视角回顾开源运动与社会学理论的交汇演进</span></div>
      </div>
      <div class="info-card">
        <div class="card-num"><span>03 / PROPOSITION</span></div>
        <div class="card-title"><span>核心命题</span></div>
        <div class="card-text"><span>开源是否构成了数字时代的新型科学共同体</span></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="badges">
        <div class="badge">
          <div class="badge-icon"></div>
          <div>
            <span class="badge-label">分享年份</span>
            <span class="badge-value">2022</span>
          </div>
        </div>
        <div class="badge">
          <div class="badge-icon" style="background:#2196F3;box-shadow:0 0 16px rgba(33,150,243,0.5);"></div>
          <div>
            <span class="badge-label">理论视角</span>
            <span class="badge-value">科学社会学</span>
          </div>
        </div>
        <div class="badge">
          <div class="badge-icon" style="background:#00BCD4;"></div>
          <div>
            <span class="badge-label">核心议题</span>
            <span class="badge-value">开源共同体</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="deco-zone">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="45" stroke="#2196F3" stroke-width="0.5" opacity="0.4"/>
      <circle cx="50" cy="50" r="35" stroke="#00BCD4" stroke-width="0.5" opacity="0.3"/>
      <ellipse cx="50" cy="50" rx="40" ry="12" stroke="#2196F3" stroke-width="0.6" opacity="0.5" transform="rotate(0 50 50)"/>
      <ellipse cx="50" cy="50" rx="40" ry="12" stroke="#00BCD4" stroke-width="0.6" opacity="0.5" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="50" rx="40" ry="12" stroke="#2196F3" stroke-width="0.6" opacity="0.5" transform="rotate(120 50 50)"/>
      <circle cx="50" cy="50" r="4" fill="#2196F3" opacity="0.8"/>
      <circle cx="90" cy="50" r="2" fill="#00BCD4"/>
      <circle cx="10" cy="50" r="2" fill="#00BCD4"/>
      <circle cx="50" cy="14.5" r="2" fill="#2196F3"/>
      <circle cx="50" cy="85.5" r="2" fill="#2196F3"/>
    </svg>
  </div>
</div>
</body>
</html>
