

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第一部分:理论溯源</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --accent:#00BCD4;
  --gray:#B0BEC5;
  --bg-dark:#0A1A2F;
  --bg-deeper:#061425;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;font-family:'Inter',sans-serif;color:#E8EEF5;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
#bg .bg-photo{position:absolute;top:0;left:0;width:1600px;height:900px;object-fit:cover;object-position:center;}
#bg .bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,37,0.78) 0%,rgba(10,26,47,0.72) 50%,rgba(6,20,37,0.85) 100%);}
#ct{position:absolute;inset:0;z-index:1;padding:60px 80px;box-sizing:border-box;display:flex;flex-direction:column;}

.head-row{display:flex;align-items:flex-start;gap:48px;height:260px;}
.chapter-num{font-size:260px;font-weight:900;line-height:0.85;letter-spacing:-8px;
  background:linear-gradient(135deg,#64B5F6 0%,#2196F3 40%,#00BCD4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(33,150,243,0.45));
  margin-top:-18px;flex-shrink:0;}
.title-block{flex:1;padding-top:32px;}
.title-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:4px;color:var(--accent);
  padding:6px 14px;border:1px solid rgba(0,188,212,0.4);border-radius:2px;margin-bottom:18px;}
.title-main{font-size:52px;font-weight:700;color:#FFFFFF;letter-spacing:1px;line-height:1.15;}
.title-sub{margin-top:18px;font-size:20px;font-weight:300;color:var(--gray);letter-spacing:1px;line-height:1.5;}
.title-line{margin-top:22px;width:80px;height:2px;background:linear-gradient(90deg,var(--primary),var(--accent));}

.divider{margin:24px 0 20px 0;height:2px;background:linear-gradient(90deg,rgba(33,150,243,0) 0%,#2196F3 20%,#00BCD4 80%,rgba(0,188,212,0) 100%);position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.divider::before{left:20%;}
.divider::after{right:20%;}

.points{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;}
.point{display:flex;align-items:center;gap:24px;padding:14px 24px;background:rgba(33,150,243,0.06);border-left:2px solid var(--primary);border-radius:2px;}
.point-tag{flex-shrink:0;font-size:15px;font-weight:700;color:#FFFFFF;letter-spacing:2px;padding:6px 14px;border:1px solid rgba(33,150,243,0.5);border-radius:2px;min-width:120px;text-align:center;}
.point-content{flex:1;font-size:17px;font-weight:400;color:var(--gray);line-height:1.5;}
.point-content b{color:#FFFFFF;font-weight:600;}

.footer{margin-top:auto;display:flex;flex-direction:column;gap:14px;}
.narrative{font-size:14px;font-weight:300;color:#90A4AE;line-height:1.65;letter-spacing:0.5px;
  padding-left:16px;border-left:2px solid rgba(0,188,212,0.4);}
.data-row{display:flex;gap:14px;}
.data-tag{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 18px;background:rgba(10,26,47,0.6);border:1px solid rgba(176,190,197,0.15);border-radius:2px;}
.data-tag .k{font-size:11px;font-weight:500;letter-spacing:2px;color:var(--accent);}
.data-tag .v{font-size:15px;font-weight:600;color:#FFFFFF;}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg">
<img class="bg-photo" src="../images/page_002_section_bg.png" alt="">
<div class="bg-overlay"></div>
</div>
<div id="ct">

<div class="head-row">
<div class="chapter-num"><span>01</span></div>
<div class="title-block">
  <div class="title-tag"><span>PART 01 · INTRODUCTION</span></div>
  <div class="title-main"><span>第一部分:理论溯源</span></div>
  <div class="title-sub"><span>从默顿科学规范到开源精神的基因传承</span></div>
  <div class="title-line"></div>
</div>
</div>

<div class="divider"></div>

<div class="points">
<div class="point">
  <div class="point-tag"><span>默顿规范</span></div>
  <div class="point-content"><span>科学社会学的四大规范:<b>普遍主义、公有性、无私利性、有组织怀疑</b></span></div>
</div>
<div class="point">
  <div class="point-tag"><span>开源精神</span></div>
  <div class="point-content"><span><b>开放、共享、协作、自由</b>,与默顿规范形成惊人映射</span></div>
</div>
<div class="point">
  <div class="point-tag"><span>关键命题</span></div>
  <div class="point-content"><span>开源社区是否可被视为<b>数字时代的新型科学共同体</b>?</span></div>
</div>
</div>

<div class="footer">
<div class="narrative"><span>本部分追溯开源社区的思想根源,重点梳理默顿科学规范(USPS)与开源文化的内在关联,揭示二者在知识公有性、协作无私利性等核心维度上的结构同构,为后续分析奠定理论基石。</span></div>
<div class="data-row">
  <div class="data-tag"><span class="k">理论源头</span><span class="v">默顿科学社会学</span></div>
  <div class="data-tag"><span class="k">核心规范数</span><span class="v">4项(USPS)</span></div>
  <div class="data-tag"><span class="k">开源宣言年份</span><span class="v">1987 / 1998</span></div>
</div>
</div>

</div>
</div>
</body>
</html>
