<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第二章 · 回望</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Serif+SC:wght@400;600;900&family=Source+Sans+3:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{
  --bg:#0D2137;
  --white:#FFFFFF;
  --accent:#E53935;
  --muted:rgba(255,255,255,0.62);
  --line:rgba(255,255,255,0.18);
  --line-strong:rgba(255,255,255,0.35);
  --serif:'Playfair Display','Noto Serif SC',serif;
  --sans:'Source Sans 3','Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:var(--sans);
  font-weight:300;
}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
#bg .glow{
  position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(229,57,53,0.10) 0%,rgba(229,57,53,0) 60%);
  right:-200px;top:-300px;
}
#bg .glow2{
  position:absolute;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,rgba(255,255,255,0) 60%);
  left:-150px;bottom:-200px;
}
#bg .grain{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,33,55,0) 0%,rgba(13,33,55,0.6) 100%);
}
#ct{position:absolute;inset:0;z-index:1;padding:64px 72px 48px 72px;box-sizing:border-box;display:flex;flex-direction:column;}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:0.28em;
  color:var(--muted);text-transform:uppercase;
}
.top-bar .chap-mark{
  display:flex;align-items:center;gap:14px;
}
.top-bar .chap-mark .dot{
  width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;
}
.main{
  display:grid;grid-template-columns:1fr 720px;gap:56px;
  margin-top:36px;
}
.left-col{display:flex;flex-direction:column;justify-content:flex-start;}
.chap-label{
  font-family:var(--sans);font-size:14px;font-weight:400;
  letter-spacing:0.36em;color:var(--accent);text-transform:uppercase;
  margin-bottom:18px;
}
.main-title{
  font-family:var(--serif);font-weight:900;
  font-size:104px;line-height:1.02;letter-spacing:-0.01em;
  color:var(--white);
}
.main-title .accent-bar{
  display:block;width:88px;height:3px;background:var(--accent);margin-top:22px;
}
.subtitle{
  margin-top:28px;
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:24px;line-height:1.5;color:rgba(255,255,255,0.82);
  padding-left:20px;border-left:2px solid var(--accent);
  max-width:520px;
}
.right-col{position:relative;display:flex;flex-direction:column;justify-content:flex-start;}
.art-frame{
  position:relative;width:700px;height:391px;
  border:1px solid var(--line-strong);
  overflow:hidden;background:#0a1a2c;
}
.art-frame img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.art-frame .frame-overlay{
  position:absolute;left:0;right:0;bottom:0;height:60px;
  background:linear-gradient(180deg,rgba(13,33,55,0) 0%,rgba(13,33,55,0.55) 100%);
  pointer-events:none;
}
.art-caption{
  margin-top:14px;font-family:var(--serif);font-style:italic;
  font-size:15px;color:rgba(255,255,255,0.7);letter-spacing:0.02em;
  display:flex;align-items:center;gap:12px;
}
.art-caption .quote-mark{
  font-family:var(--serif);font-size:34px;color:var(--accent);line-height:0.6;
}
.points-area{
  margin-top:44px;padding-top:30px;
  border-top:1px solid var(--line);
}
.points-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
}
.point{
  padding:0 26px 0 26px;
  border-left:1px solid var(--line);
}
.point:first-child{padding-left:0;border-left:none;}
.point .num{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:14px;color:var(--accent);letter-spacing:0.12em;
  margin-bottom:8px;
}
.point .keyword{
  font-family:var(--serif);font-weight:700;
  font-size:22px;line-height:1.2;color:var(--white);
  margin-bottom:10px;
}
.point .desc{
  font-family:var(--sans);font-weight:300;
  font-size:13.5px;line-height:1.65;color:var(--muted);
}
.foot{
  margin-top:26px;padding-top:18px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--sans);font-size:12px;letter-spacing:0.18em;
  color:var(--muted);
}
.foot .foot-left{
  display:flex;align-items:center;gap:14px;
}
.foot .foot-left .bar{
  width:24px;height:1px;background:var(--accent);
}
.foot .foot-right{font-style:italic;font-family:var(--serif);font-size:14px;letter-spacing:0.02em;color:rgba(255,255,255,0.55);}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="grain"></div>
  </div>
  <div id="ct">
    <div class="top-bar">
      <div class="chap-mark"><span class="dot"></span><span>SECTION&nbsp;&nbsp;02 / 05</span></div>
      <div>回望 · REFLECTIONS</div>
    </div>

    <div class="main">
      <div class="left-col">
        <div class="chap-label"><span>CHAPTER TWO</span></div>
        <h1 class="main-title">
          <span>第二章 · 回望</span>
          <span class="accent-bar"></span>
        </h1>
        <p class="subtitle"><span>"沉淀与展望：写给后来者的话"</span></p>
      </div>
      <div class="right-col">
        <div class="art-frame">
          <img src="/slides/6-years-memory/images/page_008_section_art_2.jpg" alt="一面镜子映出远方山峦与明亮地平线，温暖红色地平线将镜内世界与外部深色空间连接">
          <div class="frame-overlay"></div>
        </div>
        <div class="art-caption">
          <span class="quote-mark">"</span>
          <span>以镜为鉴，照见来路与远方</span>
        </div>
      </div>
    </div>

    <div class="points-area">
      <div class="points-grid">
        <div class="point">
          <div class="num"><span>01 — 回望为什么</span></div>
          <div class="keyword"><span>看清来路</span></div>
          <div class="desc"><span>只有回头看，才能看清走了多远、偏离了什么。</span></div>
        </div>
        <div class="point">
          <div class="num"><span>02 — 沉淀什么</span></div>
          <div class="keyword"><span>组织方法</span></div>
          <div class="desc"><span>把零散笔记组织成可复用的方法论与思考框架。</span></div>
        </div>
        <div class="point">
          <div class="num"><span>03 — 给谁看</span></div>
          <div class="keyword"><span>致后来者</span></div>
          <div class="desc"><span>写给正在入门的同学，与正在犹豫要不要开始的人。</span></div>
        </div>
        <div class="point">
          <div class="num"><span>04 — 展望什么</span></div>
          <div class="keyword"><span>记录仍贵</span></div>
          <div class="desc"><span>在 AI 与开源相遇的时代，记录与分享依然有价值。</span></div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="foot-left"><span class="bar"></span><span>本章节点：沉淀 · 展望 —— 回望与前瞻两个面向</span></div>
      <div class="foot-right"><span>Page 08</span></div>
    </div>
  </div>
</div>
</body>
</html>
