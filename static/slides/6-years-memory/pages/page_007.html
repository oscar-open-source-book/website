

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>从读者到布道者</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Source+Sans+3:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D2137;
  --navy-soft:#1B3553;
  --gray:#F5F5F5;
  --gray-dark:#E6E6E6;
  --red:#E53935;
  --text-main:#0D2137;
  --text-sub:#4A5A6E;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Source Sans 3','Noto Sans SC',sans-serif;color:var(--text-main);background:var(--gray);overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--gray);}
#bg{position:absolute;inset:0;z-index:0;}
#ct{position:absolute;inset:0;z-index:1;padding:56px 60px 44px 60px;box-sizing:border-box;display:flex;flex-direction:column;}

.head-block{display:flex;flex-direction:column;align-items:flex-start;}
.title-row{display:flex;align-items:center;gap:18px;}
.title-accent{width:6px;height:56px;background:var(--red);display:inline-block;}
h1.title{font-family:'Playfair Display','Noto Serif SC',serif;font-weight:700;font-size:52px;color:var(--navy);letter-spacing:2px;line-height:1;}
.subtitle{margin-top:18px;margin-left:24px;max-width:1460px;font-size:15px;line-height:1.85;color:var(--text-sub);font-weight:400;}
.top-rule{margin-top:20px;margin-left:24px;width:1460px;height:1px;background:var(--navy);}

.main{margin-top:26px;flex:1;display:flex;gap:36px;align-items:stretch;}
.col-left{width:55%;display:flex;flex-direction:column;}
.col-right{width:45%;display:flex;flex-direction:column;gap:14px;}

.art-wrap{position:relative;width:100%;height:440px;background:#fff;border:1px solid var(--gray-dark);border-left:4px solid var(--navy);padding:18px;display:flex;align-items:center;justify-content:center;}
.art-wrap img{max-width:100%;max-height:100%;width:784px;height:400px;object-fit:contain;display:block;}
.art-meta{position:absolute;top:14px;left:22px;font-family:'Playfair Display',serif;font-size:13px;color:var(--navy);letter-spacing:2px;}
.art-num{position:absolute;top:14px;right:22px;font-family:'Playfair Display',serif;font-size:13px;color:var(--red);letter-spacing:2px;}
.caption{margin-top:14px;font-size:14px;color:var(--navy);letter-spacing:2px;font-weight:600;font-family:'Noto Serif SC',serif;padding-left:4px;border-top:1px solid var(--gray-dark);padding-top:12px;}

.card{background:#fff;border-left:4px solid var(--red);border-top:1px solid var(--gray-dark);border-right:1px solid var(--gray-dark);border-bottom:1px solid var(--gray-dark);padding:14px 18px 14px 20px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-head{display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;color:var(--navy);letter-spacing:1px;}
.card-idx{font-family:'Playfair Display',serif;font-weight:600;font-size:22px;color:var(--red);line-height:1;}
.card-detail{font-size:14px;line-height:1.7;color:var(--text-sub);font-weight:400;}

.footer{margin-top:18px;display:flex;align-items:center;gap:16px;padding-top:14px;border-top:1px solid var(--navy);}
.footer-dot{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;flex-shrink:0;}
.footer-text{font-family:'Noto Serif SC',serif;font-weight:600;font-size:18px;color:var(--navy);letter-spacing:4px;}
.footer-mark{margin-left:auto;font-family:'Playfair Display',serif;font-size:12px;color:var(--text-sub);letter-spacing:3px;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="head-block">
      <div class="title-row">
        <span class="title-accent"></span>
        <h1 class="title"><span>从读者到布道者</span></h1>
      </div>
      <p class="subtitle"><span>布道者的角色不是凭空产生的，它建立在长期阅读与积累之上。当输入足够多，输出就会自然发生，而把这种输出组织成可复用的笔记，就形成了布道的素材。</span></p>
      <div class="top-rule"></div>
    </div>

    <div class="main">
      <div class="col-left">
        <div class="art-wrap">
          <span class="art-meta">EVOLUTION · 角色演化</span>
          <span class="art-num">№ 03</span>
          <img src="/slides/6-years-memory/images/page_007_evolution_art.jpg" alt="三段角色演化示意图：读者、贡献者、布道者的剪影由暖红色弧线串联">
        </div>
        <div class="caption"><span>角色演化：读者 → 贡献者 → 布道者</span></div>
      </div>

      <div class="col-right">
        <div class="card">
          <div class="card-head">
            <span class="card-title">身份转变</span>
            <span class="card-idx">01</span>
          </div>
          <div class="card-detail"><span>从输入到输出，角色从旁观者走向社区参与者。</span></div>
        </div>
        <div class="card">
          <div class="card-head">
            <span class="card-title">输出实践</span>
            <span class="card-idx">02</span>
          </div>
          <div class="card-detail"><span>写博客、做演讲、办读书会，把笔记转化为公共知识。</span></div>
        </div>
        <div class="card">
          <div class="card-head">
            <span class="card-title">社区参与</span>
            <span class="card-idx">03</span>
          </div>
          <div class="card-detail"><span>参与主流开源项目，提交 issue、PR，加入 SIG。</span></div>
        </div>
        <div class="card">
          <div class="card-head">
            <span class="card-title">布道定位</span>
            <span class="card-idx">04</span>
          </div>
          <div class="card-detail"><span>以阅读笔记为线索，连接技术、文化与价值。</span></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-dot"></span>
      <span class="footer-text">输入沉淀为输出，输出沉淀为布道</span>
      <span class="footer-mark">READ · WRITE · TEACH</span>
    </div>

  </div>
</div>
</body>
</html>
