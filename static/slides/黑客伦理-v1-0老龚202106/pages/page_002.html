

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>背景与缘起</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{
  --bg:#1E1E2E;
  --bg-2:#2A2A3E;
  --silver:#B0BEC5;
  --cyan:#00BCD4;
  --dim:#546E7A;
  --accent:#00BCD4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0E0E18;font-family:'Inter','Noto Sans SC',sans-serif;color:var(--silver);overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 80% 20%, rgba(0,188,212,0.08), transparent 60%), radial-gradient(ellipse at 15% 85%, rgba(0,188,212,0.05), transparent 55%), #1E1E2E;}
#ct{position:absolute;inset:0;z-index:1;padding:60px;display:flex;}

.chapter-tag{
  position:absolute;top:48px;left:72px;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;font-weight:700;
  color:var(--cyan);letter-spacing:4px;
  display:flex;align-items:center;gap:14px;
  text-shadow:0 0 12px rgba(0,188,212,0.6);
}
.chapter-tag::before{
  content:"";display:block;width:44px;height:2px;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

.main{display:flex;width:100%;height:100%;gap:60px;align-items:stretch;padding-top:40px;}

.left{flex:0 0 720px;display:flex;flex-direction:column;justify-content:center;}
.right{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:10px;}

.sec-label{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;color:var(--dim);letter-spacing:6px;margin-bottom:24px;
}
.sec-label span{color:var(--cyan);}

.title{
  font-family:'JetBrains Mono',monospace;
  font-size:96px;font-weight:800;
  color:#ECEFF1;line-height:1.05;letter-spacing:2px;
  margin-bottom:24px;
  text-shadow:0 0 24px rgba(0,188,212,0.15);
}
.title .glow{
  color:var(--cyan);
  text-shadow:0 0 20px rgba(0,188,212,0.6), 0 0 40px rgba(0,188,212,0.3);
}

.subtitle{
  font-family:'JetBrains Mono',monospace;
  font-size:26px;font-weight:400;
  color:var(--silver);letter-spacing:1px;margin-bottom:28px;
}
.subtitle::before{
  content:"> ";color:var(--cyan);
}

.narrative{
  font-family:'Inter','Noto Sans SC',sans-serif;
  font-size:16px;line-height:1.85;font-weight:300;
  color:#78909C;max-width:580px;margin-bottom:36px;
  border-left:2px solid var(--cyan);padding-left:18px;
  box-shadow:-2px 0 12px rgba(0,188,212,0.15) inset;
}

.cards{display:flex;flex-direction:column;gap:16px;max-width:640px;}
.card{
  font-family:'JetBrains Mono',monospace;
  background:rgba(38,38,58,0.7);
  border:1px solid rgba(0,188,212,0.25);
  border-left:3px solid var(--cyan);
  padding:14px 20px;display:flex;gap:16px;align-items:flex-start;
  box-shadow:0 0 20px rgba(0,188,212,0.06) inset;
}
.card .comment{color:var(--cyan);font-size:13px;letter-spacing:1px;white-space:nowrap;}
.card .tag{color:#ECEFF1;font-size:14px;font-weight:700;margin-bottom:4px;display:block;}
.card .body{color:var(--silver);font-size:14px;font-weight:400;font-family:'Inter','Noto Sans SC',sans-serif;line-height:1.6;}

.img-wrap{
  width:760px;height:424px;position:relative;
  border:1px solid rgba(0,188,212,0.2);
  padding:10px;background:rgba(14,14,24,0.6);
  box-shadow:0 0 40px rgba(0,188,212,0.08), 0 0 120px rgba(0,188,212,0.04);
}
.img-wrap img{width:760px;height:424px;display:block;object-fit:cover;}
.img-caption{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;color:var(--silver);letter-spacing:1px;
  margin-top:16px;padding-left:4px;display:flex;align-items:center;gap:10px;
}
.img-caption::before{
  content:"◈";color:var(--cyan);text-shadow:0 0 8px var(--cyan);
}

.corner-grid{
  position:absolute;right:60px;top:48px;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);
  letter-spacing:2px;text-align:right;line-height:1.6;
}
.corner-grid .dim{color:#455A64;}

.bottom-bar{
  position:absolute;left:72px;bottom:48px;right:72px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);
  letter-spacing:2px;
}
.bottom-bar .line{flex:1;height:1px;background:linear-gradient(90deg, rgba(0,188,212,0.4), transparent);margin:0 20px;}

.cursor{
  display:inline-block;width:12px;height:26px;background:var(--cyan);
  vertical-align:-4px;margin-left:6px;
  box-shadow:0 0 10px var(--cyan);
  animation:blink 1.1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg"></div>
<div id="ct">

<div class="chapter-tag"><span>CHAPTER 02 / SECTION</span></div>
<div class="corner-grid">
  <div>// BACKGROUND &amp; ORIGIN</div>
  <div class="dim">// 0x02</div>
</div>

<div class="main">
<div class="left">
  <div class="sec-label"><span>&gt;</span> SECTION 02 — BACKGROUND</div>
  <div class="title">背景与<span class="glow">缘起</span></div>
  <div class="subtitle">为什么读黑客伦理<span class="cursor"></span></div>
  <div class="narrative">
    本节介绍黑客伦理产生的历史背景，以及分享者选择这一主题的初衷，为后续深入奠定基础。
  </div>
  <div class="cards">
    <div class="card">
      <span class="comment">// 01</span>
      <span>
        <span class="tag">时代背景</span>
        <span class="body">互联网初期，黑客文化萌芽并影响技术社群。</span>
      </span>
    </div>
    <div class="card">
      <span class="comment">// 02</span>
      <span>
        <span class="tag">个人动机</span>
        <span class="body">从开源实践回溯伦理源头，理解协作根基。</span>
      </span>
    </div>
  </div>
</div>

<div class="right">
  <div class="img-wrap">
    <img src="../images/page_002_deco.png" alt="复古 CRT 终端显示器剪影从暗影中浮现，投射青蓝色光芒，周围漂浮像素网格与线框几何">
  </div>
  <div class="img-caption">从早期终端到代码协作，黑客伦理的起点</div>
</div>
</div>

<div class="bottom-bar">
  <span>HACKER ETHICS // 2024</span>
  <span class="line"></span>
  <span>02 / 06</span>
</div>

</div>
</div>
</body>
</html>
