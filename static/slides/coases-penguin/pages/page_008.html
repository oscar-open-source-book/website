

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>如何参与共建</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D2137;
  --blue: #2196F3;
  --bg: #F5F5F5;
  --text-main: #1a1a1a;
  --text-muted: #6b7280;
  --white: #ffffff;
  --border: #e5e7eb;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  color: var(--text-main);
  background: var(--bg);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--bg);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 56px 64px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.header-brand {
  font-size: 14px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 1px;
}

.header-brand-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--blue);
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: middle;
}

.header-nav {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.main-area {
  display: flex;
  flex: 1;
  gap: 48px;
  padding-top: 24px;
  min-height: 0;
}

/* Left 40% */
.left-col {
  width: 40%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-right: 12px;
}

.chapter-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--blue);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.chapter-number {
  font-family: 'Inter', sans-serif;
  font-size: 180px;
  font-weight: 700;
  color: var(--navy);
  line-height: 0.9;
  letter-spacing: -4px;
  margin-bottom: 8px;
}

.chapter-number-accent {
  display: inline-block;
  width: 48px;
  height: 4px;
  background: var(--blue);
  margin-bottom: 24px;
}

.main-title {
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  font-size: 40px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.25;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

.subtitle {
  font-size: 15px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.6;
  letter-spacing: 0.5px;
  max-width: 380px;
  padding-left: 16px;
  border-left: 2px solid var(--blue);
}

/* Right 60% */
.right-col {
  width: 60%;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.hero-image-wrap {
  width: 750px;
  height: 420px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 4px 20px rgba(13, 33, 55, 0.08);
  position: relative;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-caption {
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: 1px;
  font-weight: 400;
  margin-top: -4px;
}

.hero-caption span {
  color: var(--navy);
  font-weight: 500;
}

/* Four cards */
.cards-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  width: 750px;
  margin: 0 auto;
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  transition: box-shadow 0.2s;
}

.card-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: 0.5px;
}

.card-desc {
  font-size: 11px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Bottom narrative */
.footer-narrative {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
  color: var(--navy);
  font-weight: 400;
  letter-spacing: 0.5px;
  line-height: 1.6;
  padding: 12px 40px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.footer-narrative .highlight {
  color: var(--blue);
  font-weight: 500;
}

</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="header-bar">
      <div class="header-brand"><span class="header-brand-dot"></span>开源之书 · 社区共建计划</div>
      <div class="header-nav">Chapter 03 / 05</div>
    </div>

    <div class="main-area">

      <div class="left-col">
        <div class="chapter-label">CHAPTER · 第三章节</div>
        <div class="chapter-number">03</div>
        <span class="chapter-number-accent"></span>
        <h1 class="main-title">如何参与共建</h1>
        <p class="subtitle">每一个贡献者都是开源之书的守护人</p>
      </div>

      <div class="right-col">

        <div class="hero-image-wrap">
          <img src="/slides/coases-penguin/images/page_008_contribute_hero.jpg" alt="极简协作场景插画：多个简化人形轮廓围成半圆共同托举中央抽象书堆">
        </div>

        <p class="hero-caption"><span>众人拾柴</span>，共筑开源知识之城</p>

        <div class="cards-row">

          <div class="card">
            <div class="card-icon">01</div>
            <div class="card-title">推荐好书</div>
            <div class="card-desc">发现优质开源书籍后，提交 Issue 或 Pull Request 收录到目录中。</div>
          </div>

          <div class="card">
            <div class="card-icon">02</div>
            <div class="card-title">完善信息</div>
            <div class="card-desc">补充书籍元数据、难度评级、阅读笔记和推荐语。</div>
          </div>

          <div class="card">
            <div class="card-icon">03</div>
            <div class="card-title">翻译贡献</div>
            <div class="card-desc">参与外文开源书籍的中英翻译协作项目，拓宽传播边界。</div>
          </div>

          <div class="card">
            <div class="card-icon">04</div>
            <div class="card-title">布道分享</div>
            <div class="card-desc">将项目推荐给朋友、同事与同行，让更多人受益。</div>
          </div>

        </div>

      </div>

    </div>

    <div class="footer-narrative">
      开源之书的壮大离不开每一位社区成员的参与——<span class="highlight">门槛很低，影响却很大。</span>
    </div>

  </div>
</div>
</body>
</html>
