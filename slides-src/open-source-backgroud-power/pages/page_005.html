<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第二章：开源的核心价值</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D2137;
  --cyan: #00BCD4;
  --warm: #F5A623;
  --bg: #F5F7FA;
  --text-main: #0D2137;
  --text-sub: #4A5B70;
  --text-light: #8B9DAF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', 'Inter', sans-serif; overflow: hidden; }

.wrapper { width: 1600px; height: 900px; position: relative; overflow: hidden; margin: 0 auto; background: var(--bg); }
#bg { position: absolute; inset: 0; z-index: 0; }
#ct { position: absolute; inset: 0; z-index: 1; padding: 48px 68px; box-sizing: border-box; display: flex; flex-direction: column; }

.bg-base {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 900px 600px at 12% 25%, rgba(13,33,55,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 88% 80%, rgba(0,188,212,0.05) 0%, transparent 60%);
}

.halo-warm-1 {
  position: absolute;
  width: 650px; height: 650px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,166,35,0.09) 0%, rgba(245,166,35,0.02) 45%, transparent 72%);
  top: -220px; right: -200px;
  filter: blur(25px);
}
.halo-cyan-1 {
  position: absolute;
  width: 580px; height: 580px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,188,212,0.08) 0%, rgba(0,188,212,0.02) 45%, transparent 72%);
  bottom: -220px; left: -150px;
  filter: blur(25px);
}

.top-area {
  position: relative;
  display: flex;
  align-items: center;
  padding-top: 18px;
  padding-bottom: 18px;
}

.chapter-tag {
  position: absolute;
  top: 0; left: 0;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 6px;
  color: var(--cyan);
}
.chapter-tag::before {
  content: '';
  display: inline-block;
  width: 40px; height: 2px;
  background: var(--cyan);
  vertical-align: middle;
  margin-right: 14px;
  margin-bottom: 3px;
}

.halo-n {
  position: absolute;
  width: 380px; height: 380px;
  border-radius: 50%;
  top: -80px;
  filter: blur(20px);
  pointer-events: none;
}
.halo-n.a { left: 380px; background: radial-gradient(circle, rgba(13,33,55,0.10) 0%, rgba(13,33,55,0.02) 45%, transparent 72%); }
.halo-n.b { left: 560px; background: radial-gradient(circle, rgba(0,188,212,0.12) 0%, rgba(0,188,212,0.02) 45%, transparent 72%); }
.halo-n.c { left: 740px; background: radial-gradient(circle, rgba(245,166,35,0.10) 0%, rgba(245,166,35,0.02) 45%, transparent 72%); }

.big-number {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 250px;
  line-height: 0.85;
  color: var(--navy);
  letter-spacing: -8px;
  flex-shrink: 0;
}
.big-number .zero { color: transparent; -webkit-text-stroke: 3px var(--navy); }

.title-area { flex: 1; padding-left: 30px; }
.title-text {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-weight: 800;
  font-size: 54px;
  color: var(--navy);
  line-height: 1.15;
  letter-spacing: -1px;
}
.title-divider {
  width: 80px; height: 4px;
  background: var(--cyan);
  margin: 22px 0;
  border-radius: 2px;
}
.subtitle-text {
  font-size: 20px;
  color: var(--text-sub);
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: 1px;
}

.mid-halo-area {
  position: relative;
  height: 150px;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tri-halo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 14px;
}
.tri-halo .h1 {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(13,33,55,0.28) 0%, rgba(13,33,55,0.08) 40%, transparent 72%);
  top: -110px; left: 30%;
  filter: blur(4px);
}
.tri-halo .h2 {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,188,212,0.32) 0%, rgba(0,188,212,0.08) 40%, transparent 72%);
  top: -110px; left: 45%;
  filter: blur(4px);
}
.tri-halo .h3 {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,166,35,0.28) 0%, rgba(245,166,35,0.08) 40%, transparent 72%);
  top: -110px; left: 60%;
  filter: blur(4px);
}
.dim-labels {
  position: relative;
  display: flex;
  gap: 100px;
  z-index: 2;
}
.dim-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.dim-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  margin-bottom: 10px;
}
.dim-label:nth-child(1) .dim-dot { background: var(--navy); box-shadow: 0 0 14px rgba(13,33,55,0.55); }
.dim-label:nth-child(2) .dim-dot { background: var(--cyan); box-shadow: 0 0 14px rgba(0,188,212,0.65); }
.dim-label:nth-child(3) .dim-dot { background: var(--warm); box-shadow: 0 0 14px rgba(245,166,35,0.65); }
.dim-name {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-weight: 700;
  font-size: 19px;
  color: var(--navy);
}
.dim-en {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 3px;
  margin-top: 4px;
}

.points-area {
  display: flex;
  gap: 22px;
  margin-top: 6px;
}
.point-card {
  flex: 1;
  background: white;
  border-radius: 10px;
  padding: 22px 26px;
  border-left: 4px solid var(--cyan);
  box-shadow: 0 4px 22px rgba(13,33,55,0.07);
  position: relative;
}
.point-card:nth-child(1) { border-left-color: var(--navy); }
.point-card:nth-child(2) { border-left-color: var(--cyan); }
.point-card:nth-child(3) { border-left-color: var(--warm); }
.point-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.point-num {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--cyan);
  letter-spacing: 1px;
}
.point-card:nth-child(1) .point-num { color: var(--navy); }
.point-card:nth-child(3) .point-num { color: var(--warm); }
.point-title {
  font-weight: 700;
  font-size: 17px;
  color: var(--navy);
}
.point-content {
  font-size: 13.5px;
  color: var(--text-sub);
  line-height: 1.7;
}

.footer-area {
  margin-top: 14px;
  padding: 20px 32px;
  background: linear-gradient(90deg, rgba(13,33,55,0.05) 0%, rgba(0,188,212,0.05) 50%, rgba(245,166,35,0.05) 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 22px;
}
.footer-bar {
  width: 4px;
  height: 56px;
  background: linear-gradient(180deg, var(--navy) 0%, var(--cyan) 50%, var(--warm) 100%);
  border-radius: 2px;
  flex-shrink: 0;
}
.footer-text {
  font-size: 13.5px;
  color: var(--text-sub);
  line-height: 1.8;
  font-weight: 400;
  letter-spacing: 0.3px;
}
.footer-text strong { color: var(--navy); font-weight: 600; }

.bottom-line {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--navy) 0%, var(--cyan) 50%, var(--warm) 100%);
  opacity: 0.35;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-base"></div>
    <div class="halo-warm-1"></div>
    <div class="halo-cyan-1"></div>
  </div>
  <div id="ct">
    <div class="top-area">
      <div class="chapter-tag"><span>CHAPTER</span></div>
      <div class="halo-n a"></div>
      <div class="halo-n b"></div>
      <div class="halo-n c"></div>
      <div class="big-number"><span>0<span class="zero">2</span></span></div>
      <div class="title-area">
        <div class="title-text"><span>开源的核心价值</span></div>
        <div class="title-divider"></div>
        <div class="subtitle-text"><span>透明、协作、创新 —— 开源为什么改变世界</span></div>
      </div>
    </div>

    <div class="mid-halo-area">
      <div class="tri-halo">
        <div class="h1"></div>
        <div class="h2"></div>
        <div class="h3"></div>
      </div>
      <div class="dim-labels">
        <div class="dim-label">
          <div class="dim-dot"></div>
          <div class="dim-name"><span>技术维度</span></div>
          <div class="dim-en"><span>TECHNICAL</span></div>
        </div>
        <div class="dim-label">
          <div class="dim-dot"></div>
          <div class="dim-name"><span>商业维度</span></div>
          <div class="dim-en"><span>BUSINESS</span></div>
        </div>
        <div class="dim-label">
          <div class="dim-dot"></div>
          <div class="dim-name"><span>社会维度</span></div>
          <div class="dim-en"><span>SOCIAL</span></div>
        </div>
      </div>
    </div>

    <div class="points-area">
      <div class="point-card">
        <div class="point-header">
          <div class="point-num"><span>01</span></div>
          <div class="point-title"><span>本章聚焦</span></div>
        </div>
        <div class="point-content"><span>剖析开源的四项核心价值主张，以及它们如何重塑软件产业格局，催生新一代技术经济模式。</span></div>
      </div>
      <div class="point-card">
        <div class="point-header">
          <div class="point-num"><span>02</span></div>
          <div class="point-title"><span>思考框架</span></div>
        </div>
        <div class="point-content"><span>从技术维度、商业维度、社会维度三个角度审视开源的多重价值，构建立体的分析视角。</span></div>
      </div>
      <div class="point-card">
        <div class="point-header">
          <div class="point-num"><span>03</span></div>
          <div class="point-title"><span>延伸阅读</span></div>
        </div>
        <div class="point-content"><span>推荐书目：《开源商业模式》与《开源革命》，从理论与实践双重视角深入理解开源经济。</span></div>
      </div>
    </div>

    <div class="footer-area">
      <div class="footer-bar"></div>
      <div class="footer-text">
        <span>开源的价值远不止"<strong>免费</strong>"二字——它带来的<strong>透明性</strong>让安全审计成为可能，<strong>协作性</strong>让全球人才汇聚于同一项目，<strong>开放性</strong>让创新不再受制于单一公司战略。</span>
      </div>
    </div>

    <div class="bottom-line"></div>
  </div>
</div>
</body>
</html>
