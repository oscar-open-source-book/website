

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>PART 01 · GenAI 开源浪潮：从闭源到开放的技术转向</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0F172A;
  --bg-2: #0B1220;
  --blue: #2196F3;
  --blue-deep: #1565C0;
  --cyan: #00E5FF;
  --text-main: #F1F5F9;
  --text-mid: #94A3B8;
  --text-dim: #64748B;
  --card-bg: rgba(33, 150, 243, 0.06);
  --card-border: rgba(33, 150, 243, 0.32);
}
html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}
.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg);
}
#bg { position: absolute; inset: 0; z-index: 0; }
#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* --- background layers --- */
.bg-gradient {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 1400px 900px at 20% 40%, rgba(33, 150, 243, 0.14), transparent 65%);
}
.bg-grid {
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px);
  background-size: 64px 64px;
}
.bg-glow-1 {
  position: absolute;
  right: -260px;
  top: -260px;
  width: 720px;
  height: 720px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 229, 255, 0.22) 0%, rgba(0, 229, 255, 0) 70%);
}
.bg-glow-2 {
  position: absolute;
  left: -220px;
  bottom: -220px;
  width: 640px;
  height: 640px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(33, 150, 243, 0.22) 0%, rgba(33, 150, 243, 0) 70%);
}
.bg-glow-3 {
  position: absolute;
  left: 50%;
  top: 30%;
  transform: translate(-50%, -50%);
  width: 900px;
  height: 460px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(33, 150, 243, 0.09) 0%, transparent 70%);
}

/* decorative dot grid cluster top-left */
.dots-top-left {
  position: absolute;
  left: 60px;
  top: 34px;
  width: 108px;
  height: 34px;
  background-image: radial-gradient(circle, rgba(0, 229, 255, 0.55) 1.2px, transparent 1.6px);
  background-size: 13px 13px;
  opacity: 0.7;
}
/* corner brackets */
.corner-tr {
  position: absolute;
  right: 40px;
  top: 40px;
  width: 46px;
  height: 46px;
  border-top: 1.6px solid rgba(0, 229, 255, 0.55);
  border-right: 1.6px solid rgba(0, 229, 255, 0.55);
}
.corner-bl {
  position: absolute;
  left: 40px;
  bottom: 40px;
  width: 46px;
  height: 46px;
  border-bottom: 1.6px solid rgba(0, 229, 255, 0.55);
  border-left: 1.6px solid rgba(0, 229, 255, 0.55);
}
/* subtle bottom-right dot grid */
.dots-br {
  position: absolute;
  right: 60px;
  bottom: 100px;
  width: 140px;
  height: 60px;
  background-image: radial-gradient(circle, rgba(0, 229, 255, 0.32) 1px, transparent 1.4px);
  background-size: 14px 14px;
}

/* --- eyebrow --- */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.32em;
  color: var(--cyan);
}
.eyebrow::before {
  content: '';
  width: 44px;
  height: 1.5px;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

/* --- chapter anchor --- */
.section-block {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}
.part-label {
  display: flex;
  align-items: baseline;
  gap: 34px;
  margin-top: 16px;
  line-height: 1;
}
.part-word {
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--text-mid);
}
.part-number {
  font-size: 208px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: #3FA9F5;
  text-shadow:
    0 0 24px rgba(33, 150, 243, 0.55),
    0 0 60px rgba(33, 150, 243, 0.28);
  line-height: 0.92;
}
.light-band {
  margin-top: 26px;
  width: 160px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, rgba(0, 229, 255, 0) 0%, rgba(0, 229, 255, 1) 30%, rgba(33, 150, 243, 1) 70%, rgba(0, 229, 255, 0) 100%);
  box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
  position: relative;
}
.light-band::after {
  content: '';
  position: absolute;
  right: -4px;
  top: -3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 16px var(--cyan);
}

/* --- title / subtitle --- */
.title-group {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 40px;
  max-width: 1100px;
}
.section-title {
  font-size: 46px;
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: -0.01em;
  color: #FFFFFF;
}
.section-title .accent {
  color: var(--cyan);
  text-shadow: 0 0 16px rgba(0, 229, 255, 0.55);
}
.section-subtitle {
  font-size: 16px;
  font-weight: 400;
  color: var(--text-mid);
  letter-spacing: 0.04em;
  max-width: 820px;
  line-height: 1.65;
}

/* --- 3 cards --- */
.card-row {
  display: flex;
  gap: 24px;
  margin-top: 26px;
  align-self: flex-start;
}
.card {
  width: 430px;
  padding: 22px 26px 24px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
}
.card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 22px;
  width: 3px;
  height: 34px;
  background: linear-gradient(180deg, var(--cyan), var(--blue));
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.55);
}
.card-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--cyan);
  align-self: flex-start;
}
.card-tag::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}
.card-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: 0.02em;
}
.card-desc {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-mid);
  line-height: 1.72;
}

/* --- footer --- */
.footer {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 24px;
  font-size: 11px;
  letter-spacing: 0.28em;
  color: var(--text-dim);
  font-weight: 500;
}
.footer::before {
  content: '';
  width: 34px;
  height: 1px;
  background: rgba(148, 163, 184, 0.5);
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-glow-3"></div>
    <div class="dots-top-left"></div>
    <div class="dots-br"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
  </div>
  <div id="ct">
    <div class="section-block">
      <div class="eyebrow"><span>CHAPTER 01 / SECTION OPENING</span></div>
      <div class="part-label">
        <span class="part-word">PART</span>
        <span class="part-number">01</span>
      </div>
      <div class="light-band"></div>
      <div class="title-group">
        <h1 class="section-title">GenAI <span class="accent">开源浪潮</span>：<br>从闭源到开放的技术转向</h1>
        <p class="section-subtitle">当权重开放、模型成为开发者资产，一次跨越闭源与开源边界的范式跃迁正式拉开帷幕。</p>
      </div>
    </div>
    <div class="card-row">
      <div class="card">
        <div class="card-tag"><span>POINT 01</span></div>
        <div class="card-title">闭源时代落幕</div>
        <div class="card-desc">GPT-3.5 发布后 18 个月，开源追赶进入主流视野。</div>
      </div>
      <div class="card">
        <div class="card-tag"><span>POINT 02</span></div>
        <div class="card-title">范式转变</div>
        <div class="card-desc">从 API 调用到模型权重全量开放，开发者真正拥有模型。</div>
      </div>
      <div class="card">
        <div class="card-tag"><span>POINT 03</span></div>
        <div class="card-title">本次议程</div>
        <div class="card-desc">梳理开源 GenAI 的价值、主流玩家、生态数据与布道方法。</div>
      </div>
    </div>
    <div class="footer"><span>OPEN-SOURCE AGENDA · CHAPTER 01 · 2024</span></div>
  </div>
</div>
</body>
</html>
