

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第二部分·商业模式</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1E293B;
  --bg-deep:#0F1729;
  --primary:#2196F3;
  --accent:#00BCD4;
  --text-main:#E8F1FF;
  --text-muted:#8FA8C4;
  --card-bg:rgba(33,150,243,0.06);
  --card-border:rgba(33,150,243,0.32);
  --glow:0 0 20px rgba(33,150,243,0.55),0 0 60px rgba(33,150,243,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;font-size:16px;color:var(--text-main);background:var(--bg-deep);overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
#ct{position:absolute;inset:0;z-index:1;padding:60px 80px;box-sizing:border-box;}

/* 背景网格 + 装饰 */
#bg{
  background:
    radial-gradient(circle at 15% 40%, rgba(33,150,243,0.18) 0%, transparent 40%),
    radial-gradient(circle at 88% 75%, rgba(0,188,212,0.14) 0%, transparent 42%),
    radial-gradient(circle at 60% 20%, rgba(33,150,243,0.08) 0%, transparent 35%),
    var(--bg);
}
.grid-overlay{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(33,150,243,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,150,243,0.07) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.deco-circle{
  position:absolute;border-radius:50%;border:1px solid rgba(0,188,212,0.18);
}
.deco-c1{width:520px;height:520px;top:-160px;left:-180px;}
.deco-c2{width:380px;height:380px;bottom:-120px;right:-100px;border-color:rgba(33,150,243,0.2);}
.deco-c3{width:220px;height:220px;bottom:120px;left:520px;border-color:rgba(0,188,212,0.12);}

.neon-line-top{position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--primary),var(--accent),transparent);box-shadow:0 0 12px rgba(33,150,243,0.7);}
.neon-line-bottom{position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--primary),transparent);box-shadow:0 0 12px rgba(0,188,212,0.7);}
.neon-vl{position:absolute;top:60px;bottom:60px;left:0;width:1px;background:linear-gradient(180deg,transparent,rgba(33,150,243,0.35),transparent);}
.neon-vr{position:absolute;top:60px;bottom:60px;right:0;width:1px;background:linear-gradient(180deg,transparent,rgba(0,188,212,0.3),transparent);}

/* 顶部页头 */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.chapter-tag{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 8px rgba(0,188,212,0.6);}
.page-mark{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:3px;color:var(--text-muted);}
.page-mark .num{color:var(--primary);text-shadow:0 0 8px rgba(33,150,243,0.6);}

/* 主内容 */
.main{display:grid;grid-template-columns:560px 1fr;gap:60px;height:600px;}

/* 左侧大号 02 */
.left-col{position:relative;display:flex;align-items:center;justify-content:center;}
.num-wrap{position:relative;}
.neon-num{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:340px;line-height:0.85;
  color:transparent;
  -webkit-text-stroke:2px var(--primary);
  text-shadow:
    0 0 18px rgba(33,150,243,0.85),
    0 0 50px rgba(33,150,243,0.5),
    0 0 90px rgba(33,150,243,0.3);
  animation:neonPulse 3.6s ease-in-out infinite;
  letter-spacing:-8px;
}
@keyframes neonPulse{
  0%,100%{text-shadow:0 0 18px rgba(33,150,243,0.85),0 0 50px rgba(33,150,243,0.5),0 0 90px rgba(33,150,243,0.3);}
  50%{text-shadow:0 0 28px rgba(33,150,243,1),0 0 70px rgba(33,150,243,0.7),0 0 120px rgba(0,188,212,0.35);}
}
.neon-num-fill{
  position:absolute;left:0;top:0;
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:340px;line-height:0.85;letter-spacing:-8px;
  color:rgba(33,150,243,0.08);
}
.num-frame{
  position:absolute;inset:-30px -40px;
  border:1px solid rgba(33,150,243,0.25);
  box-shadow:0 0 30px rgba(33,150,243,0.15) inset, 0 0 20px rgba(33,150,243,0.1);
  pointer-events:none;
}
.num-frame::before,.num-frame::after{
  content:"";position:absolute;width:24px;height:24px;border:2px solid var(--accent);
}
.num-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none;box-shadow:-2px -2px 10px rgba(0,188,212,0.5);}
.num-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none;box-shadow:2px 2px 10px rgba(0,188,212,0.5);}

.left-meta{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;}
.meta-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 6px rgba(0,188,212,0.6);}
.meta-label{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:5px;color:var(--accent);}

/* 右侧内容 */
.right-col{display:flex;flex-direction:column;justify-content:center;gap:18px;padding-left:30px;border-left:1px solid rgba(33,150,243,0.2);position:relative;}
.right-col::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:1px;background:linear-gradient(180deg,transparent,var(--primary),transparent);box-shadow:0 0 12px rgba(33,150,243,0.4);}

.chapter-title{
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:40px;
  color:var(--text-main);letter-spacing:2px;line-height:1.15;
}
.chapter-title .hl{color:var(--primary);text-shadow:0 0 14px rgba(33,150,243,0.6);}
.chapter-sub{
  font-size:16px;color:var(--text-muted);margin-top:10px;
  padding-bottom:18px;border-bottom:1px solid rgba(33,150,243,0.18);
  display:flex;align-items:center;gap:10px;
}
.sub-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;}

.points{display:flex;flex-direction:column;gap:14px;}
.point-card{
  position:relative;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-left:3px solid var(--primary);
  padding:14px 18px 14px 20px;
  display:flex;align-items:flex-start;gap:16px;
  transition:none;
  box-shadow:0 0 0 1px rgba(33,150,243,0.05), inset 0 0 30px rgba(33,150,243,0.04);
}
.point-card.acc{border-left-color:var(--accent);background:rgba(0,188,212,0.06);}
.point-num{
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:22px;
  color:var(--primary);text-shadow:0 0 10px rgba(33,150,243,0.5);
  min-width:38px;
}
.point-card.acc .point-num{color:var(--accent);text-shadow:0 0 10px rgba(0,188,212,0.5);}
.point-body{flex:1;}
.point-tag{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:4px;}
.point-card:not(.acc) .point-tag{color:var(--primary);}
.point-text{font-size:15px;line-height:1.6;color:var(--text-main);font-weight:400;}
.point-text .em{color:var(--accent);font-weight:600;}
.point-text .em2{color:var(--primary);font-weight:600;}

/* 底部收束 */
.bottom-bar{position:absolute;left:80px;right:80px;bottom:48px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.tagline{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:17px;
  color:var(--text-main);letter-spacing:1px;
  display:flex;align-items:center;gap:14px;
}
.tagline .neon-tick{
  width:6px;height:28px;background:linear-gradient(180deg,var(--primary),var(--accent));
  box-shadow:0 0 12px rgba(33,150,243,0.7);
}
.tagline .hl{color:var(--accent);}
.tagline .hl2{color:var(--primary);}
.tagline .eq{color:var(--accent);margin:0 6px;}

.prompt-text{
  font-size:12px;color:var(--text-muted);letter-spacing:2px;
  font-family:'Orbitron',sans-serif;
  display:flex;align-items:center;gap:8px;
}
.prompt-text::before{content:"";width:20px;height:1px;background:var(--text-muted);}

/* 装饰角标 */
.corner{position:absolute;width:40px;height:40px;}
.corner-tl{top:30px;left:30px;border-top:2px solid var(--primary);border-left:2px solid var(--primary);box-shadow:-2px -2px 10px rgba(33,150,243,0.3);}
.corner-tr{top:30px;right:30px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);box-shadow:2px -2px 10px rgba(0,188,212,0.3);}
.corner-bl{bottom:30px;left:30px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);box-shadow:-2px 2px 10px rgba(0,188,212,0.3);}
.corner-br{bottom:30px;right:30px;border-bottom:2px solid var(--primary);border-right:2px solid var(--primary);box-shadow:2px 2px 10px rgba(33,150,243,0.3);}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="grid-overlay"></div>
    <div class="deco-circle deco-c1"></div>
    <div class="deco-circle deco-c2"></div>
    <div class="deco-circle deco-c3"></div>
    <div class="neon-line-top"></div>
    <div class="neon-line-bottom"></div>
    <div class="neon-vl"></div>
    <div class="neon-vr"></div>
  </div>
  <div id="ct">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="top-bar">
      <div class="chapter-tag"><span>PART · 02 / BUSINESS MODEL</span></div>
      <div class="page-mark"><span>CHAPTER / <span class="num">05</span> / 12</span></div>
    </div>

    <div class="main">
      <div class="left-col">
        <div class="num-wrap">
          <div class="num-frame"></div>
          <div class="neon-num-fill">02</div>
          <div class="neon-num">02</div>
        </div>
        <div class="left-meta">
          <div class="meta-line"></div>
          <div class="meta-label"><span>CHAPTER ZERO TWO</span></div>
        </div>
      </div>

      <div class="right-col">
        <div class="chapter-title"><span>第二部分 · <span class="hl">商业模式</span></span></div>
        <div class="chapter-sub"><span class="sub-dot"></span><span>从开源到变现：主流路径全景扫描</span></div>

        <div class="points">
          <div class="point-card">
            <div class="point-num">01</div>
            <div class="point-body">
              <div class="point-tag"><span>章节目标</span></div>
              <div class="point-text"><span>拆解开源商业化的<span class="em2">多种可行路径</span>及其<span class="em">适用场景</span>，为不同阶段的团队提供路径参照。</span></div>
            </div>
          </div>
          <div class="point-card acc">
            <div class="point-num">02</div>
            <div class="point-body">
              <div class="point-tag"><span>核心议题</span></div>
              <div class="point-text"><span>服务、订阅、平台、数据、品牌赞助等<span class="em">多种模式并存</span>，识别主流玩家的选择逻辑与差异。</span></div>
            </div>
          </div>
          <div class="point-card">
            <div class="point-num">03</div>
            <div class="point-body">
              <div class="point-tag"><span>判断维度</span></div>
              <div class="point-text"><span>从<span class="em2">用户规模</span>、<span class="em2">付费意愿</span>到<span class="em2">竞争强度</span>，构建可复用的路径评估框架。</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="tagline">
        <span class="neon-tick"></span>
        <span>开源<span class="eq">≠</span>不赚钱，关键在于<span class="hl2">选对变现路径</span></span>
      </div>
      <div class="prompt-text"><span>梳理主流商业模式的门槛 · 天花板 · 风险</span></div>
    </div>
  </div>
</div>
</body>
</html>
