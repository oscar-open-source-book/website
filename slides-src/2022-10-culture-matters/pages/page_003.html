

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>为什么文化重要</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Roboto+Mono:wght@300;400;500&display=swap');

:root{
  --klein:#002FA7;
  --ice:#4FC3F7;
  --neutral:#B0BEC5;
  --dark:#04061a;
  --dark-soft:#0a0f2c;
  --card-bg:rgba(4,6,26,0.55);
  --card-border:rgba(79,195,247,0.45);
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{width:1600px;height:900px;overflow:hidden;}

body{
  font-family:'Inter','Source Han Sans SC','Noto Sans SC',sans-serif;
  color:#E8EEF7;
  background:var(--dark);
}

.wrapper{
  width:1600px;height:900px;
  position:relative;overflow:hidden;
  margin:0 auto;
}

#bg{
  position:absolute;inset:0;z-index:0;
  overflow:hidden;
}
#bg .bg-photo{
  position:absolute;left:50%;top:50%;
  width:1600px;height:900px;
  transform:translate(-50%,-50%);
  object-fit:cover;
  filter:saturate(1.05) brightness(0.92);
}
#bg .bg-overlay{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(0,47,167,0.45) 0%, rgba(4,6,26,0.0) 55%),
    radial-gradient(ellipse at 85% 80%, rgba(0,47,167,0.35) 0%, rgba(4,6,26,0.0) 55%),
    linear-gradient(180deg, rgba(4,6,26,0.35) 0%, rgba(4,6,26,0.55) 100%);
}

#ct{
  position:absolute;inset:0;z-index:1;
  padding:56px 72px 44px 72px;
  box-sizing:border-box;
  display:flex;flex-direction:column;
}

/* 巨大的章节数字 01 */
.big-num{
  position:absolute;
  left:-40px;top:60px;
  font-family:'Inter',sans-serif;
  font-weight:900;
  font-size:760px;
  line-height:0.78;
  letter-spacing:-20px;
  color:transparent;
  -webkit-text-stroke:2px rgba(79,195,247,0.28);
  text-shadow:0 0 80px rgba(0,47,167,0.5);
  opacity:0.55;
  z-index:0;
  user-select:none;
  pointer-events:none;
}

/* 主标题区 */
.head{
  position:relative;z-index:2;
  margin-top:30px;
}
.head .eyebrow{
  font-family:'Roboto Mono',monospace;
  font-size:13px;
  letter-spacing:6px;
  color:var(--ice);
  text-transform:uppercase;
  margin-bottom:18px;
  display:flex;align-items:center;gap:14px;
}
.head .eyebrow .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--ice);
  box-shadow:0 0 12px var(--ice);
}
.head .eyebrow .line{
  width:60px;height:1px;background:linear-gradient(90deg,var(--ice),transparent);
}

.title{
  font-family:'Inter','Source Han Sans SC','Noto Sans SC',sans-serif;
  font-weight:900;
  font-size:96px;
  line-height:1.02;
  letter-spacing:2px;
  color:#F2F7FF;
  text-shadow:
    0 0 24px rgba(79,195,247,0.55),
    0 0 48px rgba(0,47,167,0.55),
    0 4px 0 rgba(0,47,167,0.4);
  -webkit-text-stroke:1px rgba(79,195,247,0.35);
}
.subtitle{
  font-family:'Roboto Mono',monospace;
  font-weight:300;
  font-size:20px;
  color:var(--neutral);
  margin-top:18px;
  letter-spacing:1px;
}
.subtitle .accent{color:var(--ice);}

/* 中部叙事 */
.narrative{
  position:relative;z-index:2;
  margin-top:28px;
  max-width:1180px;
  font-family:'Inter','Source Han Sans SC',sans-serif;
  font-size:16px;
  line-height:1.75;
  color:#D3DBE8;
  padding:20px 24px;
  border-left:3px solid var(--ice);
  background:rgba(4,6,26,0.35);
  backdrop-filter:blur(2px);
}
.narrative .em{color:var(--ice);font-weight:600;}

/* 三卡片 */
.cards{
  position:relative;z-index:2;
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card{
  background:rgba(4,6,26,0.6);
  border:1px solid var(--card-border);
  border-radius:6px;
  padding:20px 22px 22px 22px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,47,167,0.15), inset 0 0 40px rgba(0,47,167,0.15);
}
.card::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ice),var(--klein));
  box-shadow:0 0 12px var(--ice);
}
.card .idx{
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  color:var(--ice);
  letter-spacing:3px;
  margin-bottom:8px;
}
.card .ctitle{
  font-family:'Inter','Source Han Sans SC',sans-serif;
  font-weight:800;
  font-size:18px;
  color:#F2F7FF;
  margin-bottom:10px;
  letter-spacing:0.5px;
}
.card .cbody{
  font-family:'Inter','Source Han Sans SC',sans-serif;
  font-size:13px;
  line-height:1.7;
  color:#C4CDD8;
}

/* 底部分隔线与总结 */
.foot{
  position:relative;z-index:2;
  margin-top:auto;
  display:flex;flex-direction:column;align-items:center;
}
.separator{
  width:100%;height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(79,195,247,0.15) 15%,
    rgba(79,195,247,0.9) 50%,
    rgba(79,195,247,0.15) 85%,
    transparent 100%);
  box-shadow:0 0 16px rgba(79,195,247,0.55), 0 0 32px rgba(0,47,167,0.5);
  position:relative;
}
.separator::before{
  content:'';
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;
  background:var(--ice);
  box-shadow:0 0 16px var(--ice);
}
.closing{
  font-family:'Roboto Mono',monospace;
  font-size:15px;
  color:var(--neutral);
  letter-spacing:4px;
  margin-top:16px;
}
.closing .k{color:var(--ice);font-weight:500;}

</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_003_section_bg.png" alt="">
    <div class="bg-overlay"></div>
  </div>

  <div id="ct">
    <div class="big-num">01</div>

    <div class="head">
      <div class="eyebrow">
        <span class="dot"></span>
        <span>SECTION · 01</span>
        <span class="line"></span>
        <span>CULTURE</span>
      </div>
      <div class="title">为什么文化重要</div>
      <div class="subtitle"><span class="accent">Section 01 —</span> 文化是开源社区的操作系统</div>
    </div>

    <div class="narrative">
      本节聚焦<span class="em">文化</span>在开源中的底层作用。代码可以复制，但文化难以移植——这正是某些社区繁荣而某些社区沉寂的根本差异。<span class="em">理解文化，才能理解开源。</span>
    </div>

    <div class="cards">
      <div class="card">
        <div class="idx">01 / CULTURE &gt; CODE</div>
        <div class="ctitle">文化 &gt; 代码</div>
        <div class="cbody">再优雅的实现也会因糟糕的社区氛围而流失贡献者。</div>
      </div>
      <div class="card">
        <div class="idx">02 / TRUST COST</div>
        <div class="ctitle">信任成本</div>
        <div class="cbody">健康的文化降低协作摩擦，让陌生人之间的代码合并成为可能。</div>
      </div>
      <div class="card">
        <div class="idx">03 / HIDDEN RULES</div>
        <div class="ctitle">隐性规则</div>
        <div class="cbody">每个成熟社区都有不成文的潜规则，它们比文档更早塑造行为。</div>
      </div>
    </div>

    <div class="foot">
      <div class="separator"></div>
      <div class="closing"><span class="k">代码可以复制，文化难以移植。</span></div>
    </div>
  </div>
</div>
</body>
</html>
