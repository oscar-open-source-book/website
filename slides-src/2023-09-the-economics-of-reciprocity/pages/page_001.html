

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>互惠的经济学 — 封面</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --navy: #0D2137;
  --gold: #B08D57;
  --cream: #F7F5F0;
  --text-main: #1a1a1a;
  --text-muted: #4a4a4a;
  --text-light: #6b6b6b;
  --gold-light: rgba(176, 141, 87, 0.55);
  --gold-faint: rgba(176, 141, 87, 0.22);
  --ink-faint: rgba(13, 33, 55, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--navy);
  background: #e9e6df;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--cream);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--cream);
}

.bg-tint {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 20% 10%, rgba(176, 141, 87, 0.06), transparent 55%);
}

.bg-corner-tl {
  position: absolute;
  top: 34px;
  left: 34px;
  width: 90px;
  height: 90px;
  border-top: 1px solid var(--gold);
  border-left: 1px solid var(--gold);
}

.bg-corner-br {
  position: absolute;
  bottom: 34px;
  right: 34px;
  width: 90px;
  height: 90px;
  border-bottom: 1px solid var(--gold);
  border-right: 1px solid var(--gold);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
}

/* ============ 左侧文字区 ============ */

.text-col {
  width: 880px;
  padding: 92px 80px 70px 96px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

.badge {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--gold);
  font-family: "Georgia", "Noto Serif SC", "Songti SC", serif;
  font-size: 12.5px;
  letter-spacing: 5px;
  font-weight: 600;
  text-transform: uppercase;
}

.badge-line {
  width: 58px;
  height: 1px;
  background: var(--gold);
  opacity: 0.85;
}

.title-block {
  display: flex;
  flex-direction: column;
}

.title {
  font-family: "Georgia", "Noto Serif SC", "Songti SC", serif;
  font-size: 120px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.06;
  letter-spacing: 14px;
  margin-top: 32px;
  text-indent: 14px;
}

.sub-wrap {
  margin-top: 38px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.sub {
  font-family: "Georgia", "Noto Serif SC", "Songti SC", serif;
  font-size: 22px;
  color: var(--navy);
  font-weight: 400;
  letter-spacing: 4.5px;
}

.divider {
  width: 92px;
  height: 1.5px;
  background: var(--gold);
}

.info-block {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.info-row {
  display: grid;
  grid-template-columns: 118px 1fr;
  align-items: baseline;
  gap: 22px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-main);
  font-family: "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
}

.info-label {
  font-family: "Georgia", "Noto Serif SC", "Songti SC", serif;
  color: var(--gold);
  font-weight: 600;
  letter-spacing: 4px;
  font-size: 14px;
  position: relative;
  padding-left: 16px;
}

.info-label::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 6px;
  height: 1px;
  background: var(--gold);
  transform: translateY(-50%);
}

.info-value {
  color: var(--text-main);
  letter-spacing: 0.5px;
  font-size: 13.5px;
  line-height: 1.7;
}

.meta-bar {
  border-top: 1px solid var(--gold-faint);
  padding-top: 18px;
  display: flex;
  gap: 30px;
  color: var(--text-light);
  font-size: 11px;
  letter-spacing: 1.8px;
  font-family: "Helvetica Neue", "Noto Sans SC", sans-serif;
  flex-wrap: nowrap;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.meta-label {
  color: var(--gold);
  font-weight: 600;
  font-size: 9.5px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
}

.meta-value {
  color: var(--text-muted);
  font-size: 11.5px;
  letter-spacing: 0.6px;
  font-weight: 400;
}

.meta-dot {
  color: var(--gold);
  opacity: 0.5;
  font-size: 11px;
  align-self: center;
}

/* ============ 右侧视觉区 ============ */

.hero-col {
  flex: 1;
  padding: 88px 88px 88px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero-frame {
  position: relative;
  width: 720px;
  height: 402px;
}

.hero-frame::before {
  content: "";
  position: absolute;
  top: -16px;
  left: -16px;
  right: 16px;
  bottom: 16px;
  border: 1px solid var(--gold-faint);
  z-index: 0;
}

.hero-frame::after {
  content: "";
  position: absolute;
  top: -16px;
  left: -16px;
  width: 46px;
  height: 46px;
  border-top: 1.5px solid var(--gold);
  border-left: 1.5px solid var(--gold);
  z-index: 2;
}

.hero-corner-br {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: 46px;
  height: 46px;
  border-bottom: 1.5px solid var(--gold);
  border-right: 1.5px solid var(--gold);
  z-index: 2;
}

.hero-img {
  position: relative;
  z-index: 1;
  width: 720px;
  height: 402px;
  object-fit: cover;
  display: block;
  box-shadow: 0 22px 44px rgba(13, 33, 55, 0.14), 0 4px 10px rgba(13, 33, 55, 0.06);
}

.hero-caption {
  position: absolute;
  bottom: -46px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "Georgia", "Noto Serif SC", serif;
  font-size: 11.5px;
  color: var(--gold);
  letter-spacing: 3px;
  font-style: italic;
}

.hero-caption-line {
  width: 28px;
  height: 1px;
  background: var(--gold);
  opacity: 0.7;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-tint"></div>
    <div class="bg-corner-tl"></div>
    <div class="bg-corner-br"></div>
  </div>
  <div id="ct">
    <div class="text-col">
      <div class="badge">
        <span>READING&nbsp;SHARE&nbsp;·&nbsp;经典回读</span>
        <span class="badge-line"></span>
      </div>

      <div class="title-block">
        <h1 class="title">互惠的<br>经济学</h1>
        <div class="sub-wrap">
          <div class="sub">开源之道 · 适兕</div>
          <div class="divider"></div>
          <div class="sub">阅读分享&nbsp;·&nbsp;2023 — 09</div>
        </div>
      </div>

      <div class="info-block">
        <div class="info-row">
          <div class="info-label"><span>经典回读</span></div>
          <div class="info-value"><span>重读 von Hippel 与 Gibbons 2000 年发表于 AEA 的开创性论文</span></div>
        </div>
        <div class="info-row">
          <div class="info-label"><span>分享动机</span></div>
          <div class="info-value"><span>把二十年前的开放协作洞察带回今天的开源布道现场</span></div>
        </div>
        <div class="info-row">
          <div class="info-label"><span>阅读视角</span></div>
          <div class="info-value"><span>从经济学角度理解开发者为何愿意无偿贡献代码与时间</span></div>
        </div>
      </div>

      <div class="meta-bar">
        <div class="meta-item">
          <div class="meta-label"><span>Year&nbsp;·&nbsp;出版</span></div>
          <div class="meta-value"><span>2000 · American Economic Review</span></div>
        </div>
        <div class="meta-dot">·</div>
        <div class="meta-item">
          <div class="meta-label"><span>Authors&nbsp;·&nbsp;作者</span></div>
          <div class="meta-value"><span>von Hippel &amp; Gibbons · MIT</span></div>
        </div>
        <div class="meta-dot">·</div>
        <div class="meta-item">
          <div class="meta-label"><span>Issue&nbsp;·&nbsp;分享期</span></div>
          <div class="meta-value"><span>2023-09 · 开源之书记录系列</span></div>
        </div>
      </div>
    </div>

    <div class="hero-col">
      <div class="hero-frame">
        <img class="hero-img" src="../images/page_001_hero.png" alt="摊开的皮面精装书，金色柔光洒在书页上，藏蓝水墨勾勒的世界地图剪影，古铜金钢笔斜搭">
        <div class="hero-corner-br"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
