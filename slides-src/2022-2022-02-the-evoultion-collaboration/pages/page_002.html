<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Part 01 协作模式演进</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Roboto+Mono:wght@300;400;500;700&display=swap');

:root {
  --primary: #2196F3;
  --cyan: #00BCD4;
  --bg: #F5F7FA;
  --dark: #0D1B2A;
  --dark-2: #1A2A3A;
  --gray: #5A6A7A;
  --line: #D0DAE4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto Mono', monospace;
  background: var(--bg);
  color: var(--dark);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: linear-gradient(135deg, #F5F7FA 0%, #E8F0FA 50%, #F5F7FA 100%);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

#bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 800px 400px at 15% 20%, rgba(33,150,243,0.06), transparent 70%),
    radial-gradient(ellipse 600px 300px at 85% 80%, rgba(0,188,212,0.05), transparent 70%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 48px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top header strip */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 36px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
  margin-bottom: 20px;
}

.top-bar .tag {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--primary);
  font-weight: 500;
}

.top-bar .dots {
  display: flex;
  gap: 6px;
}

.top-bar .dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line);
}

.top-bar .dots span:nth-child(1) { background: var(--primary); }
.top-bar .dots span:nth-child(2) { background: var(--cyan); }

/* Main content row */
.main-row {
  display: flex;
  gap: 40px;
  flex: 1;
  align-items: flex-start;
}

/* Left column - giant 01 */
.left-col {
  width: 420px;
  flex-shrink: 0;
  position: relative;
}

.num-block {
  position: relative;
  height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.num-01 {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 240px;
  line-height: 0.85;
  background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -8px;
}

.num-label {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 16px;
  letter-spacing: 8px;
  color: var(--gray);
  margin-top: 4px;
}

.title-block {
  margin-top: 18px;
  padding-left: 4px;
}

.main-title {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 32px;
  color: var(--dark);
  letter-spacing: -0.5px;
  line-height: 1.2;
}

.sub-title {
  font-family: 'Roboto Mono', monospace;
  font-weight: 400;
  font-size: 13px;
  color: var(--gray);
  margin-top: 12px;
  line-height: 1.6;
  letter-spacing: 0.5px;
  max-width: 380px;
}

.title-divider {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--cyan));
  margin-top: 16px;
}

/* Right column - image */
.right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.image-wrap {
  width: 1000px;
  height: 560px;
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(13,27,42,0.12), 0 2px 8px rgba(33,150,243,0.08);
}

.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.image-caption {
  position: absolute;
  bottom: 14px;
  left: 18px;
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  letter-spacing: 2px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.image-frame-corner {
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2px solid var(--cyan);
  opacity: 0.7;
}

.image-frame-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.image-frame-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.image-frame-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.image-frame-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

/* Bottom key points */
.key-points {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.kp-card {
  flex: 1;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--line);
  border-top: 3px solid var(--primary);
  padding: 14px 18px;
  position: relative;
  backdrop-filter: blur(4px);
}

.kp-card:nth-child(2) { border-top-color: var(--cyan); }
.kp-card:nth-child(3) { border-top-color: #7E57C2; }

.kp-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.kp-index {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--primary);
  letter-spacing: 2px;
}

.kp-card:nth-child(2) .kp-index { color: var(--cyan); }
.kp-card:nth-child(3) .kp-index { color: #7E57C2; }

.kp-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--dark);
  letter-spacing: 0.5px;
}

.kp-desc {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  line-height: 1.5;
  color: var(--gray);
  letter-spacing: 0.3px;
}

/* Bottom decorative line */
.deco-line {
  position: absolute;
  bottom: 18px;
  left: 60px;
  right: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
}

.deco-meta {
  position: absolute;
  bottom: 28px;
  left: 60px;
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 3px;
}

.deco-meta-r {
  position: absolute;
  bottom: 28px;
  right: 60px;
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="top-bar">
      <span class="tag">PART 01 / CHAPTER OPENING</span>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="main-row">
      <div class="left-col">
        <div class="num-block">
          <div class="num-label"><span>PART</span></div>
          <div class="num-01">01</div>
        </div>
        <div class="title-block">
          <div class="title-divider"></div>
          <h1 class="main-title">协作模式演进</h1>
          <p class="sub-title">从邮件列表到生态治理：<br>开源协作形态的百年变迁</p>
        </div>
      </div>

      <div class="right-col">
        <div class="image-wrap">
          <img src="../images/page_002_section_visual.png" alt="抽象时间线流光图：象征协作模式演化的发光路径">
          <div class="image-frame-corner tl"></div>
          <div class="image-frame-corner tr"></div>
          <div class="image-frame-corner bl"></div>
          <div class="image-frame-corner br"></div>
          <div class="image-caption">TIMELINE · COLLABORATION EVOLUTION</div>
        </div>
      </div>
    </div>

    <div class="key-points">
      <div class="kp-card">
        <div class="kp-head">
          <span class="kp-index"><span>01 /</span></span>
          <span class="kp-title"><span>历史切片</span></span>
        </div>
        <p class="kp-desc">Linux 内核、Apache 基金会到 GitHub——不同阶段的协作范式各有侧重。</p>
      </div>
      <div class="kp-card">
        <div class="kp-head">
          <span class="kp-index"><span>02 /</span></span>
          <span class="kp-title"><span>核心命题</span></span>
        </div>
        <p class="kp-desc">技术基础设施如何决定社区参与门槛与贡献路径。</p>
      </div>
      <div class="kp-card">
        <div class="kp-head">
          <span class="kp-index"><span>03 /</span></span>
          <span class="kp-title"><span>演进线索</span></span>
        </div>
        <p class="kp-desc">去中心化理想与商业平台现实之间的持续张力。</p>
      </div>
    </div>
  </div>

  <div class="deco-line"></div>
  <div class="deco-meta"><span>S1 · SECTION OPENING</span></div>
  <div class="deco-meta-r"><span>2025 / OPEN SOURCE</span></div>
</div>
</body>
</html>
