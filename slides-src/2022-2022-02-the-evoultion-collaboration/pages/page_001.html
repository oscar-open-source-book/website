

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源协作的演进</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Roboto+Mono:wght@300;400;500&display=swap');

:root{
  --primary:#2196F3;
  --accent:#00BCD4;
  --neutral:#F5F7FA;
  --deep:#041026;
  --glow:rgba(33,150,243,0.45);
  --glow2:rgba(0,188,212,0.35);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Roboto Mono','Inter',sans-serif;
  color:var(--neutral);
  overflow:hidden;
}

.wrapper{
  width:1600px;
  height:900px;
  position:relative;
  overflow:hidden;
  margin:0 auto;
  font-family:'Roboto Mono','Inter',sans-serif;
}

#bg{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg .bg-photo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:1600px;
  height:894px;
  object-fit:cover;
  filter:saturate(1.05) brightness(0.85);
}

#bg .bg-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 700px 500px at 50% 40%, rgba(4,16,38,0.85), rgba(4,16,38,0.45)),
    linear-gradient(180deg, rgba(4,16,38,0.55) 0%, rgba(4,16,38,0.35) 35%, rgba(4,16,38,0.7) 75%, rgba(4,16,38,0.92) 100%);
}

#bg .bg-vignette{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 100%, rgba(0,188,212,0.12), transparent 60%);
}

#ct{
  position:absolute;
  inset:0;
  z-index:1;
  padding:70px 80px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  letter-spacing:3px;
  color:rgba(245,247,250,0.55);
  text-transform:uppercase;
}

.top-bar .brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.top-bar .brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
}

.center-zone{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  padding-bottom:20px;
}

.eyebrow{
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  letter-spacing:8px;
  color:var(--accent);
  margin-bottom:24px;
  text-transform:uppercase;
  opacity:0.9;
}

.main-title{
  font-family:'Inter','Helvetica Neue',sans-serif;
  font-weight:900;
  font-size:108px;
  line-height:1.05;
  letter-spacing:4px;
  background:linear-gradient(135deg, #ffffff 0%, #b8e0ff 45%, #2196F3 75%, #00BCD4 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(33,150,243,0.35);
  margin-bottom:22px;
}

.title-underline{
  width:220px;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), var(--primary), transparent);
  margin:0 auto 26px;
  position:relative;
}

.title-underline::before,
.title-underline::after{
  content:"";
  position:absolute;
  top:-4px;
  width:10px;height:10px;
  border:1px solid var(--accent);
  transform:rotate(45deg);
}
.title-underline::before{left:-14px;}
.title-underline::after{right:-14px;}

.subtitle{
  font-family:'Inter','Helvetica Neue',sans-serif;
  font-weight:400;
  font-size:22px;
  letter-spacing:6px;
  color:rgba(245,247,250,0.85);
}

.bottom-zone{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:40px;
  padding-top:10px;
}

.cards{
  display:flex;
  gap:18px;
  flex:1;
}

.card{
  flex:1;
  background:linear-gradient(160deg, rgba(33,150,243,0.10), rgba(4,16,38,0.55));
  border:1px solid rgba(33,150,243,0.30);
  border-radius:10px;
  padding:18px 20px;
  position:relative;
  backdrop-filter:blur(4px);
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;left:0;
  width:3px;height:100%;
  background:linear-gradient(180deg, var(--accent), var(--primary));
}

.card .idx{
  font-family:'Roboto Mono',monospace;
  font-size:11px;
  color:var(--accent);
  letter-spacing:2px;
  margin-bottom:6px;
}

.card .label{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:15px;
  color:var(--neutral);
  margin-bottom:8px;
  letter-spacing:1px;
}

.card .desc{
  font-family:'Roboto Mono',monospace;
  font-weight:300;
  font-size:11.5px;
  line-height:1.6;
  color:rgba(245,247,250,0.72);
}

.narrative{
  position:absolute;
  left:80px;
  right:80px;
  bottom:30px;
  font-family:'Roboto Mono',monospace;
  font-weight:300;
  font-size:12.5px;
  letter-spacing:2px;
  color:rgba(245,247,250,0.65);
  text-align:center;
  border-top:1px solid rgba(33,150,243,0.25);
  padding-top:14px;
}

.narrative .hl{
  color:var(--accent);
  font-weight:500;
}

/* Decorative right grid */
.deco-grid{
  position:absolute;
  right:-60px;
  bottom:-60px;
  width:380px;height:380px;
  z-index:0;
  opacity:0.35;
  pointer-events:none;
}

.deco-grid svg{width:100%;height:100%;}

/* corner marks */
.corner{
  position:absolute;
  width:34px;height:34px;
  border:1px solid rgba(0,188,212,0.5);
  z-index:2;
}
.corner.tl{top:30px;left:30px;border-right:none;border-bottom:none;}
.corner.tr{top:30px;right:30px;border-left:none;border-bottom:none;}
.corner.bl{bottom:14px;left:30px;border-right:none;border-top:none;}
.corner.br{bottom:14px;right:30px;border-left:none;border-top:none;}

/* floating particles */
.particle{
  position:absolute;
  border-radius:50%;
  z-index:0;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_001_hero.png" alt="未来感抽象网络节点图，发光互联节点漂浮在深邃天蓝黑暗中">
    <div class="bg-overlay"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="deco-grid">
    <svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gd" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g stroke="#2196F3" stroke-width="0.6" opacity="0.6" fill="none">
        <circle cx="300" cy="300" r="80"/>
        <circle cx="300" cy="300" r="140"/>
        <circle cx="300" cy="300" r="200"/>
        <circle cx="300" cy="300" r="260"/>
        <line x1="300" y1="40" x2="300" y2="560"/>
        <line x1="40" y1="300" x2="560" y2="300"/>
        <line x1="100" y1="100" x2="500" y2="500"/>
        <line x1="500" y1="100" x2="100" y2="500"/>
      </g>
      <g fill="#00BCD4">
        <circle cx="300" cy="300" r="4" fill="#ffffff"/>
        <circle cx="220" cy="300" r="2.5"/>
        <circle cx="380" cy="300" r="2.5"/>
        <circle cx="300" cy="220" r="2.5"/>
        <circle cx="300" cy="380" r="2.5"/>
        <circle cx="244" cy="244" r="2"/>
        <circle cx="356" cy="244" r="2"/>
        <circle cx="244" cy="356" r="2"/>
        <circle cx="356" cy="356" r="2"/>
      </g>
      <g stroke="#00BCD4" stroke-width="0.5" opacity="0.4">
        <line x1="300" y1="300" x2="220" y2="300"/>
        <line x1="300" y1="300" x2="380" y2="300"/>
        <line x1="300" y1="300" x2="300" y2="220"/>
        <line x1="300" y1="300" x2="300" y2="380"/>
        <line x1="300" y1="300" x2="244" y2="244"/>
        <line x1="300" y1="300" x2="356" y2="244"/>
        <line x1="300" y1="300" x2="244" y2="356"/>
        <line x1="300" y1="300" x2="356" y2="356"/>
      </g>
    </svg>
  </div>

  <div id="ct">
    <div class="top-bar">
      <div class="brand">
        <span class="dot"></span>
        <span>OPEN SOURCE / 2022.02</span>
      </div>
      <div>THE EVOLUTION OF COLLABORATION</div>
    </div>

    <div class="center-zone">
      <div class="eyebrow">开源协作 · 深度分享</div>
      <h1 class="main-title">开源协作的演进</h1>
      <div class="title-underline"></div>
      <div class="subtitle">2022年2月 · 开源之道适兕的阅读分享</div>
    </div>

    <div class="bottom-zone">
      <div class="cards">
        <div class="card">
          <div class="idx">01</div>
          <div class="label"><span>主题聚焦</span></div>
          <div class="desc"><span>围绕 The Evolution of Collaboration 梳理开源协作的脉络与启示</span></div>
        </div>
        <div class="card">
          <div class="idx">02</div>
          <div class="label"><span>分享场合</span></div>
          <div class="desc"><span>开源之道月度阅读分享会，面向社区开发者与布道者</span></div>
        </div>
        <div class="card">
          <div class="idx">03</div>
          <div class="label"><span>演讲者</span></div>
          <div class="desc"><span>适兕，开源之道核心成员，长期关注社区治理与协作机制</span></div>
        </div>
      </div>
    </div>

    <div class="narrative">
      <span>从 <span class="hl">代码合 一</span> 到 <span class="hl">生态共建</span> 的演进轨迹，提炼布道者应思考的关键命题</span>
    </div>
  </div>
</div>
</body>
</html>
