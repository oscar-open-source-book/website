<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开源布道</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --secondary: #B0BEC5;
  --bg-deep: #050B1A;
  --bg-mid: #0A1733;
  --card-bg: rgba(20, 40, 80, 0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  color: #E3E8F0;
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at 78% 45%, rgba(33, 150, 243, 0.18) 0%, rgba(33, 150, 243, 0.04) 40%, transparent 70%),
              linear-gradient(135deg, #050B1A 0%, #0A1733 55%, #051024 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px 70px;
}

/* Header zone */
.chapter-tag {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 500;
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}
.chapter-tag .bar {
  width: 48px;
  height: 2px;
  background: var(--accent);
  display: inline-block;
}

.main-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 118px;
  line-height: 1;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #FFFFFF 0%, #B0E2FF 60%, #00BCD4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}

.sub-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 500;
  font-size: 30px;
  letter-spacing: 8px;
  color: var(--secondary);
  margin-bottom: 24px;
}

.narrative {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.85;
  color: var(--secondary);
  max-width: 560px;
  border-left: 2px solid var(--primary);
  padding-left: 18px;
}

.narrative .highlight {
  color: #FFFFFF;
  font-weight: 400;
}

/* Right hero image area */
.hero-zone {
  position: absolute;
  top: 90px;
  right: 60px;
  width: 750px;
  z-index: 2;
}

.hero-frame {
  position: relative;
  width: 750px;
  height: 420px;
  border: 1px solid rgba(33, 150, 243, 0.35);
  border-radius: 6px;
  overflow: hidden;
  background: rgba(5, 15, 40, 0.5);
  box-shadow: 0 0 60px rgba(33, 150, 243, 0.15), inset 0 0 80px rgba(33, 150, 243, 0.05);
}

.hero-frame img {
  width: 750px;
  height: 420px;
  object-fit: cover;
  display: block;
}

.hero-caption {
  margin-top: 14px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 500;
  font-size: 17px;
  letter-spacing: 2px;
  color: var(--accent);
  text-align: right;
  padding-right: 6px;
}

.hero-caption .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 10px;
  box-shadow: 0 0 10px var(--accent);
}

/* Bottom three cards */
.cards {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 60px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  z-index: 2;
}

.card {
  background: var(--card-bg);
  border: 1px solid rgba(33, 150, 243, 0.25);
  border-top: 2px solid var(--primary);
  border-radius: 4px;
  padding: 20px 22px;
  backdrop-filter: blur(6px);
  position: relative;
  transition: border-color 0.3s;
}

.card .card-num {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 22px;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.card .card-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 24px;
  color: #FFFFFF;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.card .card-desc {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.7;
  color: var(--secondary);
}

/* Decorative elements */
.grid-lines {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(33, 150, 243, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33, 150, 243, 0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
}

.corner-tl, .corner-br {
  position: absolute;
  width: 50px;
  height: 50px;
  z-index: 1;
  border-color: var(--accent);
}
.corner-tl {
  top: 30px;
  left: 30px;
  border-top: 2px solid;
  border-left: 2px solid;
}
.corner-br {
  bottom: 30px;
  right: 30px;
  border-bottom: 2px solid;
  border-right: 2px solid;
}

.page-marker {
  position: absolute;
  top: 34px;
  right: 40px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--secondary);
  z-index: 3;
}
.page-marker .num {
  color: var(--accent);
  font-weight: 700;
  font-size: 18px;
  margin-right: 6px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div class="grid-lines"></div>

  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="page-marker"><span class="num">05</span>CHAPTER</div>

  <div id="ct">
    <div class="chapter-tag">
      <span class="bar"></span>
      <span>OPEN SOURCE EVANGELISM</span>
    </div>
    <h1 class="main-title"><span>开源布道</span></h1>
    <div class="sub-title"><span>分享 · 传播 · 社区影响</span></div>
    <p class="narrative">
      <span class="highlight">开源布道是连接技术与人的桥梁。</span>
      布道者通过演讲、写作、培训等形式，将开源的理念与实践传递给更广泛的受众，从而推动社区生态的繁荣。光从中心扩散，正如开源理念在社群中层层传递。
    </p>
  </div>

  <div class="hero-zone">
    <div class="hero-frame">
      <img src="../images/page_005_hero.png" alt="从中心向外扩散的天蓝与青色光波抽象图，象征思想的传播与影响力">
    </div>
    <div class="hero-caption">
      <span><span class="dot"></span>思想扩散 · 层层涟漪 · 影响力延伸</span>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-num"><span>01</span></div>
      <div class="card-title"><span>布道使命</span></div>
      <div class="card-desc"><span>让更多人理解并拥抱开源价值观，让自由协作的精神深入人心。</span></div>
    </div>
    <div class="card">
      <div class="card-num"><span>02</span></div>
      <div class="card-title"><span>演讲技巧</span></div>
      <div class="card-desc"><span>用故事与技术演示打动听众，把复杂概念转化为可感知的价值。</span></div>
    </div>
    <div class="card">
      <div class="card-num"><span>03</span></div>
      <div class="card-title"><span>社区链接</span></div>
      <div class="card-desc"><span>建立跨项目、跨企业的协作网络，让开源生态在连接中持续生长。</span></div>
    </div>
  </div>
</div>
</body>
</html>
