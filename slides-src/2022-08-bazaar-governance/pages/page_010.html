

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>共建开源生态</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --accent:#00BCD4;
  --gray:#B0BEC5;
  --dark:#0A1424;
  --dark2:#0E1B30;
  --line:rgba(33,150,243,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{font-family:'Inter',sans-serif;color:#E6EEF7;background:var(--dark);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%, #122847 0%, #0A1424 55%, #060C18 100%);}
#ct{position:absolute;inset:0;z-index:1;padding:56px 80px 48px;box-sizing:border-box;display:flex;flex-direction:column;}

/* decorative particles */
.particles{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.6;}
.dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

.head{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px;}
.title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:78px;letter-spacing:6px;
  background:linear-gradient(90deg,#7DC4FF 0%, #2196F3 45%, #00BCD4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(33,150,243,.25);}
.divider{width:120px;height:2px;margin:14px 0 10px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.subtitle{font-family:'Rajdhani',sans-serif;font-weight:500;font-size:22px;color:var(--gray);letter-spacing:8px;}

.mid{margin-top:30px;display:grid;grid-template-columns:800px 1fr;gap:40px;align-items:start;}

.hero-wrap{position:relative;width:800px;height:446px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 60px rgba(33,150,243,.12);}
.hero-wrap img{width:800px;height:446px;object-fit:cover;display:block;}
.hero-badge{position:absolute;left:18px;top:18px;padding:6px 14px;border-radius:20px;
  background:rgba(10,20,36,.65);border:1px solid var(--accent);color:var(--accent);
  font-family:'Rajdhani',sans-serif;font-size:14px;letter-spacing:2px;font-weight:600;
  backdrop-filter:blur(4px);}
.hero-cap{position:absolute;left:18px;bottom:16px;right:18px;font-size:13px;color:var(--gray);
  line-height:1.5;}

.cards{display:flex;flex-direction:column;gap:14px;}
.card{position:relative;display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:12px;
  background:linear-gradient(90deg,rgba(33,150,243,.10) 0%, rgba(0,188,212,.04) 100%);
  border:1px solid var(--line);backdrop-filter:blur(2px);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;
  background:linear-gradient(180deg,var(--primary),var(--accent));}
.icon{flex-shrink:0;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(33,150,243,.55), rgba(0,188,212,.15));
  border:1px solid rgba(0,188,212,.5);display:flex;align-items:center;justify-content:center;}
.icon svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;}
.card-body{display:flex;flex-direction:column;}
.card-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;color:#EAF3FF;letter-spacing:1px;}
.card-desc{font-size:12.5px;color:var(--gray);margin-top:2px;line-height:1.45;}

.foot{margin-top:auto;text-align:center;padding:18px 40px 0;border-top:1px solid var(--line);position:relative;}
.foot-glow{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:280px;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.foot p{font-size:15px;line-height:1.8;color:#CFDEEE;font-weight:300;letter-spacing:0.5px;}
.foot .em{color:#7DC4FF;font-weight:500;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div class="particles" aria-hidden="true">
    <span class="dot" style="left:6%;top:12%"></span>
    <span class="dot" style="left:22%;top:8%;width:2px;height:2px"></span>
    <span class="dot" style="left:44%;top:14%"></span>
    <span class="dot" style="left:71%;top:9%;width:2px;height:2px"></span>
    <span class="dot" style="left:89%;top:13%"></span>
    <span class="dot" style="left:4%;top:46%;width:2px;height:2px"></span>
    <span class="dot" style="left:96%;top:48%"></span>
    <span class="dot" style="left:12%;top:78%;width:2px;height:2px"></span>
    <span class="dot" style="left:88%;top:82%"></span>
    <span class="dot" style="left:50%;top:92%"></span>
  </div>
  <div id="ct">

    <div class="head">
      <div class="title">共建开源生态</div>
      <div class="divider"></div>
      <div class="subtitle">阅读 · 布道 · 治理的融合</div>
    </div>

    <div class="mid">
      <div class="hero-wrap">
        <img src="../images/page_010_hero.png" alt="全球协作网络与人物剪影：发光节点与辐射路径连接的数字地球，象征共建精神">
        <div class="hero-badge">GLOBAL · COLLABORATION</div>
        <div class="hero-cap">节点相连 · 光芒交织 · 跨越地域与文化的共同协作网络</div>
      </div>

      <div class="cards">
        <div class="card">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M4 17V4M9 8h6M9 12h6M9 16h4"/></svg></div>
          <div class="card-body">
            <div class="card-title">持续学习</div>
            <div class="card-desc">保持好奇心，深度阅读与思考</div>
          </div>
        </div>
        <div class="card">
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 12h10M8 10l10-2M8 14l10 2"/></svg></div>
          <div class="card-body">
            <div class="card-title">主动分享</div>
            <div class="card-desc">将知识与经验传递给更多人</div>
          </div>
        </div>
        <div class="card">
          <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="1"/><path d="M8 4h8l-1 2H9L8 4zM8 12h8M8 16h5"/></svg></div>
          <div class="card-body">
            <div class="card-title">参与治理</div>
            <div class="card-desc">在项目中承担责任，推动民主决策</div>
          </div>
        </div>
        <div class="card">
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18"/></svg></div>
          <div class="card-body">
            <div class="card-title">连接社区</div>
            <div class="card-desc">建立跨区域、跨文化的协作网络</div>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="foot-glow"></div>
      <p>开源之道并非独行之路，而是<span class="em">众行致远</span>。我们通过<span class="em">阅读</span>汲取智慧，通过<span class="em">布道</span>传递火种，通过<span class="em">治理</span>确保公平与可持续。愿每个人都能成为开源生态中的<span class="em">建设者</span>。</p>
    </div>

  </div>
</div>
</body>
</html>
