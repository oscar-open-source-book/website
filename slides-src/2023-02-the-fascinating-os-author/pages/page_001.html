

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之书记录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --primary: #2196F3;
  --cyan: #00BCD4;
  --neutral: #E0E0E0;
  --dark: #0A1628;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Roboto Mono', monospace;
  color: var(--neutral);
  background: #000;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url('../images/page_001_hero.png') center/cover no-repeat;
}

#bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(10,22,40,0.15) 0%, rgba(10,22,40,0.55) 65%, rgba(10,22,40,0.8) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header-section {
  text-align: center;
  padding-top: 10px;
}

.title-glow {
  position: relative;
  display: inline-block;
  padding: 12px 40px;
}

.title-glow::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: radial-gradient(ellipse at center, rgba(33,150,243,0.2) 0%, transparent 70%);
  z-index: -1;
}

.main-title {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 100px;
  color: #FFFFFF;
  letter-spacing: 10px;
  line-height: 1.1;
  text-shadow: 0 0 24px var(--primary), 0 0 48px var(--cyan), 0 0 80px rgba(33,150,243,0.45);
  margin: 0;
}

.title-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.title-line-bar {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan));
}

.title-line-bar.right {
  background: linear-gradient(90deg, var(--cyan), transparent);
}

.subtitle {
  font-family: 'Roboto Mono', monospace;
  font-size: 17px;
  color: var(--neutral);
  letter-spacing: 3px;
  margin-top: 16px;
  opacity: 0.85;
}

.cards-section {
  display: flex;
  gap: 22px;
  justify-content: center;
  margin: 0 auto;
}

.card {
  width: 440px;
  padding: 24px 26px;
  background: rgba(10, 22, 40, 0.72);
  border: 1px solid var(--primary);
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(33,150,243,0.28), inset 0 0 18px rgba(33,150,243,0.06);
  backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), var(--cyan), transparent);
}

.card-label {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--cyan);
  letter-spacing: 4px;
  margin-bottom: 10px;
}

.card-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 21px;
  color: #FFFFFF;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(33,150,243,0.3);
}

.card-text {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  line-height: 1.8;
  color: var(--neutral);
  opacity: 0.92;
}

.bottom-section {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
}

.data-tags {
  display: flex;
  gap: 32px;
}

.data-tag {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.data-tag-label {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  color: var(--cyan);
  letter-spacing: 2px;
}

.data-tag-value {
  font-family: 'Roboto Mono', monospace;
  font-weight: 500;
  font-size: 16px;
  color: #FFFFFF;
}

.geo-decoration {
  position: relative;
  width: 150px;
  height: 100px;
  flex-shrink: 0;
}

.geo-ring {
  position: absolute;
  border: 1px solid var(--primary);
  border-radius: 50%;
  opacity: 0.5;
}

.geo-ring-1 {
  width: 100px;
  height: 100px;
  right: 0;
  bottom: 0;
  border-color: var(--cyan);
  opacity: 0.4;
}

.geo-ring-2 {
  width: 60px;
  height: 60px;
  right: 20px;
  bottom: 20px;
  opacity: 0.6;
}

.geo-ring-3 {
  width: 26px;
  height: 26px;
  right: 37px;
  bottom: 37px;
  background: var(--cyan);
  border: none;
  opacity: 0.85;
  box-shadow: 0 0 12px var(--cyan);
}

.geo-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary));
  right: 0;
  bottom: 50px;
  width: 150px;
  opacity: 0.55;
}

.geo-line-2 {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan));
  right: 0;
  bottom: 25px;
  width: 105px;
  opacity: 0.5;
}

.geo-node {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--cyan);
}

.geo-node-1 { left: 0; top: 8px; }
.geo-node-2 { left: 32px; top: 48px; }
.geo-node-3 { left: 72px; top: 18px; }

.bottom-narrative {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  color: var(--neutral);
  opacity: 0.65;
  text-align: center;
  letter-spacing: 1.5px;
  line-height: 1.6;
  margin-top: 12px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="header-section">
      <div class="title-glow">
        <h1 class="main-title"><span>开源之书记录</span></h1>
      </div>
      <div class="title-line">
        <span class="title-line-bar"></span>
        <div class="subtitle"><span>2023年02月 · The Fascinating OS Author 阅读分享</span></div>
        <span class="title-line-bar right"></span>
      </div>
    </div>

    <div class="cards-section">
      <div class="card">
        <div class="card-label"><span>01 / TOPIC</span></div>
        <div class="card-title"><span>分享主题</span></div>
        <div class="card-text"><span>围绕开源布道精神与阅读分享，探索优秀开源作者的写作世界。</span></div>
      </div>
      <div class="card">
        <div class="card-label"><span>02 / ROLE</span></div>
        <div class="card-title"><span>分享角色</span></div>
        <div class="card-text"><span>由开源之道·适兕担任本期主讲，聚焦英文技术原著与译作推荐。</span></div>
      </div>
      <div class="card">
        <div class="card-label"><span>03 / FORMAT</span></div>
        <div class="card-title"><span>分享形式</span></div>
        <div class="card-text"><span>结合书籍摘要、作者背景、社区影响与个人阅读笔记进行深度拆解。</span></div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="data-tags">
        <div class="data-tag">
          <div class="data-tag-label"><span>分享期次</span></div>
          <div class="data-tag-value"><span>2023-02</span></div>
        </div>
        <div class="data-tag">
          <div class="data-tag-label"><span>分享平台</span></div>
          <div class="data-tag-value"><span>开源之道</span></div>
        </div>
        <div class="data-tag">
          <div class="data-tag-label"><span>主讲人</span></div>
          <div class="data-tag-value"><span>适兕</span></div>
        </div>
      </div>
      <div class="geo-decoration">
        <div class="geo-line"></div>
        <div class="geo-line-2"></div>
        <div class="geo-ring geo-ring-1"></div>
        <div class="geo-ring geo-ring-2"></div>
        <div class="geo-ring geo-ring-3"></div>
        <div class="geo-node geo-node-1"></div>
        <div class="geo-node geo-node-2"></div>
        <div class="geo-node geo-node-3"></div>
      </div>
    </div>

    <div class="bottom-narrative"><span>本期聚焦 2023 年 2 月开源之道社区阅读记录，旨在通过开源经典阅读让开发者感受开源文化的魅力与思想力量。</span></div>
  </div>
</div>
</body>
</html>
