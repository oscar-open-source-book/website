

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之道·适兕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap');
:root{
--klein:#002FA7;
--cyan:#00BCD4;
--bg:#1A1A2E;
--text-main:#FFFFFF;
--text-dim:rgba(255,255,255,0.62);
--text-line:rgba(255,255,255,0.28);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:var(--text-main);background:#000;overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;}
#bg img.bg-photo{width:1600px;height:900px;object-fit:cover;object-position:right center;display:block;}
#bg .bg-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(26,26,46,0.94) 0%,rgba(26,26,46,0.78) 38%,rgba(26,26,46,0.32) 62%,rgba(26,26,46,0.10) 100%);}
#ct{position:absolute;inset:0;z-index:1;padding:72px 80px;display:flex;flex-direction:column;box-sizing:border-box;}
.top-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--text-line);}
.brand{font-size:13px;letter-spacing:0.32em;font-weight:500;color:var(--text-dim);}
.brand .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);margin-right:12px;vertical-align:middle;}
.meta-top{font-size:12px;letter-spacing:0.28em;color:var(--text-dim);font-weight:400;}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:10px;}
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.eyebrow .bar{width:48px;height:2px;background:var(--cyan);}
.eyebrow .tag{font-size:12px;letter-spacing:0.42em;color:var(--cyan);font-weight:500;}
.title{font-size:118px;font-weight:700;line-height:1.02;letter-spacing:0.04em;color:var(--text-main);margin-bottom:18px;}
.title .sep{color:var(--cyan);font-weight:300;margin:0 6px;}
.title .accent{background:linear-gradient(90deg,var(--klein),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;}
.subtitle{font-size:22px;font-weight:300;color:var(--text-dim);letter-spacing:0.10em;margin-bottom:40px;}
.info-list{display:flex;flex-direction:column;gap:16px;max-width:720px;}
.info-item{display:flex;align-items:flex-start;gap:18px;}
.info-item .label{flex-shrink:0;font-size:11px;letter-spacing:0.32em;color:var(--cyan);font-weight:600;min-width:64px;padding-top:3px;}
.info-item .divider{width:1px;background:var(--text-line);align-self:stretch;}
.info-item .content{flex:1;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.78);font-weight:300;letter-spacing:0.02em;}
.info-item .content b{color:var(--text-main);font-weight:600;}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;padding-top:28px;border-top:1px solid var(--text-line);margin-top:28px;}
.tags{display:flex;gap:0;}
.tag-item{display:flex;flex-direction:column;padding:0 28px;border-right:1px solid var(--text-line);}
.tag-item:first-child{padding-left:0;}
.tag-item:last-child{border-right:none;padding-right:0;}
.tag-item .tag-label{font-size:10px;letter-spacing:0.32em;color:var(--text-dim);font-weight:500;margin-bottom:6px;}
.tag-item .tag-value{font-size:14px;font-weight:500;color:var(--text-main);letter-spacing:0.04em;}
.tag-item .tag-value .hl{color:var(--cyan);}
.nav-hint{font-size:11px;letter-spacing:0.36em;color:var(--text-dim);font-weight:400;text-align:right;}
.nav-hint .arrow{color:var(--cyan);margin-left:8px;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_001_hero.png" alt="深色科技感开源主题封面视觉">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">
    <div class="top-row">
      <div class="brand"><span class="dot"></span><span>OPEN · SOURCE · SHI·SI</span></div>
      <div class="meta-top">COVER / 2022</div>
    </div>

    <div class="main">
      <div class="eyebrow">
        <span class="bar"></span>
        <span class="tag">开源之道 · READING SHARE</span>
      </div>
      <h1 class="title">开源之道<span class="sep">·</span><span class="accent">适兕</span></h1>
      <div class="subtitle">2022年12月　开源布道与阅读分享会</div>

      <div class="info-list">
        <div class="info-item">
          <div class="label">主题</div>
          <div class="divider"></div>
          <div class="content">开源阅读，围绕<b>2022年度开源经典与新兴读物</b>进行系统分享与深度探讨</div>
        </div>
        <div class="info-item">
          <div class="label">主讲</div>
          <div class="divider"></div>
          <div class="content"><b>Rebel-code</b>，以技术实践者视角解读开源文化、技术趋势与社区生态</div>
        </div>
        <div class="info-item">
          <div class="label">时间</div>
          <div class="divider"></div>
          <div class="content"><b>2022年12月</b>，年终回顾专场，总结年度开源热点并展望来年技术方向</div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="tags">
        <div class="tag-item">
          <div class="tag-label">分享日期</div>
          <div class="tag-value"><span class="hl">2022.12</span>　年终开源阅读专场</div>
        </div>
        <div class="tag-item">
          <div class="tag-label">主讲</div>
          <div class="tag-value">Rebel-code　开源技术实践者</div>
        </div>
        <div class="tag-item">
          <div class="tag-label">栏目</div>
          <div class="tag-value"><span class="hl">适兕</span>　开源之道读书分享栏目</div>
        </div>
      </div>
      <div class="nav-hint">DEC 2022<span class="arrow">→</span></div>
    </div>
  </div>
</div>
</body>
</html>
