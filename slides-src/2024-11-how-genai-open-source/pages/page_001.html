

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>开源布道与阅读分享</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2196F3;
            --secondary: #00BCD4;
            --bg-dark: #1A1F2E;
            --text-main: #FFFFFF;
            --text-light: rgba(255, 255, 255, 0.7);
            --font-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-base);
            font-size: 18px;
            color: var(--text-main);
            overflow: hidden;
        }
        
        .wrapper {
            width: 1600px;
            height: 900px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        
        #bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        
        .bg-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(26, 31, 46, 0.2) 0%, rgba(26, 31, 46, 0.4) 50%, rgba(26, 31, 46, 0.6) 100%);
        }
        
        #ct {
            position: absolute;
            inset: 0;
            z-index: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .title-area {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .main-title {
            font-size: 96px;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1.05;
            margin-bottom: 20px;
            text-shadow: 0 4px 40px rgba(33, 150, 243, 0.4), 0 2px 10px rgba(0, 188, 212, 0.2);
        }
        
        .sub-title {
            font-size: 26px;
            font-weight: 400;
            color: var(--text-light);
            letter-spacing: 2px;
        }
        
        .points-area {
            display: flex;
            gap: 80px;
            margin-bottom: 40px;
        }
        
        .point-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .point-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
        }
        
        .point-label {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-light);
        }
        
        .stats-area {
            display: flex;
            gap: 100px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="bg">
            <img class="bg-photo" src="../images/page_001_hero.png" alt="粒子网络背景">
            <div class="bg-overlay"></div>
        </div>
        <div id="ct">
            <div class="title-area">
                <h1 class="main-title">开源布道与阅读分享</h1>
                <p class="sub-title">2024 GenAI开源实践：从阅读到布道的路径探索</p>
            </div>
            
            <div class="points-area">
                <div class="point-item">
                    <div class="point-icon">📚</div>
                    <span class="point-label">开源之书记录</span>
                </div>
                <div class="point-item">
                    <div class="point-icon">🗓️</div>
                    <span class="point-label">2024年11月专题</span>
                </div>
                <div class="point-item">
                    <div class="point-icon">🚀</div>
                    <span class="point-label">从代码到布道</span>
                </div>
            </div>
            
            <div class="stats-area">
                <div class="stat-item">
                    <span class="stat-value">2000+</span>
                    <span class="stat-label">HuggingFace GenAI开源大模型</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">4亿+</span>
                    <span class="stat-label">全球GitHub活跃开源仓库</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
