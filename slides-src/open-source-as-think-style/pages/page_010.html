

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>保持开放，继续生长</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap');
:root{
  --primary:#607D8B;
  --dark:#263238;
  --bg:#ECEFF1;
  --ink:#263238;
  --muted:#546E7A;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;}
body{font-family:'Noto Sans SC','Inter',-apple-system,sans-serif;color:var(--ink);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--bg);}
#bg{position:absolute;inset:0;z-index:0;background:var(--bg);}
#ct{position:absolute;inset:0;z-index:1;padding:42px 60px 40px 60px;display:flex;flex-direction:column;align-items:center;}

.title-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;}
.title{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:500;font-size:50px;letter-spacing:8px;color:var(--dark);line-height:1.1;}
.subtitle{font-family:'Noto Serif SC',serif;font-weight:300;font-size:15px;letter-spacing:2px;color:var(--muted);line-height:1.6;}

.art-wrap{margin-top:14px;display:flex;justify-content:center;align-items:center;}
.art-wrap img{width:820px;height:458px;object-fit:cover;display:block;border:0;box-shadow:0 10px 40px rgba(38,50,56,.10);}

.points{display:flex;align-items:flex-start;justify-content:center;gap:22px;margin-top:22px;width:1420px;}
.point{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 10px;}
.point .pt-lead{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:500;font-size:16px;letter-spacing:4px;color:var(--primary);margin-bottom:10px;}
.point .pt-body{font-family:'Noto Serif SC',serif;font-weight:300;font-size:13px;line-height:1.95;color:var(--muted);letter-spacing:0.5px;}
.divider{display:flex;align-items:center;justify-content:center;padding-top:14px;color:var(--primary);opacity:.6;font-size:14px;flex-shrink:0;}

.foot{margin-top:18px;text-align:center;max-width:1180px;display:flex;flex-direction:column;align-items:center;}
.foot-rule{width:48px;height:1px;background:var(--primary);opacity:.55;margin-bottom:12px;}
.foot-text{font-family:'Noto Serif SC',serif;font-weight:300;font-size:14.5px;line-height:1.95;color:var(--dark);letter-spacing:1px;}
.foot-tag{font-family:'Inter',sans-serif;font-weight:400;font-size:11px;letter-spacing:5px;color:var(--muted);margin-top:10px;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="title-wrap">
      <div class="title"><span>保持开放，继续生长</span></div>
      <div class="subtitle"><span>开源是一种生活方式，阅读与布道是它的呼吸</span></div>
    </div>

    <div class="art-wrap">
      <img src="../images/page_010_closing_art.png" alt="一条向远方延伸的开放道路，地平线渐隐的极简抽象构图">
    </div>

    <div class="points">
      <div class="point">
        <span class="pt-lead">不忘初心</span>
        <span class="pt-body">记住为何出发，为了一个更开放、更公平、更协作的技术世界。</span>
      </div>
      <div class="divider"><span>·</span></div>
      <div class="point">
        <span class="pt-lead">持续学习</span>
        <span class="pt-body">开源在演变，思维需更新，每年至少精读 2 至 3 本相关著作。</span>
      </div>
      <div class="divider"><span>·</span></div>
      <div class="point">
        <span class="pt-lead">分享所得</span>
        <span class="pt-body">将你的笔记、思考与实践开放出来，让更多人加入这场运动。</span>
      </div>
    </div>

    <div class="foot">
      <div class="foot-rule"></div>
      <p class="foot-text">开源不是终点，而是一种持续开放的状态。愿这份书记录成为你旅程中的一站——读完它，写下你的思考，贡献你的代码，传播你的火种。</p>
      <div class="foot-tag"><span>open · onward</span></div>
    </div>
  </div>
</div>
</body>
</html>
