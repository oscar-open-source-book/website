

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>让知识流动起来</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2196F3;
  --accent:#00BCD4;
  --bg:#0D1117;
  --bg-2:#161B22;
  --text-main:#E6EDF3;
  --text-dim:#8B949E;
  --line:#30363D;
  --violet:#7C4DFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--text-main);font-family:'JetBrains Mono','Noto Sans SC',monospace;font-size:14px;line-height:1.6}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto}
#bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 42%, rgba(33,150,243,0.14) 0%, rgba(0,188,212,0.06) 32%, rgba(13,17,23,1) 72%);}
#ct{position:absolute;inset:0;z-index:1;padding:44px 80px 40px 80px;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}

.corner{position:absolute;width:16px;height:16px;border:1px solid var(--accent);opacity:0.45}
.corner.tl{top:22px;left:22px;border-right:0;border-bottom:0}
.corner.tr{top:22px;right:22px;border-left:0;border-bottom:0}
.corner.bl{bottom:22px;left:22px;border-right:0;border-top:0}
.corner.br{bottom:22px;right:22px;border-left:0;border-top:0}

.header{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
.title{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:800;font-size:40px;letter-spacing:0.04em;background:linear-gradient(90deg,#E6EDF3 0%, #2196F3 55%, #00BCD4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.subtitle{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:0.32em;text-align:center}
.subtitle .bar{display:inline-block;width:40px;height:1px;background:var(--accent);vertical-align:middle;margin:0 14px;opacity:0.7}

.hero-wrap{position:relative;width:860px;height:480px;display:flex;align-items:center;justify-content:center;margin:6px 0}
.hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, rgba(33,150,243,0.28) 0%, rgba(0,188,212,0.10) 42%, transparent 72%);filter:blur(6px);pointer-events:none}
.hero-ring{position:absolute;inset:-6px;border:1px solid rgba(33,150,243,0.35);border-radius:8px;pointer-events:none}
.hero-ring.inner{inset:0;border:1px solid rgba(0,188,212,0.22)}
.hero-img{position:relative;width:860px;height:480px;object-fit:cover;object-position:center;border-radius:6px;box-shadow:0 0 50px rgba(33,150,243,0.28), 0 0 100px rgba(0,188,212,0.12)}

.anchor{margin:10px 0 12px 0;display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;letter-spacing:0.28em;color:var(--text-main);padding:10px 28px;background:linear-gradient(90deg, rgba(33,150,243,0.10) 0%, rgba(0,188,212,0.14) 50%, rgba(33,150,243,0.10) 100%);border-top:1px solid rgba(33,150,243,0.4);border-bottom:1px solid rgba(0,188,212,0.4);border-radius:2px}
.anchor .word{color:#E6EDF3}
.anchor .sep{color:var(--accent);font-weight:600}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;width:100%;margin:8px 0 12px 0}
.col{background:linear-gradient(180deg, rgba(22,27,34,0.92) 0%, rgba(13,17,23,0.65) 100%);border:1px solid var(--line);border-top:2px solid var(--primary);border-radius:8px;padding:18px 22px 20px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;backdrop-filter:blur(2px)}
.col:nth-child(2){border-top-color:var(--accent)}
.col:nth-child(3){border-top-color:var(--violet)}
.col-deco{position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle at 100% 0%, rgba(33,150,243,0.18) 0%, transparent 60%);pointer-events:none}
.col:nth-child(2) .col-deco{background:radial-gradient(circle at 100% 0%, rgba(0,188,212,0.20) 0%, transparent 60%)}
.col:nth-child(3) .col-deco{background:radial-gradient(circle at 100% 0%, rgba(124,77,255,0.20) 0%, transparent 60%)}
.col-head{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.col-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:0.20em;padding:2px 8px;border:1px solid rgba(0,188,212,0.35);border-radius:3px}
.col-title{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:700;font-size:20px;color:var(--text-main);letter-spacing:0.04em}
.col-desc{font-size:13px;color:var(--text-dim);line-height:1.75;position:relative;z-index:1}

.closing{font-family:'Inter','Noto Sans SC',sans-serif;font-size:14px;color:var(--text-dim);line-height:1.9;max-width:1240px;text-align:center;letter-spacing:0.02em;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.closing .hl{color:var(--accent);font-weight:500}
.closing .hl2{color:var(--primary);font-weight:500}

.footer-l{position:absolute;bottom:14px;left:24px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:0.24em}
.footer-r{position:absolute;bottom:14px;right:24px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:0.24em}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="header">
      <div class="title"><span>让知识流动起来</span></div>
      <div class="subtitle"><span><span class="bar"></span>开源之书记录 · 持续更新中<span class="bar"></span></span></div>
    </div>

    <div class="hero-wrap">
      <div class="hero-glow"></div>
      <div class="hero-ring"></div>
      <div class="hero-ring inner"></div>
      <img class="hero-img" src="../images/page_010_closing_hero.png" alt="天蓝色发光球体居中悬浮，周围电路纹路向外盘旋并逐渐消散">
    </div>

    <div class="anchor">
      <span class="word">Open</span>
      <span class="sep">·</span>
      <span class="word">Read</span>
      <span class="sep">·</span>
      <span class="word">Share</span>
    </div>

    <div class="three">
      <div class="col">
        <div class="col-deco"></div>
        <div class="col-head"><span class="col-num">01</span><span class="col-title">保持阅读</span></div>
        <div class="col-desc"><span>将阅读纳入日常生活节奏，让输入源源不断。</span></div>
      </div>
      <div class="col">
        <div class="col-deco"></div>
        <div class="col-head"><span class="col-num">02</span><span class="col-title">持续分享</span></div>
        <div class="col-desc"><span>把每次收获转化为笔记、演讲或代码贡献回馈社区。</span></div>
      </div>
      <div class="col">
        <div class="col-deco"></div>
        <div class="col-head"><span class="col-num">03</span><span class="col-title">欢迎共建</span></div>
        <div class="col-desc"><span>本册记录面向社区开放，欢迎任何人 fork 与贡献。</span></div>
      </div>
    </div>

    <div class="closing"><span>开源之书记录不是一次性的总结，而是一个<span class="hl2">持续生长</span>的项目。它记录我们的阅读、我们的思考、我们的分享——以及每一次与社区相遇的瞬间。<span class="hl">期待下一个版本，也期待你的参与。</span></span></div>

    <div class="footer-l"><span>// v.Next · keep flowing</span></div>
    <div class="footer-r"><span>END · OF · THIS · CHAPTER</span></div>
  </div>
</div>
</body>
</html>
