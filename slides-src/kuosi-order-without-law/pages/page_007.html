<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第二章 · 读后思</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --coffee: #795548;
  --coffee-deep: #4E342E;
  --coffee-light: #A1887F;
  --moss: #A3B18A;
  --moss-deep: #7A8B60;
  --moss-light: #C5D0A8;
  --cream: #F4F1E8;
  --cream-deep: #E8E2D2;
  --text-main: #3E2723;
  --text-sub: #5D4037;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--cream);
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--cream);
}

.bg-mountain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 38%;
  background: linear-gradient(180deg, transparent 0%, rgba(163,177,138,0.08) 40%, rgba(163,177,138,0.14) 100%);
  z-index: 0;
}

.bg-mountain-2 {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 28%;
  background: linear-gradient(180deg, transparent 0%, rgba(121,85,72,0.05) 50%, rgba(121,85,72,0.09) 100%);
  z-index: 0;
}

.bg-mist {
  position: absolute;
  top: 25%;
  left: 0;
  width: 100%;
  height: 12%;
  background: linear-gradient(90deg, transparent 0%, rgba(244,241,232,0.9) 30%, rgba(244,241,232,0.7) 70%, transparent 100%);
  z-index: 0;
}

.bg-vline {
  position: absolute;
  top: 60px;
  right: 60px;
  width: 1px;
  height: 780px;
  background: linear-gradient(180deg, transparent 0%, rgba(121,85,72,0.15) 20%, rgba(121,85,72,0.15) 80%, transparent 100%);
  z-index: 0;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 70px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(121,85,72,0.18);
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.top-left-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--coffee);
}

.top-left-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--coffee-light);
  letter-spacing: 6px;
}

.top-right-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--coffee-light);
  letter-spacing: 4px;
}

.main-area {
  flex: 1;
  display: flex;
  align-items: stretch;
  padding-top: 30px;
  gap: 40px;
}

.left-section {
  width: 56%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.num-row {
  display: flex;
  align-items: flex-start;
  gap: 30px;
}

.bignum {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 280px;
  line-height: 0.85;
  color: var(--coffee);
  letter-spacing: -8px;
  position: relative;
}

.bignum::after {
  content: '';
  position: absolute;
  bottom: 20px;
  left: 10px;
  width: 120px;
  height: 3px;
  background: var(--moss);
}

.chapter-label {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 40px;
}

.chapter-tag {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--moss-deep);
  letter-spacing: 8px;
}

.chapter-divider {
  width: 60px;
  height: 2px;
  background: var(--coffee);
}

.chapter-title {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  font-size: 72px;
  color: var(--coffee-deep);
  letter-spacing: 6px;
  line-height: 1.1;
}

.chapter-subtitle {
  margin-top: 18px;
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  font-size: 26px;
  color: var(--text-sub);
  letter-spacing: 3px;
  line-height: 1.4;
}

.subtitle-accent {
  color: var(--moss-deep);
  font-weight: 600;
}

.right-section {
  width: 44%;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: flex-start;
  position: relative;
}

.brush-seal {
  width: 260px;
  height: 260px;
  border: 2px solid var(--coffee);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(135deg, rgba(244,241,232,1) 0%, rgba(232,226,210,0.6) 100%);
}

.brush-seal::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(121,85,72,0.25);
  border-radius: 4px;
}

.brush-char {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 160px;
  color: var(--coffee-deep);
  line-height: 1;
  position: relative;
}

.brush-char::after {
  content: '';
  position: absolute;
  bottom: -8px;
  right: -10px;
  width: 40px;
  height: 40px;
  background: rgba(163,177,138,0.25);
  border-radius: 50%;
  filter: blur(8px);
}

.brush-caption {
  margin-top: 14px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--coffee-light);
  letter-spacing: 8px;
  text-align: center;
  width: 260px;
}

.narrative-block {
  margin-top: 35px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.narr-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.45);
  border-left: 3px solid var(--moss);
  border-radius: 2px;
}

.narr-index {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--coffee);
  min-width: 28px;
  line-height: 1.5;
}

.narr-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.narr-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--moss-deep);
  letter-spacing: 4px;
}

.narr-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-sub);
  line-height: 1.6;
}

.bottom-bar {
  padding-top: 18px;
  border-top: 1px solid rgba(121,85,72,0.15);
  display: flex;
  align-items: center;
  gap: 18px;
}

.bottom-quote-mark {
  font-family: 'Noto Serif SC', serif;
  font-size: 48px;
  color: var(--coffee-light);
  line-height: 0.8;
  font-weight: 700;
}

.bottom-text {
  flex: 1;
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 400;
  color: var(--text-sub);
  line-height: 1.7;
  letter-spacing: 1px;
}

.bottom-text .highlight {
  color: var(--coffee-deep);
  font-weight: 600;
}

.bottom-text .highlight-moss {
  color: var(--moss-deep);
  font-weight: 600;
}

.bottom-page {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--coffee-light);
  letter-spacing: 3px;
  white-space: nowrap;
}

.left-accent {
  margin-top: 30px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.accent-line {
  width: 80px;
  height: 1px;
  background: var(--coffee-light);
}

.accent-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: var(--coffee-light);
  letter-spacing: 6px;
}

.deco-circle {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(121,85,72,0.08);
  z-index: 0;
  top: -60px;
  left: -80px;
}

.deco-circle-2 {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 1px solid rgba(163,177,138,0.15);
  z-index: 0;
  bottom: 100px;
  left: 60px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-mountain"></div>
    <div class="bg-mountain-2"></div>
    <div class="bg-mist"></div>
  </div>
  <div class="deco-circle"></div>
  <div class="deco-circle-2"></div>

  <div id="ct">
    <div class="top-bar">
      <div class="top-left">
        <div class="top-left-dot"></div>
        <span class="top-left-text">CHAPTER TRANSITION</span>
      </div>
      <span class="top-right-text">第 七 页 · 章 节 过 渡</span>
    </div>

    <div class="main-area">
      <div class="left-section">
        <div class="num-row">
          <div class="bignum">02</div>
          <div class="chapter-label">
            <span class="chapter-tag">CHAPTER TWO</span>
            <div class="chapter-divider"></div>
            <div class="chapter-title">第二章<br>读后思</div>
            <div class="chapter-subtitle">
              <span class="subtitle-accent">适兕的开源布道</span><br>
              — 让哲学落地
            </div>
          </div>
        </div>

        <div class="left-accent">
          <div class="accent-line"></div>
          <span class="accent-text">FROM THOUGHT TO PRACTICE</span>
        </div>
      </div>

      <div class="right-section">
        <div class="brush-seal">
          <span class="brush-char">思</span>
        </div>
        <div class="brush-caption">禅 意 · 静 思</div>

        <div class="narrative-block">
          <div class="narr-item">
            <span class="narr-index">壹</span>
            <div class="narr-content">
              <span class="narr-label">转 场</span>
              <span class="narr-text">从哲学思辨进入适兕个人的布道实践与阅读方法论</span>
            </div>
          </div>
          <div class="narr-item">
            <span class="narr-index">贰</span>
            <div class="narr-content">
              <span class="narr-label">核 心 命 题</span>
              <span class="narr-text">如何让"无律之序"的理念走出书斋，影响真实的社区与个人</span>
            </div>
          </div>
          <div class="narr-item">
            <span class="narr-index">叁</span>
            <div class="narr-content">
              <span class="narr-label">分 享 路 径</span>
              <span class="narr-text">从《开源之道》杂志到线下活动，从文字到行动</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <span class="bottom-quote-mark">"</span>
      <div class="bottom-text">
        本章从<span class="highlight">思想进入行动</span>——适兕作为<span class="highlight">开源之道的推动者</span>，如何将<span class="highlight-moss">"无律之序"</span>的哲学理念转化为具体的社区建设、人才培养与知识传播实践，是本文值得借鉴的<span class="highlight">第二层价值</span>。
      </div>
      <span class="bottom-page">P · 07</span>
    </div>
  </div>
</div>
</body>
</html>
