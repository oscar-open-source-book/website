<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>共读共成长</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D2137;
  --gold: #C08B3E;
  --gray: #9CA3AF;
  --light-bg: #FAF8F5;
  --light-card: #FFFFFF;
  --light-line: #E5E1DA;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--navy);
  background: var(--light-bg);
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--light-bg);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 120px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* corner decorations */
.corner {
  position: absolute;
  width: 50px;
  height: 50px;
  z-index: 2;
  opacity: 0.6;
}
.corner-tl { top: 36px; left: 36px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-tr { top: 36px; right: 36px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.corner-bl { bottom: 36px; left: 36px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-br { bottom: 36px; right: 36px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

/* header ornament */
.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 6px;
  margin-bottom: 18px;
}
.ornament-line {
  width: 80px;
  height: 1px;
  background: var(--gold);
}
.ornament-dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  transform: rotate(45deg);
}

/* title */
.main-title {
  font-size: 82px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 12px;
  text-align: center;
  line-height: 1.1;
}

.sub-title {
  font-size: 22px;
  font-weight: 400;
  color: var(--gray);
  letter-spacing: 6px;
  margin-top: 16px;
  text-align: center;
}

.divider-title {
  width: 60px;
  height: 2px;
  background: var(--gold);
  margin: 22px auto 20px;
}

/* narrative */
.narrative {
  font-size: 17px;
  font-weight: 300;
  color: var(--navy);
  line-height: 2.0;
  text-align: center;
  max-width: 1080px;
  letter-spacing: 1px;
}

/* cards */
.cards-row {
  display: flex;
  gap: 28px;
  margin-top: 30px;
  width: 100%;
  justify-content: center;
}

.card {
  width: 380px;
  background: var(--light-card);
  border: 1px solid var(--light-line);
  border-top: 2px solid var(--gold);
  padding: 22px 26px 24px;
  position: relative;
}

.card-number {
  font-size: 12px;
  color: var(--gold);
  font-weight: 600;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.card-title {
  font-size: 19px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.card-line {
  width: 32px;
  height: 1px;
  background: var(--gray);
  margin-bottom: 10px;
}

.card-text {
  font-size: 13.5px;
  font-weight: 300;
  color: var(--navy);
  line-height: 1.75;
  letter-spacing: 0.5px;
}

/* data tags row */
.tags-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 24px;
  font-size: 12px;
  color: var(--gray);
  letter-spacing: 2px;
  font-weight: 400;
}

.tag-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tag-dot {
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
}

.tag-sep {
  width: 1px;
  height: 14px;
  background: var(--gold);
  opacity: 0.7;
}

.tag-value {
  color: var(--navy);
  font-weight: 500;
}

/* bottom line */
.bottom-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22px;
  height: 1px;
  background: var(--gold);
  z-index: 1;
}

.bottom-label {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 4px;
  background: var(--light-bg);
  padding: 0 16px;
  z-index: 2;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="bottom-line"></div>
  <div class="bottom-label">SUI &nbsp;·&nbsp; OPEN SOURCE READING</div>

  <div id="ct">
    <div class="ornament">
      <span class="ornament-line"></span>
      <span class="ornament-dot"></span>
      <span class="ornament-line"></span>
    </div>

    <h1 class="main-title">共读共成长</h1>
    <p class="sub-title">感谢阅读 · 期待交流</p>

    <div class="divider-title"></div>

    <p class="narrative">
      开源不止于代码，更在于人的联结。<br>
      适兕希望这份书单成为你与开源世界之间的第一座桥梁，<br>
      期待在未来的共读活动中与你相遇。
    </p>

    <div class="cards-row">
      <div class="card">
        <div class="card-number">— 01 —</div>
        <div class="card-title">行动倡议</div>
        <div class="card-line"></div>
        <div class="card-text">从今天起选择一本书单中的书，开始你的开源阅读之旅。</div>
      </div>
      <div class="card">
        <div class="card-number">— 02 —</div>
        <div class="card-title">交流渠道</div>
        <div class="card-line"></div>
        <div class="card-text">关注「开源之道」公众号，参与适兕的书单讨论与月度共读活动。</div>
      </div>
      <div class="card">
        <div class="card-number">— 03 —</div>
        <div class="card-title">持续更新</div>
        <div class="card-line"></div>
        <div class="card-text">书单将每季度更新，欢迎读者推荐好书并分享阅读心得。</div>
      </div>
    </div>

    <div class="tags-row">
      <span class="tag-item">
        <span class="tag-dot"></span>
        <span>公众号</span><span style="color:var(--navy);font-weight:500;">开源之道</span>
      </span>
      <span class="tag-sep"></span>
      <span class="tag-item">
        <span class="tag-dot"></span>
        <span>更新频率</span><span style="color:var(--navy);font-weight:500;">每季度</span>
      </span>
      <span class="tag-sep"></span>
      <span class="tag-item">
        <span class="tag-dot"></span>
        <span>下一期预告</span><span style="color:var(--navy);font-weight:500;">2023Q2 书单</span>
      </span>
    </div>
  </div>
</div>
</body>
</html>
