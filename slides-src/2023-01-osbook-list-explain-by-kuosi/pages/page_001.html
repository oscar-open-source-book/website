

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之书记录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --navy: #0D2137;
  --gold: #C08B3E;
  --gray: #9CA3AF;
  --light: #F8F7F4;
  --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #F8F7F4;
  color: var(--navy);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--light);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #F8F7F4 0%, #F1EDE6 100%);
}

#bg::before {
  content: '';
  position: absolute;
  top: -200px;
  right: -200px;
  width: 600px;
  height: 600px;
  border: 1px solid var(--gold);
  opacity: 0.15;
  border-radius: 50%;
}

#bg::after {
  content: '';
  position: absolute;
  bottom: -300px;
  left: -150px;
  width: 700px;
  height: 700px;
  border: 1px solid var(--navy);
  opacity: 0.06;
  border-radius: 50%;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 80px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top area */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
}

.brand-tag {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--navy);
  font-weight: 500;
}

.brand-dot {
  width: 8px;
  height: 8px;
  background: var(--gold);
  border-radius: 50%;
}

.top-meta {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--gray);
  font-weight: 400;
}

/* Decorative frame lines */
.frame-corner-tl {
  position: absolute;
  top: 40px;
  left: 40px;
  width: 40px;
  height: 40px;
  border-top: 1.5px solid var(--gold);
  border-left: 1.5px solid var(--gold);
  z-index: 2;
}

.frame-corner-tr {
  position: absolute;
  top: 40px;
  right: 40px;
  width: 40px;
  height: 40px;
  border-top: 1.5px solid var(--gold);
  border-right: 1.5px solid var(--gold);
  z-index: 2;
}

.frame-corner-bl {
  position: absolute;
  bottom: 40px;
  left: 40px;
  width: 40px;
  height: 40px;
  border-bottom: 1.5px solid var(--gold);
  border-left: 1.5px solid var(--gold);
  z-index: 2;
}

.frame-corner-br {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 40px;
  height: 40px;
  border-bottom: 1.5px solid var(--gold);
  border-right: 1.5px solid var(--gold);
  z-index: 2;
}

/* Center hero */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-top: 10px;
}

.eyebrow {
  font-size: 13px;
  letter-spacing: 8px;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 16px;
}

.gold-divider-top {
  width: 200px;
  height: 1px;
  background: var(--gold);
  margin-bottom: 24px;
  position: relative;
}

.gold-divider-top::before {
  content: '';
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;
}

.gold-divider-top::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 9px;
  height: 9px;
  border: 1px solid var(--gold);
  border-radius: 50%;
}

.main-title {
  font-size: 96px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 12px;
  line-height: 1.1;
  text-align: center;
  margin-bottom: 4px;
}

.title-under {
  font-size: 18px;
  letter-spacing: 16px;
  color: var(--navy);
  font-weight: 300;
  margin-top: 14px;
  opacity: 0.6;
}

.gold-divider-bottom {
  width: 200px;
  height: 1px;
  background: var(--gold);
  margin-top: 24px;
  margin-bottom: 20px;
  position: relative;
}

.gold-divider-bottom::before {
  content: '';
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;
}

.gold-divider-bottom::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 9px;
  height: 9px;
  border: 1px solid var(--gold);
  border-radius: 50%;
}

.subtitle {
  font-size: 22px;
  letter-spacing: 6px;
  color: var(--navy);
  font-weight: 400;
  text-align: center;
}

.subtitle-accent {
  color: var(--gold);
  font-weight: 500;
}

/* Side decorations */
.side-text-left {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--gray);
  white-space: nowrap;
  transform-origin: center;
}

.side-text-right {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--gray);
  white-space: nowrap;
  transform-origin: center;
}

/* Card area */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  margin-top: 24px;
}

.card {
  background: var(--white);
  border: 1px solid rgba(13, 33, 55, 0.08);
  padding: 20px 22px;
  position: relative;
  transition: all 0.3s;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 40px;
  height: 2px;
  background: var(--gold);
}

.card-num {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 6px;
}

.card-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.card-desc {
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--gray);
  font-weight: 300;
  letter-spacing: 0.5px;
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(13, 33, 55, 0.08);
}

.footer-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  letter-spacing: 1px;
  color: var(--gray);
}

.footer-dot {
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
  display: inline-block;
}

.footer-label {
  font-weight: 500;
  color: var(--navy);
}

/* Navy accent bar */
.navy-bar {
  position: absolute;
  left: 0;
  top: 0;
  width: 6px;
  height: 100%;
  background: var(--navy);
  z-index: 2;
}

.navy-bar-right {
  position: absolute;
  right: 0;
  top: 0;
  width: 6px;
  height: 100%;
  background: var(--navy);
  z-index: 2;
}

/* Vertical accent lines */
.v-line-left {
  position: absolute;
  left: 60px;
  top: 100px;
  bottom: 100px;
  width: 1px;
  background: rgba(13, 33, 55, 0.08);
  z-index: 1;
}

.v-line-right {
  position: absolute;
  right: 60px;
  top: 100px;
  bottom: 100px;
  width: 1px;
  background: rgba(13, 33, 55, 0.08);
  z-index: 1;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>

  <div class="navy-bar"></div>
  <div class="navy-bar-right"></div>

  <div class="frame-corner-tl"></div>
  <div class="frame-corner-tr"></div>
  <div class="frame-corner-bl"></div>
  <div class="frame-corner-br"></div>

  <div class="v-line-left"></div>
  <div class="v-line-right"></div>

  <div id="ct">

    <div class="top-bar">
      <div class="brand-tag">
        <span class="brand-dot"></span>
        <span>OPEN SOURCE · READING</span>
      </div>
      <div class="top-meta">
        年度书单导读 · ANNUAL BOOK GUIDE 2023
      </div>
    </div>

    <div class="hero">
      <div class="eyebrow">SUANU'S OPEN SOURCE DIARY</div>

      <div class="gold-divider-top"></div>

      <h1 class="main-title">开源之书记录</h1>

      <div class="title-under">RECORD · OF · OPEN · SOURCE</div>

      <div class="gold-divider-bottom"></div>

      <div class="subtitle">
        <span class="subtitle-accent">2023</span> 年开源布道 · 适兕书单导读
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-num">— 01 —</div>
        <div class="card-title">主题聚焦</div>
        <div class="card-desc">以开源思想、工程实践与社区文化为主线，回顾年度核心读物</div>
      </div>
      <div class="card">
        <div class="card-num">— 02 —</div>
        <div class="card-title">适兕视角</div>
        <div class="card-desc">开源之道主笔从一线实践出发，提炼每本书最值得带走的理念</div>
      </div>
      <div class="card">
        <div class="card-num">— 03 —</div>
        <div class="card-title">共读共建</div>
        <div class="card-desc">邀请读者跟随书单重走开源认知之旅，交流心得与延伸阅读</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-item">
        <span class="footer-dot"></span>
        <span class="footer-label">书单主题：</span>
        <span>开源思想与实践</span>
      </div>
      <div class="footer-item">
        <span class="footer-dot"></span>
        <span class="footer-label">整理人：</span>
        <span>开源之道·适兕</span>
      </div>
      <div class="footer-item">
        <span class="footer-dot"></span>
        <span class="footer-label">整理时间：</span>
        <span>2023年1月</span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
