

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开源之道·阅读记录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

:root {
  --primary: #0D2137;
  --gold: #C9A227;
  --cream: #F4F1EA;
  --text-muted: #6B5A3A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Noto Serif SC', 'Source Serif Pro', 'Georgia', serif;
  color: var(--primary);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: #F4F1EA;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #F4F1EA 0%, #EAE3D2 100%);
}

#bg::before {
  content: '';
  position: absolute;
  top: 40px;
  left: 40px;
  width: 44px;
  height: 44px;
  border-top: 1px solid var(--gold);
  border-left: 1px solid var(--gold);
  opacity: 0.55;
}

#bg::after {
  content: '';
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 44px;
  height: 44px;
  border-bottom: 1px solid var(--gold);
  border-right: 1px solid var(--gold);
  opacity: 0.55;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
}

.content {
  display: flex;
  height: 100%;
  gap: 60px;
}

.left {
  width: 620px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.right {
  width: 800px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.title-block {
  padding-top: 24px;
}

.deco-line {
  width: 84px;
  height: 3px;
  background: var(--gold);
  margin-bottom: 40px;
}

h1 {
  font-family: 'Noto Serif SC', 'Georgia', serif;
  font-size: 64px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.15;
  letter-spacing: 2px;
  margin-bottom: 26px;
}

.subtitle {
  font-family: 'Noto Serif SC', 'Georgia', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
  letter-spacing: 1.5px;
}

.cards {
  margin-top: 64px;
}

.card {
  padding: 12px 0;
}

.card-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 6px;
  letter-spacing: 3px;
}

.card-desc {
  font-family: 'Source Serif Pro', 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.7;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 10px 0;
}

.divider-line {
  width: 36px;
  height: 1px;
  background: var(--gold);
}

.divider-dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
}

.signature {
  margin-top: auto;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: 4px;
  padding-bottom: 16px;
}

.hero-img {
  width: 800px;
  height: 447px;
  display: block;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="content">
      <div class="left">
        <div class="title-block">
          <div class="deco-line"></div>
          <h1>开源之道·阅读记录</h1>
          <div class="subtitle">适兕的开源布道与书籍分享 DR2 专题</div>
        </div>

        <div class="cards">
          <div class="card">
            <div class="card-title">记录主题</div>
            <div class="card-desc">围绕开源运动的历史、理念与实践梳理关键阅读笔记</div>
          </div>
          <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
          </div>
          <div class="card">
            <div class="card-title">布道视角</div>
            <div class="card-desc">以开源布道者身份提炼书籍核心思想与方法论</div>
          </div>
          <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
          </div>
          <div class="card">
            <div class="card-title">分享目标</div>
            <div class="card-desc">帮助读者理解开源为何重要以及如何真正参与</div>
          </div>
        </div>

        <div class="signature">适兕 · DR2 专题 · 阅读笔记</div>
      </div>

      <div class="right">
        <img src="../images/page_001_hero.png" class="hero-img" alt="金色边缘泛光的打开书籍，书页舒展成流动代码线条意象">
      </div>
    </div>
  </div>
</div>
</body>
</html>
