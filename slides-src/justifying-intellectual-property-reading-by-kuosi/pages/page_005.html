<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>深度解读——拆解洛克劳动论与人格理论的争鸣</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --klein: #002FA7;
  --bright-blue: #4FC3F7;
  --deep-bg: #1A1A2E;
  --deep-bg-2: #0F0F1E;
  --text-main: #E8E8F0;
  --text-dim: #9090B0;
  --glow-blue: rgba(79, 195, 247, 0.35);
  --glow-klein: rgba(0, 47, 167, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'PingFang SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--deep-bg);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(135deg, #0A0A18 0%, #1A1A2E 35%, #0D1B3A 60%, #0A0A18 100%);
  overflow: hidden;
}

#bg .light-band {
  position: absolute;
  width: 2200px;
  height: 120px;
  top: -40px;
  left: -300px;
  background: linear-gradient(90deg, transparent 0%, rgba(79,195,247,0.06) 30%, rgba(79,195,247,0.12) 50%, rgba(79,195,247,0.06) 70%, transparent 100%);
  transform: rotate(-25deg);
  filter: blur(2px);
}

#bg .light-band.b2 {
  top: 200px;
  height: 80px;
  background: linear-gradient(90deg, transparent 0%, rgba(0,47,167,0.12) 30%, rgba(79,195,247,0.10) 50%, rgba(0,47,167,0.08) 70%, transparent 100%);
  transform: rotate(-25deg);
}

#bg .light-band.b3 {
  top: 380px;
  height: 200px;
  background: linear-gradient(90deg, transparent 0%, rgba(79,195,247,0.04) 30%, rgba(0,47,167,0.10) 50%, rgba(79,195,247,0.04) 70%, transparent 100%);
  transform: rotate(-25deg);
  filter: blur(4px);
}

#bg .light-band.b4 {
  top: 560px;
  height: 100px;
  background: linear-gradient(90deg, transparent 0%, rgba(0,47,167,0.10) 30%, rgba(79,195,247,0.08) 50%, rgba(0,47,167,0.06) 70%, transparent 100%);
  transform: rotate(-25deg);
}

#bg .light-band.b5 {
  top: 720px;
  height: 140px;
  background: linear-gradient(90deg, transparent 0%, rgba(79,195,247,0.05) 30%, rgba(0,47,167,0.08) 50%, rgba(79,195,247,0.03) 70%, transparent 100%);
  transform: rotate(-25deg);
}

#bg .grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(79,195,247,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,195,247,0.03) 1px, transparent 1px);
  background-size: 80px 80px;
}

#bg .corner-glow-tl {
  position: absolute;
  top: -200px;
  left: -200px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(79,195,247,0.15) 0%, transparent 65%);
}

#bg .corner-glow-br {
  position: absolute;
  bottom: -250px;
  right: -200px;
  width: 550px;
  height: 550px;
  background: radial-gradient(circle, rgba(0,47,167,0.20) 0%, transparent 65%);
}

#bg .vline {
  position: absolute;
  width: 1px;
  height: 900px;
  background: linear-gradient(180deg, transparent 0%, rgba(79,195,247,0.10) 30%, rgba(79,195,247,0.10) 70%, transparent 100%);
}

#bg .vline.v1 { left: 460px; }
#bg .vline.v2 { left: 1140px; }

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top section */
.top-section {
  display: flex;
  align-items: flex-start;
  gap: 40px;
  margin-top: 10px;
}

.chapter-num-wrap {
  position: relative;
  width: 340px;
  flex-shrink: 0;
}

.chapter-label {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--bright-blue);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.chapter-num {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 200px;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 2px var(--bright-blue);
  text-stroke: 2px var(--bright-blue);
  position: relative;
  letter-spacing: -4px;
  text-shadow: 0 0 30px rgba(79,195,247,0.3);
}

.chapter-num::after {
  content: '02';
  position: absolute;
  left: 4px;
  top: 4px;
  color: var(--bright-blue);
  opacity: 0.12;
  -webkit-text-stroke: 0;
}

.num-underline {
  width: 120px;
  height: 3px;
  background: var(--bright-blue);
  margin-top: 12px;
  box-shadow: 0 0 12px var(--glow-blue);
}

.title-block {
  flex: 1;
  padding-top: 18px;
  padding-left: 20px;
  border-left: 1px solid rgba(79,195,247,0.25);
}

.main-title {
  font-family: 'Inter', 'PingFang SC', sans-serif;
  font-weight: 900;
  font-size: 88px;
  line-height: 1.05;
  color: var(--text-main);
  letter-spacing: 4px;
}

.main-title .accent {
  color: var(--bright-blue);
  text-shadow: 0 0 20px rgba(79,195,247,0.4);
}

.subtitle {
  font-family: 'PingFang SC', 'Source Han Sans SC', sans-serif;
  font-weight: 400;
  font-size: 26px;
  line-height: 1.5;
  color: var(--bright-blue);
  margin-top: 20px;
  letter-spacing: 2px;
}

.subtitle-underline {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
}

.subtitle-underline .bar {
  width: 60px;
  height: 2px;
  background: var(--bright-blue);
}

.subtitle-underline .bar.short {
  width: 20px;
  background: rgba(79,195,247,0.5);
}

.subtitle-underline .tag {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--text-dim);
}

/* Middle points section */
.points-section {
  margin-top: 30px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.point-card {
  position: relative;
  background: linear-gradient(135deg, rgba(0,47,167,0.15) 0%, rgba(26,26,46,0.6) 100%);
  border: 1px solid rgba(79,195,247,0.20);
  border-left: 3px solid var(--bright-blue);
  padding: 20px 24px;
}

.point-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 40px;
  height: 40px;
  border-top: 1px solid var(--bright-blue);
  border-right: 1px solid var(--bright-blue);
  opacity: 0.5;
}

.point-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.point-index {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--bright-blue);
  background: rgba(79,195,247,0.10);
  border: 1px solid rgba(79,195,247,0.30);
  padding: 3px 8px;
}

.point-title {
  font-family: 'PingFang SC', 'Source Han Sans SC', sans-serif;
  font-weight: 700;
  font-size: 19px;
  color: var(--text-main);
  letter-spacing: 1px;
}

.point-desc {
  font-family: 'Roboto Mono', 'Source Han Sans SC', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

/* Narrative section */
.narrative-section {
  margin-top: 22px;
  position: relative;
  padding: 16px 28px;
  border-top: 1px solid rgba(79,195,247,0.15);
  border-bottom: 1px solid rgba(79,195,247,0.15);
  background: rgba(0,47,167,0.06);
}

.narrative-section::before {
  content: '“';
  position: absolute;
  top: -10px;
  left: 16px;
  font-family: 'Inter', serif;
  font-size: 50px;
  color: var(--bright-blue);
  opacity: 0.4;
  line-height: 1;
}

.narrative-text {
  font-family: 'PingFang SC', 'Source Han Sans SC', sans-serif;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-main);
  letter-spacing: 1px;
  padding-left: 30px;
}

.narrative-text .hl {
  color: var(--bright-blue);
  font-weight: 500;
}

.narrative-text .hl2 {
  color: #FFFFFF;
  font-weight: 700;
}

/* Bottom bar */
.bottom-bar {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border: 1px solid rgba(79,195,247,0.20);
  background: linear-gradient(90deg, rgba(0,47,167,0.12) 0%, rgba(26,26,46,0.4) 100%);
}

.data-tag {
  display: flex;
  align-items: center;
  gap: 14px;
}

.data-tag .tag-dot {
  width: 8px;
  height: 8px;
  background: var(--bright-blue);
  box-shadow: 0 0 8px var(--glow-blue);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.data-tag .tag-text {
  font-family: 'Roboto Mono', 'Source Han Sans SC', monospace;
  font-size: 13px;
  color: var(--text-main);
  letter-spacing: 1.5px;
}

.data-tag .tag-text .label {
  color: var(--bright-blue);
  margin-right: 8px;
}

.data-tag .tag-text .sep {
  color: rgba(79,195,247,0.4);
  margin: 0 8px;
}

.bottom-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
}

.bottom-meta .meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.bottom-meta .meta-dot {
  width: 4px;
  height: 4px;
  background: var(--bright-blue);
  opacity: 0.6;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="grid-overlay"></div>
    <div class="corner-glow-tl"></div>
    <div class="corner-glow-br"></div>
    <div class="light-band b1"></div>
    <div class="light-band b2"></div>
    <div class="light-band b3"></div>
    <div class="light-band b4"></div>
    <div class="light-band b5"></div>
    <div class="vline v1"></div>
    <div class="vline v2"></div>
  </div>

  <div id="ct">
    <div class="top-section">
      <div class="chapter-num-wrap">
        <div class="chapter-label"><span>SECTION / 章节</span></div>
        <div class="chapter-num"><span>02</span></div>
        <div class="num-underline"></div>
      </div>
      <div class="title-block">
        <h1 class="main-title"><span>深度</span><span class="accent">解读</span></h1>
        <div class="subtitle"><span>拆解洛克劳动论与人格理论的争鸣</span></div>
        <div class="subtitle-underline">
          <div class="bar"></div>
          <div class="bar short"></div>
          <div class="bar short"></div>
          <div class="tag"><span>PHILOSOPHY · DEBATE</span></div>
        </div>
      </div>
    </div>

    <div class="points-section">
      <div class="point-card">
        <div class="point-header">
          <div class="point-index"><span>01</span></div>
          <div class="point-title"><span>本节主题</span></div>
        </div>
        <div class="point-desc"><span>聚焦自然权利论与人格权论的内部逻辑，系统呈现作者在两条理论路径之间的批判路径与论证推进。</span></div>
      </div>
      <div class="point-card">
        <div class="point-header">
          <div class="point-index"><span>02</span></div>
          <div class="point-title"><span>讨论焦点</span></div>
        </div>
        <div class="point-desc"><span>为何在知识产权语境下，传统财产哲学面临"智力"与"物"的本质区别这一根本难题，构成理论困境的核心。</span></div>
      </div>
    </div>

    <div class="narrative-section">
      <div class="narrative-text">
        <span>进入本书最富<span class="hl2">哲学张力</span>的部分——作者如何拆解<span class="hl">自然权利</span>与<span class="hl">人格权</span>两条路径，又为何最终未能给出令人满意的答案。适兕将带领读者感受这一<span class="hl2">思想交锋</span>的深邃与激烈。</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="data-tag">
        <div class="tag-dot"></div>
        <div class="tag-text">
          <span class="label">关键章节</span>
          <span>Ch.3–5</span>
          <span class="sep">|</span>
          <span>涵盖劳动论 · 人格论 · 综合评估</span>
        </div>
      </div>
      <div class="bottom-meta">
        <div class="meta-item"><div class="meta-dot"></div><span>PAGE 05 / 12</span></div>
        <div class="meta-item"><div class="meta-dot"></div><span>2024</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
