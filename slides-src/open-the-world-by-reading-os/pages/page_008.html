

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>布道与行动</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --brown: #795548;
  --brown-light: #A98477;
  --brown-dark: #4E342E;
  --blue-gray: #6B8BA4;
  --blue-gray-light: #9FB4C4;
  --cream: #F7F3EE;
  --cream-warm: #EFE7DE;
  --text-main: #3E2A23;
  --text-sub: #7A6458;
  --line: #D9CFC4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
  color: var(--text-main);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  font-family: 'Noto Sans SC', sans-serif;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #D9C8B4 0%, #EBDFD0 35%, #F2EADD 60%, #F7F3EE 100%);
}

#bg::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 20% 30%, rgba(121, 85, 72, 0.06) 0%, transparent 55%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 70px 90px 60px 90px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* ---------- 顶部区域 ---------- */
.top-zone {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.chapter-tag {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  letter-spacing: 6px;
  color: var(--blue-gray);
  font-weight: 400;
  padding-top: 4px;
}

.page-meta {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--text-sub);
  text-align: right;
  font-weight: 300;
  padding-top: 6px;
}

.page-meta .num {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--brown);
  font-weight: 600;
  margin-left: 8px;
}

/* ---------- 标题区 ---------- */
.title-zone {
  padding: 42px 0 34px 0;
  position: relative;
}

.title-row {
  display: flex;
  align-items: flex-end;
  gap: 36px;
}

.title-main {
  font-family: 'Noto Serif SC', serif;
  font-size: 84px;
  font-weight: 700;
  color: var(--brown);
  letter-spacing: 12px;
  line-height: 1.1;
}

.title-accent-bar {
  width: 6px;
  height: 68px;
  background: var(--blue-gray);
  margin-bottom: 8px;
  flex-shrink: 0;
}

.subtitle-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 22px;
  padding-left: 42px;
}

.subtitle-line {
  flex: 0 0 80px;
  height: 1px;
  background: var(--blue-gray);
  opacity: 0.6;
}

.subtitle-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--text-sub);
  letter-spacing: 3px;
}

/* ---------- 中部寄语区 ---------- */
.narrative-zone {
  margin-top: 26px;
  padding: 28px 60px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 30px;
}

.narrative-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: 72px;
  color: var(--brown-light);
  line-height: 0.6;
  font-weight: 600;
  opacity: 0.5;
  flex-shrink: 0;
}

.narrative-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  line-height: 1.9;
  color: var(--text-main);
  font-weight: 400;
  letter-spacing: 2px;
}

.narrative-text .em {
  color: var(--brown);
  font-weight: 600;
}

.narrative-right-mark {
  font-family: 'Noto Serif SC', serif;
  font-size: 72px;
  color: var(--brown-light);
  line-height: 0.6;
  font-weight: 600;
  opacity: 0.5;
  flex-shrink: 0;
}

/* ---------- 三栏区 ---------- */
.columns-zone {
  margin-top: auto;
  padding-top: 34px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}

.col {
  padding: 28px 40px 0 40px;
  position: relative;
  border-left: 1px solid var(--line);
}

.col:first-child {
  border-left: none;
  padding-left: 0;
}

.col:last-child {
  padding-right: 0;
}

.col-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.col-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 30px;
  font-weight: 400;
  color: var(--blue-gray);
  letter-spacing: 2px;
  line-height: 1;
}

.col-rule {
  flex: 1;
  height: 1px;
  background: var(--line);
}

.col-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--brown);
  letter-spacing: 4px;
  margin-bottom: 14px;
}

.col-body {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  line-height: 1.85;
  color: var(--text-sub);
  font-weight: 300;
  letter-spacing: 1px;
}

/* ---------- 底部收束 ---------- */
.footer-line {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--text-sub);
  letter-spacing: 6px;
  font-weight: 400;
}

.footer-dots {
  display: flex;
  align-items: center;
  gap: 10px;
}

.footer-dots .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line);
}

.footer-dots .dot.active {
  background: var(--brown);
}

.footer-side {
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--blue-gray);
  font-weight: 300;
}

</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="top-zone">
      <div class="chapter-tag"><span>CHAPTER · 08</span></div>
      <div class="page-meta"><span>第</span><span class="num">八</span><span>章</span></div>
    </div>

    <div class="title-zone">
      <div class="title-row">
        <div class="title-accent-bar"></div>
        <div class="title-main">布道与行动</div>
      </div>
      <div class="subtitle-row">
        <div class="subtitle-line"></div>
        <div class="subtitle-text">从读者到贡献者：让开源精神在现实中生长</div>
      </div>
    </div>

    <div class="narrative-zone">
      <div class="narrative-quote">"</div>
      <div class="narrative-text">
        阅读只是起点，真正的开源精神要在<span class="em">行动中落地</span>。这一章我们将探讨如何把自己读到的、学到的，转化为对社区的贡献与对他人的启发。布道不是高谈阔论，而是<span class="em">以身作则</span>。
      </div>
      <div class="narrative-right-mark">"</div>
    </div>

    <div class="columns-zone">
      <div class="col">
        <div class="col-header">
          <span class="col-num"><span>01</span></span>
          <span class="col-rule"></span>
        </div>
        <div class="col-title"><span>为什么要布道</span></div>
        <div class="col-body"><span>开源需要持续的新人加入，布道是扩大生态的必要途径。</span></div>
      </div>
      <div class="col">
        <div class="col-header">
          <span class="col-num"><span>02</span></span>
          <span class="col-rule"></span>
        </div>
        <div class="col-title"><span>本节的重点</span></div>
        <div class="col-body"><span>分享如何从阅读走向参与、从参与到贡献的可操作路径。</span></div>
      </div>
      <div class="col">
        <div class="col-header">
          <span class="col-num"><span>03</span></span>
          <span class="col-rule"></span>
        </div>
        <div class="col-title"><span>与你相关</span></div>
        <div class="col-body"><span>无论你是开发者、设计师还是写作者，都能找到参与开源的方式。</span></div>
      </div>
    </div>

    <div class="footer-line">
      <div class="footer-text"><span>走出书房，走向更广阔的开源世界</span></div>
      <div class="footer-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>
      <div class="footer-side"><span>PROLEGOMENA · 08 / 08</span></div>
    </div>

  </div>
</div>
</body>
</html>
