

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>书单精选</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{
  --brown:#795548;
  --brown-deep:#5D3F35;
  --brown-mid:#8E6A5B;
  --brown-light:#A88574;
  --blue:#6B8BA4;
  --blue-deep:#4F6E87;
  --cream:#F7F3EE;
  --cream-2:#F1EBE3;
  --cream-3:#EDE6DC;
  --ink:#3A2A22;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;}
body{font-family:'Noto Sans SC',sans-serif;color:var(--ink);background:var(--cream);}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--cream);}
#bg{position:absolute;inset:0;z-index:0;background:var(--cream);}
#ct{position:absolute;inset:0;z-index:1;padding:56px 90px 48px 90px;display:flex;flex-direction:column;}

/* 顶部分隔条 */
.topbar{display:flex;align-items:center;gap:22px;margin-bottom:14px;}
.topbar .ln{flex:1;height:1px;background:var(--brown-light);opacity:.55;}
.topbar .dot{width:6px;height:6px;border-radius:50%;background:var(--brown);}
.topbar .tag{font-family:'Noto Serif SC',serif;font-size:15px;letter-spacing:10px;color:var(--brown);font-weight:500;}

/* 标题区 */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:6px;}
.chapter-no{font-family:'Noto Serif SC',serif;font-size:22px;letter-spacing:8px;color:var(--blue);font-weight:400;margin-bottom:10px;}
.main-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:96px;color:var(--brown);letter-spacing:18px;line-height:1;}
.title-underline{width:120px;height:2px;background:var(--brown);margin:20px auto 18px auto;}
.sub-title{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--blue-deep);letter-spacing:4px;font-weight:400;}

/* 书脊剪影 */
.spines{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:26px auto 4px auto;}
.spine{width:38px;border-radius:2px 2px 0 0;box-shadow:inset 0 0 0 1px rgba(121,85,72,.18);}
.spine.s1{height:150px;background:var(--brown-deep);}
.spine.s2{height:128px;background:var(--brown);}
.spine.s3{height:166px;background:var(--brown-mid);}
.spine.s4{height:140px;background:var(--brown-deep);}
.spine.s5{height:152px;background:var(--brown-light);}
.spine::after{content:"";display:block;height:6px;width:100%;background:rgba(255,255,255,.14);}
.shelf{width:340px;height:5px;background:var(--brown-deep);margin:0 auto;border-radius:1px;}

/* 三张卡片 */
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-top:34px;}
.card{border:1px solid #E2D6C7;background:var(--cream-2);padding:24px 24px 26px 24px;position:relative;border-radius:2px;}
.card.alt{background:var(--cream-3);}
.card-index{font-family:'Noto Serif SC',serif;font-size:34px;color:var(--brown-light);font-weight:700;line-height:1;margin-bottom:6px;}
.card-line{width:36px;height:2px;background:var(--brown);margin-bottom:12px;}
.card-title{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--brown);font-weight:700;letter-spacing:3px;margin-bottom:10px;}
.card-body{font-size:14.5px;color:var(--ink);line-height:1.85;font-weight:300;}
.card-tag{margin-top:14px;display:inline-block;font-size:12px;color:var(--blue-deep);letter-spacing:3px;border:1px solid #C8BBAE;padding:4px 10px;border-radius:1px;}

/* 叙事段 */
.narrative{margin-top:30px;display:flex;align-items:center;gap:22px;}
.narrative-bar{width:3px;height:64px;background:var(--brown);}
.narrative-text{font-size:14.5px;line-height:1.9;color:var(--ink);font-weight:300;letter-spacing:.5px;max-width:1360px;}
.narrative-text .hl{color:var(--brown);font-weight:500;}

/* 底部 */
.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;}
.closing{font-family:'Noto Serif SC',serif;font-size:24px;color:var(--brown-deep);letter-spacing:8px;font-weight:500;}
.closing .accent{color:var(--blue-deep);}
.footer-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--brown-light);letter-spacing:4px;}
.footer-meta .sq{width:8px;height:8px;background:var(--brown);}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg"></div>
<div id="ct">

<div class="topbar">
  <div class="ln"></div>
  <div class="dot"></div>
  <div class="tag">CHAPTER</div>
  <div class="dot"></div>
  <div class="ln"></div>
</div>

<div class="head">
  <div class="chapter-no">第　三　章</div>
  <h1 class="main-title"><span>书　单　精　选</span></h1>
  <div class="title-underline"></div>
  <div class="sub-title">经典必读与进阶拓展：从入门到深入</div>
</div>

<div class="spines">
  <div class="spine s1"></div>
  <div class="spine s2"></div>
  <div class="spine s3"></div>
  <div class="spine s4"></div>
  <div class="spine s5"></div>
</div>
<div class="shelf"></div>

<div class="cards">
  <div class="card">
    <div class="card-index"><span>壹</span></div>
    <div class="card-line"></div>
    <div class="card-title"><span>选书标准</span></div>
    <div class="card-body"><span>优先选有<span style="color:var(--brown);font-weight:500">历史影响力</span>、<span style="color:var(--brown);font-weight:500">思想深度</span>与<span style="color:var(--brown);font-weight:500">当代价值</span>并重的著作。</span></div>
    <div class="card-tag"><span>STANDARD</span></div>
  </div>
  <div class="card alt">
    <div class="card-index"><span>贰</span></div>
    <div class="card-line"></div>
    <div class="card-title"><span>如何阅读</span></div>
    <div class="card-body"><span>先通读<span style="color:var(--blue-deep);font-weight:500">主线著作</span>，再围绕<span style="color:var(--blue-deep);font-weight:500">专题深入</span>拓展阅读。</span></div>
    <div class="card-tag"><span>METHOD</span></div>
  </div>
  <div class="card">
    <div class="card-index"><span>叁</span></div>
    <div class="card-line"></div>
    <div class="card-title"><span>下一步安排</span></div>
    <div class="card-body"><span>后续将组织<span style="color:var(--brown);font-weight:500">线上读书会</span>，逐本精读并讨论<span style="color:var(--brown);font-weight:500">实践案例</span>。</span></div>
    <div class="card-tag"><span>NEXT STEP</span></div>
  </div>
</div>

<div class="narrative">
  <div class="narrative-bar"></div>
  <div class="narrative-text"><span>这一章是我们分享的核心——<span class="hl">一份经过筛选、可以直接照单执行的开源书单</span>。不追求最全，而追求最能帮你建立开源世界观，每本书都附有<span class="hl">推荐理由</span>与<span class="hl">阅读建议</span>，让每一次翻开都成为一次有方向的出发。</span></div>
</div>

<div class="footer">
  <div class="closing"><span>照单执行</span>　·　<span class="accent">建立开源世界观</span></div>
  <div class="footer-meta">
    <div class="sq"></div>
    <div>SELECTION　·　CHAPTER　03</div>
  </div>
</div>

</div>
</div>
</body>
</html>
