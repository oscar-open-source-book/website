

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>技术成长的阶梯 - 六年成长轨迹</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root{
  --primary:#2196F3;
  --primary-dark:#1565C0;
  --primary-light:#64B5F6;
  --primary-tint:#E3F2FD;
  --accent:#FF9800;
  --accent-dark:#F57C00;
  --bg:#ECEFF1;
  --bg-light:#F5F7F9;
  --text-main:#1A2B3F;
  --text-sec:#546E7A;
  --text-muted:#90A4AE;
  --border:rgba(33,150,243,.15);
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
  color:var(--text-main);
  background:var(--bg);
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.wrapper{
  width:1600px;
  height:900px;
  position:relative;
  overflow:hidden;
  margin:0 auto;
}

#bg{
  position:absolute;
  inset:0;
  z-index:0;
  background:linear-gradient(160deg, #F5F8FA 0%, #E8EFF5 100%);
}

.stairs{
  position:absolute;
  right:-60px;
  bottom:-40px;
  z-index:0;
  opacity:.6;
}

#ct{
  position:absolute;
  inset:0;
  z-index:1;
  padding:64px 80px;
}

/* Top row */
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.chapter-tag{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:14px;
  color:var(--text-sec);
  font-weight:500;
  letter-spacing:.15em;
}

.chapter-bar{
  width:56px;
  height:3px;
  background:linear-gradient(90deg, var(--primary), var(--primary-light));
}

.page-info{
  font-size:13px;
  color:var(--text-muted);
  letter-spacing:.25em;
  font-weight:500;
  text-align:right;
}

.page-info .num{
  color:var(--primary);
  font-size:16px;
  font-weight:700;
}

/* Header block */
.header-block{
  margin-top:70px;
  max-width:1200px;
}

.title{
  font-size:92px;
  font-weight:800;
  line-height:1.08;
  letter-spacing:-.015em;
  color:var(--text-main);
  position:relative;
  display:inline-block;
}

.title-underline{
  display:block;
  width:120px;
  height:6px;
  background:linear-gradient(90deg, var(--accent), var(--accent-dark));
  border-radius:3px;
  margin-top:26px;
}

.subtitle{
  font-size:26px;
  color:var(--primary-dark);
  font-weight:500;
  margin-top:32px;
  letter-spacing:.04em;
}

.subtitle-line{
  display:inline-block;
  width:44px;
  height:3px;
  background:var(--primary);
  vertical-align:middle;
  margin-right:20px;
  margin-bottom:5px;
  border-radius:2px;
}

/* Data row */
.data-row{
  position:absolute;
  left:80px;
  right:80px;
  bottom:130px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:44px;
}

.data-card{
  background:rgba(255,255,255,.88);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px 36px 30px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(6px);
  box-shadow:0 4px 24px rgba(33,150,243,.08);
}

.data-card::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  width:6px;
  height:100%;
  background:linear-gradient(180deg, var(--primary), var(--primary-light));
}

.data-card.accent::before{
  background:linear-gradient(180deg, var(--accent), var(--accent-dark));
}

.card-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  color:var(--text-sec);
  letter-spacing:.18em;
  font-weight:500;
  margin-bottom:14px;
}

.label-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:var(--primary);
  border-radius:50%;
}

.data-card.accent .label-dot{
  background:var(--accent);
}

.card-number-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:20px;
}

.card-number{
  font-size:100px;
  font-weight:800;
  color:var(--primary);
  line-height:.9;
  letter-spacing:-.03em;
}

.data-card.accent .card-number{
  color:var(--accent);
}

.card-unit{
  font-size:32px;
  color:var(--text-sec);
  font-weight:600;
}

.card-context{
  font-size:17px;
  color:var(--text-main);
  letter-spacing:.12em;
  line-height:1.6;
  font-weight:500;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.stages{
  display:flex;
  flex-wrap:wrap;
  gap:8px 6px;
}

.stage-item{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 12px;
  background:var(--primary-tint);
  color:var(--primary-dark);
  border-radius:6px;
  font-size:15px;
  font-weight:600;
  letter-spacing:.15em;
  border:1px solid rgba(33,150,243,.2);
}

.stage-item.current{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.timeline-context{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.year-chip{
  padding:6px 12px;
  background:rgba(255,152,0,.12);
  border:1px solid rgba(255,152,0,.35);
  color:var(--accent-dark);
  border-radius:20px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.06em;
}

.year-chip.highlight{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

/* Bottom bar */
.bottom-bar{
  position:absolute;
  left:80px;
  right:80px;
  bottom:48px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--text-muted);
  letter-spacing:.22em;
  font-weight:500;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.bottom-left, .bottom-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.dot-blue{
  width:8px;
  height:8px;
  background:var(--primary);
  border-radius:50%;
  display:inline-block;
}

.dot-orange{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  display:inline-block;
}

.divider-mini{
  color:var(--text-muted);
  opacity:.5;
}

</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>

  <svg class="stairs" width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#2196F3" stop-opacity=".14"/>
        <stop offset="1" stop-color="#2196F3" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#1565C0" stop-opacity=".08"/>
        <stop offset="1" stop-color="#1565C0" stop-opacity=".20"/>
      </linearGradient>
    </defs>
    <!-- back outline -->
    <polygon points="0,600 150,600 150,500 300,500 300,400 450,400 450,300 600,300 600,200 750,200 750,100 900,100 900,640 0,640"
             fill="url(#g2)"/>
    <!-- front outline -->
    <polygon points="0,640 160,640 160,540 320,540 320,440 480,440 480,340 640,340 640,240 800,240 800,140 900,140 900,640"
             fill="url(#g1)" stroke="#2196F3" stroke-opacity=".35" stroke-width="2"/>
    <!-- step highlights -->
    <line x1="160" y1="540" x2="320" y2="540" stroke="#2196F3" stroke-opacity=".7" stroke-width="2"/>
    <line x1="320" y1="440" x2="480" y2="440" stroke="#2196F3" stroke-opacity=".7" stroke-width="2"/>
    <line x1="480" y1="340" x2="640" y2="340" stroke="#2196F3" stroke-opacity=".7" stroke-width="2"/>
    <line x1="640" y1="240" x2="800" y2="240" stroke="#FF9800" stroke-opacity=".8" stroke-width="2.5"/>
    <line x1="800" y1="140" x2="900" y2="140" stroke="#FF9800" stroke-opacity=".9" stroke-width="2.5"/>
    <!-- nodes -->
    <circle cx="240" cy="540" r="5" fill="#2196F3"/>
    <circle cx="400" cy="440" r="5" fill="#2196F3"/>
    <circle cx="560" cy="340" r="5" fill="#2196F3"/>
    <circle cx="720" cy="240" r="6" fill="#FF9800"/>
    <circle cx="850" cy="140" r="7" fill="#FF9800"/>
  </svg>

  <div id="ct">
    <div class="top-row">
      <div class="chapter-tag">
        <span class="chapter-bar"></span>
        <span>CHAPTER · 章节过渡</span>
      </div>
      <div class="page-info">
        <span class="num">06</span> / 章节过渡页
      </div>
    </div>

    <div class="header-block">
      <h1 class="title">
        <span>技术成长的阶梯</span>
        <span class="title-underline"></span>
      </h1>
      <p class="subtitle">
        <span class="subtitle-line"></span><span>六年成长轨迹</span>
      </p>
    </div>

    <div class="data-row">
      <div class="data-card">
        <div class="card-label"><span class="label-dot"></span><span>成长阶段</span></div>
        <div class="card-number-row">
          <span class="card-number">5</span>
          <span class="card-unit">级</span>
        </div>
        <div class="card-context">
          <div class="stages">
            <span class="stage-item">入门</span>
            <span class="stage-item">贡献</span>
            <span class="stage-item">布道</span>
            <span class="stage-item">主导</span>
            <span class="stage-item current">引领</span>
          </div>
        </div>
      </div>

      <div class="data-card accent">
        <div class="card-label"><span class="label-dot"></span><span>跨越时间</span></div>
        <div class="card-number-row">
          <span class="card-number">6</span>
          <span class="card-unit">年</span>
        </div>
        <div class="card-context">
          <div class="timeline-context">
            <span class="year-chip">2019</span>
            <span class="year-chip">2020</span>
            <span class="year-chip">2021</span>
            <span class="year-chip">2022</span>
            <span class="year-chip">2023</span>
            <span class="year-chip highlight">2024</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <span class="dot-blue"></span>
        <span>技术能力</span>
        <span class="divider-mini">·</span>
        <span class="dot-orange"></span>
        <span>社区影响力</span>
        <span class="divider-mini">·</span>
        <span class="dot-blue"></span>
        <span>布道经验</span>
      </div>
      <div class="bottom-right">
        <span>FROM NOVICE TO CORE CONTRIBUTOR</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
