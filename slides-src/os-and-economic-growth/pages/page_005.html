

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>增长驱动机制</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D2137;
  --light:#F5F5F5;
  --red:#E53935;
  --text-dark:#1A1A1A;
  --text-muted:#5A5A5A;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;background:var(--light);}
#bg{position:absolute;inset:0;z-index:0;}
#ct{position:absolute;inset:0;z-index:1;padding:0;display:flex;}

.left-panel{
  width:640px;height:900px;
  background:var(--navy);
  position:relative;
  padding:64px 56px;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.part-label{
  font-family:'Noto Sans SC',sans-serif;
  font-size:18px;font-weight:500;
  color:var(--red);
  letter-spacing:5px;
  margin-bottom:0;
}
.part-label::before{
  content:'';display:inline-block;width:44px;height:2px;
  background:var(--red);vertical-align:middle;margin-right:14px;
}

.title-block{margin-top:52px;}
.main-title{
  font-family:'Noto Serif SC',serif;
  font-size:96px;font-weight:900;
  color:#FFFFFF;
  line-height:1.05;
  letter-spacing:3px;
}
.title-underline{
  width:90px;height:4px;background:var(--red);margin:36px 0 28px 0;
}
.subtitle{
  font-family:'Noto Serif SC',serif;
  font-size:26px;font-weight:600;
  color:#FFFFFF;
  line-height:1.5;
  opacity:0.92;
  letter-spacing:1px;
}

.left-footer{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.footer-line{
  font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:3px;
}
.footer-line.accent{color:rgba(255,255,255,0.85);}

.left-deco{
  position:absolute;right:-60px;top:80px;width:140px;height:140px;
  border:1px solid rgba(255,255,255,0.08);border-radius:50%;
}
.left-deco-2{
  position:absolute;right:-30px;top:110px;width:80px;height:80px;
  border:1px solid rgba(255,255,255,0.12);border-radius:50%;
}
.left-deco-3{
  position:absolute;left:-40px;bottom:200px;width:100px;height:100px;
  border:1px solid rgba(255,255,255,0.06);
}

.right-panel{
  width:960px;height:900px;
  background:var(--light);
  padding:58px 60px 50px 60px;
  display:flex;flex-direction:column;
  position:relative;
}
.right-header{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:18px;border-bottom:1px solid #D8D8D8;
  margin-bottom:30px;
}
.right-header-label{
  font-size:13px;color:var(--text-muted);letter-spacing:3px;
}
.right-header-page{
  font-family:'Noto Serif SC',serif;
  font-size:14px;color:var(--navy);font-weight:700;letter-spacing:2px;
}

.points-list{
  display:flex;flex-direction:column;
  flex:1;
}
.point-item{
  display:flex;align-items:flex-start;gap:36px;
  padding:22px 0 22px 0;
  border-bottom:1px solid #E4E4E4;
}
.point-item:last-child{border-bottom:none;}
.point-num{
  font-family:'Noto Serif SC',serif;
  font-size:76px;font-weight:900;
  color:var(--red);
  line-height:1;
  min-width:100px;
  flex-shrink:0;
}
.point-content{
  flex:1;padding-top:12px;
}
.point-title{
  font-family:'Noto Serif SC',serif;
  font-size:30px;font-weight:700;
  color:var(--navy);
  margin-bottom:10px;
  line-height:1.3;
  letter-spacing:1px;
}
.point-desc{
  font-size:16px;font-weight:400;
  color:var(--text-muted);
  line-height:1.75;
}

.data-bar{
  margin-top:28px;
  background:var(--red);
  color:#FFFFFF;
  padding:22px 32px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;
}
.data-bar::after{
  content:'';position:absolute;right:0;top:0;width:0;height:0;
  border-left:24px solid #0D2137;
  border-top:22px solid transparent;
  border-bottom:22px solid transparent;
}
.data-bar-left{
  display:flex;flex-direction:column;gap:4px;
}
.data-bar-label{
  font-size:12px;letter-spacing:3px;font-weight:400;opacity:0.85;
}
.data-bar-value{
  font-family:'Noto Serif SC',serif;
  font-size:28px;font-weight:700;letter-spacing:1px;
}
.data-bar-right{
  font-size:12px;letter-spacing:2px;opacity:0.85;font-weight:300;
}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg"></div>
<div id="ct">
  <div class="left-panel">
    <div class="left-deco"></div>
    <div class="left-deco-2"></div>
    <div class="left-deco-3"></div>
    <div class="part-label"><span>PART 02</span></div>
    <div class="title-block">
      <h1 class="main-title"><span>增长驱动<br>机制</span></h1>
      <div class="title-underline"></div>
      <div class="subtitle"><span>开源如何成为经济引擎</span></div>
    </div>
    <div class="left-footer">
      <div class="footer-line accent"><span>CHAPTER TRANSITION</span></div>
      <div class="footer-line"><span>2024 · OPEN SOURCE ECONOMY</span></div>
    </div>
  </div>
  <div class="right-panel">
    <div class="right-header">
      <div class="right-header-label"><span>本章核心议题 · KEY TOPICS</span></div>
      <div class="right-header-page"><span>P. 05</span></div>
    </div>
    <div class="points-list">
      <div class="point-item">
        <div class="point-num"><span>01</span></div>
        <div class="point-content">
          <div class="point-title"><span>降低创新成本</span></div>
          <div class="point-desc"><span>开源复用让企业可将研发投入集中在差异化场景而非重复造轮子，使有限资源聚焦于真正创造价值的环节</span></div>
        </div>
      </div>
      <div class="point-item">
        <div class="point-num"><span>02</span></div>
        <div class="point-content">
          <div class="point-title"><span>加速技术扩散</span></div>
          <div class="point-desc"><span>标准协议下的代码共享使新技术在数月内即可完成全球普及，跨越地域与规模壁垒实现快速落地</span></div>
        </div>
      </div>
      <div class="point-item">
        <div class="point-num"><span>03</span></div>
        <div class="point-content">
          <div class="point-title"><span>催生产业生态</span></div>
          <div class="point-desc"><span>围绕核心开源项目形成的咨询、培训、商业支持市场持续扩张，构筑多元化价值网络</span></div>
        </div>
      </div>
    </div>
    <div class="data-bar">
      <div class="data-bar-left">
        <div class="data-bar-label"><span>研发成本节省</span></div>
        <div class="data-bar-value"><span>30 – 50%</span></div>
      </div>
      <div class="data-bar-right"><span>企业平均估算</span></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
