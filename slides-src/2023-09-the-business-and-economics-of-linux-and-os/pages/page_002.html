

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>第一部分 · 开源经济学背景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #2D3748;
  --primary: #2196F3;
  --accent: #00BCD4;
  --text-main: #F0F4F8;
  --text-sub: #B4C4D6;
  --text-dim: #7A8CA0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  color: var(--text-main);
  background: var(--bg);
}
.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}
#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.bg-photo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
.bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(20,28,42,0.92) 0%, rgba(20,28,42,0.72) 40%, rgba(20,28,42,0.35) 70%, rgba(20,28,42,0.55) 100%);
}
.bg-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(33,150,243,0.12) 0%, transparent 60%);
}
#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px 80px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  font-weight: 500;
}
.top-bar .left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.top-bar .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.top-bar .right {
  color: var(--text-dim);
}

.main-area {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 60px;
  padding-top: 20px;
}
.chapter-num-col {
  flex: 0 0 560px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.chapter-num {
  font-size: 460px;
  font-weight: 900;
  line-height: 0.85;
  letter-spacing: -20px;
  background: linear-gradient(135deg, #2196F3 0%, #00BCD4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 40px rgba(33,150,243,0.55)) drop-shadow(0 0 80px rgba(0,188,212,0.3));
  font-family: 'Inter', sans-serif;
  position: relative;
}
.chapter-num-glow {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(33,150,243,0.28) 0%, transparent 65%);
  filter: blur(20px);
  z-index: -1;
}

.text-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 780px;
}
.section-tag {
  font-size: 14px;
  letter-spacing: 6px;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-tag::before {
  content: '';
  width: 40px;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}
h1 {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.15;
  color: var(--text-main);
  letter-spacing: -0.5px;
}
h1 .accent-bar {
  display: inline-block;
  width: 6px;
  height: 48px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  vertical-align: middle;
  margin-right: 18px;
  border-radius: 3px;
  box-shadow: 0 0 20px rgba(33,150,243,0.6);
}
h2 {
  font-size: 20px;
  font-weight: 400;
  color: var(--text-sub);
  line-height: 1.5;
  letter-spacing: 0.5px;
}
.divider {
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), transparent);
  margin: 8px 0 4px;
  box-shadow: 0 0 12px rgba(33,150,243,0.6);
}

.bottom-section {
  padding-top: 20px;
}
.core-questions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-bottom: 22px;
}
.q-item {
  background: rgba(45,55,72,0.55);
  border: 1px solid rgba(33,150,243,0.28);
  border-left: 3px solid var(--primary);
  backdrop-filter: blur(6px);
  padding: 20px 22px;
  border-radius: 4px;
  position: relative;
}
.q-item .q-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.q-item .q-num::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
}
.q-item .q-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.q-item .q-desc {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.55;
  font-weight: 400;
}
.lead-note {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
  padding-left: 16px;
  border-left: 2px solid var(--accent);
  font-style: italic;
  max-width: 1200px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_hero.png" alt="">
    <div class="bg-overlay"></div>
    <div class="bg-vignette"></div>
  </div>
  <div id="ct">
    <div class="top-bar">
      <div class="left">
        <span class="dot"></span>
        <span>OPEN SOURCE ECONOMICS</span>
      </div>
      <div class="right">CHAPTER TRANSITION / 章节过渡</div>
    </div>

    <div class="main-area">
      <div class="chapter-num-col">
        <div class="chapter-num-glow"></div>
        <div class="chapter-num">01</div>
      </div>
      <div class="text-col">
        <div class="section-tag">PART ONE</div>
        <h1><span class="accent-bar"></span>第一部分 · 开源经济学背景</h1>
        <h2>为什么开源值得从商业角度重新审视</h2>
        <div class="divider"></div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="core-questions">
        <div class="q-item">
          <div class="q-num">01 / REFRAME</div>
          <div class="q-title">认知纠偏</div>
          <div class="q-desc">开源不等于免费，也不等于没有商业模式</div>
        </div>
        <div class="q-item">
          <div class="q-num">02 / VALUE</div>
          <div class="q-title">价值重构</div>
          <div class="q-desc">从许可证、协作机制到网络效应的经济学解读</div>
        </div>
        <div class="q-item">
          <div class="q-num">03 / INDUSTRY</div>
          <div class="q-title">产业视角</div>
          <div class="q-desc">全球科技巨头均深度嵌入开源生态</div>
        </div>
      </div>
      <div class="lead-note">进入第一部分之前，我们需要打破一个常见误区：开源并非慈善行为，而是一套经过市场验证的价值创造机制。</div>
    </div>
  </div>
</div>
</body>
</html>
