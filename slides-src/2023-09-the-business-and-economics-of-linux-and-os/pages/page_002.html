

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一部分 · 开源经济学背景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --primary: #2196F3;
  --accent:  #00BCD4;
  --neutral: #2D3748;
  --text-main: #FFFFFF;
  --text-dim: rgba(255,255,255,0.72);
  --text-mute: rgba(255,255,255,0.55);
  --line:    rgba(255,255,255,0.14);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 16px;
  color: var(--text-main);
  background: #050912;
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: #050912;
}

.bg-photo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    rgba(5,9,18,0.15) 0%,
    rgba(5,9,18,0.30) 38%,
    rgba(5,9,18,0.62) 72%,
    rgba(5,9,18,0.85) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px 80px;
}

/* 顶部小徽章 */
.badge {
  position: absolute;
  top: 62px;
  right: 80px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 11px 20px;
  background: rgba(33,150,243,0.08);
  border: 1px solid rgba(33,150,243,0.45);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: rgba(255,255,255,0.82);
}

.badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary);
}

/* 主视觉行 */
.main-row {
  position: absolute;
  top: 240px;
  left: 80px;
  right: 80px;
  display: flex;
  align-items: center;
  gap: 68px;
}

/* 超大号 01 */
.num-wrap {
  position: relative;
  width: 420px;
  height: 400px;
  flex-shrink: 0;
}

.num {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 400px;
  line-height: 0.82;
  letter-spacing: -0.04em;
  background: linear-gradient(180deg, #4FC3F7 0%, #2196F3 50%, #0288D1 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 100px rgba(33,150,243,0.25);
}

/* 竖向分割线 */
.divider {
  width: 2px;
  height: 320px;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(33,150,243,0.05) 12%,
    rgba(33,150,243,0.9) 50%,
    rgba(0,188,212,0.55) 88%,
    transparent 100%);
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(33,150,243,0.45);
}

/* 右侧标题区 */
.text-wrap {
  flex: 1;
  min-width: 0;
}

.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.32em;
  color: var(--accent);
  margin: 0 0 22px 0;
  text-transform: uppercase;
}

.title {
  font-size: 50px;
  font-weight: 700;
  line-height: 1.18;
  color: var(--text-main);
  margin: 0 0 26px 0;
  letter-spacing: -0.005em;
}

.title-underline {
  width: 80px;
  height: 4px;
  background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
  border-radius: 2px;
  margin: 0 0 26px 0;
}

.subtitle {
  font-size: 22px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--text-dim);
  margin: 0;
  letter-spacing: 0.02em;
}

/* 三栏要点 */
.list-row {
  position: absolute;
  bottom: 90px;
  left: 80px;
  right: 80px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 40px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.10);
}

.list-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  margin-top: 1px;
}

.item-text {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  margin: 0 0 6px 0;
  letter-spacing: 0.10em;
}

.item-desc {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-mute);
  margin: 0;
  line-height: 1.6;
  letter-spacing: 0.01em;
}

/* 底部装饰 */
.footer-line {
  position: absolute;
  bottom: 46px;
  left: 80px;
  right: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.32em;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
}

.footer-line .rule {
  flex: 1;
  height: 1px;
  margin: 0 22px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 20%, rgba(255,255,255,0.18) 80%, transparent 100%);
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_hero.png" alt="">
    <div class="bg-overlay"></div>
  </div>

  <div id="ct">
    <div class="badge">
      <span class="dot"></span>
      <span>第一部分 / 3 个核心问题 / 背景 · 机制 · 价值</span>
    </div>

    <div class="main-row">
      <div class="num-wrap">
        <div class="num">01</div>
      </div>

      <div class="divider"></div>

      <div class="text-wrap">
        <p class="eyebrow">PART ONE / OPEN-SOURCE ECONOMICS</p>
        <h1 class="title">第一部分 · 开源经济学背景</h1>
        <div class="title-underline"></div>
        <p class="subtitle">为什么开源值得从商业角度重新审视</p>
      </div>
    </div>

    <div class="list-row">
      <div class="list-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#2196F3" stroke-width="1.5"/>
          <path d="M4.5 12h15M12 4.5v15" stroke="#00BCD4" stroke-width="1.5"/>
        </svg>
        <div class="item-text">
          <p class="item-title">认知纠偏</p>
          <p class="item-desc">开源不等于免费，也不等于没有商业模式</p>
        </div>
      </div>

      <div class="list-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <polygon points="12,3 21,12 12,21 3,12" stroke="#2196F3" stroke-width="1.5" fill="none"/>
          <circle cx="12" cy="12" r="2.5" fill="#00BCD4"/>
        </svg>
        <div class="item-text">
          <p class="item-title">价值重构</p>
          <p class="item-desc">从许可证、协作机制到网络效应的经济学解读</p>
        </div>
      </div>

      <div class="list-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="8" height="8" stroke="#2196F3" stroke-width="1.5" fill="none"/>
          <rect x="13" y="3" width="8" height="8" stroke="#00BCD4" stroke-width="1.5" fill="none"/>
          <rect x="3" y="13" width="8" height="8" stroke="#00BCD4" stroke-width="1.5" fill="none"/>
          <rect x="13" y="13" width="8" height="8" stroke="#2196F3" stroke-width="1.5" fill="none"/>
        </svg>
        <div class="item-text">
          <p class="item-title">产业视角</p>
          <p class="item-desc">全球科技巨头均深度嵌入开源生态</p>
        </div>
      </div>
    </div>

    <div class="footer-line">
      <span>SECTION TRANSITION</span>
      <div class="rule"></div>
      <span>01 / OPEN-SOURCE ECONOMICS</span>
    </div>
  </div>
</div>
</body>
</html>
