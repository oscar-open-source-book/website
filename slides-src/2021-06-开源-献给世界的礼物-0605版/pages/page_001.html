

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源：献给世界的礼物</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --neutral: #B0BEC5;
  --bg-dark: #0A0E1A;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Roboto Mono', monospace; background: #000; }
.wrapper { width: 1600px; height: 900px; position: relative; overflow: hidden; margin: 0 auto; }
#bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.bg-photo { position: absolute; inset: 0; width: 1600px; height: 900px; object-fit: cover; display: block; }
.bg-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,26,0.35) 0%, rgba(10,14,26,0.65) 60%, rgba(10,14,26,0.85) 100%); }
#ct { position: absolute; inset: 0; z-index: 1; padding: 55px 60px; box-sizing: border-box; }

.deco-panel {
  position: absolute;
  top: 160px;
  right: 24px;
  width: 280px;
  height: 380px;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid rgba(33,150,243,0.35);
  box-shadow: 0 0 40px rgba(33,150,243,0.2), inset 0 0 30px rgba(0,188,212,0.08);
}
.deco-panel img { width: 280px; height: 380px; object-fit: cover; object-position: center top; display: block; }

.header {
  max-width: 1000px;
  margin: 0 auto;
  text-align: center;
  padding-top: 30px;
}
.main-title {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 76px;
  line-height: 1.1;
  margin: 0 0 22px;
  background: linear-gradient(135deg, #2196F3 0%, #00BCD4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
  filter: drop-shadow(0 0 30px rgba(33,150,243,0.35));
}
.subtitle {
  font-family: 'Roboto Mono', monospace;
  font-weight: 500;
  font-size: 19px;
  color: var(--neutral);
  margin: 0 0 28px;
  letter-spacing: 5px;
}
.divider {
  width: 100px;
  height: 2px;
  margin: 0 auto 26px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}
.desc {
  font-family: 'Roboto Mono', monospace;
  font-size: 14px;
  color: rgba(176,190,197,0.9);
  max-width: 900px;
  margin: 0 auto;
  line-height: 1.9;
  letter-spacing: 1px;
}

.cards {
  position: absolute;
  left: 80px;
  right: 340px;
  bottom: 150px;
  display: flex;
  gap: 22px;
  justify-content: center;
}
.card {
  flex: 1;
  background: rgba(10, 14, 26, 0.72);
  border: 1px solid rgba(33,150,243,0.28);
  border-radius: 12px;
  padding: 24px 22px;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(6px);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}
.card-num {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 4px;
  margin-bottom: 12px;
}
.card-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: #ffffff;
  margin: 0 0 12px;
  letter-spacing: 2px;
}
.card-desc {
  font-family: 'Roboto Mono', monospace;
  font-size: 12.5px;
  color: var(--neutral);
  line-height: 1.75;
}

.badges {
  position: absolute;
  right: 30px;
  bottom: 55px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.badge {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 22px;
  background: rgba(33,150,243,0.18);
  border: 1px solid rgba(33,150,243,0.5);
  color: #ffffff;
  letter-spacing: 3px;
  white-space: nowrap;
}
.badge.accent {
  background: rgba(0,188,212,0.18);
  border-color: rgba(0,188,212,0.5);
}
.badge-num {
  color: var(--accent);
  font-weight: 500;
}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg">
  <img class="bg-photo" src="../images/page_001_hero_bg.png" alt="深色科技风主视觉背景">
  <div class="bg-overlay"></div>
</div>
<div id="ct">
  <div class="deco-panel">
    <img src="../images/page_001_decoration.png" alt="代码字符流装饰侧栏">
  </div>

  <div class="header">
    <h1 class="main-title"><span>开源：献给世界的礼物</span></h1>
    <p class="subtitle"><span>开源之道 · 适兕 · 2021年6月 · 阅读分享专场</span></p>
    <div class="divider"></div>
    <p class="desc"><span>开源不仅是一种技术许可模式，更是一种关于协作、透明与共享的人类实践。本期分享以《开源：献给世界的礼物》为主线，回顾开源运动的历史脉络，梳理其对当今科技与社会的深远影响。</span></p>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-num"><span>01 / THEME</span></div>
      <h3 class="card-title"><span>主题分享</span></h3>
      <p class="card-desc"><span>围绕《开源：献给世界的礼物》一书进行深度阅读分享与主题讨论</span></p>
    </div>
    <div class="card">
      <div class="card-num"><span>02 / EVANGELIST</span></div>
      <h3 class="card-title"><span>布道者说</span></h3>
      <p class="card-desc"><span>适兕带你走进开源精神世界，理解代码自由与协作共创之美</span></p>
    </div>
    <div class="card">
      <div class="card-num"><span>03 / TIME</span></div>
      <h3 class="card-title"><span>时间与场次</span></h3>
      <p class="card-desc"><span>2021年6月·开源之道栏目·线上阅读分享专场，诚邀同行者共赴</span></p>
    </div>
  </div>

  <div class="badges">
    <div class="badge"><span class="badge-num">第06期</span></div>
    <div class="badge accent"><span>主题关键词：献给世界的礼物</span></div>
  </div>
</div>
</div>
</body>
</html>
