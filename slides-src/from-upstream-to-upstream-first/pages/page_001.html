

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之书记录 · 封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brown: #795548;
    --brown-dark: #4E342E;
    --brown-light: #C49A6C;
    --cream: #F5F0E8;
    --cream-deep: #EFE7D6;
    --paper: #FAF6EC;
    --text-mute: #8B7355;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--cream);
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--brown-dark);
  }
  .wrapper {
    width: 1600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
    background: var(--cream);
  }
  #bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #FAF6EC 0%, #F5F0E8 45%, #EFE7D6 100%);
  }
  #ct {
    position: absolute;
    inset: 0;
    z-index: 1;
    padding: 64px 96px 64px 96px;
    box-sizing: border-box;
  }
  /* ============ Decorative curves on the right ============ */
  .curves {
    position: absolute;
    right: 0;
    top: 0;
    width: 820px;
    height: 660px;
    pointer-events: none;
  }
  .curves svg { display: block; }
  /* ============ Frame accents ============ */
  .corner-tr {
    position: absolute;
    right: 60px;
    top: 60px;
    width: 60px;
    height: 60px;
    border-top: 1px solid rgba(121,85,72,0.35);
    border-right: 1px solid rgba(121,85,72,0.35);
  }
  .corner-bl {
    position: absolute;
    left: 60px;
    bottom: 60px;
    width: 60px;
    height: 60px;
    border-bottom: 1px solid rgba(121,85,72,0.35);
    border-left: 1px solid rgba(121,85,72,0.35);
  }
  /* ============ Main title area (left) ============ */
  .left-col {
    position: absolute;
    left: 96px;
    top: 64px;
    width: 640px;
  }
  .accent-mark {
    position: absolute;
    left: -32px;
    top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .accent-mark .dot {
    width: 8px;
    height: 8px;
    background: var(--brown-light);
    border-radius: 50%;
  }
  .accent-mark .line {
    width: 1px;
    height: 88px;
    background: rgba(121,85,72,0.35);
  }
  .title-vertical {
    font-family: 'Noto Serif SC', serif;
    font-size: 156px;
    font-weight: 500;
    color: var(--brown-dark);
    letter-spacing: 0.1em;
    line-height: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .title-vertical span {
    display: block;
    line-height: 1;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 44px;
    margin-bottom: 28px;
  }
  .divider .rule {
    display: block;
    width: 140px;
    height: 1px;
    background: var(--brown);
  }
  .divider .end-dot {
    width: 6px;
    height: 6px;
    background: var(--brown);
    border-radius: 50%;
  }
  .subtitle {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-style: italic;
    color: var(--brown);
    letter-spacing: 0.04em;
    line-height: 1.3;
    font-weight: 400;
  }
  /* ============ Quote in lower left ============ */
  .quote-block {
    position: absolute;
    left: 96px;
    bottom: 220px;
    max-width: 470px;
    padding: 22px 0 22px 24px;
    border-left: 2px solid var(--brown-light);
  }
  .quote-block .q-mark {
    font-family: 'Noto Serif SC', serif;
    font-size: 44px;
    line-height: 1;
    color: var(--brown-light);
    margin-bottom: 6px;
    display: block;
    font-weight: 400;
  }
  .quote-block p {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-mute);
    letter-spacing: 0.02em;
    font-weight: 300;
  }
  /* ============ Seal / Stamp in top right ============ */
  .stamp {
    position: absolute;
    right: 108px;
    top: 96px;
    width: 80px;
    height: 108px;
    background: var(--brown);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    letter-spacing: 0.35em;
    font-weight: 500;
    box-shadow: 2px 2px 0 rgba(121,85,72,0.15);
  }
  /* ============ Bottom theme row ============ */
  .bottom-row {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 64px;
    height: 160px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .theme-col {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 26px;
    padding: 30px 36px 20px 0;
    border-top: 1px solid rgba(121,85,72,0.28);
  }
  .theme-col .theme-label {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-shrink: 0;
  }
  .theme-col .theme-label::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--brown-light);
    border-radius: 50%;
    margin-right: 2px;
    margin-bottom: 8px;
  }
  .theme-col .theme-label span {
    font-family: 'Noto Serif SC', serif;
    font-size: 32px;
    font-weight: 500;
    color: var(--brown-dark);
    letter-spacing: 0.16em;
    line-height: 1;
  }
  .theme-col .theme-desc {
    font-size: 14px;
    color: var(--text-mute);
    line-height: 1.85;
    flex: 1;
    max-width: 300px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="curves">
      <svg viewBox="0 0 820 660" preserveAspectRatio="none" width="820" height="660" xmlns="http://www.w3.org/2000/svg">
        <!-- Very faint background contour -->
        <path d="M -40 260 C 140 200, 300 340, 500 260 C 680 200, 800 320, 860 260"
              fill="none" stroke="#C49A6C" stroke-width="1" stroke-opacity="0.18" stroke-linecap="round"/>
        <!-- Main upper curve -->
        <path d="M -20 130 C 160 60, 320 210, 500 140 C 660 90, 780 220, 860 150"
              fill="none" stroke="#795548" stroke-width="2.4" stroke-opacity="0.85" stroke-linecap="round"/>
        <!-- Middle curve -->
        <path d="M -20 330 C 180 260, 340 400, 520 340 C 680 290, 780 420, 860 350"
              fill="none" stroke="#C49A6C" stroke-width="1.6" stroke-opacity="0.6" stroke-linecap="round"/>
        <!-- Lower curve -->
        <path d="M -20 460 C 200 410, 380 510, 560 460 C 700 420, 780 510, 860 470"
              fill="none" stroke="#795548" stroke-width="1.1" stroke-opacity="0.42" stroke-linecap="round"/>
        <!-- Faintest echo -->
        <path d="M -20 570 C 220 530, 400 590, 600 570 C 720 560, 790 590, 860 580"
              fill="none" stroke="#C49A6C" stroke-width="0.8" stroke-opacity="0.3" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div id="ct">
    <div class="left-col">
      <div class="accent-mark">
        <div class="dot"></div>
        <div class="line"></div>
      </div>
      <div class="title-vertical">
        <span>开</span>
        <span>源</span>
        <span>之</span>
        <span>书</span>
      </div>
      <div class="divider">
        <span class="rule"></span>
        <span class="end-dot"></span>
      </div>
      <div class="subtitle">From Upstream to Upstream First</div>
    </div>

    <div class="stamp">
      <span>记 · 录</span>
    </div>

    <div class="quote-block">
      <span class="q-mark">"</span>
      <p>开源发展史是一部不断向源流汇聚的历史，本书记录从早期从下游到上游的觉醒到今日 Upstream First 成为社区共识的全过程，试图为每一位开源参与者提供一份可读、可感的思想地图。</p>
    </div>

    <div class="bottom-row">
      <div class="theme-col">
        <div class="theme-label"><span>源流回望</span></div>
        <div class="theme-desc">追溯开源协作中上游概念的起源与演变脉络</div>
      </div>
      <div class="theme-col">
        <div class="theme-label"><span>理念跃迁</span></div>
        <div class="theme-desc">从被动下游到主动上游的思维范式转换</div>
      </div>
      <div class="theme-col">
        <div class="theme-label"><span>布道践行</span></div>
        <div class="theme-desc">开源布道者如何推动社区向上游沉淀贡献</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
