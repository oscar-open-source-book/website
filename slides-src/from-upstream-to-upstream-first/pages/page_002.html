

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>源流：何为上游 — Section 01</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --primary: #795548;
  --accent: #C49A6C;
  --bg: #F5F0E8;
  --text-main: #3B2A1E;
  --text-muted: #8B7A6E;
  --text-light: #B8A99A;
  --line: rgba(121, 85, 72, 0.22);
  --line-soft: rgba(121, 85, 72, 0.10);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
}

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  font-size: 16px;
  color: var(--text-main);
  background: var(--bg);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #F5F0E8 0%, #EEE5D4 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 62px 90px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Eyebrow header */
.eyebrow {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 0.32em;
  color: var(--primary);
  font-weight: 500;
}
.eyebrow-line {
  width: 92px;
  height: 1px;
  background: var(--primary);
  opacity: 0.55;
}
.eyebrow-dot {
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
}

/* Title block */
.title-block {
  display: flex;
  align-items: center;
  gap: 60px;
  margin-top: 82px;
}
.big-number {
  font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
  font-size: 248px;
  font-weight: 300;
  color: var(--primary);
  line-height: 0.85;
  letter-spacing: -0.02em;
  position: relative;
}
.big-number::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -14px;
  transform: translateX(-50%);
  width: 42px;
  height: 2px;
  background: var(--accent);
}
.title-content {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.title-main {
  font-family: 'Noto Serif SC', serif;
  font-size: 72px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: 0.08em;
  line-height: 1.2;
}
.title-main-accent {
  color: var(--primary);
}
.title-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  font-style: italic;
  padding-left: 6px;
}

/* Items row */
.items-row {
  display: flex;
  gap: 72px;
  margin-top: 82px;
  flex: 1;
}
.item {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  padding-right: 8px;
}
.item-index {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--accent);
  font-style: italic;
  letter-spacing: 0.12em;
}
.item-divider {
  width: 42px;
  height: 1px;
  background: var(--primary);
  opacity: 0.55;
}
.item-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 0.08em;
}
.item-desc {
  font-size: 14.5px;
  color: var(--text-muted);
  line-height: 1.85;
  font-weight: 300;
  letter-spacing: 0.02em;
}

/* Footer */
.footer {
  margin-top: 42px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  position: relative;
}
.footer::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 0;
  width: 7px;
  height: 7px;
  background: var(--accent);
  border-radius: 50%;
}
.footer-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.85;
  letter-spacing: 0.05em;
  max-width: 1200px;
  padding-left: 22px;
  font-weight: 400;
}

/* Decorative diagonal river line */
.decor-line-1 {
  position: absolute;
  top: -120px;
  right: 40px;
  width: 1500px;
  height: 1px;
  background: var(--accent);
  transform: rotate(30deg);
  transform-origin: top right;
  opacity: 0.55;
  z-index: 0;
}
.decor-line-2 {
  position: absolute;
  top: -120px;
  right: 40px;
  width: 900px;
  height: 1px;
  background: var(--primary);
  transform: rotate(30deg);
  transform-origin: top right;
  opacity: 0.28;
  z-index: 0;
}
.decor-circle {
  position: absolute;
  top: 265px;
  right: 340px;
  width: 10px;
  height: 10px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  opacity: 0.7;
  z-index: 0;
}

/* Corner mark */
.corner-mark {
  position: absolute;
  bottom: 62px;
  right: 90px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.42em;
  color: var(--text-light);
  text-transform: uppercase;
  z-index: 2;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="decor-line-1"></div>
    <div class="decor-line-2"></div>
    <div class="decor-circle"></div>
  </div>
  <div id="ct">
    <div class="eyebrow">
      <span>Section 01 — Upstream Origin</span>
      <span class="eyebrow-line"></span>
      <span class="eyebrow-dot"></span>
    </div>

    <div class="title-block">
      <div class="big-number">01</div>
      <div class="title-content">
        <div class="title-main"><span>源流：何为上游</span></div>
        <div class="title-sub">Upstream · Origin</div>
      </div>
    </div>

    <div class="items-row">
      <div class="item">
        <div class="item-index">Ⅰ</div>
        <div class="item-divider"></div>
        <div class="item-title">上游定义</div>
        <div class="item-desc">指代码、设计或决策的最终权威源头与原始仓库。</div>
      </div>
      <div class="item">
        <div class="item-index">Ⅱ</div>
        <div class="item-divider"></div>
        <div class="item-title">下游含义</div>
        <div class="item-desc">依赖上游发布的发行版、派生项目与使用者。</div>
      </div>
      <div class="item">
        <div class="item-index">Ⅲ</div>
        <div class="item-divider"></div>
        <div class="item-title">关系隐喻</div>
        <div class="item-desc">如江河源流，上游汇聚则下游丰沛。</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-text">进入第一个章节，我们先厘清「上游」与「下游」这两个贯穿全书的核心隐喻。理解二者的关系，是理解整个开源协作哲学的第一步。</div>
    </div>
  </div>
  <div class="corner-mark">Chapter · One</div>
</div>
</body>
</html>
