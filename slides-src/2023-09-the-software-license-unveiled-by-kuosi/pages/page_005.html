

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源布道精神</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D2137;
  --navy-soft: #1B3A5B;
  --gold: #C9A227;
  --gold-soft: #E0C368;
  --gray: #5A5A5A;
  --gray-light: #8A8A8A;
  --bg: #F7F5F0;
  --paper: #FBF9F4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--navy);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  background: var(--bg);
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(180deg, #FBF9F4 0%, #F5F1E8 100%);
}

/* 装饰背景元素 */
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(13, 33, 55, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(13, 33, 55, 0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
}

/* 大引号装饰 */
.quote-deco {
  position: absolute;
  font-family: 'Noto Serif SC', serif;
  color: var(--gold);
  opacity: 0.18;
  font-weight: 900;
  line-height: 1;
  user-select: none;
  z-index: 0;
}
.quote-tl {
  top: 20px;
  left: 40px;
  font-size: 320px;
}
.quote-br {
  bottom: -120px;
  right: 40px;
  font-size: 320px;
}

/* 边角装饰线 */
.corner {
  position: absolute;
  width: 80px;
  height: 80px;
  border: 2px solid var(--gold);
  z-index: 1;
}
.corner.tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
.corner.tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
.corner.br { bottom: 40px; right: 40px; border-left: none; border-top: none; }

#ct {
  position: absolute;
  inset: 0;
  z-index: 2;
  padding: 80px 120px;
  display: flex;
  flex-direction: column;
}

/* 顶部章节标识 */
.chapter-mark {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 30px;
}
.chapter-line {
  width: 60px;
  height: 2px;
  background: var(--gold);
}
.chapter-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  letter-spacing: 6px;
  color: var(--gold);
  font-weight: 500;
}

/* 标题区 */
.title-block {
  text-align: center;
  margin-top: 8px;
  margin-bottom: 32px;
}

.main-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 84px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 12px;
  line-height: 1.1;
  margin-bottom: 24px;
}

.title-underline {
  display: inline-block;
  width: 120px;
  height: 3px;
  background: var(--gold);
  margin: 0 auto 22px;
}

.subtitle {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 400;
  color: var(--navy-soft);
  letter-spacing: 6px;
}

/* 引导语 */
.narrative {
  max-width: 1100px;
  margin: 0 auto;
  text-align: center;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 20px;
  line-height: 2;
  color: var(--gray);
  font-weight: 400;
  margin-bottom: 42px;
}

/* 分隔线 */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 32px;
}
.divider-line {
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.divider-diamond {
  width: 8px;
  height: 8px;
  background: var(--gold);
  transform: rotate(45deg);
}

/* 三栏要点 */
.points {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 48px;
  padding: 0 20px;
}

.point {
  position: relative;
  padding-top: 26px;
  text-align: center;
}

.point-top-bar {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: var(--gold);
}

.point-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  color: var(--gold);
  font-weight: 600;
  letter-spacing: 3px;
  margin-bottom: 14px;
  display: block;
}

.point-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 16px;
  letter-spacing: 2px;
}

.point-desc {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 17px;
  line-height: 1.9;
  color: var(--gray);
  font-weight: 400;
}

/* 页脚 */
.footer {
  position: absolute;
  bottom: 48px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 140px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: var(--gray-light);
  letter-spacing: 3px;
  z-index: 3;
}
.footer-left::before {
  content: '◆';
  color: var(--gold);
  margin-right: 10px;
  font-size: 8px;
}
.footer-right::after {
  content: '◆';
  color: var(--gold);
  margin-left: 10px;
  font-size: 8px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <div class="bg-grid"></div>
    <div class="quote-deco quote-tl">&ldquo;</div>
    <div class="quote-deco quote-br">&rdquo;</div>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="ct">
    <div class="chapter-mark">
      <div class="chapter-line"></div>
      <div class="chapter-text">CHAPTER · 分 节</div>
    </div>

    <div class="title-block">
      <h1 class="main-title">开源布道精神</h1>
      <div class="title-underline"></div>
      <div class="subtitle">分享即传播，知识即自由</div>
    </div>

    <p class="narrative">开源布道不仅仅是技术传播，更是一种文化传递。适兕以阅读分享为纽带，将开源经典著作与一线实践相结合，让知识在流动中生根发芽。本节将探讨开源布道的内涵、方法与价值。</p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <div class="points">
      <div class="point">
        <div class="point-top-bar"></div>
        <span class="point-num">— 01 —</span>
        <div class="point-title">布道者角色</div>
        <div class="point-desc">开源布道者是社区的引路人，连接技术与理念的桥梁</div>
      </div>
      <div class="point">
        <div class="point-top-bar"></div>
        <span class="point-num">— 02 —</span>
        <div class="point-title">阅读分享传统</div>
        <div class="point-desc">开源社区以阅读经典著作、分享实践心得为传承文化的重要方式</div>
      </div>
      <div class="point">
        <div class="point-top-bar"></div>
        <span class="point-num">— 03 —</span>
        <div class="point-title">适兕的实践</div>
        <div class="point-desc">通过持续的内容输出与社区互动，推动开源知识平权</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">OPEN SOURCE · PREACHING SPIRIT</div>
    <div class="footer-right">CHAPTER TRANSITION</div>
  </div>
</div>
</body>
</html>
