

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>阅读背景与动机</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root {
  --primary: #2196F3;
  --cyan: #00BCD4;
  --gray: #B0BEC5;
  --dark: #0A1628;
  --darker: #060F1E;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1600px; height:900px; font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif; color:#E8EEF5; overflow:hidden; }
.wrapper { width:1600px; height:900px; position:relative; overflow:hidden; margin:0 auto; background:var(--darker); }
#bg { position:absolute; inset:0; z-index:0; }
#bg .bg-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
#bg .bg-overlay { position:absolute; inset:0; background: linear-gradient(180deg, rgba(6,15,30,0.80) 0%, rgba(6,15,30,0.55) 40%, rgba(6,15,30,0.70) 70%, rgba(6,15,30,0.90) 100%); }
#ct { position:absolute; inset:0; z-index:1; padding:50px 70px 44px; box-sizing:border-box; display:flex; flex-direction:column; }

.head { text-align:center; }
.title { font-size:76px; font-weight:900; letter-spacing:3px; color:#FFFFFF; text-shadow:0 0 24px rgba(33,150,243,0.55), 0 0 60px rgba(33,150,243,0.25); line-height:1.1; }
.divider { width:560px; height:2px; margin:26px auto 22px; background:linear-gradient(90deg, rgba(33,150,243,0) 0%, #2196F3 50%, rgba(33,150,243,0) 100%); box-shadow:0 0 14px rgba(33,150,243,0.9), 0 0 30px rgba(33,150,243,0.45); border-radius:2px; }
.subtitle { font-size:22px; font-weight:400; color:#B0BEC5; letter-spacing:1px; }

.connector { width:100%; height:1px; margin:26px 0 0; background:linear-gradient(90deg, rgba(33,150,243,0) 0%, rgba(33,150,243,0.55) 50%, rgba(33,150,243,0) 100%); box-shadow:0 0 6px rgba(33,150,243,0.4); }

.cards { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin:28px 0 0; }
.card { background:rgba(13,26,46,0.72); border:1px solid rgba(33,150,243,0.28); border-radius:14px; padding:22px 20px; box-shadow:0 8px 32px rgba(0,0,0,0.35); display:flex; flex-direction:column; align-items:flex-start; position:relative; overflow:hidden; }
.card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg, #2196F3 0%, #00BCD4 100%); box-shadow:0 0 12px rgba(33,150,243,0.7); }
.card .idx { font-size:12px; font-weight:700; color:#00BCD4; letter-spacing:2.5px; margin-bottom:10px; }
.card .icon { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg, rgba(33,150,243,0.22), rgba(0,188,212,0.14)); display:flex; align-items:center; justify-content:center; margin-bottom:14px; border:1px solid rgba(33,150,243,0.35); }
.card h3 { font-size:19px; font-weight:800; color:#FFFFFF; margin-bottom:8px; letter-spacing:0.5px; }
.card p { font-size:13.5px; font-weight:400; color:#B0BEC5; line-height:1.7; }

.footer { margin-top:auto; display:flex; align-items:stretch; justify-content:space-between; gap:32px; padding-top:24px; }
.narrative { flex:1; font-size:15px; line-height:1.9; color:#E0E8F0; font-weight:400; letter-spacing:0.3px; padding-right:24px; border-right:1px solid rgba(176,190,197,0.28); align-self:center; }
.data { display:flex; gap:38px; flex-shrink:0; align-items:center; }
.data .item { text-align:center; min-width:138px; }
.data .num { font-size:46px; font-weight:900; color:#2196F3; text-shadow:0 0 20px rgba(33,150,243,0.65); line-height:1.05; letter-spacing:0.5px; }
.data .label { font-size:11.5px; font-weight:500; color:#B0BEC5; margin-top:8px; letter-spacing:0.8px; line-height:1.55; }
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_section_bg.png" alt="抽象数据流网络背景">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">
    <div class="head">
      <div class="title"><span>阅读背景与动机</span></div>
      <div class="divider"></div>
      <div class="subtitle"><span>为什么在 2022 年 4 月重新审视开源许可证</span></div>
    </div>

    <div class="connector"></div>

    <div class="cards">
      <div class="card">
        <div class="idx"><span>01</span></div>
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h3><span>合规压力上升</span></h3>
        <p><span>国内企业与开发者对许可证合规意识快速提升。</span></p>
      </div>

      <div class="card">
        <div class="idx"><span>02</span></div>
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-1 1"/>
            <path d="M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l1-1"/>
          </svg>
        </div>
        <h3><span>供应链安全</span></h3>
        <p><span>Log4j 等事件后，开源依赖链治理成为焦点议题。</span></p>
      </div>

      <div class="card">
        <div class="idx"><span>03</span></div>
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h13a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3H3z"/>
            <path d="M6 4v16"/>
            <circle cx="17" cy="14" r="1.5"/>
          </svg>
        </div>
        <h3><span>商业化需求</span></h3>
        <p><span>开源项目商业化路径必须依赖许可证策略设计。</span></p>
      </div>

      <div class="card">
        <div class="idx"><span>04</span></div>
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <path d="M12 4v16"/>
            <path d="M4 12h16"/>
          </svg>
        </div>
        <h3><span>政策窗口期</span></h3>
        <p><span>国内推进信创与自主可控，许可证教育需求旺盛。</span></p>
      </div>
    </div>

    <div class="footer">
      <div class="narrative">
        <span>2022 年前后，开源生态正经历合规化、商业化和供应链安全的多重压力，系统理解许可证条款不再是律师专属功课，而是每个开发者的必修课。</span>
      </div>
      <div class="data">
        <div class="item">
          <div class="num"><span>91%</span></div>
          <div class="label"><span>全球开源采用率 · 企业级应用采用开源技术比例</span></div>
        </div>
        <div class="item">
          <div class="num"><span>+15%</span></div>
          <div class="label"><span>许可证纠纷年增 · 过去五年年均增长率</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
