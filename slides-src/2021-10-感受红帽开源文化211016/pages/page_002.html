<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>走进红帽</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --bg-dark: #263238;
  --bg-darker: #1a262c;
  --text-main: #ECEFF1;
  --text-muted: #90A4AE;
  --card-bg: rgba(31, 43, 50, 0.72);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@300;400;500&display=swap');

body {
  font-family: 'Roboto Mono', monospace;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

#bg .bg-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#bg .bg-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(22,31,36,0.92) 0%, rgba(22,31,36,0.78) 35%, rgba(22,31,36,0.35) 65%, rgba(22,31,36,0.55) 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 56px 64px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

.header-zone {
  width: 42%;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.chapter-row {
  display: flex;
  align-items: flex-start;
  gap: 22px;
}

.chapter-num {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 96px;
  line-height: 0.9;
  color: transparent;
  -webkit-text-stroke: 2px var(--primary);
  text-shadow: 0 0 24px rgba(33, 150, 243, 0.5);
  letter-spacing: -2px;
}

.chapter-label {
  font-family: 'Roboto Mono', monospace;
  font-weight: 400;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 6px;
  text-transform: uppercase;
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.chapter-label .vline {
  width: 36px;
  height: 1px;
  background: var(--accent);
  opacity: 0.7;
}

.title-main {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 56px;
  line-height: 1.1;
  color: var(--text-main);
  letter-spacing: 1px;
}

.title-sub {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 2px;
  line-height: 1.4;
}

.divider-accent {
  width: 64px;
  height: 2px;
  background: var(--primary);
  margin: 4px 0;
}

.narrative {
  font-family: 'Roboto Mono', monospace;
  font-weight: 300;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.85;
  max-width: 92%;
}

.mid-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 20px;
  padding-top: 24px;
}

.cards-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  background: var(--card-bg);
  border: 1px solid rgba(33, 150, 243, 0.22);
  border-left: 2px solid var(--primary);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  backdrop-filter: blur(4px);
}

.card .idx {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 2px;
}

.card .card-title {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 18px;
  color: var(--text-main);
  letter-spacing: 1px;
}

.card .card-text {
  font-family: 'Roboto Mono', monospace;
  font-weight: 300;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.7;
}

.bottom-zone {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gradient-divider {
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, transparent 0%, var(--primary) 30%, var(--accent) 70%, transparent 100%);
}

.footer-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
}

.footer-text .footer-left {
  color: var(--accent);
  letter-spacing: 4px;
  font-weight: 500;
}

.footer-text .footer-right {
  color: var(--text-muted);
  opacity: 0.7;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_002_section_bg.png" alt="章节封面背景">
    <div class="bg-overlay"></div>
  </div>
  <div id="ct">
    <div class="header-zone">
      <div class="chapter-row">
        <div class="chapter-num"><span>01</span></div>
        <div class="chapter-label">
          <span>CHAPTER</span>
          <span>分&nbsp;&nbsp;区&nbsp;&nbsp;序&nbsp;&nbsp;幕</span>
          <span class="vline"></span>
        </div>
      </div>
      <div class="title-main"><span>走进红帽</span></div>
      <div class="title-sub"><span>一家定义了现代开源商业模式的企业</span></div>
      <div class="divider-accent"></div>
      <div class="narrative">
        <span>红帽成立于1993年，是美国北卡罗来纳州里士满的一家开源软件公司，以企业级 Linux 发行版 RHEL 闻名，被视为开源运动走向主流商业的关键推动者。</span>
      </div>
    </div>

    <div class="mid-zone">
      <div class="cards-row">
        <div class="card">
          <span class="idx">/ 01</span>
          <div class="card-title"><span>为何选择红帽</span></div>
          <div class="card-text"><span>红帽是开源商业化最成功的范例，其文化具高度代表性。</span></div>
        </div>
        <div class="card">
          <span class="idx">/ 02</span>
          <div class="card-title"><span>本章聚焦</span></div>
          <div class="card-text"><span>公司背景、开源理念与在开源社区中的角色。</span></div>
        </div>
        <div class="card">
          <span class="idx">/ 03</span>
          <div class="card-title"><span>阅读线索</span></div>
          <div class="card-text"><span>从历史到文化，建立对红帽的完整认知框架。</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-zone">
      <div class="gradient-divider"></div>
      <div class="footer-text">
        <span class="footer-left"><span>一家定义了现代开源商业模式的企业</span></span>
        <span class="footer-right"><span>RED HAT · CHAPTER 01</span></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
