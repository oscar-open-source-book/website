<!DOCTYPE html>
<html lang="zh-Hans">
><head>
<meta charset="UTF-8">
<title>精彩分享回顾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

:root {
  --primary: #2196F3;
  --accent: #00BCD4;
  --text-main: #ECEFF1;
  --text-muted: #90A4AE;
  --bg-dark: #0A0E1A;
  --bg-mid: #10162A;
  --bg-card: rgba(33, 150, 243, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  color: var(--text-main);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse 1400px 700px at 50% 30%, #13294A 0%, #0A0E1A 60%, #060912 100%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 48px 80px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Background decorative elements */
#bg::before {
  content: '';
  position: absolute;
  top: -100px;
  left: -100px;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(33,150,243,0.15) 0%, transparent 70%);
}

#bg::after {
  content: '';
  position: absolute;
  bottom: -150px;
  right: -100px;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,188,212,0.12) 0%, transparent 70%);
}

/* Decorative grid overlay */
.bg-grid {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: 
    linear-gradient(rgba(33,150,243,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,150,243,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
}

/* Top label */
.top-label {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 4px;
}

.top-label .line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent));
}

.top-label .line.right {
  background: linear-gradient(90deg, var(--accent), transparent);
}

.top-label span {
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--accent);
  font-weight: 500;
  text-transform: uppercase;
}

/* Section number */
.section-num {
  font-size: 140px;
  font-weight: 900;
  line-height: 1;
  margin-top: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 8px;
  text-shadow: 0 0 60px rgba(33,150,243,0.3);
  position: relative;
}

.section-num::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

/* Main title */
.main-title {
  font-size: 56px;
  font-weight: 900;
  margin-top: 18px;
  letter-spacing: 8px;
  color: var(--text-main);
  text-align: center;
}

.main-title .underline {
  display: block;
  width: 120px;
  height: 3px;
  margin: 16px auto 0;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 2px;
}

.subtitle {
  font-size: 18px;
  color: var(--text-muted);
  margin-top: 14px;
  letter-spacing: 3px;
  font-weight: 300;
}

/* Silhouettes area */
.silhouettes {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 30px;
  margin-top: 20px;
  margin-bottom: 6px;
  position: relative;
}

.silhouettes::before {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(33,150,243,0.4), transparent);
}

.silhouette {
  width: 68px;
  height: 90px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.silhouette .head {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  opacity: 0.85;
  box-shadow: 0 0 20px rgba(33,150,243,0.4);
}

.silhouette .body {
  width: 56px;
  height: 64px;
  margin-top: -4px;
  background: linear-gradient(180deg, rgba(33,150,243,0.7) 0%, rgba(0,188,212,0.4) 100%);
  border-radius: 50% 50% 8px 8px / 40% 40% 8px 8px;
  clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
  opacity: 0.8;
}

.silhouette.mid .head {
  width: 22px;
  height: 22px;
}
.silhouette.mid .body {
  width: 50px;
  height: 58px;
}
.silhouette.mid { height: 80px; }

.silhouette .pulse {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(0,188,212,0.3);
  animation: pulse-ring 2.5s ease-out infinite;
}

@keyframes pulse-ring {
  0% { transform: translateX(-50%) scale(0.8); opacity: 0.8; }
  100% { transform: translateX(-50%) scale(1.6); opacity: 0; }
}

/* Sparkle dots around silhouettes */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}

/* Three columns */
.columns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  width: 100%;
  margin-top: 14px;
}

.col {
  background: var(--bg-card);
  border: 1px solid rgba(33,150,243,0.2);
  border-radius: 12px;
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(4px);
}

.col::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}

.col::after {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(33,150,243,0.1) 0%, transparent 70%);
}

.col .col-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.col .col-num {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.col .col-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 2px;
}

.col .col-desc {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  font-weight: 300;
}

.col .col-tag {
  display: inline-block;
  margin-top: 10px;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  color: var(--accent);
  border: 1px solid rgba(0,188,212,0.3);
  letter-spacing: 2px;
}

/* Decorative corner brackets */
.corner {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 2px solid var(--accent);
  opacity: 0.3;
  z-index: 1;
}

.corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
.corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
.corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div class="bg-grid"></div>
  <div id="ct">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="top-label">
      <div class="line"></div>
      <span>SECTION 02 / REVIEW</span>
      <div class="line right"></div>
    </div>

    <div class="section-num">02</div>

    <h1 class="main-title">
      <span>精彩分享回顾</span>
      <span class="underline"></span>
    </h1>

    <p class="subtitle">嘉宾洞见与社区共鸣的交汇时刻</p>

    <div class="silhouettes">
      <span class="sparkle" style="top:10px;left:20px;"></span>
      <span class="sparkle" style="top:40px;right:30px;"></span>
      <span class="sparkle" style="bottom:15px;left:50px;"></span>
      <span class="sparkle" style="top:20px;right:80px;"></span>

      <div class="silhouette left">
        <div class="pulse"></div>
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="silhouette mid">
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="silhouette right">
        <div class="pulse"></div>
        <div class="head"></div>
        <div class="body"></div>
      </div>
    </div>

    <div class="columns">
      <div class="col">
        <div class="col-head">
          <div class="col-num">01</div>
          <div class="col-title"><span>嘉宾阵容</span></div>
        </div>
        <div class="col-desc">
          <span>本期邀请多位资深开源贡献者与行业技术专家，跨越不同技术领域，齐聚一堂。</span>
        </div>
        <span class="col-tag">GUESTS</span>
      </div>
      <div class="col">
        <div class="col-head">
          <div class="col-num">02</div>
          <div class="col-title"><span>分享维度</span></div>
        </div>
        <div class="col-desc">
          <span>从技术实战到开源哲学，多维度展开深度讨论，呈现立体丰富的开源图景。</span>
        </div>
        <span class="col-tag">DIMENSIONS</span>
      </div>
      <div class="col">
        <div class="col-head">
          <div class="col-num">03</div>
          <div class="col-title"><span>现场氛围</span></div>
        </div>
        <div class="col-desc">
          <span>弹幕刷屏、连麦互动，社区成员热情参与全程，共鸣与火花交织不断。</span>
        </div>
        <span class="col-tag">VIBE</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
