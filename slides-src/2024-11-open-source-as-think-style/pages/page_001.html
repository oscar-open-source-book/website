

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源：一种思维方式</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #F5F5F5;
  --primary: #0D2137;
  --accent: #E67E22;
  --text: #0D2137;
  --text-muted: rgba(13, 33, 55, 0.62);
  --text-faint: rgba(13, 33, 55, 0.42);
  --line: rgba(13, 33, 55, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(180deg, #F8F8F8 0%, #ECECEC 100%);
}

#bg::before {
  content: '';
  position: absolute;
  top: -140px;
  right: -120px;
  width: 460px;
  height: 460px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(230, 126, 34, 0.07) 0%, transparent 65%);
}

#bg::after {
  content: '';
  position: absolute;
  bottom: -160px;
  left: -120px;
  width: 480px;
  height: 480px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(13, 33, 55, 0.05) 0%, transparent 65%);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 76px 72px 56px 72px;
  display: flex;
  flex-direction: column;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}

.eyebrow-mark {
  width: 40px;
  height: 1.5px;
  background: var(--accent);
  display: inline-block;
}

.eyebrow-text {
  font-size: 12px;
  letter-spacing: 0.30em;
  color: var(--accent);
  font-weight: 500;
  font-family: 'Inter', sans-serif;
}

.title {
  font-size: 78px;
  font-weight: 600;
  line-height: 1.08;
  color: var(--primary);
  letter-spacing: -0.015em;
  margin-bottom: 20px;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
}

.subtitle {
  font-size: 18px;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0.02em;
  margin-bottom: 50px;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
}

.body-grid {
  display: grid;
  grid-template-columns: 500px 880px;
  gap: 44px;
  align-items: start;
  flex: 1;
}

.info-list {
  display: flex;
  flex-direction: column;
  height: 490px;
  justify-content: space-around;
}

.info-item {
  position: relative;
  padding-left: 26px;
}

.info-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 11px;
  height: 11px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  background: transparent;
}

.info-num {
  display: block;
  font-size: 11px;
  letter-spacing: 0.26em;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 8px;
  font-family: 'Inter', sans-serif;
}

.info-text {
  display: block;
  font-size: 15px;
  line-height: 1.75;
  color: var(--text);
  font-weight: 400;
  font-family: 'Noto Sans SC', sans-serif;
}

.hero-wrap {
  position: relative;
  width: 880px;
  height: 490px;
  overflow: hidden;
}

.hero-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.footer {
  position: absolute;
  bottom: 34px;
  left: 72px;
  right: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: 0.20em;
  color: var(--text-faint);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
}

.footer-left {
  display: flex;
  gap: 36px;
}

.footer-right {
  font-family: 'Inter', sans-serif;
  letter-spacing: 0.26em;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="eyebrow">
      <span class="eyebrow-mark"></span>
      <span class="eyebrow-text">OPEN SOURCE · MINDSET</span>
    </div>

    <h1 class="title">开源：一种思维方式</h1>
    <p class="subtitle">2024·11 开源之书记录 · 分享与阅读笔记</p>

    <div class="body-grid">
      <div class="info-list">
        <div class="info-item">
          <span class="info-num">01 / THINKING</span>
          <span class="info-text">开源不只是代码——它是一套关于协作、共享、透明与信任的现代思维方式。</span>
        </div>
        <div class="info-item">
          <span class="info-num">02 / RECORD</span>
          <span class="info-text">本月记录——整理 2024 年 11 月一次线上分享会的核心观点与延伸阅读。</span>
        </div>
        <div class="info-item">
          <span class="info-num">03 / SPEAKER</span>
          <span class="info-text">分享者：适兕——以个人阅读路径为线索，还原这场关于开源布道的讨论。</span>
        </div>
      </div>

      <div class="hero-wrap">
        <img src="../images/page_001_hero.png" alt="开源主题抽象几何图形，半透明圆与细线交叠，藏蓝主色配暖橙点缀">
      </div>
    </div>

    <div class="footer">
      <div class="footer-left">
        <span>记录时间 2024-11</span>
        <span>主题：开源布道与阅读分享</span>
      </div>
      <div class="footer-right">COVER · 01</div>
    </div>
  </div>
</div>
</body>
</html>
