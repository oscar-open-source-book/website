

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>阅读分享实践指南</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D2137;
  --vermilion: #C23D2E;
  --cream: #F5F1EA;
  --text-main: #1a1a2e;
  --text-light: #5a5a6a;
  --text-muted: #7a7a8a;
  --border: #d5d0c8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  color: var(--text-main);
  background: var(--cream);
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--cream);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 60px;
  box-sizing: border-box;
  display: flex;
}

.left-col {
  width: 620px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 50px;
  border-right: 1px solid var(--border);
}

.kicker-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 32px;
}

.kicker {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--vermilion);
}

.kicker-line {
  flex: 1;
  height: 1px;
  background: var(--vermilion);
  opacity: 0.25;
}

.title {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 54px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--navy);
  margin-bottom: 20px;
}

.subtitle {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--text-light);
  margin-bottom: 36px;
}

.intro {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 14.5px;
  line-height: 1.8;
  color: var(--text-muted);
  margin-bottom: 48px;
  max-width: 500px;
}

.tags {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.tag {
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.tag-num {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--vermilion);
  min-width: 36px;
  line-height: 1.5;
}

.tag-content {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  color: var(--navy);
  line-height: 1.6;
}

.tag-content .label {
  font-weight: 600;
  color: var(--navy);
}

.tag-content .desc {
  color: var(--text-light);
  font-weight: 400;
}

.right-col {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 60px;
}

.hero-img {
  width: 800px;
  height: 595px;
  object-fit: contain;
  display: block;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">
    <div class="left-col">
      <div class="kicker-row">
        <span class="kicker">PART 02</span>
        <div class="kicker-line"></div>
      </div>
      <h1 class="title">阅读分享<br>实践指南</h1>
      <div class="subtitle">从一名读者，到一名布道者</div>
      <p class="intro">真正的开源布道者，往往是先深度阅读、再沉淀文字、最后走向公开场合的布道者；这一章给出读·写·讲三段可落地的路径。</p>
      <div class="tags">
        <div class="tag">
          <span class="tag-num">01</span>
          <span class="tag-content"><span class="label">读得深</span> <span class="desc">— 把经典与一手资料反复咀嚼，建立稳定的认知底座</span></span>
        </div>
        <div class="tag">
          <span class="tag-num">02</span>
          <span class="tag-content"><span class="label">写得清</span> <span class="desc">— 把思考落成文字，是分享与自我校验的第一站</span></span>
        </div>
        <div class="tag">
          <span class="tag-num">03</span>
          <span class="tag-content"><span class="label">讲得透</span> <span class="desc">— 从个人笔记走向公开舞台，让认知真正流动</span></span>
        </div>
      </div>
    </div>
    <div class="right-col">
      <img class="hero-img" src="../images/page_006_hero.png" alt="章节主视觉">
    </div>
  </div>
</div>
</body>
</html>
