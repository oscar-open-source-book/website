

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一章 · 年度回顾</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#061024;
  --bg-mid:#0A1628;
  --bg-card:#0D1F3C;
  --primary:#2196F3;
  --accent:#00E5FF;
  --text:#ECEFF1;
  --text-dim:#90A4AE;
  --card-bg:rgba(33,150,243,0.07);
  --card-border:rgba(33,150,243,0.28);
  --kpi-border:rgba(33,150,243,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg-deep);overflow:hidden;}
.wrapper{width:1600px;height:900px;position:relative;overflow:hidden;margin:0 auto;}
#bg{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#061024 0%,#0A1628 45%,#0D1F3C 100%);}
.grid-deco{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(33,150,243,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(33,150,243,0.045) 1px,transparent 1px);background-size:48px 48px;z-index:0;}
#ct{position:absolute;inset:0;z-index:1;padding:54px 60px;box-sizing:border-box;display:flex;flex-direction:column;}

.head{display:grid;grid-template-columns:560px 1fr;gap:44px;align-items:center;height:440px;}
.left-col{display:flex;flex-direction:column;justify-content:center;gap:16px;}
.chapter-num{font-family:'Roboto Mono',monospace;font-size:150px;font-weight:700;color:var(--accent);line-height:0.95;letter-spacing:-6px;text-shadow:0 0 40px rgba(0,229,255,0.45),0 0 8px rgba(0,229,255,0.3);}
.title-bar{width:64px;height:3px;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:2px;}
.chapter-title{font-family:'Roboto Mono',monospace;font-size:36px;font-weight:500;color:var(--text);letter-spacing:2px;}
.chapter-sub{font-size:15px;font-weight:300;color:var(--text-dim);line-height:1.75;max-width:500px;}

.right-col{position:relative;display:flex;align-items:center;justify-content:center;}
.hero-frame{position:relative;padding:12px;}
.hero-frame::before{content:"";position:absolute;left:-12px;top:40px;right:-12px;bottom:40px;border:1px solid rgba(0,229,255,0.18);border-radius:8px;pointer-events:none;}
.hero-img{display:block;width:880px;height:492px;object-fit:cover;border-radius:6px;box-shadow:0 20px 70px rgba(0,229,255,0.14),0 0 0 1px rgba(33,150,243,0.25);}
.hero-corner{position:absolute;width:18px;height:18px;border:2px solid var(--accent);}
.hero-corner.tl{top:0;left:0;border-right:none;border-bottom:none;}
.hero-corner.tr{top:0;right:0;border-left:none;border-bottom:none;}
.hero-corner.bl{bottom:0;left:0;border-right:none;border-top:none;}
.hero-corner.br{bottom:0;right:0;border-left:none;border-top:none;}

.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;padding:15px 18px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.card-h{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;color:var(--accent);margin-bottom:7px;letter-spacing:1.5px;}
.card-d{font-size:13px;color:var(--text);line-height:1.6;font-weight:300;}

.kpi-row{display:grid;grid-template-columns:260px 260px 1fr;gap:20px;margin-top:18px;align-items:center;}
.kpi{background:rgba(13,31,60,0.65);border:1px solid var(--kpi-border);border-radius:6px;padding:12px 18px;display:flex;align-items:center;gap:14px;}
.kpi-num{font-family:'Roboto Mono',monospace;font-size:30px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-1px;}
.kpi-info{display:flex;flex-direction:column;gap:3px;}
.kpi-label{font-size:12.5px;color:var(--text);font-weight:500;}
.kpi-desc{font-size:11.5px;color:var(--text-dim);font-weight:300;line-height:1.4;}

.summary{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--text-dim);font-weight:300;line-height:1.7;letter-spacing:0.3px;}
.summary-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent);flex-shrink:0;}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div class="grid-deco"></div>
  <div id="ct">
    <div class="head">
      <div class="left-col">
        <div class="chapter-num">01</div>
        <div class="title-bar"></div>
        <div class="chapter-title">第一章 · 年度回顾</div>
        <div class="chapter-sub">回望2021，用数据与故事定义我们的开源轨迹</div>
      </div>
      <div class="right-col">
        <div class="hero-frame">
          <span class="hero-corner tl"></span>
          <span class="hero-corner tr"></span>
          <span class="hero-corner bl"></span>
          <span class="hero-corner br"></span>
          <img class="hero-img" src="../images/page_002_section_bg.png" alt="时间轴与章节标识构成的科技感背景">
        </div>
      </div>
    </div>

    <div class="preview">
      <div class="card">
        <div class="card-h"><span>关键节点</span></div>
        <div class="card-d"><span>梳理年度里程碑，从首次 PR 到大型分享会</span></div>
      </div>
      <div class="card">
        <div class="card-h"><span>阅读清单</span></div>
        <div class="card-d"><span>汇总全年精读开源书籍与重要技术文献</span></div>
      </div>
      <div class="card">
        <div class="card-h"><span>社区足迹</span></div>
        <div class="card-d"><span>回顾参与的社区活动、会议与线上分享</span></div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-num"><span>320+</span></div>
        <div class="kpi-info">
          <div class="kpi-label"><span>提交次数</span></div>
          <div class="kpi-desc"><span>全年代码与文档贡献</span></div>
        </div>
      </div>
      <div class="kpi">
        <div class="kpi-num"><span>6 场</span></div>
        <div class="kpi-info">
          <div class="kpi-label"><span>参与会议</span></div>
          <div class="kpi-desc"><span>线上线下开源活动</span></div>
        </div>
      </div>
      <div class="summary">
        <span class="summary-dot"></span>
        <span>从每一次代码提交，到每一场分享布道，每一页都是开源成长路上真实的足迹。</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
