

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之书</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700;900&family=Roboto+Mono:wght@300;400;500&display=font-family" rel="stylesheet">
<style>
:root {
  --bg-dark: #1A1A2E;
  --mint: #A8E6CF;
  --electric: #39FF14;
  --text: #E6EAF0;
  --dim: #8892A0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Roboto Mono', monospace; color: var(--text); }
.wrapper {
  width: 1600px; height: 900px;
  position: relative; overflow: hidden;
  margin: 0 auto;
  background: var(--bg-dark);
}
#bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.bg-photo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.42;
}
.bg-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(26,26,46,0.45) 0%, rgba(26,26,46,0.88) 65%, rgba(26,26,46,0.98) 100%);
}
#ct {
  position: absolute; inset: 0; z-index: 1;
  padding: 60px;
  box-sizing: border-box;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.title-block {
  text-align: center;
  margin-bottom: 46px;
}
.title-main {
  font-family: 'Fira Code', monospace;
  font-weight: 900;
  font-size: 130px;
  color: var(--electric);
  text-shadow: 0 0 30px rgba(57,255,20,0.65), 0 0 60px rgba(57,255,20,0.35);
  letter-spacing: 12px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.cursor {
  display: inline-block;
  width: 16px; height: 112px;
  background: var(--electric);
  box-shadow: 0 0 18px var(--electric);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.title-sub {
  font-family: 'Roboto Mono', monospace;
  font-weight: 400;
  font-size: 20px;
  color: var(--mint);
  margin-top: 22px;
  letter-spacing: 3px;
  line-height: 1.8;
}
.title-sub-line {
  display: block;
  color: var(--dim);
  font-size: 12px;
  margin-top: 8px;
  letter-spacing: 2px;
}
.concepts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  width: 1480px;
  margin-bottom: 38px;
}
.concept {
  border: 1px solid rgba(168,230,207,0.28);
  background: rgba(26,26,46,0.72);
  padding: 26px 24px;
  position: relative;
  box-shadow: 0 0 24px rgba(57,255,20,0.06);
  backdrop-filter: blur(2px);
}
.concept::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 70px; height: 3px;
  background: var(--electric);
  box-shadow: 0 0 10px var(--electric);
}
.concept-title {
  font-family: 'Fira Code', monospace;
  font-weight: 700;
  font-size: 22px;
  color: var(--mint);
  margin-bottom: 12px;
  line-height: 1.4;
}
.concept-title .en {
  display: block;
  font-size: 11px;
  color: var(--dim);
  font-weight: 400;
  margin-top: 4px;
  letter-spacing: 1.5px;
}
.concept-text {
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.75;
  opacity: 0.9;
}
.footer-bar {
  width: 1480px;
  border-top: 1px solid rgba(168,230,207,0.22);
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--dim);
  letter-spacing: 1px;
  font-family: 'Roboto Mono', monospace;
}
.footer-bar .k { color: var(--mint); margin-right: 6px; }
.footer-bar .v { color: var(--electric); margin-right: 6px; }
</style>
</head>
<body>
<div class="wrapper">
<div id="bg">
  <img class="bg-photo" src="../images/page_001_hero.png" alt="开源之书封面主视觉：终端代码雨与荧光光标">
  <div class="bg-overlay"></div>
</div>
<div id="ct">
  <div class="title-block">
    <div class="title-main"><span>开源之书</span><span class="cursor"></span></div>
    <div class="title-sub">
      <span>开源布道与阅读分享 · 2021年8月记录</span>
      <span class="title-sub-line">&gt; open_source_library / README.md &nbsp;|&nbsp; loading...</span>
    </div>
  </div>
  <div class="concepts">
    <div class="concept">
      <div class="concept-title"><span>以书为舟</span><span class="en">// sail by book</span></div>
      <div class="concept-text"><span>通过经典开源著作深入理解自由软件的哲学与工程实践。</span></div>
    </div>
    <div class="concept">
      <div class="concept-title"><span>布道开源</span><span class="en">// evangelize the source</span></div>
      <div class="concept-text"><span>将阅读中的思想火花转化为可传播的知识与代码贡献。</span></div>
    </div>
    <div class="concept">
      <div class="concept-title"><span>适兕之道</span><span class="en">// the dao of open source</span></div>
      <div class="concept-text"><span>开源之道角色视角下的一次深度阅读笔记与心得分享。</span></div>
    </div>
  </div>
  <div class="footer-bar">
    <div><span class="k">[ 阅读时长 ]</span><span class="v">约 6 周</span>系统性阅读与笔记整理</div>
    <div><span class="k">[ 涉及书籍 ]</span><span class="v">8 册</span>从哲学到工程实践</div>
    <div><span class="k">[ 分享日期 ]</span><span class="v">2021-08</span>开源之道读书会</div>
  </div>
</div>
</div>
</body>
</html>
