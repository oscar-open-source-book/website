

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>分享与传播</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --bg-dark: #1A1A2E;
  --mint: #A8E6CF;
  --neon: #39FF14;
  --text-main: #E0E0E0;
  --text-dim: #888899;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto Mono', monospace;
  color: var(--text-main);
  background: var(--bg-dark);
  overflow: hidden;
}

.wrapper {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: var(--bg-dark);
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 50px 60px;
  box-sizing: border-box;
}

.hero-section {
  position: relative;
  width: 1480px;
  height: 460px;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid rgba(168, 230, 207, 0.3);
}

.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(26, 26, 46, 0.88) 0%, rgba(26, 26, 46, 0.45) 55%, rgba(26, 26, 46, 0.2) 100%);
}

.hero-content {
  position: relative;
  z-index: 2;
  padding: 38px 50px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.chapter-tag {
  font-family: 'Fira Code', monospace;
  font-size: 16px;
  color: var(--neon);
  letter-spacing: 2px;
  margin-bottom: 16px;
}

.chapter-tag .blink {
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.chapter-title {
  font-family: 'Fira Code', monospace;
  font-size: 76px;
  font-weight: 700;
  color: var(--mint);
  text-shadow: 0 0 20px rgba(168, 230, 207, 0.55), 0 0 40px rgba(57, 255, 20, 0.25);
  letter-spacing: 6px;
  line-height: 1.1;
}

.chapter-subtitle {
  font-family: 'Fira Code', monospace;
  font-size: 19px;
  color: var(--mint);
  opacity: 0.88;
  margin-top: 14px;
  letter-spacing: 1px;
}

.hero-footer {
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  color: var(--neon);
  opacity: 0.7;
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-footer .line {
  flex: 0 0 120px;
  height: 1px;
  background: var(--neon);
  opacity: 0.5;
}

.three-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 22px;
}

.col-card {
  background: rgba(168, 230, 207, 0.05);
  border: 1px solid rgba(168, 230, 207, 0.2);
  border-left: 3px solid var(--neon);
  border-radius: 6px;
  padding: 16px 22px;
  position: relative;
}

.col-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.col-num {
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  color: var(--neon);
  font-weight: 600;
}

.col-title {
  font-family: 'Fira Code', monospace;
  font-size: 20px;
  font-weight: 600;
  color: var(--mint);
}

.col-text {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-main);
  opacity: 0.85;
}

.narrative {
  margin-top: 18px;
  font-family: 'Roboto Mono', monospace;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text-main);
  opacity: 0.8;
  padding: 10px 20px;
  border-left: 2px solid var(--mint);
  background: rgba(168, 230, 207, 0.03);
  border-radius: 0 4px 4px 0;
}

.terminal-prompt {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Fira Code', monospace;
  font-size: 15px;
  color: var(--neon);
}

.terminal-prompt .prompt-sym {
  color: var(--mint);
  font-weight: 700;
}

.terminal-prompt .caret {
  display: inline-block;
  width: 10px;
  height: 18px;
  background: var(--neon);
  animation: blink 1s infinite;
}
</style>
</head>
<body>
<div class="wrapper">
<div id="bg"></div>
<div id="ct">
  <div class="hero-section">
    <img class="hero-img" src="../images/page_008_wave_bg.png" alt="荧光绿知识波纹从中心向外扩散">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div>
        <div class="chapter-tag"><span>&gt; Chapter_04<span class="blink">_</span></span></div>
        <h1 class="chapter-title"><span>分享与传播</span></h1>
        <div class="chapter-subtitle"><span>从一个人读懂到一群人共鸣——开源布道的方法论</span></div>
      </div>
      <div class="hero-footer">
        <span class="line"></span>
        <span>Ripples of Knowledge · Spreading Ideas Across the Network</span>
      </div>
    </div>
  </div>

  <div class="three-cols">
    <div class="col-card">
      <div class="col-header">
        <span class="col-num">$ 01</span>
        <span class="col-title">布道价值</span>
      </div>
      <div class="col-text"><span>知识只有被传播才能产生复利，开源精神需要持续的故事讲述者。</span></div>
    </div>
    <div class="col-card">
      <div class="col-header">
        <span class="col-num">$ 02</span>
        <span class="col-title">多元形式</span>
      </div>
      <div class="col-text"><span>从读书会到技术博客再到直播分享，选择适合自己的表达方式。</span></div>
    </div>
    <div class="col-card">
      <div class="col-header">
        <span class="col-num">$ 03</span>
        <span class="col-title">社区共建</span>
      </div>
      <div class="col-text"><span>分享不是单向输出，而是激发对话、连接同道、凝聚共识的过程。</span></div>
    </div>
  </div>

  <div class="narrative">
    <span>阅读之后如何让更多人受益于这些知识？这一节聚焦开源布道的方法论，探讨如何将个人理解转化为集体智慧。</span>
  </div>

  <div class="terminal-prompt">
    <span class="prompt-sym">$</span>
    <span>Enter ↵ 开始分享</span>
    <span class="caret"></span>
  </div>
</div>
</div>
</body>
</html>
