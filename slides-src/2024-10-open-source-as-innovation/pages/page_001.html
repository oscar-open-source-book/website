

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>开源之道·以开放铸创新</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --primary: #2196F3;
    --accent: #00BCD4;
    --accent-light: #4DD0E1;
    --dark-bg: #2D3748;
    --deep-night: #0A0F1A;
    --text-main: #FFFFFF;
    --text-dim: #B0BEC5;
    --text-muted: rgba(255, 255, 255, 0.65);
    --text-faint: rgba(255, 255, 255, 0.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--deep-night);
    color: var(--text-main);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .wrapper {
    width: 1600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
  }

  #bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg,
      rgba(10, 15, 26, 0.96) 0%,
      rgba(13, 22, 38, 0.90) 35%,
      rgba(20, 34, 58, 0.68) 70%,
      rgba(33, 150, 243, 0.30) 100%);
  }

  #ct {
    position: absolute;
    inset: 0;
    z-index: 1;
    padding: 60px 60px 50px 60px;
  }

  /* ── Top tagline ── */
  .top-strip {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 96px;
  }
  .brand-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--primary));
    box-shadow: 0 0 20px var(--accent), 0 0 6px rgba(77, 208, 225, 0.9);
    flex-shrink: 0;
  }
  .brand-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.4em;
    color: var(--text-main);
    text-transform: uppercase;
  }
  .brand-line {
    flex: 1;
    max-width: 320px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, rgba(255, 255, 255, 0) 100%);
  }

  /* ── Hero title ── */
  .hero-title {
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 108px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.015em;
    color: var(--text-main);
    text-shadow: 0 4px 40px rgba(0, 0, 0, 0.55);
    margin-bottom: 42px;
  }
  .title-glow {
    background: linear-gradient(90deg,
      #FFFFFF 0%,
      #FFFFFF 42%,
      var(--accent-light) 68%,
      var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-mark {
    color: var(--accent);
    -webkit-text-fill-color: var(--accent);
    font-weight: 400;
    margin: 0 0.02em;
    opacity: 0.95;
  }

  .hero-subtitle {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 22px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    margin-bottom: 74px;
  }
  .subtitle-date {
    font-weight: 600;
    color: var(--accent-light);
    letter-spacing: 0.28em;
    font-size: 21px;
  }
  .subtitle-divider {
    width: 48px;
    height: 1px;
    background: var(--accent);
    opacity: 0.85;
  }
  .subtitle-en {
    letter-spacing: 0.22em;
    font-size: 20px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.78);
  }

  /* ── Info bar ── */
  .info-bar {
    display: flex;
    gap: 32px;
    margin-bottom: 40px;
  }
  .info-item {
    flex: 1;
    padding: 24px 26px 24px 28px;
    background: linear-gradient(135deg, rgba(33, 150, 243, 0.12), rgba(0, 188, 212, 0.04));
    border-left: 2px solid var(--accent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative;
  }
  .info-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: rgba(33, 150, 243, 0.20);
    color: var(--accent-light);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    margin-bottom: 16px;
    border: 1px solid rgba(77, 208, 225, 0.35);
  }
  .info-tag-dot {
    width: 4px;
    height: 4px;
    background: var(--accent-light);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-light);
  }
  .info-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .info-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* ── Footer meta ── */
  .footer-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 48px;
    padding-top: 22px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .meta-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  .meta-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--accent-light);
    letter-spacing: 0.14em;
  }
  .meta-sep {
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 50%;
  }

  /* ── Decorative SVG ── */
  .deco-corner {
    position: absolute;
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
  }
  .deco-corner.tl {
    top: 24px;
    right: 24px;
  }
  .deco-corner.br {
    bottom: 24px;
    left: 24px;
  }
  .deco-corner .br-l {
    stroke: var(--accent);
  }

  .page-num {
    position: absolute;
    right: 60px;
    bottom: 14px;
    font-size: 10px;
    letter-spacing: 0.5em;
    color: rgba(255, 255, 255, 0.28);
    z-index: 2;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg">
    <img class="bg-photo" src="../images/page_001_hero.png" alt="开放式代码网络主视觉">
    <div class="bg-overlay"></div>
  </div>

  <div id="ct">
    <!-- Top brand strip -->
    <div class="top-strip">
      <span class="brand-dot"></span>
      <span class="brand-label">开源 · 创新 · 共建</span>
      <div class="brand-line"></div>
    </div>

    <!-- Hero title -->
    <h1 class="hero-title">
      <span class="title-glow">开源之道<span class="title-mark">·</span>以开放铸创新</span>
    </h1>

    <!-- Subtitle -->
    <div class="hero-subtitle">
      <span class="subtitle-date">2024·10</span>
      <span class="subtitle-divider"></span>
      <span class="subtitle-en">OPEN SOURCE AS INNOVATION</span>
    </div>

    <!-- Info bar -->
    <div class="info-bar">
      <div class="info-item">
        <div class="info-tag"><span class="info-tag-dot"></span><span>50 YEARS</span></div>
        <div class="info-title">开源五十年</div>
        <div class="info-desc">从 GNU 计划到 AI 模型开源浪潮<br>半个世纪的时代回响</div>
      </div>
      <div class="info-item">
        <div class="info-tag"><span class="info-tag-dot"></span><span>NEW PARADIGM</span></div>
        <div class="info-title">创新新范式</div>
        <div class="info-desc">代码 · 协议 · 模型 · 数据<br>共同构成公共基础设施</div>
      </div>
      <div class="info-item">
        <div class="info-tag"><span class="info-tag-dot"></span><span>SHARE & BUILD</span></div>
        <div class="info-title">分享与共建</div>
        <div class="info-desc">一份阅读记录<br>一次布道之旅</div>
      </div>
    </div>

    <!-- Footer meta -->
    <div class="footer-meta">
      <div class="meta-item">
        <span class="meta-label">主题</span>
        <span class="meta-value">OPEN SOURCE AS INNOVATION</span>
      </div>
      <div class="meta-sep"></div>
      <div class="meta-item">
        <span class="meta-label">时间</span>
        <span class="meta-value">2024·10</span>
      </div>
    </div>
  </div>

  <!-- Decorative corners -->
  <svg class="deco-corner tl" width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="60" fill="none" stroke="#2196F3" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.55"/>
    <circle cx="70" cy="70" r="42" fill="none" stroke="#00BCD4" stroke-width="0.6" opacity="0.4"/>
    <circle cx="70" cy="10" r="2.5" fill="#4DD0E1"/>
    <circle cx="130" cy="70" r="2" fill="#2196F3"/>
    <circle cx="10" cy="70" r="1.5" fill="#4DD0E1" opacity="0.7"/>
    <line x1="70" y1="10" x2="130" y2="70" stroke="#4DD0E1" stroke-width="0.5" opacity="0.35"/>
    <line x1="70" y1="10" x2="10" y2="70" stroke="#4DD0E1" stroke-width="0.5" opacity="0.35"/>
    <text x="70" y="73" font-family="monospace" font-size="8" fill="#4DD0E1" opacity="0.45" text-anchor="middle">{ } &lt;/&gt;</text>
  </svg>

  <svg class="deco-corner br" width="120" height="120" viewBox="0 0 120 120">
    <line class="br-l" x1="10" y1="10" x2="70" y2="10" stroke-width="1"/>
    <line class="br-l" x1="10" y1="10" x2="10" y2="70" stroke-width="1"/>
    <line class="br-l" x1="24" y1="10" x2="24" y2="24" stroke-width="0.6" opacity="0.6"/>
    <line class="br-l" x1="10" y1="24" x2="24" y2="24" stroke-width="0.6" opacity="0.6"/>
    <text x="30" y="26" font-family="monospace" font-size="9" fill="#4DD0E1" opacity="0.5">&lt;/&gt;</text>
    <text x="30" y="40" font-family="monospace" font-size="9" fill="#2196F3" opacity="0.35">{ }</text>
    <text x="30" y="54" font-family="monospace" font-size="9" fill="#4DD0E1" opacity="0.25">$ _</text>
  </svg>

  <div class="page-num">01 / 01</div>
</div>
</body>
</html>
