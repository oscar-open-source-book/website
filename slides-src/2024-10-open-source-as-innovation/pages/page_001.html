

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开源之道·以开放铸创新</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #2D3748;
  color: #E6EBF2;
}
body { width: 1600px; height: 900px; margin: 0 auto; overflow: hidden; }

.wrapper {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0 auto;
}

#bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: #2D3748;
}
#bg::before {
  content: '';
  position: absolute;
  left: 40%;
  top: 10%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(33,150,243,0.18) 0%, rgba(33,150,243,0) 70%);
  pointer-events: none;
}
#bg::after {
  content: '';
  position: absolute;
  right: 10%;
  bottom: 20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0,188,212,0.14) 0%, rgba(0,188,212,0) 70%);
  pointer-events: none;
}

#ct {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 56px 60px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}

/* Top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  letter-spacing: 0.2em;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-mark {
  color: #2196F3;
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}
.brand-text {
  font-size: 12px;
  font-weight: 600;
  color: rgba(230,235,242,0.55);
  letter-spacing: 0.32em;
}
.meta-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.meta-item {
  font-size: 12px;
  font-weight: 500;
  color: rgba(230,235,242,0.6);
  letter-spacing: 0.28em;
}
.meta-sep {
  width: 1px;
  height: 12px;
  background: rgba(255,255,255,0.18);
}

/* Main row */
.main {
  flex: 1;
  display: flex;
  gap: 60px;
  padding-top: 50px;
}

/* Title column */
.title-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-right: 12px;
}
.title-inner {
  display: flex;
  gap: 26px;
  align-items: stretch;
}
.accent-line {
  width: 3px;
  background: linear-gradient(180deg, #2196F3 0%, #00BCD4 100%);
  flex-shrink: 0;
  border-radius: 2px;
}
.title-text {
  font-size: 72px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: 0.01em;
  color: #F7FAFC;
  text-shadow: 0 4px 30px rgba(0,0,0,0.35);
}
.title-text .dot {
  color: #00BCD4;
  font-weight: 700;
  margin-right: 4px;
}

.english-subtitle {
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.32em;
  color: rgba(230,235,242,0.6);
  margin-top: 46px;
  text-transform: uppercase;
}

.intro {
  font-size: 15px;
  font-weight: 300;
  color: rgba(230,235,242,0.5);
  font-style: italic;
  line-height: 1.9;
  margin-top: 18px;
  max-width: 460px;
}

/* Hero image */
.hero-photo {
  flex: 0 0 912px;
  height: 514px;
  background: #1A202C;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(33,150,243,0.14);
}
.hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Timeline */
.timeline {
  margin-top: 44px;
  padding-top: 26px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 30px;
}
.timeline-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(0,188,212,0.85);
  letter-spacing: 0.36em;
  white-space: nowrap;
}
.timeline-track {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(33,150,243,0.4) 0%, rgba(0,188,212,0.15) 100%);
  position: relative;
}
.timeline-track::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translate(-3px, -50%);
  width: 7px;
  height: 7px;
  background: #2196F3;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(33,150,243,0.8);
}
.timeline-track::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translate(3px, -50%);
  width: 7px;
  height: 7px;
  background: #00BCD4;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(0,188,212,0.8);
}
.timeline-year {
  font-size: 13px;
  font-weight: 500;
  color: rgba(230,235,242,0.6);
  letter-spacing: 0.24em;
}

/* Cards */
.cards {
  display: flex;
  gap: 20px;
  margin-top: 36px;
}
.card {
  flex: 1;
  padding: 20px 22px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 4px;
  position: relative;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}
.card-num {
  font-size: 20px;
  font-weight: 700;
  color: #2196F3;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  color: #F7FAFC;
  letter-spacing: 0.06em;
}
.card-body {
  font-size: 12.5px;
  font-weight: 300;
  color: rgba(230,235,242,0.55);
  line-height: 1.75;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>
<div class="wrapper">
  <div id="bg"></div>
  <div id="ct">

    <div class="top-bar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-text">OPEN SOURCE AS INNOVATION</span>
      </div>
      <div class="meta-right">
        <span class="meta-item">2024 · 10</span>
        <span class="meta-sep"></span>
        <span class="meta-item">READING · TALKING</span>
      </div>
    </div>

    <div class="main">
      <div class="title-column">
        <div class="title-inner">
          <div class="accent-line"></div>
          <div class="title-text">
            <div>开源之道</div>
            <div><span class="dot">·</span>以开放铸创新</div>
          </div>
        </div>
        <div class="english-subtitle">Open Source as Innovation</div>
        <div class="intro">围绕"开源作为创新引擎"的 2024 年 10 月阅读分享与布道活动记录</div>
      </div>
      <div class="hero-photo">
        <img src="../images/page_001_hero.png" alt="开放式代码网络节点与光晕，全球网格与代码字符">
      </div>
    </div>

    <div class="timeline">
      <span class="timeline-label">TIMELINE</span>
      <span class="timeline-track"></span>
      <span class="timeline-year">2024 · 10</span>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-head">
          <span class="card-num">01</span>
          <span class="card-title">开源五十年</span>
        </div>
        <div class="card-body">从 GNU 计划到 AI 模型开源浪潮的时代回响</div>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="card-num">02</span>
          <span class="card-title">创新新范式</span>
        </div>
        <div class="card-body">代码、协议、模型、数据共同构成公共基础设施</div>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="card-num">03</span>
          <span class="card-title">分享与共建</span>
        </div>
        <div class="card-body">一份阅读记录，一次布道之旅</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
