name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # deploy job 查 run API 取 head_sha 需要
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true, fetch-depth: 1}
      - name: Fetch slides assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-slides.sh
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: peaceiris/actions-hugo@v3
        with: {hugo-version: '0.164.0', extended: true}
      - run: npm install
      - name: Build with Hugo
        run: |
          hugo build --minify || {
           # /media 重复发布是 Hugo Blox 0.12.0 已知 bug（exit code 1）
           # 但 public/ 已完整生成，检查后放行
            if [ -f public/index.html ] && [ -d public/events ]; then
             echo "Build output OK (known /media warning)"
              exit 0
            fi
              echo "Build output missing — real failure"
            exit 1
            }
      - name: Build search index
        run: npx pagefind --site public   
      - name: Slim publish assets
        run: python3 scripts/slim_publish_assets.py
      - name: Publish size report
        run: du -sh public || true  
      # 产物哨兵：把本次提交 sha 写进 public/，deploy 后由线上回读比对。
      # 目的：Hugo Blox 的 public/media 重复发布是已知 bug，上面用容错分支放行；
      # 但若 upload-pages-artifact 被 skip 或上传空目录，CI 仍可能显示绿色、
      # 线上继续跑旧内容——这种静默降级比构建失败更危险。
      - name: Write build sentinel
        run: |
          test -f public/index.html || { echo "::error::public/index.html 缺失"; exit 1; }
          test -d public/events || { echo "::error::public/events 缺失"; exit 1; }
          echo "${{ github.sha }}" > public/build-sha.txt
          echo "sentinel = ${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with: {path: ./public}  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
      # 部署后回读线上哨兵，确认线上跑的确实是本次提交的产物。
      # Pages 有 CDN 传播延迟，最多重试 8 次（约 2 分钟）。
      - name: Verify deployed build (sentinel check)
        run: |
          # 这里的 github.sha 为空、build job 的 outputs 也没传过来（都实测过），
          # 所以直接查 API 拿本次 run 的 head_sha —— 最可靠。
          EXPECT=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])" || true)
          if [ -z "$EXPECT" ]; then
            echo "::error::无法取得本次 run 的 head_sha，哨兵校验中止"
            exit 1
          fi
          echo "expect = $EXPECT"
          BASE="https://osbook.opensourceway.blog"
          for i in $(seq 1 8); do
            GOT=$(curl -fsS --max-time 15 "$BASE/build-sha.txt?cb=$RANDOM$i" || true)
            if [ "$GOT" = "$EXP" ]; then
              echo "✅ 线上产物就是本次提交 $EXP"
              exit 0
            fi
            echo "attempt $i: got '${GOT:-<empty>}' expected '$EXP' — retry in 15s"
            sleep 15
          done
          echo "::error::线上哨兵与本次提交不一致（got '${GOT:-<empty>}' expected '$EXP'）——artifact 可能被 skip 或上传了旧目录"
          exit 1
