<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Noto Serif SC, Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111D32"/>
      <stop offset="100%" stop-color="#1B3B6B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E7DCC7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D9A441"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="60" y="58" fill="#F5F0E8" font-size="28" font-weight="700">书店二当家 Agent：证据 → 假设 → 策略 → 行动 → 进化</text>
  <text x="60" y="92" fill="#B4A078" font-size="16">目标不是“猜准偏好”，而是维护一套可解释、可修正、可拒绝的服务策略。</text>

  <rect x="60" y="140" width="200" height="110" rx="18" fill="url(#card)" stroke="#D9A441" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" fill="#1B3B6B" font-size="20" font-weight="700">读者信号</text>
  <text x="160" y="212" text-anchor="middle" fill="#1B3B6B" font-size="14">停留 / 拿起 / 询问 / 放回</text>

  <rect x="310" y="140" width="210" height="110" rx="18" fill="url(#card)" stroke="#D9A441" stroke-width="2"/>
  <text x="415" y="180" text-anchor="middle" fill="#1B3B6B" font-size="20" font-weight="700">证据账本</text>
  <text x="415" y="212" text-anchor="middle" fill="#1B3B6B" font-size="14">只记录事实，不急于下结论</text>

  <rect x="570" y="140" width="210" height="110" rx="18" fill="url(#card)" stroke="#D9A441" stroke-width="2"/>
  <text x="675" y="180" text-anchor="middle" fill="#1B3B6B" font-size="20" font-weight="700">假设生成</text>
  <text x="675" y="212" text-anchor="middle" fill="#1B3B6B" font-size="14">读者在找答案、确认、反驳？</text>

  <rect x="830" y="140" width="310" height="110" rx="18" fill="url(#card)" stroke="#D9A441" stroke-width="2"/>
  <text x="985" y="180" text-anchor="middle" fill="#1B3B6B" font-size="20" font-weight="700">策略检查 + 二当家行动</text>
  <text x="985" y="212" text-anchor="middle" fill="#1B3B6B" font-size="14">可解释推荐、引导提问、调整书架</text>

  <path d="M260 195 H310" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M520 195 H570" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 195 H830" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="260" height="150" rx="18" fill="#1F3559" stroke="#D9A441" stroke-width="2"/>
  <text x="190" y="372" text-anchor="middle" fill="#F5F0E8" font-size="20" font-weight="700">单次阅读回路</text>
  <text x="88" y="408" fill="#F5F0E8" font-size="14">- 本次兴趣与疑问</text>
  <text x="88" y="434" fill="#F5F0E8" font-size="14">- 未完成的阅读线程</text>
  <text x="88" y="460" fill="#F5F0E8" font-size="14">- 下一次进门如何接住</text>

  <rect x="360" y="330" width="260" height="150" rx="18" fill="#1F3559" stroke="#D9A441" stroke-width="2"/>
  <text x="490" y="372" text-anchor="middle" fill="#F5F0E8" font-size="20" font-weight="700">长期读者回路</text>
  <text x="388" y="408" fill="#F5F0E8" font-size="14">- 稳定偏好，不贴死标签</text>
  <text x="388" y="434" fill="#F5F0E8" font-size="14">- 阅读风格与阻塞点</text>
  <text x="388" y="460" fill="#F5F0E8" font-size="14">- 可删除、可暂停、可重置</text>

  <rect x="660" y="330" width="480" height="150" rx="18" fill="#1F3559" stroke="#D9A441" stroke-width="2"/>
  <text x="900" y="372" text-anchor="middle" fill="#F5F0E8" font-size="20" font-weight="700">书店全局回路</text>
  <text x="690" y="408" fill="#F5F0E8" font-size="14">- 识别 Misfit：书不适 / 位置不适 / 标签不适 / 服务不适</text>
  <text x="690" y="434" fill="#F5F0E8" font-size="14">- 调整书架、导读卡、标签、推荐权重</text>
  <text x="690" y="460" fill="#F5F0E8" font-size="14">- 对删除、恢复、改标签保持审计</text>

  <path d="M190 250 C190 285 190 300 190 330" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 250 C490 285 490 300 490 330" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M900 250 C900 285 900 300 900 330" stroke="#D9A441" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="545" width="1080" height="72" rx="18" fill="#D9A441" fill-opacity="0.15" stroke="#D9A441" stroke-width="2"/>
  <text x="90" y="585" fill="#F5F0E8" font-size="22" font-weight="700">进化目标：不是“更懂你”，而是“更会问对问题”。</text>
  <text x="90" y="612" fill="#F5F0E8" font-size="15" opacity="0.85">推荐系统追求命中偏好；二当家追求理解读者问题的结构，并在误判中学习。</text>
</svg>
