<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Noto Serif SC, Georgia, serif">
  <defs><linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111D32"/><stop offset="100%" stop-color="#1B3B6B"/></linearGradient><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D9A441"/></marker></defs>
  <rect width="1200" height="520" fill="url(#bgB)"/>
  <text x="60" y="58" fill="#F5F0E8" font-size="28" font-weight="700">三条进化回路：一次、一个人、一家店</text>
  <text x="60" y="92" fill="#B4A078" font-size="16">从一次服务，到一位读者，再到整个书店生态的缓慢调整。</text>
  <rect x="80" y="155" width="300" height="220" rx="22" fill="#F5F0E8" stroke="#D9A441" stroke-width="2"/>
  <text x="230" y="198" text-anchor="middle" fill="#1B3B6B" font-size="22" font-weight="700">单次阅读</text>
  <text x="112" y="238" fill="#1B3B6B" font-size="15">- 本次兴趣</text><text x="112" y="266" fill="#1B3B6B" font-size="15">- 重复追问</text><text x="112" y="294" fill="#1B3B6B" font-size="15">- 未解决线程</text><text x="112" y="330" fill="#1B3B6B" font-size="15">下次进门如何接住</text>
  <rect x="450" y="155" width="300" height="220" rx="22" fill="#F5F0E8" stroke="#D9A441" stroke-width="2"/>
  <text x="600" y="198" text-anchor="middle" fill="#1B3B6B" font-size="22" font-weight="700">长期读者</text>
  <text x="482" y="238" fill="#1B3B6B" font-size="15">- 稳定兴趣</text><text x="482" y="266" fill="#1B3B6B" font-size="15">- 阅读风格</text><text x="482" y="294" fill="#1B3B6B" font-size="15">- 阻塞点</text><text x="482" y="330" fill="#1B3B6B" font-size="15">不是标签，是服务备忘</text>
  <rect x="820" y="155" width="300" height="220" rx="22" fill="#F5F0E8" stroke="#D9A441" stroke-width="2"/>
  <text x="970" y="198" text-anchor="middle" fill="#1B3B6B" font-size="22" font-weight="700">书店全局</text>
  <text x="852" y="238" fill="#1B3B6B" font-size="15">- 被误解的书</text><text x="852" y="266" fill="#1B3B6B" font-size="15">- 困惑的标签</text><text x="852" y="294" fill="#1B3B6B" font-size="15">- 高成功推荐路径</text><text x="852" y="330" fill="#1B3B6B" font-size="15">调整书架、导读卡、权重</text>
  <path d="M230 405 C390 455 810 455 970 405" stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arB)"/>
  <path d="M970 405 C1080 330 1080 245 970 190" stroke="#D9A441" stroke-width="4" fill="none" marker-end="url(#arB)"/>
</svg>
