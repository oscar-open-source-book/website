<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Noto Serif SC, Georgia, serif">
  <defs><linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111D32"/><stop offset="100%" stop-color="#274870"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B4A078"/><stop offset="100%" stop-color="#D9A441"/></linearGradient><marker id="arA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D9A441"/></marker></defs>
  <rect width="1200" height="420" fill="url(#bgA)"/>
  <text x="60" y="58" fill="#F5F0E8" font-size="28" font-weight="700">从排序到解释：推荐不再是一个黑箱分数</text>
  <text x="60" y="92" fill="#B4A078" font-size="16">普通系统回答“给你什么”；二当家解释“为什么此刻是它”。</text>
