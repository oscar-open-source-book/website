  <text x="245" y="190" text-anchor="middle" fill="#F5F0E8" font-size="22" font-weight="700">传统推荐</text><text x="245" y="225" text-anchor="middle" fill="#F5F0E8" font-size="16" opacity="0.85">读者 → 分数 → Top Books</text>
  <path d="M430 205 H540" stroke="url(#gold)" stroke-width="4" marker-end="url(#arA)"/>
  <rect x="570" y="132" width="520" height="148" rx="22" fill="#F5F0E8" stroke="#D9A441" stroke-width="3"/>
  <text x="830" y="178" text-anchor="middle" fill="#1B3B6B" font-size="24" font-weight="700">二当家的服务</text><text x="830" y="215" text-anchor="middle" fill="#1B3B6B" font-size="16">观察 → 假设 → 可能路径 → 解释 → 反馈</text><text x="830" y="245" text-anchor="middle" fill="#1B3B6B" font-size="16">推荐不是终点，而是可被纠正的判断。</text>
