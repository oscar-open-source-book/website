  <text x="600" y="362" text-anchor="middle" fill="#F5F0E8" font-size="18">读者可以纠正</text>
  <rect x="810" y="325" width="260" height="60" rx="18" fill="#D9A441" fill-opacity="0.18" stroke="#D9A441"/>
  <text x="940" y="362" text-anchor="middle" fill="#F5F0E8" font-size="18">系统当场学习</text>
