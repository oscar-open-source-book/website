title: '「开源之书 · 共读」'

menu:
  main:
    - identifier: "books"
      name: "书单"
      url: "/books/"
      weight: 10
    - identifier: "events"
      name: "活动"
      url: "/events/"
      weight: 20
    - identifier: "plan-signup"
      parent: "events"
      name: "策展"
      url: "/notices/"
      weight: 21
    - identifier: "discussions"
      parent: "events"
      name: "留言"
      url: "https://github.com/oscar-open-source-book/website/discussions"
      weight: 22
    - identifier: "about"
      name: "关于"
      url: "/about/"
      weight: 30
    - identifier: "sponsors"
      parent: "about"
      name: "赞助"
      url: "/about/sponsors/"
      weight: 45
    - identifier: "contributors"
      parent: "about"
      name: "贡献者"
      url: "/about/contributors/"
      weight: 50
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 40
baseURL: 'https://osbook.opensourceway.blog/'

# Hugo Blox module import
module:
  hugoVersion:
    min: '0.128.0'
  imports:
    - path: github.com/HugoBlox/kit/modules/blox
      mounts:
        - source: layouts
          target: layouts
        - source: static
          target: static
        - source: assets
          target: assets
        - source: i18n
          target: i18n
        - source: data
          target: data
        - source: archetypes
          target: archetypes
        - source: assets/vendor
          target: assets/vendor
        - source: layouts/_partials/hbx
          target: layouts/_partials/hbx

defaultContentLanguage: zh
hasCJKLanguage: true
defaultContentLanguageInSubdir: false

cascade:
  - target:
      path: /books/**
      kind: page
    show_date: true
    share: true
    pager: true

  - target:
      path: /events/**
      kind: page
    show_date: true
    share: true
    pager: true

  - target:
      path: /posts/**
      kind: page
    pager: true
    show_date: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

build:
  writeStats: true
summaryLength: 30
pagination:
  pagerSize: 12
enableEmoji: true
enableRobotsTXT: true
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart

taxonomies:
  author: authors
  tag: tags
  category: categories

related:
  threshold: 80
  includeNewer: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

markup:
  _merge: deep
security:
  _merge: deep
