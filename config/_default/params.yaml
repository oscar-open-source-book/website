hugoblox:
  schema: "2.0"



  identity:
    # /media icon.png 触发 Hugo 0.162 已知 bug (exit code 1)
    # 禁用后 Hugo 不再生成 public/media/ 目录
    disable_favicon: false
    name: "「开源之书 · 共读」"
    organization: "「开源之道」"
    type: organization
    tagline: "共读 · 共识 · 共进"
    description: "「OSCAR·开源之书·共读」——82 本开源经典著作，22 场线下 meetup，持续生长的开源思想地图。"
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: "#1B3B6B"
      secondary: "#F5F0E8"
      neutral: "#2B2B2B"

  typography:
    pack: "system"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true

  footer:
    style: minimal

  copyright:
    notice: "© 2019–2026 [「开源之道」](https://opensourceway.blog/) · 开源之书"

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true

  search:
    enable: true

  locale:
    date_format: "2006-01-02"
    time_format: "15:04"

repository:
  url: "https://github.com/oscar-open-source-book/website"
  content_dir: "content"
  branch: "main"
