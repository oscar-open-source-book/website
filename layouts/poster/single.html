{{ define "main" }}
<section class="mx-auto max-w-screen-xl px-4 py-8">
  {{ $cover := .Params.image }}
  {{ $filename := $cover.filename | default "" }}
  {{ if $filename }}
  {{ $resource := resources.GetMatch (printf "media/posters/%s" (path.Base $filename)) }}
  {{ if $resource }}
  <div class="flex justify-center">
    <img
      src="{{ $resource.RelPermalink }}"
      alt="{{ .Title | plainify }}"
      class="rounded-xl shadow-2xl max-h-[78vh] object-contain"
    />
  </div>
  <div class="text-center mt-6">
    <a href="{{ $resource.RelPermalink }}" download
       class="inline-flex items-center px-5 py-2 rounded-lg border border-amber-700/40 text-amber-600 hover:bg-amber-700/10 transition-colors text-sm">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      下载原图
    </a>
  </div>
  {{ end }}
  {{ end }}
</section>
{{ end }}
