{{- define "main" -}}

<div class="hero-section"
     style="background-color:#0F172A; padding:2rem 1rem;">
  <div id="oscar-carousel" class="max-w-5xl mx-auto px-4 flex flex-col items-center gap-4">
    <div class="relative w-full aspect-video bg-gray-900 rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/10 group">
      <img src="/media/images/meetup/2023-01-14-meeting.jpeg" alt="meetup 2023-01" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="0" />
      <img src="/media/images/meetup/2023-04-15-meeting.jpeg" alt="meetup 2023-04" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="1" style="display:none;" />
      <img src="/media/images/meetup/2023-07-08-meeting.jpeg" alt="meetup 2023-07" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="2" style="display:none;" />
      <img src="/media/images/meetup/2023-09-23-meeting.jpg" alt="meetup 2023-09" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="3" style="display:none;" />
      <img src="/media/images/meetup/2023-12-23-meeting.jpg" alt="meetup 2023-12" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="4" style="display:none;" />
      <img src="/media/images/meetup/2024-06-15-meeting.jpg" alt="meetup 2024-06" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="5" style="display:none;" />
      <img src="/media/images/meetup/2025-01-04-meeting.jpg" alt="meetup 2025-01" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="6" style="display:none;" />
      <img src="/media/images/meetup/2026-05-30-meeting.jpg" alt="meetup 2026-05" class="carousel-slide absolute inset-0 w-full h-full object-cover transition-opacity duration-500" data-idx="7" style="display:none;" />
      <button onclick="oscarCarousel.prev()" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-3 rounded-full backdrop-blur-sm transition opacity-0 group-hover:opacity-100" aria-label="prev">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button onclick="oscarCarousel.next()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-3 rounded-full backdrop-blur-sm transition opacity-0 group-hover:opacity-100" aria-label="next">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="oscar-page-count" class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded backdrop-blur-sm">1 / 8</div>
    </div>
    <div id="oscar-thumbnails" class="flex gap-2 mt-2 flex-wrap justify-center">
      <button onclick="oscarCarousel.go(0)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-amber-400 ring-2 ring-amber-400/40 transition cursor-pointer" style="background-image:url('/media/images/meetup/2023-01-14-meeting.jpeg'); background-size:cover; background-position:center;" aria-label="2023-01"></button>
      <button onclick="oscarCarousel.go(1)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2023-04-15-meeting.jpeg'); background-size:cover; background-position:center;" aria-label="2023-04"></button>
      <button onclick="oscarCarousel.go(2)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2023-07-08-meeting.jpeg'); background-size:cover; background-position:center;" aria-label="2023-07"></button>
      <button onclick="oscarCarousel.go(3)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2023-09-23-meeting.jpg'); background-size:cover; background-position:center;" aria-label="2023-09"></button>
      <button onclick="oscarCarousel.go(4)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2023-12-23-meeting.jpg'); background-size:cover; background-position:center;" aria-label="2023-12"></button>
      <button onclick="oscarCarousel.go(5)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2024-06-15-meeting.jpg'); background-size:cover; background-position:center;" aria-label="2024-06"></button>
      <button onclick="oscarCarousel.go(6)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2025-01-04-meeting.jpg'); background-size:cover; background-position:center;" aria-label="2025-01"></button>
      <button onclick="oscarCarousel.go(7)" class="w-16 h-12 rounded-lg overflow-hidden border-2 border-transparent hover:border-white/30 hover:scale-105 transition cursor-pointer" style="background-image:url('/media/images/meetup/2026-05-30-meeting.jpg'); background-size:cover; background-position:center;" aria-label="2026-05"></button>
    </div>
    <div class="grid grid-cols-8 gap-1 mt-1 text-center text-xs text-gray-400 max-w-4xl">
      <span>2023-01</span><span>2023-04</span><span>2023-07</span><span>2023-09</span><span>2023-12</span><span>2024-06</span><span>2025-01</span><span>2026-05</span>
    </div>
  </div>
</div>

<script>
var oscarCarousel = {
  idx: 0, total: 8,
  init: function() {
    this.slides = document.querySelectorAll('#oscar-carousel .carousel-slide');
    this.thumbs = document.querySelectorAll('#oscar-thumbnails button');
    this.pageCount = document.getElementById('oscar-page-count');
    this.total = this.slides.length;
    this.render();
  },
  render: function() {
    var self = this;
    this.slides.forEach(function(s, i) { s.style.display = (i === self.idx) ? 'block' : 'none'; });
    this.thumbs.forEach(function(t, i) {
      t.className = 'w-16 h-12 rounded-lg overflow-hidden border-2 transition cursor-pointer ' +
        (i === self.idx ? 'border-amber-400 ring-2 ring-amber-400/40' : 'border-transparent hover:border-white/30 hover:scale-105');
    });
    this.pageCount.textContent = (self.idx + 1) + ' / ' + self.total;
  },
  go: function(i) { this.idx = i; this.render(); },
  next: function() { this.idx = (this.idx + 1) % this.total; this.render(); },
  prev: function() { this.idx = (this.idx - 1 + this.total) % this.total; this.render(); }
};
document.addEventListener('DOMContentLoaded', function() { oscarCarousel.init(); });
</script>
