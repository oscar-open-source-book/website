{{ define "main" }}
{{ $deckId := "dev-together-2024" }}
{{ $total := 7 }}

<section class="mx-auto max-w-screen-xl px-4 py-4" id="deck-section">
  <div class="flex items-center justify-between mb-4" data-part="header">
    <div>
      <h1 class="text-xl font-bold text-amber-100">{{ .Title }}</h1>
      <p class="text-xs text-gray-400 mt-0.5">{{ $total }} slides · {{ .Date.Format "2006-01" }}</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleFS()" class="px-3 py-1 rounded-lg border border-amber-600/40 text-sm text-amber-300 hover:bg-amber-600/10 hover:text-amber-400" id="btn-fs">⛶ 全屏</button>
      <a href="/slides/" class="text-xs px-3 py-1 rounded-lg border border-white/20 text-gray-400 hover:text-amber-400">← 列表</a>
    </div>
  </div>

  <div data-part="thumbs" class="mb-4 pb-3 border-b border-white/10">
    <p class="text-xs text-gray-500 mb-2">缩略导航</p>
    <div id="thumb-strip" class="flex gap-2 overflow-x-auto pb-2">
      {{ range seq $total }}
      <div class="thumb-item flex-shrink-0 cursor-pointer" data-page="{{ . }}">
        <div class="w-[160px] h-[90px] overflow-hidden rounded-md border border-white/10 hover:border-amber-600 transition-colors bg-gray-800 relative">
          <iframe src="/slides/{{ $deckId }}/pages/page_{{ printf "%03d" . }}.html"
                  class="thumb-iframe" scrolling="no"
                  style="pointer-events:none;"></iframe>
        </div>
        <p class="text-[10px] text-gray-500 text-center mt-1">Slide {{ . }}</p>
      </div>
      {{ end }}
    </div>
  </div>

  <div id="deck-nav" data-part="nav" class="flex flex-wrap gap-1.5 mb-3 pb-3 border-b border-white/10">
    {{ range seq $total }}
    <button onclick="goTo({{ . }})" data-page="{{ . }}"
            class="px-2 py-0.5 rounded text-xs border border-white/20 text-gray-400 hover:border-amber-600 hover:text-amber-400 transition-colors">{{ . }}</button>
    {{ end }}
  </div>

  <div id="slide-stage" data-part="slide-stage">
    {{ range seq $total }}
    <iframe id="slide-{{ . }}" data-slide="{{ . }}"
            src="/slides/{{ $deckId }}/pages/page_{{ printf "%03d" . }}.html"
            class="slide-iframe"
            {{ if ne . 1 }}style="display:none"{{ end }}
            width="1600" height="900"
            scrolling="no"></iframe>
    {{ end }}
  </div>

  <div data-part="controls" class="flex justify-between mt-3 pb-2">
    <button onclick="prev()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">← 上一页</button>
    <span id="page-indicator" class="text-xs text-gray-500 self-center">1 / {{ $total }}</span>
    <button onclick="next()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">下一页 →</button>
  </div>
</section>
<style>
.slide-iframe{width:1280px;max-width:100%;height:720px;margin:0 auto;display:block;border:none;border-radius:8px;background:#F3EDE0;}
.thumb-iframe{width:1600px;height:900px;border:none;transform:scale(0.1);transform-origin:top left;position:absolute;top:0;left:0;}
#deck-section[data-fs="1"] [data-part="header"],
#deck-section[data-fs="1"] [data-part="thumbs"],
#deck-section[data-fs="1"] [data-part="nav"],
#deck-section[data-fs="1"] [data-part="controls"]{display:none !important;}
#deck-section[data-fs="1"] #slide-stage{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0A1628;z-index:99999;display:flex;align-items:center;justify-content:center;}
#deck-section[data-fs="1"] .slide-iframe{width:min(1600px,90vw);height:auto;aspect-ratio:16/9;max-height:90vh;border-radius:0;}
@media (max-width:768px){.slide-iframe{width:100%;height:auto;aspect-ratio:16/9;}}
</style>
<script>
let cur=1,total={{ $total }},fs=false;
const sec=document.getElementById('deck-section');
function toggleFS(){
  fs=!fs;
  if(fs){
    if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen();
    } else if(document.documentElement.webkitRequestFullscreen){
      document.documentElement.webkitRequestFullscreen();
    }
  } else {
    if(document.exitFullscreen){document.exitFullscreen();}
    else if(document.webkitExitFullscreen){document.webkitExitFullscreen();}
  }
  sec.setAttribute('data-fs',fs?'1':'0');
  const btn=document.getElementById('btn-fs');
  if(btn) btn.textContent=fs?'✕ 退出全屏':'⛶ 全屏';
}
function show(n){
  cur=Math.max(1,Math.min(total,n));
  const t=document.getElementById('slide-'+cur);
  document.querySelectorAll('.slide-iframe').forEach(el=>{
    el.style.display=(el===t?'block':'none');
  });
  document.querySelectorAll('#deck-nav button').forEach(el=>{
    el.classList.toggle('border-amber-600',el.dataset.page==cur);
    el.classList.toggle('text-amber-400',el.dataset.page==cur);
  });
  document.querySelectorAll('.thumb-item').forEach(el=>{
    el.style.outline=el.dataset.page==cur?'2px solid #f59e0b':'none';
    el.style.outlineOffset='2px';
  });
  const pi=document.getElementById('page-indicator');
  if(pi) pi.textContent=cur+' / '+total;
  localStorage.setItem('slide-{{ $deckId }}',cur);
}
function goTo(n){show(n);}
function prev(){if(cur>1)show(cur-1);}
function next(){if(cur<total)show(cur+1);}
document.addEventListener('keydown',e=>{
  if(e.key=='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key=='ArrowRight'){e.preventDefault();next();}
  else if(e.key=='Escape'){if(fs)toggleFS();}
  else if(e.key=='f'||e.key=='F'){toggleFS();}
  else if(e.key=='Home'){goTo(1);}
  else if(e.key=='End'){goTo(total);}
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&fs){toggleFS();}
});
show(localStorage.getItem('slide-{{ $deckId }}')?parseInt(localStorage.getItem('slide-{{ $deckId }}')):1);
</script>
{{ end }}
