{{ define "main" }}
{{ $deckId := "dev-together-2024" }}
{{ $total := 7 }}

<section class="mx-auto max-w-screen-xl px-4 py-4" id="deck-section">
  <div class="flex items-center justify-between mb-4" data-part="header">
    <div>
      <h1 class="text-xl font-bold text-amber-100">{{ .Title }}</h1>
      <p class="text-xs text-gray-400 mt-0.5">{{ $total }} slides · {{ .Date.Format "2006-01" }}</p>
    </div>
    <div class="flex gap-2">
      <button id="btn-fs" class="px-3 py-1 rounded-lg border border-amber-600/40 text-sm text-amber-300 hover:bg-amber-600/10 hover:text-amber-400">⛶ 全屏</button>
      <a href="/slides/" class="text-xs px-3 py-1 rounded-lg border border-white/20 text-gray-400 hover:text-amber-400">← 列表</a>
    </div>
  </div>

  <div data-part="thumbs" class="mb-4 pb-3 border-b border-white/10">
    <p class="text-xs text-gray-500 mb-2">缩略导航</p>
    <div id="thumb-strip" class="flex gap-2 overflow-x-auto pb-2">
      {{ range seq $total }}
      <div class="thumb-item flex-shrink-0 cursor-pointer" data-page="{{ . }}">
        <div class="w-[160px] h-[90px] overflow-hidden rounded-md border border-white/10 hover:border-amber-600 transition-colors bg-gray-800">
          <img src="/slides/{{ $deckId }}/thumbs/page_{{ printf "%03d" . }}.png"
               alt="Slide {{ . }}"
               class="w-full h-full object-cover pointer-events-none">
        </div>
        <p class="text-[10px] text-gray-500 text-center mt-1">Slide {{ . }}</p>
      </div>
      {{ end }}
    </div>
  </div>

  <div id="deck-nav" data-part="nav" class="flex flex-wrap gap-1.5 mb-3 pb-3 border-b border-white/10">
    {{ range seq $total }}
    <button class="deck-page-btn px-2 py-0.5 rounded text-xs border border-white/20 text-gray-400 hover:border-amber-600 hover:text-amber-400 transition-colors" data-page="{{ . }}">{{ . }}</button>
    {{ end }}
  </div>

  <div data-part="slide-stage" id="slide-stage">
    {{ range seq $total }}
    <div class="slide-page" data-slide="{{ . }}"
         style="{{ if ne . 1 }}display:none;{{ end }}">
      <img src="/slides/{{ $deckId }}/thumbs/page_{{ printf "%03d" . }}.png"
           alt="Slide {{ . }}"
           class="slide-img">
    </div>
    {{ end }}
  </div>

  <div data-part="controls" class="flex justify-between mt-3 pb-2">
    <button id="btn-prev" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">← 上一页</button>
    <span id="page-indicator" class="text-xs text-gray-500 self-center">1 / {{ $total }}</span>
    <button id="btn-next" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">下一页 →</button>
  </div>
</section>

<style>
.slide-page{
  max-width:1280px;
  margin:0 auto;
  display:block;
}
.slide-img{
  width:100%;
  max-width:1280px;
  height:auto;
  display:block;
  border-radius:8px;
  margin:0 auto;
}
#deck-section[data-fs="1"] .slide-page{
  max-width:none;
}
#deck-section[data-fs="1"] .slide-img{
  max-width:min(1600px, 92vw);
  max-height:92vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:0;
}
#deck-section[data-fs="1"] [data-part="header"],
#deck-section[data-fs="1"] [data-part="thumbs"],
#deck-section[data-fs="1"] [data-part="nav"],
#deck-section[data-fs="1"] [data-part="controls"]{
  display:none !important;
}
</style>

<script>
let cur = 1, total = {{ $total }};
const section = document.getElementById('deck-section');
const stage = document.getElementById('slide-stage');
const indicator = document.getElementById('page-indicator');

function show(n) {
  cur = Math.max(1, Math.min(total, n));
  document.querySelectorAll('.slide-page').forEach(el => {
    el.style.display = parseInt(el.dataset.slide) === cur ? 'block' : 'none';
  });
  document.querySelectorAll('.deck-page-btn').forEach(btn => {
    const on = parseInt(btn.dataset.page) === cur;
    btn.classList.toggle('border-amber-600', on);
    btn.classList.toggle('text-amber-400', on);
  });
  document.querySelectorAll('.thumb-item').forEach(item => {
    const on = parseInt(item.dataset.page) === cur;
    item.style.outline = on ? '2px solid #f59e0b' : 'none';
    item.style.outlineOffset = '2px';
  });
  indicator.textContent = cur + ' / ' + total;
  localStorage.setItem('slide-{{ $deckId }}', cur);
}

function goTo(n) { show(n); }
function prev() { if (cur > 1) show(cur - 1); }
function next() { if (cur < total) show(cur + 1); }

// Real Fullscreen API
function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => {
      section.setAttribute('data-fs', '1');
    }).catch(() => {});
  } else {
    document.exitFullscreen().then(() => {
      section.removeAttribute('data-fs');
    }).catch(() => {});
  }
}
document.addEventListener('fullscreenchange', () => {
  section.setAttribute('data-fs', document.fullscreenElement ? '1' : '0');
  const btn = document.getElementById('btn-fs');
  if (btn) btn.textContent = document.fullscreenElement ? '✕ 退出全屏' : '⛶ 全屏';
});

// Wire up all clickable elements
document.querySelectorAll('.thumb-item').forEach(item => {
  item.addEventListener('click', () => goTo(parseInt(item.dataset.page)));
});
document.querySelectorAll('.deck-page-btn').forEach(btn => {
  btn.addEventListener('click', () => goTo(parseInt(btn.dataset.page)));
});
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-fs').addEventListener('click', toggleFS);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'Home') goTo(1);
  else if (e.key === 'End') goTo(total);
});

show(localStorage.getItem('slide-{{ $deckId }}') ? parseInt(localStorage.getItem('slide-{{ $deckId }}')) : 1);
</script>
{{ end }}
