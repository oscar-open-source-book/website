{{ define "main" }}
{{ $deckId := "dev-together-2024" }}
{{ $total := 7 }}

<section class="mx-auto max-w-screen-xl px-4 py-4">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h1 class="text-xl font-bold text-amber-100">{{ .Title }}</h1>
      <p class="text-xs text-gray-400 mt-0.5">{{ $total }} slides · {{ .Date.Format "2006-01" }}</p>
    </div>
    <a href="/slides/" class="text-xs px-3 py-1 rounded-lg border border-white/20 text-gray-400 hover:text-amber-400">← 列表</a>
  </div>

  <div id="deck-nav" class="flex flex-wrap gap-1.5 mb-3 pb-3 border-b border-white/10">
    {{ range seq $total }}
    <button onclick="goTo({{ . }})"
            class="px-2 py-0.5 rounded text-xs border border-white/20 text-gray-400 hover:border-amber-600 hover:text-amber-400 transition-colors"
            data-page="{{ . }}">
      {{ . }}
    </button>
    {{ end }}
  </div>

  {{ range seq $total }}
  <iframe id="slide-{{ . }}"
          data-slide="{{ . }}"
          src="/slides/{{ $deckId }}/pages/page_{{ printf "%03d" . }}.html"
          class="slide-iframe"
          {{ if ne . 1 }}style="display:none"{{ end }}>
  </iframe>
  {{ end }}

  <div class="flex justify-between mt-3 pb-2">
    <button onclick="prev()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">← 上一页</button>
    <span id="page-indicator" class="text-xs text-gray-500 self-center">1 / {{ $total }}</span>
    <button onclick="next()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">下一页 →</button>
  </div>
</section>

<style>
.slide-iframe{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  display:block;
  border:none;
  border-radius:8px;
  background:#F3EDE0;
  aspect-ratio:16/9;
  height:560px;
}
@media (max-width:768px){
  .slide-iframe{height:380px}
}
</style>

<script>
let cur = 1, total = {{ $total }};
function show(n) {
  document.querySelectorAll('.slide-iframe').forEach(el => {
    el.style.display = el.dataset.slide == n ? 'block' : 'none';
  });
  document.querySelectorAll('#deck-nav button').forEach(el => {
    el.classList.toggle('border-amber-600', el.dataset.page == n);
    el.classList.toggle('text-amber-400', el.dataset.page == n);
  });
  document.getElementById('page-indicator').textContent = n + ' / ' + total;
  cur = n;
  localStorage.setItem('slide-{{ $deckId }}', n);
}
function goTo(n) { show(Math.max(1, Math.min(total, n))); }
function prev() { if (cur > 1) show(cur - 1); }
function next() { if (cur < total) show(cur + 1); }
document.addEventListener('keydown', e => {
  if (e.key == 'ArrowLeft') prev();
  else if (e.key == 'ArrowRight') next();
});
show(localStorage.getItem('slide-{{ $deckId }}') ? parseInt(localStorage.getItem('slide-{{ $deckId }}')) : 1);
</script>
{{ end }}
