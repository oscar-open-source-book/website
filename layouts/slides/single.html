{{ define "main" }}
{{ $deckId := "dev-together-2024" }}
{{ $total := 7 }}

<section class="mx-auto max-w-screen-xl px-4 py-4">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-xl font-bold text-amber-100">{{ .Title }}</h1>
      <p class="text-xs text-gray-400 mt-0.5">{{ $total }} slides · {{ .Date.Format "2006-01" }}</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleFullscreen()" class="px-3 py-1 rounded-lg border border-amber-600/40 text-sm text-amber-300 hover:bg-amber-600/10 hover:text-amber-400" id="btn-fullscreen">⛶ 全屏</button>
      <a href="/slides/" class="text-xs px-3 py-1 rounded-lg border border-white/20 text-gray-400 hover:text-amber-400">← 列表</a>
    </div>
  </div>

  <!-- Thumbnail strip -->
  <div class="mb-4 pb-3 border-b border-white/10">
    <p class="text-xs text-gray-500 mb-2">缩略导航</p>
    <div id="thumb-strip" class="flex gap-2 overflow-x-auto pb-2">
      {{ range seq $total }}
      <div onclick="goTo({{ . }})"
           class="thumb-item flex-shrink-0 cursor-pointer group"
           data-page="{{ . }}">
        <div class="w-32 h-18 border border-white/15 rounded-md overflow-hidden transition-all duration-200 group-hover:border-amber-600">
          <iframe src="/slides/{{ $deckId }}/pages/page_{{ printf "%03d" . }}.html"
                  class="w-full h-full border-0 scale-[0.3125] origin-top-left"
                  style="width:320px;height:180px;"
                  scrolling="no">
          </iframe>
        </div>
        <p class="text-[10px] text-gray-500 text-center mt-1">Slide {{ . }}</p>
      </div>
      {{ end }}
    </div>
  </div>

  <div id="deck-nav" class="flex flex-wrap gap-1.5 mb-3 pb-3 border-b border-white/10">
    {{ range seq $total }}
    <button onclick="goTo({{ . }})"
            class="px-2 py-0.5 rounded text-xs border border-white/20 text-gray-400 hover:border-amber-600 hover:text-amber-400 transition-colors"
            data-page="{{ . }}">
      {{ . }}
    </button>
    {{ end }}
  </div>

  {{ range seq $total }}
  <iframe id="slide-{{ . }}"
          data-slide="{{ . }}"
          src="/slides/{{ $deckId }}/pages/page_{{ printf "%03d" . }}.html"
          class="slide-iframe"
          {{ if ne . 1 }}style="display:none"{{ end }}
          scrolling="yes">
  </iframe>
  {{ end }}

  <div class="flex justify-between mt-3 pb-2">
    <button onclick="prev()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">← 上一页</button>
    <span id="page-indicator" class="text-xs text-gray-500 self-center">1 / {{ $total }}</span>
    <button onclick="next()" class="px-3 py-1 rounded-lg border border-white/20 text-sm text-gray-400 hover:text-amber-400">下一页 →</button>
  </div>
</section>

<style>
.slide-iframe{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  display:block;
  border:none;
  border-radius:8px;
  background:#F3EDE0;
  aspect-ratio:16/9;
  height:560px;
}
/* Fullscreen mode */
html:fullscreen .slide-iframe,
.slide-iframe:-webkit-full-screen,
.slide-iframe:fullscreen{
  max-width:none !important;
  height:95vh !important;
  aspect-ratio:16/9 !important;
  max-width:170vh !important;
}
@media (max-width:768px){
  .slide-iframe{height:380px}
}
#deck-nav button{
  transition: all 0.2s;
}
#deck-nav button.border-amber-600{
  background: rgba(217, 119, 6, 0.15);
}
</style>

<script>
let cur = 1, total = {{ $total }}, fs = null;

function syncHighlight(){
  document.querySelectorAll('#deck-nav button').forEach(el => {
    el.classList.toggle('border-amber-600', el.dataset.page == cur);
    el.classList.toggle('text-amber-400', el.dataset.page == cur);
  });
  document.querySelectorAll('.thumb-item').forEach(el => {
    el.style.outline = el.dataset.page == cur ? '2px solid #f59e0b' : 'none';
    el.style.outlineOffset = '2px';
  });
  document.getElementById('page-indicator').textContent = cur + ' / ' + total;
}

function show(n) {
  cur = Math.max(1, Math.min(total, n));
  document.querySelectorAll('.slide-iframe').forEach(el => {
    el.style.display = el.dataset.slide == cur ? 'block' : 'none';
  });
  syncHighlight();
  document.getElementById('page-indicator').textContent = cur + ' / ' + total;
  localStorage.setItem('slide-{{ $deckId }}', cur);
  // Sync fullscreen if active
  if (fs) {
    fs.style.display = fs.dataset.slide == cur ? 'block' : 'none';
  }
}

function goTo(n) { show(n); }
function prev() { if (cur > 1) show(cur - 1); }
function next() { if (cur < total) show(cur + 1); }

function toggleFullscreen() {
  const iframe = document.querySelector('.slide-iframe[style*="block"]') || document.querySelector('.slide-iframe');
  if (!fs) {
    fs = iframe;
    iframe.requestFullscreen().then(() => {
      document.getElementById('btn-fullscreen').textContent = '✕ 退出';
    }).catch(e => {});
  } else {
    document.exitFullscreen();
    fs = null;
    document.getElementById('btn-fullscreen').textContent = '⛶ 全屏';
  }
}

document.addEventListener('keydown', e => {
  if (e.key == 'ArrowLeft') prev();
  else if (e.key == 'ArrowRight') next();
  else if (e.key == 'f' || e.key == 'F') toggleFullscreen();
  else if (e.key == 'Escape') {} // handled natively
});

show(localStorage.getItem('slide-{{ $deckId }}') ? parseInt(localStorage.getItem('slide-{{ $deckId }}')) : 1);
</script>
{{ end }}
