{{ define "main" }}
<section class="mx-auto max-w-screen-xl px-4 py-8">
  <h1 class="text-3xl font-bold mb-2">{{ .Title }}</h1>
  <p class="text-gray-400 mb-8">{{ .Description }}</p>

  {{ $all := where .Site.RegularPages "Type" "slides" }}
  {{ $byYear := $all | groupByDate "2006" }}

  {{ range $byYear }}
  <h2 class="text-xl font-semibold text-amber-600 border-b border-white/10 pb-2 mb-4">{{ .Key }}</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}"
       class="group block rounded-xl border border-white/10 dark:border-white/20 bg-white/5 dark:bg-white/5 hover:border-amber-700/40 transition-all p-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-amber-900/30 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-medium text-gray-200 group-hover:text-amber-400 transition-colors line-clamp-2">{{ .Title }}</h3>
          <p class="text-xs text-gray-500 mt-1">{{ .Date.Format "2006-01" }}</p>
        </div>
      </div>
    </a>
    {{ end }}
  </div>
  {{ end }}
</section>
{{ end }}
