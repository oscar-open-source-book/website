{{ $api := .Get "api" | default "https://signup-api.osbook.opensourceway.blog/api/cfp" }}
{{ $data := .Get "data" | default "https://raw.githubusercontent.com/oscar-open-source-book/cfp-data/main/proposals.json" }}

<script>
  /* 议题 → 已分享活动 的映射，构建时由 data/cfp_links.json 内联。
     不放运行时 fetch：Hugo 的 data/ 不发布为静态文件。 */
  window.__cfpLanded = {{ site.Data.cfp_links.cfp_to_events | default dict | jsonify | safeJS }};
</script>

<div id="cfp-block" class="cfp-block" data-api="{{ $api }}" data-data="{{ $data }}">

  <div class="cfp-form-wrap">
    <h2>提议一个议题</h2>
    <p class="cfp-form-sub">
      议题常年有效，不必等到有活动。填完会立刻出现在下面的档案里。
      <strong>联系方式不公开</strong>，只有组委会能看到。
    </p>

    <form id="cfp-form" class="cfp-form" novalidate>
      <div class="cfp-row">
        <label for="cfp-speaker">你的称呼 <span class="req">*</span></label>
        <input type="text" id="cfp-speaker" name="speaker" maxlength="40"
               placeholder="希望别人怎么称呼你" required />
      </div>

      <div class="cfp-row">
        <label for="cfp-title">议题标题 <span class="req">*</span></label>
        <input type="text" id="cfp-title" name="title" maxlength="90"
               placeholder="演讲、对话、圆桌、话题讨论均可" required />
      </div>

      <div class="cfp-row">
        <label for="cfp-summary">议题概要 <span class="req">*</span></label>
        <textarea id="cfp-summary" name="summary" rows="6" maxlength="2000"
                  placeholder="想讲什么？为什么值得讲？和大家读过的哪本书有关？" required></textarea>
      </div>

      <div class="cfp-row cfp-row-split">
        <div>
          <label for="cfp-city">城市 / 线上</label>
          <select id="cfp-city" name="city">
            <option value="">不限</option>
            <option value="北京">北京</option>
            <option value="上海">上海</option>
            <option value="深圳">深圳</option>
            <option value="杭州">杭州</option>
            <option value="南京">南京</option>
            <option value="Online">线上</option>
          </select>
        </div>
        <div>
          <label for="cfp-duration">预计时长</label>
          <select id="cfp-duration" name="duration">
            <option value="">未定</option>
            <option value="30 分钟">30 分钟</option>
            <option value="1 小时">1 小时</option>
            <option value="1.5 小时">1.5 小时</option>
            <option value="2 小时">2 小时</option>
          </select>
        </div>
      </div>

      <div class="cfp-row">
        <label for="cfp-bio">简单介绍一下自己</label>
        <textarea id="cfp-bio" name="bio" rows="3" maxlength="500"
                  placeholder="可选。这段会公开显示——是让大家认识你的好机会。"></textarea>
      </div>

      <div class="cfp-row">
        <label for="cfp-contact">联系方式（邮箱或微信）<span class="req">*</span></label>
        <input type="text" id="cfp-contact" name="contact" maxlength="120"
               placeholder="仅组委会可见，不会公开" required />
      </div>

      <div class="cfp-actions">
        <button type="submit" id="cfp-submit">提交议题</button>
        <span class="cfp-msg" id="cfp-msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </div>

</div>

<script>
(function () {
  const root = document.getElementById('cfp-block');
  if (!root) return;

  // 状态挂在 window 上：minify 会重命名局部变量，window 属性不受影响
  window.__cfpFilter = window.__cfpFilter || { city: '', year: '', q: '' };

  const API = root.dataset.api;
  const DATA = root.dataset.data;

  // 直接内联 document.getElementById，不做任何包装函数。
  // Hugo --minify 会把包装函数的参数和函数名都压成单字母 e，
  // 产生 `function e(e){return document.getElementById(e)}` —— 函数名自引用，
  // 调用即抛异常，整个 IIFE 静默死掉（控制台也没有报错）。
  const form = document.getElementById('cfp-form');
  const btn = document.getElementById('cfp-submit');
  const msg = document.getElementById('cfp-msg');

  let ALL = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render(list) {
    const box = document.getElementById('cfp-list');
    const empty = document.getElementById('cfp-empty');
    if (!box) return;
    if (!list.length) {
      box.innerHTML = '';
      if (empty) empty.hidden = false;
      return;
    }
    if (empty) empty.hidden = true;
    box.innerHTML = list.map(function (p) {
      const meta = [p.submitted_at, p.city, p.duration].filter(Boolean).join(' · ');
      const bio = p.bio ? '<p class="cfp-item-bio">' + esc(p.bio) + '</p>' : '';
      // 落地链接：这份议题后来在哪一站讲了。数据来自 data/cfp_links.json，
      // 由 scripts/build-cfp-links.py 从活动页正文反推，不手写。
      var done = '';
      var landed = (window.__cfpLanded || {})[p.id];
      if (landed && landed.length) {
        var parts = [];
        for (var li = 0; li < landed.length; li++) {
          var ev = landed[li];
          parts.push('<a href="/events/' + ev.slug + '/">' + esc(ev.date) + '</a>');
        }
        done = '<p class="cfp-item-landed">✓ 已分享 · ' + parts.join('、') + '</p>';
      }
      return '<article class="cfp-item">' +
        '<div class="cfp-item-head">' +
          '<span class="cfp-item-speaker">' + esc(p.speaker || '匿名') + '</span>' +
          '<span class="cfp-item-meta">' + esc(meta) + '</span>' +
        '</div>' +
        '<h3 class="cfp-item-title">' + esc(p.title) + '</h3>' +
        '<p class="cfp-item-summary">' + esc(p.summary) + '</p>' +
        bio +
        done +
      '</article>';
    }).join('');
  }


  function buildChips() {
    const cities = Array.from(new Set(ALL.map(p => p.city).filter(Boolean))).sort();
    const years = Array.from(new Set(ALL.map(p => (p.submitted_at || '').slice(0, 4))
      .filter(Boolean))).sort().reverse();

    const cbox = document.getElementById('cfp-city-chips');
    if (cbox) {
      cbox.innerHTML = '<button class="cfp-chip active" data-kind="city" data-val="">全部城市</button>' +
        cities.map(c => '<button class="cfp-chip" data-kind="city" data-val="' + esc(c) + '">' + esc(c) + '</button>').join('');
    }
    const ybox = document.getElementById('cfp-year-chips');
    if (ybox) {
      ybox.innerHTML = '<button class="cfp-chip active" data-kind="year" data-val="">全部年份</button>' +
        years.map(y => '<button class="cfp-chip" data-kind="year" data-val="' + y + '">' + y + '</button>').join('');
    }
  }

  // 用 for 循环而非 filter+箭头：Hugo --minify 会把局部变量与箭头参数
  // 统统压成 t/s/e，二者撞名后 filterState.q 会被议题对象遮蔽，
  // 搜索静默失效。for 循环没有闭包参数，不会被遮蔽。
  function apply() {
    const filter = window.__cfpFilter;
    const q = (filter.q || '').toLowerCase();
    const out = [];
    for (let i = 0; i < ALL.length; i++) {
      const item = ALL[i];
      if (filter.city && item.city !== filter.city) continue;
      if (filter.year && (item.submitted_at || '').slice(0, 4) !== filter.year) continue;
      if (q) {
        const hay = ((item.title || '') + ' ' + (item.summary || '') +
                     ' ' + (item.speaker || '') + ' ' + (item.bio || '')).toLowerCase();
        if (hay.indexOf(q) === -1) continue;
      }
      out.push(item);
    }
    render(out);
    const total = document.getElementById('cfp-total');
    if (total) total.textContent = ALL.length;
  }
  // 挂到 window：回调里一律用 window.__cfpApply()，
  // 避免 minify 把局部函数名与外层变量压成同一个短字母。
  window.__cfpApply = apply;

  async function loadArchive() {
    try {
      const r = await fetch(DATA + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      ALL = (d.proposals || []).slice();
      ALL.sort((a, b) => String(b.submitted_at).localeCompare(String(a.submitted_at)));
      buildChips();
      window.__cfpApply();
    } catch (e) {
      const box = document.getElementById('cfp-list');
      if (box) {
        box.innerHTML = '<p class="cfp-loading">议题档案暂时读取失败（' +
          esc(e.message) + '）。可稍后刷新重试。</p>';
      }
    }
  }

  // 筛选交互（事件委托到 document）
  // 注意：筛选器与档案列表在 #cfp-block 之外（是兄弟节点），
  // 所以必须委托到 document，绑在 root 上永远收不到。
  document.addEventListener('click', function (ev) {
    const chip = ev.target.closest('.cfp-chip');
    if (!chip) return;
    const kind = chip.dataset.kind;
    window.__cfpFilter[kind] = chip.dataset.val;
    chip.parentElement.querySelectorAll('.cfp-chip').forEach(c => c.classList.toggle('active', c === chip));
    window.__cfpApply();
  });


  function showMsg(kind, text) {
    if (!msg) return;
    msg.className = 'cfp-msg ' + kind;
    msg.textContent = text;
  }

  window.__cfpReload = loadArchive;
  loadArchive();
})();
</script>

<!--
  搜索框独立脚本：刻意不放进上面的 IIFE。
  Hugo --minify 会把同一作用域内的局部变量压成 t/h/e 等单字母并互相覆盖，
  已导致主 IIFE 多次静默中断。这里用独立 script 块 + 纯 window 属性，
  与主逻辑零共享变量，任何重命名都影响不到。
-->
<script>
(function () {
  window.__cfpFilter = window.__cfpFilter || { city: '', year: '', q: '' };
  window.__cfpSeen = '';
  window.__cfpLanded = window.__cfpLanded || {};

  // 议题→活动落地映射由 Hugo 构建时内联注入（见文件末尾），
  // 不走运行时 fetch：data/ 目录不发布为静态文件，线上取不到。

  window.setInterval(function () {
    var el = document.getElementById('cfp-search');
    if (!el) { return; }
    var v = String(el.value || '');
    if (v === window.__cfpSeen) { return; }
    window.__cfpSeen = v;
    window.__cfpFilter.q = v.replace(/^\s+|\s+$/g, '');
    if (typeof window.__cfpApply === 'function') {
      window.__cfpApply();
    }
  }, 250);
})();
</script>

<!--
  表单提交独立脚本：同样不进主 IIFE。
  主 IIFE 一旦被 minify 打断，提交按钮就会永久卡在「提交中…」
  ——preventDefault 已生效但后续 fetch 从未发生，用户以为在等，其实什么都没发。
  这里只用 DOM + window，与主逻辑零共享。
-->
<script>
(function () {
  var form = document.getElementById('cfp-form');
  var btn = document.getElementById('cfp-submit');
  var msg = document.getElementById('cfp-msg');
  var root = document.getElementById('cfp-block');
  if (!form || !btn || !root) { return; }
  var API = root.dataset.api;

  function show(kind, text) {
    if (!msg) { return; }
    msg.className = 'cfp-msg ' + kind;
    msg.textContent = text;
  }

  function restore() {
    btn.disabled = false;
    btn.textContent = '提交议题';
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    btn.disabled = true;
    btn.textContent = '提交中…';
    show('', '提交中…');

    var fd = new FormData(form);
    function val(k) { return String(fd.get(k) || '').replace(/^\s+|\s+$/g, ''); }
    var payload = {
      speaker: val('speaker'), title: val('title'), summary: val('summary'),
      city: val('city'), duration: val('duration'),
      bio: val('bio'), contact: val('contact')
    };

    if (!payload.speaker || !payload.title || !payload.summary || !payload.contact) {
      show('err', '请填写称呼、标题、概要和联系方式。');
      restore();
      return;
    }

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
    }).then(function (res) {
      var d = res.d || {};
      if (d.ok) {
        if (d.duplicate) {
          show('ok', '✓ 这条议题已经提交过了，编号 ' + d.id + '。');
        } else {
          show('ok', '✓ 已收到，编号 ' + d.id + '。议题稍后就会出现在下方档案里。');
        }
        window.setTimeout(function () { try { form.reset(); } catch (e) {} }, 400);
        if (typeof window.__cfpReload === 'function') { window.__cfpReload(); }
      } else {
        show('err', '提交失败：' + (d.error || res.status));
      }
    })['catch'](function (e) {
      show('err', '提交失败：' + (e && e.message ? e.message : '网络错误'));
    }).then(restore, restore);
  });
})();
</script>

<style>

  background: #FBF9F4;
  border: 1px solid #E6DFD0;
  border-radius: 12px;
  padding: 1.75rem 1.5rem;
}

  margin: 0 0 .4rem;
  font-size: 1.45rem;
  letter-spacing: .03em;
  color: #2B2B2B;
}

  display: block; font-size: .88rem; font-weight: 600;
  color: #4A4A4A; margin-bottom: .4rem; letter-spacing: .02em;
}

  width: 100%; padding: .62rem .78rem;
  border: 1px solid #D9D2C2; border-radius: 7px;
  background: #fff; font-size: .95rem; font-family: inherit;
  color: #2B2B2B; transition: border-color .15s;
}
.cfp-row input[type=text]:focus, .cfp-row textarea:focus, .cfp-row select:focus {
  outline: none; border-color: #B4A078;

}

  background: #4A4438; color: #F7F3EA; border: none;
  padding: .72rem 1.9rem; border-radius: 7px;
  font-size: .95rem; font-weight: 600; letter-spacing: .06em;
  cursor: pointer; transition: background .15s;
}
#cfp-submit:hover:not(:disabled) { background: #2F2B23; }
#cfp-submit:disabled { opacity: .55; cursor: default; }
.cfp-msg { font-size: .9rem; line-height: 1.5; }
.cfp-msg.ok { color: #3C6B4A; }

}

}
