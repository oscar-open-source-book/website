{{ define "main" }}
{{ $cover := .Params.cover }}
{{ if $cover }}
<div class="mx-auto max-w-screen-xl px-4 pt-4">
  <img
    src="/images/books/{{ $cover }}"
    alt="{{ .Title | plainify }}"
    class="rounded-lg shadow-lg w-full max-w-md mx-auto object-cover"
    loading="lazy"
  />
</div>
{{ end }}
<article class="mx-auto max-w-screen-xl px-4 py-4 prose prose-slate lg:prose-xl dark:prose-invert">
  {{ .Content }}
</article>
{{ end }}
