{{ define "main" }}
{{ $cover := .Params.image }}
{{ if $cover }}
{{ $filename := $cover.filename | default "" }}
{{ if $filename }}
{{ $resource := resources.GetMatch (printf "media/%s" $filename) }}
{{ if $resource }}
<div class="mx-auto max-w-screen-xl px-4 pt-4">
  <img
    src="{{ $resource.RelPermalink }}"
    alt="{{ .Title | plainify }}"
    class="rounded-lg shadow-lg w-full max-w-md mx-auto object-cover"
    loading="lazy"
  />
</div>
{{ end }}
{{ end }}
{{ end }}
<article class="mx-auto max-w-screen-xl px-4 py-4 prose prose-slate lg:prose-xl dark:prose-invert">
  {{ .Content }}
</article>
{{ end }}
